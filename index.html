<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<title>Apex 練習帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>/* レイアウト: PC は左にサイドバー＋本文 880px の1カラム、スマホは下にタブ。
   白いカードを淡い青みのグレーの地に置き、強調は青1色。状態（正解・つまずき・未対応）だけ緑・赤・琥珀を使う */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #eef1f7;
  --surface-3: #e3e8f1;
  --line: #dde3ec;
  --line-strong: #c7d0dd;
  --fg: #141a26;
  --fg-2: #3a4456;
  --muted: #6a7487;
  --accent: #2856e0;
  --accent-hover: #1e47c4;
  --accent-soft: #e8eefe;
  --accent-fg: #ffffff;
  --ok: #17803d;
  --ok-soft: #e4f5ea;
  --warn: #b25e00;
  --warn-soft: #fff1dc;
  --bad: #c62f2f;
  --bad-soft: #fde8e8;
  --nav-bg: #ffffff;
  --code-bg: #10151f;
  --code-fg: #e6ebf3;
  --code-line: #273042;
  --hl-keyword: #8fb4ff;
  --hl-string: #f2c879;
  --hl-number: #f59f80;
  --hl-comment: #7d889c;
  --hl-type: #7fd8c4;
  --hl-title: #f3e3a2;
  --shadow: 0 1px 2px rgb(20 26 38 / 0.05), 0 2px 8px rgb(20 26 38 / 0.04);
  --font-body: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 12px;
  --radius-sm: 8px;
  --tab-height: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117;
    --surface: #151b24;
    --surface-2: #1c2330;
    --surface-3: #252e3d;
    --line: #262f3d;
    --line-strong: #364152;
    --fg: #e9edf4;
    --fg-2: #c3cbd8;
    --muted: #8f9aad;
    --accent: #7ea2ff;
    --accent-hover: #9ab6ff;
    --accent-soft: #1b2744;
    --accent-fg: #0d1117;
    --ok: #5cc98a;
    --ok-soft: #14291e;
    --warn: #f0a94b;
    --warn-soft: #2e2111;
    --bad: #f27979;
    --bad-soft: #321819;
    --nav-bg: #11161e;
    --code-bg: #0a0e14;
    --code-line: #222b39;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117;
  --surface: #151b24;
  --surface-2: #1c2330;
  --surface-3: #252e3d;
  --line: #262f3d;
  --line-strong: #364152;
  --fg: #e9edf4;
  --fg-2: #c3cbd8;
  --muted: #8f9aad;
  --accent: #7ea2ff;
  --accent-hover: #9ab6ff;
  --accent-soft: #1b2744;
  --accent-fg: #0d1117;
  --ok: #5cc98a;
  --ok-soft: #14291e;
  --warn: #f0a94b;
  --warn-soft: #2e2111;
  --bad: #f27979;
  --bad-soft: #321819;
  --nav-bg: #11161e;
  --code-bg: #0a0e14;
  --code-line: #222b39;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
button, select, textarea, input { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- 枠組み ---------- */
.shell { min-height: 100%; }
.page {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(var(--tab-height) + 32px + env(safe-area-inset-bottom, 0px));
}
#main { max-width: 880px; margin-inline: auto; display: grid; gap: 28px; }
#main:focus { outline: none; }

.tabs {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: var(--nav-bg);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.brand { display: none; }
.tab {
  position: relative;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 3px;
  height: var(--tab-height);
  padding: 6px 2px;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
}
.tab svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.tab[aria-current="page"] { color: var(--accent); }
.tab-badge {
  position: absolute;
  top: 7px;
  left: calc(50% + 8px);
  min-width: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--warn);
  color: var(--surface);
  font-size: 10.5px;
  font-weight: 700;
  line-height: 18px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

@media (min-width: 900px) {
  body { font-size: 15.5px; }
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); }
  .tabs {
    position: sticky;
    top: 0;
    height: 100vh;
    inset: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 24px 14px;
    border-top: 0;
    border-right: 1px solid var(--line);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 2px 10px 22px;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.02em;
  }
  .brand-mark {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: var(--accent);
    color: var(--accent-fg);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 12px;
    height: auto;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-size: 14.5px;
    color: var(--fg-2);
    text-align: left;
  }
  .tab svg { width: 20px; height: 20px; color: var(--muted); }
  .tab:hover { background: var(--surface-2); }
  .tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .tab[aria-current="page"] svg { color: var(--accent); }
  .tab-badge { position: static; margin-left: auto; }
  .page { padding-block: 40px 56px; }
  #main { gap: 32px; }
}

/* ---------- 文字 ---------- */
h1, h2, h3 { font-weight: 700; text-wrap: balance; line-height: 1.45; margin: 0; letter-spacing: 0.01em; }
h1 { font-size: 26px; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-mono); font-size: 0.9em; }
.eyebrow {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.lead { color: var(--fg-2); }

/* ---------- 部品 ---------- */
.section { display: grid; gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stack { display: grid; gap: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  display: grid;
  gap: 14px;
  min-width: 0;
}
.panel > h2 { font-size: 17px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  padding: 7px 16px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  color: var(--fg);
  transition: background-color 0.15s, border-color 0.15s;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ok { color: var(--ok); border-color: currentColor; }
.btn.ok:hover { background: var(--ok-soft); }
.btn.ok[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn.bad { color: var(--bad); border-color: currentColor; }
.btn.bad:hover { background: var(--bad-soft); }
.btn.bad[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.quiet { border-color: transparent; background: none; color: var(--muted); padding-inline: 10px; }
.btn.quiet:hover { color: var(--fg); background: var(--surface-2); }
.btn.small { min-height: 32px; padding: 3px 12px; font-size: 13px; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 1px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.75;
  white-space: nowrap;
  background: var(--surface-2);
  color: var(--fg-2);
}
.pill[data-status]::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.85;
}
.pill[data-status="none"] { color: var(--muted); }
.pill[data-status="trying"] { background: var(--accent-soft); color: var(--accent); }
.pill[data-status="failed"] { background: var(--bad-soft); color: var(--bad); }
.pill[data-status="viewed"] { background: var(--warn-soft); color: var(--warn); }
.pill[data-status="correct"] { background: var(--ok-soft); color: var(--ok); }
.pill[data-status="planned"] { background: none; border: 1px dashed var(--line-strong); color: var(--muted); }
.pill[data-status="planned"]::before { display: none; }
.pill[data-memo="open"] { background: var(--warn-soft); color: var(--warn); }
.pill[data-memo="generated"] { background: var(--accent-soft); color: var(--accent); }
.pill[data-memo="resolved"] { background: var(--ok-soft); color: var(--ok); }
.pill.weak { background: var(--accent-soft); color: var(--accent); }

.chip {
  display: inline-block;
  padding: 0 8px;
  border-radius: 6px;
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.9;
  color: var(--fg-2);
  white-space: nowrap;
}

.bar { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.bar > span { display: block; height: 100%; min-width: 0; background: var(--accent); border-radius: 4px; }
.bar.thin { height: 5px; }

/* ---------- ホーム ---------- */
.hero {
  display: grid;
  gap: 18px;
  padding: 24px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.hero-top { display: flex; gap: 16px; align-items: center; }
.level-badge {
  display: grid;
  place-items: center;
  flex: none;
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: var(--accent);
  color: var(--accent-fg);
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 18px;
}
.hero h1 { font-size: 24px; }
.progress-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.progress-count { font-family: var(--font-mono); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.progress-count span { color: var(--muted); font-weight: 400; }
.next-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 16px;
  align-items: center;
  padding: 16px 18px;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  border: 1px solid transparent;
  text-align: left;
  cursor: pointer;
  width: 100%;
  color: var(--fg);
  transition: border-color 0.15s;
}
.next-card:hover { border-color: var(--accent); }
.next-card .eyebrow { color: var(--accent); }
.next-card strong { font-size: 16.5px; line-height: 1.5; }
.next-card .go {
  grid-row: 1 / 4;
  grid-column: 2;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-fg);
  font-size: 18px;
}
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat {
  display: grid;
  gap: 2px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 18px;
}
.stat-value { font-family: var(--font-mono); font-size: 26px; font-weight: 600; line-height: 1.3; font-variant-numeric: tabular-nums; }
.stat-value .small { font-size: 14px; font-weight: 400; }
.stat-label { font-size: 12.5px; color: var(--muted); }
.stat[data-kind="memo"] .stat-value { color: var(--warn); }
.stat[data-kind="ok"] .stat-value { color: var(--ok); }

/* ---------- 一覧 ---------- */
.list {
  display: grid;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.list-item {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 4px 14px;
  align-items: center;
  padding: 14px 18px;
  border: 0;
  border-top: 1px solid var(--line);
  background: none;
  text-align: left;
  width: 100%;
  min-width: 0;
  color: var(--fg);
}
.list-item:first-child { border-top: 0; }
button.list-item { cursor: pointer; transition: background-color 0.12s; }
button.list-item:hover { background: var(--surface-2); }
.list-item .id { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; }
.list-item .title { min-width: 0; font-weight: 500; }
.list-item .meta { grid-column: 2 / 4; display: flex; gap: 6px 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.list-item.planned .title { color: var(--muted); font-weight: 400; }
.level-num {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--fg-2);
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 13.5px;
  grid-row: 1 / 3;
}
.level-row.current .level-num { background: var(--accent); color: var(--accent-fg); }
.level-row.passed .level-num { background: var(--ok-soft); color: var(--ok); }
.level-progress { grid-column: 2 / 4; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 12.5px; color: var(--muted); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.checklist { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.checklist li { display: flex; gap: 10px; align-items: baseline; }
.check {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  font-size: 12px;
  color: transparent;
  transform: translateY(4px);
}
.check.done { background: var(--ok); border-color: var(--ok); color: var(--surface); }

/* ---------- Trailhead ---------- */
.th-item { display: grid; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
.th-item:first-child { border-top: 0; }
.th-head { display: flex; gap: 8px 12px; align-items: baseline; flex-wrap: wrap; justify-content: space-between; }
.th-head a { font-weight: 500; text-decoration: none; }
.th-head a:hover { text-decoration: underline; }
.segmented { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--surface-2); }
.segmented button {
  border: 0;
  border-radius: 7px;
  background: none;
  padding: 3px 12px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  color: var(--muted);
}
.segmented button:hover { color: var(--fg); }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.segmented button[aria-pressed="true"][data-value="完了"] { color: var(--ok); }

/* ---------- 問題ページ ---------- */
.crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.crumbs button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; }
.crumbs button:hover { text-decoration: underline; }
.problem-head { display: grid; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.problem-head h1 { font-size: 25px; }
.badges { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; }
.badge-type { font-weight: 700; color: var(--accent); background: var(--accent-soft); }
.stars { color: var(--warn); letter-spacing: 1px; font-size: 13px; }
.generated-note { background: var(--accent-soft); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13.5px; }
.resolve-offer { background: var(--ok-soft); border-radius: var(--radius-sm); padding: 14px; display: grid; gap: 10px; }

.code-input {
  width: 100%;
  min-height: 240px;
  resize: vertical;
  padding: 14px;
  border: 1px solid var(--code-line);
  border-radius: var(--radius-sm);
  background: var(--code-bg);
  color: var(--code-fg);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.65;
  tab-size: 4;
  white-space: pre;
  overflow: auto;
}
.code-input::placeholder { color: var(--hl-comment); }
.text-input, .select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
}
.text-input:focus, .select:focus, .code-input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
textarea.text-input { min-height: 96px; resize: vertical; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 500; color: var(--fg-2); }
.save-state { font-size: 12.5px; color: var(--muted); }
.save-state.dirty { color: var(--warn); font-weight: 500; }

.answer-box { padding: 20px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); }
.confirm-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--warn-soft); font-size: 13.5px; }
.pager { display: flex; justify-content: space-between; gap: 8px; }

/* ---------- メモ ---------- */
.memo { display: grid; gap: 10px; padding: 16px 18px; border-top: 1px solid var(--line); }
.memo:first-child { border-top: 0; }
.memo-head { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.memo-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.memo-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button {
  border: 1px solid var(--line-strong);
  background: var(--surface);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  color: var(--fg-2);
}
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

/* ---------- スキル ---------- */
.skill-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 18px; border-top: 1px solid var(--line); align-items: center; }
.skill-row:first-child { border-top: 0; }
.skill-name { min-width: 0; }
.skill-counts { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

Approval Threshold Service（英語）","type":"th-style","skillsText":"WORK-EN-01, APEX-DESIGN-01〜02","environment":"vscode"},{"id":"L8-15","title":"【総合】「悪いコード」を直す（直書きのトリガー・ハードコード・インジェクション・テストなし）","type":"project","skillsText":"APEX-SEC-01〜04, APEX-DESIGN-01〜02, WORK-ANTI-01","environment":"vscode"}]},{"level":9,"theme":"現場シミュレーション","dir":"lv09-field-simulation","goal":"現場のチケットと同じ形の要件から、オブジェクト作成 → Apex → LWC → テスト → デプロイまでを一人でやり切る。ここを解答を見ずに解ければ中級者の到達とする。","prep":"","format":"すべて `project`。現場のチケットに近い形で出す。\n- **背景**：誰が何に困っているか\n- **要件**：受け入れ条件（「〜のとき〜になること」）\n- **制約**：既存コードの流儀、使ってはいけない方法など\n- **成果物**：作るメタデータの一覧、テストのカバレッジ条件\n- **既存コード**（改修案件のみ）：問題フォルダに一式を置く\n\n1問あたり 2〜4 時間を想定する。","pass":"- L9-09 を解答を見ずに作り切る\n- `research/00_goal/intermediate-definition.md` のチェックリストをすべて満たす\n- Trailhead の卒業課題：**Superbadge: Apex Callouts**、**Superbadge: Apex Web Services** を完了する","planned":[{"id":"L9-01","title":"商談が成立したら契約と請求予定を自動で作る","type":"project","skillsText":"APEX-TRG-01〜03, PF-SETUP-01, APEX-TEST-01〜03","environment":"vscode"},{"id":"L9-02","title":"既存のトリガーに条件を追加する（改修案件）","type":"project","skillsText":"WORK-TASK-01, APEX-DESIGN-01","environment":"vscode"},{"id":"L9-03","title":"取引先ページの「関連案件サマリー」コンポーネント","type":"project","skillsText":"LWC-APEX-01〜03, LWC-LDS-02, LWC-DEPLOY-01","environment":"vscode"},{"id":"L9-04","title":"取引先責任者の一括更新画面","type":"project","skillsText":"LWC-COMP-02〜03, LWC-APEX-02〜04","environment":"vscode"},{"id":"L9-05","title":"夜間バッチ + エラーログの記録 + 完了メール","type":"project","skillsText":"APEX-ASYNC-04〜06, APEX-DML-02","environment":"vscode"},{"id":"L9-06","title":"外部システムとの連携（受け口の API と送信）","type":"project","skillsText":"APEX-INT-01〜04, APEX-TEST-05","environment":"vscode"},{"id":"L9-07","title":"フローから呼ぶ Apex と、画面フロー用の LWC","type":"project","skillsText":"PF-AUTO-01〜03, LWC-DEPLOY-02","environment":"vscode"},{"id":"L9-08","title":"本番障害の対応（報告 → 原因調査 → 修正 → テスト → デプロイ）","type":"project","skillsText":"APEX-DEBUG-03, WORK-LOOKUP-02, PF-TOOL-04","environment":"vscode"},{"id":"L9-09","title":"【卒業制作】要件定義書から小さな業務アプリを1本作る","type":"project","skillsText":"全体","environment":"vscode"}]}],"problems":[{"id":"L1-00","title":"問題用の Playground を作り、匿名実行を動かす","level":1,"type":"setup","skills":["PF-TOOL-01","APEX-DEBUG-03"],"difficulty":1,"minutes":20,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\nこの問題集を解くための練習用組織（Trailhead Playground）を用意し、開発者コンソールで Apex を実行できるようにする。\n\n## 手順\n1. **Trailhead にログインする**（アカウントがなければ作成する）\n2. **Playground を作る**\n   - Trailhead 右上のプロフィールアイコン → **Hands-On Orgs**（ハンズオン組織）→ **Create Playground**\n   - 名前は `Apex練習用` など、Trailhead のチャレンジ用と区別できるものにする\n   - 作成には数分かかる\n3. **Playground を開く**\n   - Hands-On Orgs の一覧で、作った Playground の **Launch** を押す\n4. **開発者コンソールを開く**\n   - 画面右上の歯車アイコン → **開発者コンソール**（Developer Console）\n5. **匿名実行する**\n   - 開発者コンソールのメニュー **Debug → Open Execute Anonymous Window**（ショートカット：Ctrl+E / Mac は Cmd+E）\n   - 次のコードを貼り付ける\n\n   ```apex\n   String name = 'Apex';\n   System.debug('Hello, ' + name);\n   System.debug('今日は ' + Date.today());\n   ```\n\n   - **Open Log** にチェックを入れて **Execute** を押す\n6. **ログを見る**\n   - 開いたログの下にある **Debug Only** にチェックを入れる\n   - `USER_DEBUG` の行に `Hello, Apex` と今日の日付が出ていることを確認する\n\n## 確認方法\n次のすべてに当てはまれば完了。\n- [ ] 問題用の Playground が Hands-On Orgs の一覧にある\n- [ ] 開発者コンソールの匿名実行で `Hello, Apex` が出た\n- [ ] Debug Only で `System.debug` の行だけを表示できた\n- [ ] 開発者コンソールのメニュー **File → New → Apex Class** を開けることを確認した（L1-04 以降で使う）","answer":"## 解説\n### ポイント\n- **問題用とチャレンジ用の Playground を分ける**。Trailhead のチャレンジは、新しい Playground で解くことが推奨されている。この問題集で作ったクラスが残っていると、チャレンジで同じ名前のクラスを作れずに失敗することがある\n- **匿名実行は「保存しないで1回だけ動かす」機能**。Lv1〜4 の多くの問題は、クラスを作ったあと、匿名実行で確認用のコードを動かして答え合わせをする\n- **`System.debug` の出力はデバッグログの `USER_DEBUG` 行に出る**。ログには他にも大量の行が出るので、Debug Only で絞り込むのが基本\n\n### よくあるつまずき\n- 匿名実行でエラーになる → 下に出るメッセージの `Line` と `Column` を見る。全角スペースや全角の記号が混ざっていることが多い\n- ログが開かない → Open Log のチェックを確認する。上のタブの **Logs** から開くこともできる\n- ログの日付の時刻がずれている → `Date.today()` は日付だけ。時刻まで欲しいときは `Datetime.now()`\n\n### 調べ先\n- Trailhead ヘルプ「Trailhead Playground の作成と管理」\n- Salesforce ヘルプ「開発者コンソール」「匿名実行」"},{"id":"L1-01","title":"計算結果を予想する（型と演算子）","level":1,"type":"predict","skills":["APEX-BASIC-01","APEX-BASIC-03"],"difficulty":1,"minutes":10,"environment":"none","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\n次のコードを匿名実行したとき、①〜⑨の `System.debug` には何が出力されるか答えなさい。\n実行せずに、まず紙に書いてから答え合わせをすること。\n\n```apex\nInteger a = 7;\nInteger b = 2;\nSystem.debug(a / b);                    // ①\n\nDecimal c = 7;\nSystem.debug(c / b);                    // ②\n\nSystem.debug(Math.mod(a, b));           // ③\n\nString s1 = 'Apex';\nString s2 = 'APEX';\nSystem.debug(s1 == s2);                 // ④\nSystem.debug(s1.equals(s2));            // ⑤\n\nInteger n;\nSystem.debug(n == null);                // ⑥\n\nSystem.debug('合計: ' + a + b);          // ⑦\nSystem.debug(a + b + '個');              // ⑧\n\nDate d = Date.newInstance(2026, 1, 31);\nSystem.debug(d.addDays(1).month());     // ⑨\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n整数どうしの割り算と、Decimal が入った割り算では結果の型が違う。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n`+` は左から順に計算される。最初に文字列が出てくると、そこから先は文字列の連結になる。\n\u003c/details>","answer":"## 解答例\n| 番号 | 出力 |\n|---|---|\n| ① | `3` |\n| ② | `3.5` |\n| ③ | `1` |\n| ④ | `true` |\n| ⑤ | `false` |\n| ⑥ | `true` |\n| ⑦ | `合計: 72` |\n| ⑧ | `9個` |\n| ⑨ | `2` |\n\n## 解説\n### ポイント\n- **① 整数どうしの割り算は小数が切り捨てられる**。`7 / 2` は `3`。金額や率の計算で小数が必要なら `Decimal` を使う\n- **② どちらかが Decimal なら結果も Decimal**。`7 / 2` が `3.5` になる\n- **③ 余りは `Math.mod`**。Apex には `%` 演算子がない\n- **④ String の `==` は大文字・小文字を区別しない**。Java とは違う点なので注意\n- **⑤ 区別したいときは `equals`**。大文字・小文字を区別して比べる\n- **⑥ 初期化していない変数は `null`**。Apex では `Integer` も `Boolean` も、何も入れなければ `0` や `false` ではなく `null` になる\n- **⑦⑧ `+` は左から順に評価される**。⑦は `'合計: ' + 7` で文字列になり、そこに `2` が連結されて `合計: 72`。⑧は先に `7 + 2 = 9` が計算されてから `'個'` が連結される。⑦で合計を出したいなら `'合計: ' + (a + b)` と書く\n- **⑨ 日付の計算は月や年をまたいでも正しく繰り上がる**。1月31日の1日後は2月1日なので `month()` は `2`。日付を数値として自分で計算せず、`addDays` / `addMonths` / `daysBetween` などのメソッドに任せる。契約終了日や期日の計算でよく出てくる\n\n### よくある間違い\n- ① を `3.5` と答える（Integer のまま計算されることを忘れる）\n- ⑥ を `false`、または「`0` が出る」と答える\n- ⑨ を `1` と答える（`addDays` が月をまたぐことを見落とす）\n\n### 調べ先\n- Apex Developer Guide「Expression Operators」（演算子と評価の順番）\n- Apex Reference Guide「Math Class」「String Class」の `equals` / `equalsIgnoreCase`\n- Apex Reference Guide「Date Class」の `addDays` / `month`"},{"id":"L1-02","title":"コレクションの中身を予想する","level":1,"type":"predict","skills":["APEX-BASIC-02"],"difficulty":1,"minutes":15,"environment":"none","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\n次のコードを匿名実行したとき、①〜⑪の `System.debug` には何が出力されるか答えなさい。\nList の中身が途中でどう変わるかを、紙に書きながら追うこと。\n\n```apex\nList\u003cString> fruits = new List\u003cString>{ 'りんご', 'みかん', 'ぶどう' };\nfruits.add('もも');\nfruits.add(1, 'バナナ');\nSystem.debug(fruits.size());               // ①\nSystem.debug(fruits[1]);                   // ②\n\nfruits.remove(0);\nSystem.debug(fruits[0]);                   // ③\nSystem.debug(fruits.indexOf('ぶどう'));     // ④\n\nSet\u003cInteger> nums = new Set\u003cInteger>{ 3, 1, 3, 2, 1 };\nSystem.debug(nums.size());                 // ⑤\nSystem.debug(nums.add(2));                 // ⑥\nSystem.debug(nums.contains(4));            // ⑦\n\nMap\u003cString, Integer> stock = new Map\u003cString, Integer>();\nstock.put('A', 10);\nstock.put('B', 5);\nstock.put('A', 7);\nSystem.debug(stock.size());                // ⑧\nSystem.debug(stock.get('A'));              // ⑨\nSystem.debug(stock.get('C'));              // ⑩\nSystem.debug(stock.containsKey('B'));      // ⑪\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n`add(1, 'バナナ')` は「1番目に差し込む」。List の番号は 0 から始まる。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\nSet は同じ値を2つ持てない。Map は同じキーに `put` すると上書きになる。\n\u003c/details>","answer":"## 解答例\n| 番号 | 出力 | そのときの中身 |\n|---|---|---|\n| ① | `5` | `[りんご, バナナ, みかん, ぶどう, もも]` |\n| ② | `バナナ` | |\n| ③ | `バナナ` | `[バナナ, みかん, ぶどう, もも]` |\n| ④ | `2` | |\n| ⑤ | `3` | `{1, 2, 3}` |\n| ⑥ | `false` | |\n| ⑦ | `false` | |\n| ⑧ | `2` | `{A=7, B=5}` |\n| ⑨ | `7` | |\n| ⑩ | `null` | |\n| ⑪ | `true` | |\n\n## 解説\n### ポイント\n- **List は順番があり、番号（インデックス）は 0 から**。`add(要素)` は末尾に追加、`add(番号, 要素)` はその位置に差し込み、`remove(番号)` で削除すると後ろの要素が前に詰まる\n- **Set は重複を持たない**。`{3, 1, 3, 2, 1}` は3種類だけ残る。`add` は「追加できたら true、もう入っていたら false」を返すので、⑥は `false`。この戻り値は重複チェックに使える（L1-04 で使う）\n- **Map は同じキーに `put` すると上書き**。キーの数は増えない\n- **Map にないキーを `get` すると `null`**。エラーにはならない。`null` に対してメソッドを呼ぶと `NullPointerException` になるので、`containsKey` で確かめるか null チェックをする（G-004 で扱う）\n\n### 3つの使い分け\n| 種類 | 順番 | 重複 | 主な用途 |\n|---|---|---|---|\n| List | あり | あり | SOQL の結果、DML でまとめて保存するレコード |\n| Set | 頼らない | なし | Id を集めて `WHERE Id IN :ids` に渡す |\n| Map | 頼らない | キーはなし | Id からレコードを引く、キーごとに集計する |\n\n### よくある間違い\n- ② を `みかん` と答える（`add(1, ...)` が上書きではなく差し込みであることを見落とす）\n- ⑥ を `true` と答える\n- ⑩ でエラーになると考える\n\n### 調べ先\n- Apex Developer Guide「Collections」\n- Apex Reference Guide「List Class」「Set Class」「Map Class」"},{"id":"L1-03","title":"List と for ループで合計・平均を出す","level":1,"type":"fill","skills":["APEX-BASIC-01","APEX-BASIC-02"],"difficulty":1,"minutes":10,"environment":"none","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\nテストの点数のリストから、合計・平均・最高点を出すコードを書いた。\n【①】〜【⑥】に入るものを答えなさい。実行すると、コメントに書いた結果が出るようにすること。\n\n```apex\nList\u003cInteger> scores = new List\u003cInteger>{ 72, 85, 90, 64, 88 };\nInteger total = 0;\nInteger maxScore = null;\n\nfor (【①】 score : 【②】) {\n    total 【③】 score;\n    if (maxScore == null || score 【④】 maxScore) {\n        maxScore = score;\n    }\n}\n\nDecimal average = 【⑤】total / scores.【⑥】();\n\nSystem.debug('合計: ' + total);                   // 合計: 399\nSystem.debug('平均: ' + average.setScale(1));      // 平均: 79.8\nSystem.debug('最高: ' + maxScore);                 // 最高: 90\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n①② は「リストの要素を1つずつ取り出す」for ループの書き方。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n⑤ を空欄のままにすると、`399 / 5` が Integer どうしの割り算になり、平均が `79` になってしまう。\n\u003c/details>","answer":"## 解答例\n| 空欄 | 答え |\n|---|---|\n| ① | `Integer` |\n| ② | `scores` |\n| ③ | `+=` |\n| ④ | `>` |\n| ⑤ | `(Decimal) ` |\n| ⑥ | `size` |\n\n⑤ は `Decimal.valueOf(total)` と書いて `Decimal.valueOf(total) / scores.size()` にしてもよい。\n\n## 解説\n### ポイント\n- **拡張 for ループ**：`for (型 変数 : リスト)` で要素を先頭から1つずつ取り出す。番号が要らないときはこちらを使う。番号も必要なら `for (Integer i = 0; i \u003c scores.size(); i++)`\n- **Integer どうしの割り算は小数が切り捨てられる**（L1-01 の①と同じ）。`Decimal average = total / scores.size();` と書いても、右側が先に Integer のまま計算されて `79` になり、それが Decimal に入るだけ。**計算する前に**どちらかを Decimal にする\n- **最大値は「まだ何もない（null）」から始める**。`maxScore = 0` から始めると、全部マイナスの値のときに正しく求められない。最初の要素で必ず置き換わるように `null` を使う\n- **リストの件数は `size()`**。Java の `length` や JavaScript の `length` と混同しやすい\n\n### よくある間違い\n- ⑤ を空欄のままにして平均が `79.0` になる\n- ⑥ を `length` や `count` と書く\n\n### 調べ先\n- Apex Developer Guide「Loops」\n- Apex Reference Guide「List Class」の `size`"},{"id":"L1-04","title":"メールアドレスの重複を Set で取り除く","level":1,"type":"write","skills":["APEX-BASIC-02","APEX-BASIC-03"],"difficulty":2,"minutes":20,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\nイベントの申込フォームから集めたメールアドレスの一覧がある。同じ人が何度も申し込んでいたり、大文字・小文字や前後の空白がばらばらだったりする。\n案内メールを1人1通だけ送れるように、重複を取り除くクラスを作りなさい。\n\n## 使う名前\nクラス名とメソッド名は次のとおりにする。**引数（何を受け取るか）と戻り値の型（何を返すか）は自分で決める**。引数名・変数名・`private` のメソッドも自由。\n\n| 何を作るか | 名前 | 種類 |\n|---|---|---|\n| クラス | `EmailUtil` |  |\n| 機能1：重複を取り除く | `uniqueEmails` | static メソッド |\n| 機能2：重複があるか調べる | `hasDuplicate` | static メソッド |\n\n## 要件\n- **機能1：重複を取り除く**\n  - メールアドレスのリストを受け取り、重複を取り除いたリストを返す\n  - メールアドレスを**前後の空白を取り除き、すべて小文字にした形**にそろえる\n  - そろえた形で同じものは1つだけ残す\n  - **最初に出てきた順番**を保つ\n  - `null`・空文字・空白だけの要素は結果に含めない\n  - 受け取ったリストが `null` なら空のリストを返す\n- **機能2：重複があるか調べる**\n  - メールアドレスのリストを受け取り、重複が1つでもあるかどうかを返す\n  - 機能1と同じルールでそろえてから比べる\n  - `null`・空文字・空白だけの要素は数えない\n  - 受け取ったリストが `null` なら「重複なし」\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\nSet だけでは順番が保てない。「もう出てきたものを覚えておく Set」と「結果を入れる List」の2つを使う。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n`Set.add` は追加できたら `true`、すでに入っていたら `false` を返す（L1-02 の⑥）。`if (seen.add(email))` と書くと「初めて出てきたら」の判定になる。\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、「使う名前」のクラス・メソッドを呼んで自分で書く。\n\n```apex\n// 書き方の例\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nAssert.isTrue(条件, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `'Taro@Example.com'`, `'hanako@example.com'`, `' taro@example.com '`, `null`, `''`, `'jiro@example.com'`, `'HANAKO@example.com'` | `taro@example.com`, `hanako@example.com`, `jiro@example.com` の3件（この順番） |\n| 1 | `null` | 空のリスト |\n| 2 | 上と同じ7件 | 重複あり |\n| 2 | `'a@example.com'`, `'b@example.com'` | 重複なし |\n| 2 | `''`, `' '`, `null` | 重複なし |\n| 2 | `null` | 重複なし |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n確認コードの例は、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード\nクラス名・メソッド名は指定どおりなので、引数と戻り値を解答例と同じ形にしていればそのまま使える。違う形にしたときは、呼び出す部分だけ自分の形に合わせる。\n\n```apex\nList\u003cString> input = new List\u003cString>{\n    'Taro@Example.com', 'hanako@example.com', ' taro@example.com ',\n    null, '', 'jiro@example.com', 'HANAKO@example.com'\n};\nList\u003cString> result = EmailUtil.uniqueEmails(input);\n\nAssert.areEqual(3, result.size(), '重複と空を除いて3件');\nAssert.areEqual('taro@example.com', result[0], '1番目は taro（小文字にそろえる）');\nAssert.areEqual('hanako@example.com', result[1], '2番目は hanako');\nAssert.areEqual('jiro@example.com', result[2], '3番目は jiro');\nAssert.areEqual(0, EmailUtil.uniqueEmails(null).size(), 'null なら空のリスト');\n\nAssert.isTrue(EmailUtil.hasDuplicate(input), '大文字・空白違いも重複とみなす');\nAssert.isFalse(EmailUtil.hasDuplicate(new List\u003cString>{ 'a@example.com', 'b@example.com' }), '重複なし');\nAssert.isFalse(EmailUtil.hasDuplicate(new List\u003cString>{ '', ' ', null }), '空は数えない');\nAssert.isFalse(EmailUtil.hasDuplicate(null), 'null なら false');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n引数と戻り値の型、メソッドの中身は一例。指定したクラス名・メソッド名で作り、要件と確認方法の表を満たしていれば正解とする。\n\n```apex\npublic class EmailUtil {\n    public static List\u003cString> uniqueEmails(List\u003cString> emails) {\n        List\u003cString> results = new List\u003cString>();\n        if (emails == null) {\n            return results;\n        }\n        Set\u003cString> seen = new Set\u003cString>();\n        for (String email : emails) {\n            if (String.isBlank(email)) {\n                continue;\n            }\n            String normalized = email.trim().toLowerCase();\n            if (seen.add(normalized)) {\n                results.add(normalized);\n            }\n        }\n        return results;\n    }\n\n    public static Boolean hasDuplicate(List\u003cString> emails) {\n        if (emails == null) {\n            return false;\n        }\n        Set\u003cString> seen = new Set\u003cString>();\n        for (String email : emails) {\n            if (String.isBlank(email)) {\n                continue;\n            }\n            if (!seen.add(email.trim().toLowerCase())) {\n                return true;\n            }\n        }\n        return false;\n    }\n}\n```\n\n## 解説\n### ポイント\n- **Set の String は大文字・小文字を区別する**。String の `==` は区別しない（L1-01 の④）のに、Set と Map のキーは区別する。`'Taro@Example.com'` と `'taro@example.com'` は Set の中では別物なので、先に `toLowerCase()` でそろえる必要がある\n- **「覚えておく Set」+「結果の List」は重複排除の定番**。順番を保ちたいときはこの形にする。順番が要らなければ `new List\u003cString>(seen)` で Set をそのまま List にしてもよい\n- **そろえる処理（正規化）は1か所で決める**。`trim().toLowerCase()` を2つのメソッドで同じように書いている。L1-06 以降では、こうした共通処理を private メソッドに切り出す書き方も覚える\n- **重複が見つかった時点で `return true`**。最後まで調べる必要がないときは早めに抜ける\n\n### よくある間違い\n- `trim` か `toLowerCase` の片方だけで、`' taro@example.com '` や `'HANAKO@...'` が残る\n- `new Set\u003cString>(emails)` で Set に変換し、順番が崩れる・空要素が残る\n- `email.trim()` を `isBlank` の判定より前に書き、`null` で落ちる\n\n### 調べ先\n- Apex Reference Guide「Set Class」の `add`\n- Apex Reference Guide「String Class」の `trim` / `toLowerCase` / `isBlank`"},{"id":"L1-05","title":"カテゴリごとの件数を Map で数える","level":1,"type":"write","skills":["APEX-BASIC-02","APEX-BASIC-03","APEX-BASIC-04"],"difficulty":2,"minutes":20,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\nネットショップの注文データから、商品カテゴリの一覧（`List\u003cString>`）を受け取った。\nカテゴリごとに何件あるかを数え、一番多いカテゴリを求めるクラスを作りなさい。\n\n## 使う名前\nクラス名とメソッド名は次のとおりにする。**引数（何を受け取るか）と戻り値の型（何を返すか）は自分で決める**。引数名・変数名・`private` のメソッドも自由。\n\n| 何を作るか | 名前 | 種類 |\n|---|---|---|\n| クラス | `CategoryCounter` |  |\n| 機能1：カテゴリごとに数える | `countByCategory` | static メソッド |\n| 機能2：一番多いカテゴリを求める | `topCategory` | static メソッド |\n\n## 要件\n- **機能1：カテゴリごとに数える**\n  - カテゴリ名のリストを受け取り、カテゴリ名ごとの件数を返す（カテゴリ名から件数を引ける形にする）\n  - カテゴリ名の前後の空白は取り除いてから数える（`' 文具 '` は `'文具'` として数える）\n  - `null` や空文字・空白だけのカテゴリは `'未分類'` として数える\n  - 受け取ったリストが `null` なら、空の結果（0種類）を返す\n- **機能2：一番多いカテゴリを求める**\n  - 機能1で数えた結果から、件数が一番多いカテゴリ名を返す\n  - 件数が同じカテゴリがある場合は、名前を `compareTo` で比べて小さいほう（辞書順で先のもの）を返す\n  - 数えた結果が空なら `null` を返す\n\n開発者コンソールの「File → New → Apex Class」でクラスを作ること。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\nMap に「まだキーがなければ 1 を入れる、あれば今の値に 1 を足す」を、リストの要素の数だけ繰り返す。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n使うメソッド：`Map.containsKey` / `Map.get` / `Map.put` / `Map.keySet`、`String.isBlank`、`String.trim`、`String.compareTo`\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、「使う名前」のクラス・メソッドを呼んで自分で書く。\n\n```apex\n// 書き方の例\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nAssert.isTrue(条件, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `'文具'`, `'食品'`, `'文具'`, `'家電'`, `null`, `'食品'`, `' 文具 '`, `''` | 文具 3件、食品 2件、家電 1件、未分類 2件（4種類） |\n| 1 | `null` | 0種類 |\n| 2 | 上の数えた結果 | `'文具'` |\n| 2 | B が2件・A が2件・C が1件 | `'A'`（同数なら辞書順で先） |\n| 2 | 空 | `null` |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n確認コードの例は、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード\nクラス名・メソッド名は指定どおりなので、引数と戻り値を解答例と同じ形にしていればそのまま使える。違う形にしたときは、呼び出す部分だけ自分の形に合わせる。\n\n```apex\nList\u003cString> items = new List\u003cString>{ '文具', '食品', '文具', '家電', null, '食品', ' 文具 ', '' };\nMap\u003cString, Integer> result = CategoryCounter.countByCategory(items);\n\nAssert.areEqual(3, result.get('文具'), '文具は3件');\nAssert.areEqual(2, result.get('食品'), '食品は2件');\nAssert.areEqual(1, result.get('家電'), '家電は1件');\nAssert.areEqual(2, result.get('未分類'), 'null と空文字は未分類で2件');\nAssert.areEqual(4, result.size(), 'カテゴリは4種類');\nAssert.areEqual('文具', CategoryCounter.topCategory(result), '一番多いのは文具');\n\nAssert.areEqual(0, CategoryCounter.countByCategory(null).size(), 'null なら空の Map');\n\nMap\u003cString, Integer> tie = new Map\u003cString, Integer>{ 'B' => 2, 'A' => 2, 'C' => 1 };\nAssert.areEqual('A', CategoryCounter.topCategory(tie), '同数なら辞書順で先のもの');\nAssert.isNull(CategoryCounter.topCategory(new Map\u003cString, Integer>()), '空なら null');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n引数と戻り値の型、メソッドの中身は一例。指定したクラス名・メソッド名で作り、要件と確認方法の表を満たしていれば正解とする。\n\n```apex\npublic class CategoryCounter {\n    public static Map\u003cString, Integer> countByCategory(List\u003cString> categories) {\n        Map\u003cString, Integer> counts = new Map\u003cString, Integer>();\n        if (categories == null) {\n            return counts;\n        }\n        for (String category : categories) {\n            String key = String.isBlank(category) ? '未分類' : category.trim();\n            if (counts.containsKey(key)) {\n                counts.put(key, counts.get(key) + 1);\n            } else {\n                counts.put(key, 1);\n            }\n        }\n        return counts;\n    }\n\n    public static String topCategory(Map\u003cString, Integer> counts) {\n        String top = null;\n        for (String key : counts.keySet()) {\n            if (top == null\n                    || counts.get(key) > counts.get(top)\n                    || (counts.get(key) == counts.get(top) && key.compareTo(top) \u003c 0)) {\n                top = key;\n            }\n        }\n        return top;\n    }\n}\n```\n\n## 解説\n### ポイント\n- **「キーごとに数える」は Map の一番よく使う形**。現場では「取引先 Id ごとの商談の件数」「担当者ごとのケースの件数」など、毎日のように書く。`Map\u003cId, Integer>` や `Map\u003cId, List\u003cSObject>>` に形を変えて何度も出てくる\n- **`String.isBlank` は null・空文字・空白だけをまとめて判定できる**。`category == null || category == ''` と書くより短く、空白だけのケースも拾える\n- **`String.isBlank` は static メソッド**なので、`category.isBlank()` ではなく `String.isBlank(category)` と書く。`category` が `null` のとき、`category.trim()` のようにインスタンスメソッドを呼ぶと `NullPointerException` になる。先に `isBlank` で判定してから `trim` を呼ぶ順番が大事\n- **Map の順番に頼らない**。`keySet()` の順番は要件にしないのが安全なので、同数のときのルール（辞書順）を明示的に書いている\n\n### よくある間違い\n- `counts.get(key) + 1` をキーがないときにも実行して `NullPointerException`（`get` はキーがないと `null` を返す）\n- `trim` を `isBlank` の判定より前に呼んで、`null` のときに落ちる\n- 同数のときの比較を忘れ、実行するたびに結果が変わりうるコードになる\n\n### 別解\n`containsKey` の代わりに、null 合体演算子 `??` で1行にまとめることもできる。\n\n```apex\ncounts.put(key, (counts.get(key) ?? 0) + 1);\n```\n\n### 調べ先\n- Apex Reference Guide「Map Class」\n- Apex Reference Guide「String Class」の `isBlank` / `trim` / `compareTo`"},{"id":"L1-06","title":"会員クラスを作る（if・switch・String・static・SObject）","level":1,"type":"write","skills":["APEX-BASIC-01","APEX-BASIC-03","APEX-BASIC-04","APEX-BASIC-05","PF-MODEL-01"],"difficulty":2,"minutes":40,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\nネットショップの会員1人を表すクラスを作りなさい。\nこの1問で、**if と switch・String のメソッドと `?.`・static とインスタンス・SObject（取引先責任者）** をまとめて練習する。\n\n## 使う名前\nクラス名とメソッド名は次のとおりにする。**引数（何を受け取るか）と戻り値の型（何を返すか）は自分で決める**。引数名・変数名・`private` のメソッドも自由。\n\n| 何を作るか | 名前 | 種類 |\n|---|---|---|\n| クラス | `ClubMember` |  |\n| 会員を作る | コンストラクタ（受け取るものと順番は自分で決める） |  |\n| 機能1：氏名 | `getFullName` | インスタンスメソッド |\n| 機能2：メールアドレス | `getEmail` | インスタンスメソッド |\n| 機能3：会員ランク | `getRank` | インスタンスメソッド |\n| 機能4：割引率 | `getDiscountRate` | インスタンスメソッド |\n| 機能5：作った会員の数 | `createdCount` | static 変数 |\n| 機能6：取引先責任者に変換 | `toContact` | インスタンスメソッド |\n\n## 要件\n会員は、作るときに **姓・名・メールアドレス・年間購入額** を受け取る。\n\n- **機能1：氏名**\n  - 姓と名を半角スペース1つでつないだ氏名を返す\n  - 姓・名それぞれの前後の空白は取り除く\n  - 名が `null`・空文字・空白だけなら、姓だけを返す\n- **機能2：メールアドレス**\n  - 前後の空白を取り除き、小文字にしたものを返す\n  - `null` なら `null` を返す（`?.` を使って1行で書く）\n- **機能3：会員ランク（if）**\n  - 年間購入額が 100000 以上なら `'GOLD'`、30000 以上なら `'SILVER'`、それ未満なら `'BRONZE'`\n  - 年間購入額が `null` なら `'BRONZE'`\n  - 100000 と 30000 は、クラスの中で**定数**（`static final`）にする\n- **機能4：割引率（switch）**\n  - ランクから `switch on` で割引率（%）を決める：GOLD は `10`、SILVER は `5`、それ以外は `0`\n- **機能5：作った会員の数（static）**\n  - このクラスで会員を作るたびに1つ増え、**クラス全体で1つ**の数を持つ\n  - 1回の匿名実行の中で、何人作ったかがわかればよい\n- **機能6：取引先責任者に変換（SObject）**\n  - `Contact` を作って返す（保存はしない＝ `insert` しない）\n  - `LastName` に姓、`FirstName` に名（空白だけなら `null`）、`Email` に機能2のメールアドレス、`Description` に `'ランク: GOLD'` の形の文字列を入れる\n\n開発者コンソールの「File → New → Apex Class」でクラスを作ること。\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、「使う名前」のクラス・メソッドを呼んで自分で書く。\n\n```apex\n// 書き方の例\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n**4人の会員**（この順番で、1回の匿名実行の中で作る）\n\n| | 姓 | 名 | メール | 年間購入額 |\n|---|---|---|---|---|\n| 1 | `' 山田 '` | `'太郎 '` | `' Taro@Example.COM '` | `120000` |\n| 2 | `'佐藤'` | `null` | `null` | `30000` |\n| 3 | `'鈴木'` | `'  '` | `'a@b.jp'` | `29999` |\n| 4 | `'高橋'` | `'花子'` | `'x@y.jp'` | `null` |\n\n**結果**\n\n| | 氏名 | メール | ランク | 割引率 |\n|---|---|---|---|---|\n| 1 | `'山田 太郎'` | `'taro@example.com'` | `'GOLD'` | `10` |\n| 2 | `'佐藤'` | `null` | `'SILVER'`（30000 ちょうど） | `5` |\n| 3 | `'鈴木'` | `'a@b.jp'` | `'BRONZE'`（29999） | `0` |\n| 4 | `'高橋 花子'` | `'x@y.jp'` | `'BRONZE'`（`null`） | `0` |\n\n| 確認 | 結果 |\n|---|---|\n| 4人作ったあとの「作った会員の数」 | `4` |\n| 1人目を `Contact` にしたもの | `LastName` が `'山田'`、`FirstName` が `'太郎'`、`Email` が `'taro@example.com'`、`Description` が `'ランク: GOLD'` |\n| 3人目を `Contact` にしたもの | `FirstName` が `null` |\n| 1人目の `Contact` で `get('Email')` | `'taro@example.com'`（項目名を文字列で指定して読む） |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n確認コードの例は、解答の最初にある（開くと「解答を見た」と記録される）。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1（設計）\u003c/summary>\n\n姓・名・メールの「整える処理」は、コンストラクタで1回だけやって、インスタンス変数に入れておく。ほかのメソッドは整ったあとの値だけを使えばよい。\n作った数は、インスタンス変数ではなく `static` 変数にする。インスタンス変数だと、会員ごとに別々の数になってしまう。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2（使うもの）\u003c/summary>\n\n`String.isBlank`、`trim`、`toLowerCase`、`?.`、`switch on 文字列 { when 'GOLD' { … } when else { … } }`、`new Contact(LastName = …, FirstName = …)`、`SObject.get('項目名')`\n\u003c/details>","answer":"## 確認コード\nクラス名・メソッド名は指定どおりなので、引数と戻り値を解答例と同じ形にしていればそのまま使える。違う形にしたときは、呼び出す部分だけ自分の形に合わせる。\n\n```apex\nClubMember yamada = new ClubMember(' 山田 ', '太郎 ', ' Taro@Example.COM ', 120000);\nClubMember sato = new ClubMember('佐藤', null, null, 30000);\nClubMember suzuki = new ClubMember('鈴木', '  ', 'a@b.jp', 29999);\nClubMember takahashi = new ClubMember('高橋', '花子', 'x@y.jp', null);\n\nAssert.areEqual('山田 太郎', yamada.getFullName(), '前後の空白を取ってつなぐ');\nAssert.areEqual('taro@example.com', yamada.getEmail(), '空白を取って小文字に');\nAssert.areEqual('GOLD', yamada.getRank());\nAssert.areEqual(10, yamada.getDiscountRate());\n\nAssert.areEqual('佐藤', sato.getFullName(), '名が null なら姓だけ');\nAssert.isNull(sato.getEmail(), 'メールが null なら null');\nAssert.areEqual('SILVER', sato.getRank(), '30000 ちょうどは SILVER');\nAssert.areEqual(5, sato.getDiscountRate());\n\nAssert.areEqual('鈴木', suzuki.getFullName(), '名が空白だけなら姓だけ');\nAssert.areEqual('BRONZE', suzuki.getRank(), '29999 は BRONZE');\nAssert.areEqual(0, suzuki.getDiscountRate());\n\nAssert.areEqual('高橋 花子', takahashi.getFullName());\nAssert.areEqual('BRONZE', takahashi.getRank(), '購入額が null なら BRONZE');\n\nAssert.areEqual(4, ClubMember.createdCount, '4人作った');\n\nContact yamadaContact = yamada.toContact();\nAssert.areEqual('山田', yamadaContact.LastName);\nAssert.areEqual('太郎', yamadaContact.FirstName);\nAssert.areEqual('taro@example.com', yamadaContact.Email);\nAssert.areEqual('ランク: GOLD', yamadaContact.Description);\nAssert.areEqual('taro@example.com', (String) yamadaContact.get('Email'), '項目名の文字列でも読める');\nAssert.isNull(suzuki.toContact().FirstName, '名が空白だけなら FirstName は null');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n引数と戻り値の型、メソッドの中身は一例。指定したクラス名・メソッド名で作り、要件と確認方法の表を満たしていれば正解とする。\n\n```apex\npublic class ClubMember {\n    private static final Decimal GOLD_THRESHOLD = 100000;\n    private static final Decimal SILVER_THRESHOLD = 30000;\n\n    public static Integer createdCount = 0;\n\n    private String lastName;\n    private String firstName;\n    private String email;\n    private Decimal annualPurchase;\n\n    public ClubMember(String lastName, String firstName, String email, Decimal annualPurchase) {\n        this.lastName = lastName?.trim();\n        this.firstName = String.isBlank(firstName) ? null : firstName.trim();\n        this.email = email?.trim()?.toLowerCase();\n        this.annualPurchase = annualPurchase;\n        createdCount++;\n    }\n\n    public String getFullName() {\n        if (firstName == null) {\n            return lastName;\n        }\n        return lastName + ' ' + firstName;\n    }\n\n    public String getEmail() {\n        return email;\n    }\n\n    public String getRank() {\n        if (annualPurchase == null) {\n            return 'BRONZE';\n        }\n        if (annualPurchase >= GOLD_THRESHOLD) {\n            return 'GOLD';\n        } else if (annualPurchase >= SILVER_THRESHOLD) {\n            return 'SILVER';\n        }\n        return 'BRONZE';\n    }\n\n    public Integer getDiscountRate() {\n        Integer rate;\n        switch on getRank() {\n            when 'GOLD' {\n                rate = 10;\n            }\n            when 'SILVER' {\n                rate = 5;\n            }\n            when else {\n                rate = 0;\n            }\n        }\n        return rate;\n    }\n\n    public Contact toContact() {\n        return new Contact(\n            LastName = lastName,\n            FirstName = firstName,\n            Email = email,\n            Description = 'ランク: ' + getRank()\n        );\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>**static は「クラスに1つ」、インスタンス変数は「1人に1つ」**\u003c/mark>。`createdCount` を static にすると、山田さんを作っても佐藤さんを作っても同じ1つの数が増える。呼ぶときも `yamada.createdCount` ではなく `ClubMember.createdCount` とクラス名で呼ぶ\n- **static の値は1回の実行（トランザクション）の間だけ残る**。匿名実行をもう一度押すと 0 から数え直しになる。Lv3 のトリガーで「同じ処理が2回動かないようにする」ときに、この性質をそのまま使う\n- **定数は `static final` で名前を付ける**。`100000` をコードに直接書くと、あとで「GOLD の基準を変えたい」ときに探して直すことになる。名前を付けておけば、1か所直すだけで済む（Lv8 ではさらにカスタムメタデータに出す）\n- \u003cmark>**`?.` は「左が null ならそこで止めて null を返す」**\u003c/mark>。`email?.trim()?.toLowerCase()` は、`email` が `null` なら `null`、そうでなければ空白を取って小文字にする。`if (email != null)` を書かずに済む\n- **`String.isBlank(firstName)` は static メソッドなので、`firstName` が `null` でも落ちない**。`firstName.trim()` を先に呼ぶと、`null` のときに `NullPointerException` になる\n- **`switch on` は「1つの値で場合分けする」ときに読みやすい**。範囲（30000 以上など）の判定は `if`、決まった値（`'GOLD'` など）の振り分けは `switch` と使い分ける。`when else` は「どれにも当てはまらないとき」\n- \u003cmark>**SObject は `new Contact(項目名 = 値, …)` で作れる**\u003c/mark>。`insert` しなければ組織には保存されない。項目は `contact.Email` のように書くのが基本で、`contact.get('Email')` は項目名を文字列で指定したいとき（どの項目を読むかが実行するまで決まらないとき）に使う。`get` の戻り値は `Object` なので、`(String)` でキャストする\n\n### よくある間違い\n- `createdCount` をインスタンス変数にして、何人作っても `1` になる\n- 割引率の `switch` で `when 'GOLD', 'SILVER'` のように書いて、GOLD と SILVER が同じ割引率になる\n- `30000` ちょうどを `> 30000` で判定して BRONZE になる\n- `toContact` で `insert` してしまい、確認するたびに組織に取引先責任者が増える\n- `switch` の各 `when` の中で `return` し、最後に `return` がなくて保存できないことがある。変数に入れてから最後に1回 `return` すると確実\n\n### 調べ先\n- Apex Developer Guide「Static and Instance Methods, Variables, and Initialization Code」\n- Apex Developer Guide「Switch Statements」「Safe Navigation Operator」\n- Apex Reference Guide「String Class」の `isBlank` / `trim` / `toLowerCase`、「SObject Class」の `get`"},{"id":"L1-07","title":"【総合】注文から請求書の内容を作る","level":1,"type":"project","skills":["APEX-BASIC-01","APEX-BASIC-02","APEX-BASIC-03","APEX-BASIC-04"],"difficulty":3,"minutes":60,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\nネットショップの1回の注文から、**請求書に載せる内容**を計算するクラスを作りなさい。\n請求番号・支払期限・合計金額・カテゴリ別の金額・割引・請求額を出す。\nLv1 で学んだこと（型・コレクション・制御構文・String・Date・クラス）をすべて使う。**解答とヒントを見ずに解けたら Lv1 合格**。\n\n## 使う名前\nクラス名とメソッド名は次のとおりにする。**引数（何を受け取るか）と戻り値の型（何を返すか）は自分で決める**。引数名・変数名・`private` のメソッドも自由。\n\n| 何を作るか | 名前 | 種類 |\n|---|---|---|\n| クラス | `OrderReport` |  |\n| 明細（内部クラス） | `OrderReport.OrderLine` |  |\n| 明細の金額 | `getAmount` | OrderLine のインスタンスメソッド |\n| 注文を受け取る | コンストラクタ（受け取るものと順番は自分で決める） |  |\n| 請求番号 | `getInvoiceNumber` | インスタンスメソッド |\n| 支払期限 | `getPaymentDueDate` | インスタンスメソッド |\n| 明細の件数 | `getLineCount` | インスタンスメソッド |\n| 合計 | `getTotalAmount` | インスタンスメソッド |\n| カテゴリごとの金額 | `getAmountByCategory` | インスタンスメソッド |\n| 一番大きいカテゴリ | `getTopCategory` | インスタンスメソッド |\n| 割引額 | `getDiscount` | インスタンスメソッド |\n| 請求額 | `getBillingAmount` | インスタンスメソッド |\n| 1行の文字列 | `buildSummary` | インスタンスメソッド |\n\n## 要件\n- **明細**\n  - 1行の明細は、商品名・カテゴリ・単価・数量を持つ。明細ごとに金額（`単価 × 数量`）を出せる\n- **注文を受け取る**\n  - 注文番号（整数）・注文日・明細のリストを受け取って、1回の注文として扱う\n  - 次の明細は**集計の対象外**にする：`null` の明細、数量が `null` か 0 以下、単価が `null`\n  - 受け取ったリストが `null` なら明細0件として扱う\n- **請求書の見出し**\n  - 請求番号：`INV-` のあとに注文番号を **6桁の0埋め**にしたもの（注文番号 `123` → `'INV-000123'`）\n  - 支払期限：**注文日の翌月の末日**（1月31日の注文なら2月28日、12月15日の注文なら翌年1月31日）\n- **金額**\n  - 集計対象の明細の件数\n  - 集計対象の明細の金額の合計\n  - カテゴリごとの金額の合計\n    - カテゴリは前後の空白を取り除く。`null`・空文字・空白だけなら `'未分類'`\n  - 金額が一番大きいカテゴリ（同額なら `compareTo` で小さいほう）。明細0件なら `null`\n  - 割引額\n    - 合計が 10000 以上なら合計の 10%、5000 以上なら 5%、それ未満は 0\n    - 1円未満は切り捨て\n  - 請求額（合計 − 割引額）\n  - 次の形の1行の文字列\n\n    ```\n    INV-000123 / 明細: 5件 / カテゴリ数: 4 / 合計: 12800円 / 割引: 1280円 / 請求額: 11520円 / 最多: 食品\n    ```\n    明細0件のときの「最多」は `なし` にする\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、「使う名前」のクラス・メソッドを呼んで自分で書く。\n\n```apex\n// 書き方の例\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n**注文**：注文番号 `123`、注文日 2026年1月31日\n\n**明細（8行）**\n\n| 商品名 | カテゴリ | 単価 | 数量 |\n|---|---|---|---|\n| ノート | `'文具'` | 150 | 10 |\n| ボールペン | `' 文具 '` | 120 | 20 |\n| コーヒー | `'食品'` | 980 | 5 |\n| USBケーブル | `'家電'` | 1200 | 3 |\n| 付箋 | `'文具'` | 300 | 0 |\n| （明細が `null`） | | | |\n| 電池 | `null` | 400 | 1 |\n| おまけ | `'文具'` | `null` | 1 |\n\n**この注文の結果**\n\n| 項目 | 結果 |\n|---|---|\n| 請求番号 | `'INV-000123'` |\n| 支払期限 | 2026年2月28日 |\n| 明細の件数 | `5`（数量0・`null`・単価 `null` の明細は除く） |\n| 合計 | `12800` |\n| カテゴリごとの金額 | 4種類：文具 `3900`、食品 `4900`、家電 `3600`、未分類 `400` |\n| 一番大きいカテゴリ | `食品` |\n| 割引額 / 請求額 | `1280` / `11520` |\n| 1行の文字列 | `INV-000123 / 明細: 5件 / カテゴリ数: 4 / 合計: 12800円 / 割引: 1280円 / 請求額: 11520円 / 最多: 食品` |\n\n**境目の確認**\n\n| 注文 | 結果 |\n|---|---|\n| 注文日 2026年12月15日 | 支払期限 2027年1月31日（年をまたぐ） |\n| 注文日 2028年1月10日 | 支払期限 2028年2月29日（うるう年） |\n| 注文番号 `1234567` | 請求番号 `'INV-1234567'`（6桁を超えたらそのまま） |\n| 5000円×1 だけ | 割引 `250`（5000ちょうどは5%） |\n| 4999円×1 だけ | 割引 `0` |\n| 7777円×1 だけ | 割引 `388`（388.85 を切り捨て） |\n| カテゴリ B 100円×1、カテゴリ A 100円×1 | 一番大きいカテゴリ `A`（同額なら辞書順） |\n| リストが `null`（注文番号 `1`） | 件数 `0`、一番大きいカテゴリ `null`、文字列 `INV-000001 / 明細: 0件 / カテゴリ数: 0 / 合計: 0円 / 割引: 0円 / 請求額: 0円 / 最多: なし` |\n\n金額は `String.valueOf(結果)` が上の文字列になることで確かめる。支払期限は `Date.newInstance(2026, 2, 28)` のように作った日付と比べる。\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n確認コードの例は、解答の最初にある（開くと「解答を見た」と記録される）。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1（設計）\u003c/summary>\n\nコンストラクタで「集計対象の明細だけ」を private な List に入れておくと、ほかのメソッドは除外条件を気にせずに済む。\n明細は、注文のクラスの中に内部クラスとして作ると、`注文のクラス名.明細のクラス名` で使える。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2（使うもの）\u003c/summary>\n\nL1-05（Map で数える）と L1-06（クラス・定数・`String.isBlank`）の組み合わせ。\n0埋めは `String.leftPad`、月末は「翌々月の1日の前の日」と考えると `toStartOfMonth` / `addMonths` / `addDays` で書ける。切り捨ては `setScale(0, RoundingMode.DOWN)`。\n\u003c/details>","answer":"## 確認コード\nクラス名・メソッド名は指定どおりなので、引数と戻り値を解答例と同じ形にしていればそのまま使える。違う形にしたときは、呼び出す部分だけ自分の形に合わせる。\n\n```apex\nList\u003cOrderReport.OrderLine> lines = new List\u003cOrderReport.OrderLine>{\n    new OrderReport.OrderLine('ノート', '文具', 150, 10),\n    new OrderReport.OrderLine('ボールペン', ' 文具 ', 120, 20),\n    new OrderReport.OrderLine('コーヒー', '食品', 980, 5),\n    new OrderReport.OrderLine('USBケーブル', '家電', 1200, 3),\n    new OrderReport.OrderLine('付箋', '文具', 300, 0),\n    null,\n    new OrderReport.OrderLine('電池', null, 400, 1),\n    new OrderReport.OrderLine('おまけ', '文具', null, 1)\n};\nOrderReport report = new OrderReport(123, Date.newInstance(2026, 1, 31), lines);\n\nAssert.areEqual('INV-000123', report.getInvoiceNumber(), '6桁の0埋め');\nAssert.areEqual(Date.newInstance(2026, 2, 28), report.getPaymentDueDate(), '1月31日の翌月末は2月28日');\n\nAssert.areEqual(5, report.getLineCount(), '数量0・null・単価nullの明細は除く');\nAssert.areEqual('12800', String.valueOf(report.getTotalAmount()));\n\nMap\u003cString, Decimal> byCategory = report.getAmountByCategory();\nAssert.areEqual(4, byCategory.size());\nAssert.areEqual('3900', String.valueOf(byCategory.get('文具')), '前後の空白を除いて文具にまとめる');\nAssert.areEqual('4900', String.valueOf(byCategory.get('食品')));\nAssert.areEqual('3600', String.valueOf(byCategory.get('家電')));\nAssert.areEqual('400', String.valueOf(byCategory.get('未分類')));\n\nAssert.areEqual('食品', report.getTopCategory());\nAssert.areEqual('1280', String.valueOf(report.getDiscount()), '10000以上は10%');\nAssert.areEqual('11520', String.valueOf(report.getBillingAmount()));\nAssert.areEqual(\n    'INV-000123 / 明細: 5件 / カテゴリ数: 4 / 合計: 12800円 / 割引: 1280円 / 請求額: 11520円 / 最多: 食品',\n    report.buildSummary()\n);\n\n// 支払期限と請求番号の境目\nList\u003cOrderReport.OrderLine> one = new List\u003cOrderReport.OrderLine>{\n    new OrderReport.OrderLine('A', 'X', 100, 1) };\nAssert.areEqual(Date.newInstance(2027, 1, 31),\n    new OrderReport(1, Date.newInstance(2026, 12, 15), one).getPaymentDueDate(), '年をまたぐ');\nAssert.areEqual(Date.newInstance(2028, 2, 29),\n    new OrderReport(1, Date.newInstance(2028, 1, 10), one).getPaymentDueDate(), 'うるう年');\nAssert.areEqual('INV-1234567',\n    new OrderReport(1234567, Date.today(), one).getInvoiceNumber(), '6桁を超えたらそのまま');\n\n// 割引の境目\nOrderReport r5000 = new OrderReport(1, Date.today(), new List\u003cOrderReport.OrderLine>{\n    new OrderReport.OrderLine('A', 'X', 5000, 1) });\nAssert.areEqual('250', String.valueOf(r5000.getDiscount()), '5000ちょうどは5%');\n\nOrderReport r4999 = new OrderReport(1, Date.today(), new List\u003cOrderReport.OrderLine>{\n    new OrderReport.OrderLine('A', 'X', 4999, 1) });\nAssert.areEqual('0', String.valueOf(r4999.getDiscount()), '5000未満は割引なし');\n\nOrderReport r7777 = new OrderReport(1, Date.today(), new List\u003cOrderReport.OrderLine>{\n    new OrderReport.OrderLine('A', 'X', 7777, 1) });\nAssert.areEqual('388', String.valueOf(r7777.getDiscount()), '388.85 は切り捨てて 388');\n\n// 同額のときは辞書順\nOrderReport tie = new OrderReport(1, Date.today(), new List\u003cOrderReport.OrderLine>{\n    new OrderReport.OrderLine('A', 'B', 100, 1),\n    new OrderReport.OrderLine('B', 'A', 100, 1) });\nAssert.areEqual('A', tie.getTopCategory());\n\n// 明細なし\nOrderReport empty = new OrderReport(1, Date.today(), null);\nAssert.areEqual(0, empty.getLineCount());\nAssert.isNull(empty.getTopCategory());\nAssert.areEqual(\n    'INV-000001 / 明細: 0件 / カテゴリ数: 0 / 合計: 0円 / 割引: 0円 / 請求額: 0円 / 最多: なし',\n    empty.buildSummary()\n);\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n引数と戻り値の型、メソッドの中身は一例。指定したクラス名・メソッド名で作り、要件と確認方法の表を満たしていれば正解とする。\n\n```apex\npublic class OrderReport {\n    private static final Decimal LARGE_ORDER_AMOUNT = 10000;\n    private static final Decimal MEDIUM_ORDER_AMOUNT = 5000;\n\n    private Integer orderNumber;\n    private Date orderDate;\n    private List\u003cOrderLine> validLines = new List\u003cOrderLine>();\n\n    public class OrderLine {\n        public String productName;\n        public String category;\n        public Decimal unitPrice;\n        public Integer quantity;\n\n        public OrderLine(String productName, String category, Decimal unitPrice, Integer quantity) {\n            this.productName = productName;\n            this.category = category;\n            this.unitPrice = unitPrice;\n            this.quantity = quantity;\n        }\n\n        public Decimal getAmount() {\n            return unitPrice * quantity;\n        }\n    }\n\n    public OrderReport(Integer orderNumber, Date orderDate, List\u003cOrderLine> lines) {\n        this.orderNumber = orderNumber;\n        this.orderDate = orderDate;\n        if (lines == null) {\n            return;\n        }\n        for (OrderLine line : lines) {\n            if (line == null || line.unitPrice == null || line.quantity == null || line.quantity \u003c= 0) {\n                continue;\n            }\n            validLines.add(line);\n        }\n    }\n\n    public String getInvoiceNumber() {\n        return 'INV-' + String.valueOf(orderNumber).leftPad(6, '0');\n    }\n\n    public Date getPaymentDueDate() {\n        // 翌々月の1日の前の日 ＝ 翌月の末日\n        return orderDate.toStartOfMonth().addMonths(2).addDays(-1);\n    }\n\n    public Integer getLineCount() {\n        return validLines.size();\n    }\n\n    public Decimal getTotalAmount() {\n        Decimal total = 0;\n        for (OrderLine line : validLines) {\n            total += line.getAmount();\n        }\n        return total;\n    }\n\n    public Map\u003cString, Decimal> getAmountByCategory() {\n        Map\u003cString, Decimal> amounts = new Map\u003cString, Decimal>();\n        for (OrderLine line : validLines) {\n            String key = normalizeCategory(line.category);\n            if (!amounts.containsKey(key)) {\n                amounts.put(key, 0);\n            }\n            amounts.put(key, amounts.get(key) + line.getAmount());\n        }\n        return amounts;\n    }\n\n    public String getTopCategory() {\n        Map\u003cString, Decimal> amounts = getAmountByCategory();\n        String top = null;\n        for (String key : amounts.keySet()) {\n            if (top == null\n                    || amounts.get(key) > amounts.get(top)\n                    || (amounts.get(key) == amounts.get(top) && key.compareTo(top) \u003c 0)) {\n                top = key;\n            }\n        }\n        return top;\n    }\n\n    public Decimal getDiscount() {\n        Decimal total = getTotalAmount();\n        Decimal rate = 0;\n        if (total >= LARGE_ORDER_AMOUNT) {\n            rate = 0.10;\n        } else if (total >= MEDIUM_ORDER_AMOUNT) {\n            rate = 0.05;\n        }\n        return (total * rate).setScale(0, RoundingMode.DOWN);\n    }\n\n    public Decimal getBillingAmount() {\n        return getTotalAmount() - getDiscount();\n    }\n\n    public String buildSummary() {\n        String top = getTopCategory();\n        return getInvoiceNumber()\n            + ' / 明細: ' + getLineCount() + '件'\n            + ' / カテゴリ数: ' + getAmountByCategory().size()\n            + ' / 合計: ' + getTotalAmount() + '円'\n            + ' / 割引: ' + getDiscount() + '円'\n            + ' / 請求額: ' + getBillingAmount() + '円'\n            + ' / 最多: ' + (top == null ? 'なし' : top);\n    }\n\n    private static String normalizeCategory(String category) {\n        return String.isBlank(category) ? '未分類' : category.trim();\n    }\n}\n```\n\n## 解説\n### ポイント\n- **入口でデータをきれいにする**。コンストラクタで対象外の明細を取り除いて `validLines` に入れておけば、残りのメソッドは「正しいデータだけがある」前提で書ける。現場でも、外から来たデータのチェックは処理の最初にまとめて行う\n- \u003cmark>**月末は「次の月の1日の前の日」で求める**\u003c/mark>。月によって 28〜31日と日数が違うので、日にちを自分で計算しない。`toStartOfMonth()` で月初にそろえてから `addMonths(2)` で翌々月の1日、`addDays(-1)` で前の日に戻す。年またぎ・うるう年も `Date` のメソッドが正しく繰り上げてくれる\n- **`addMonths` の前に、日を月初にそろえておく**のが安全。`Date.newInstance(2026, 1, 31).addMonths(1)` は 2月28日（2月に31日がないので月末に合わせられる）。月末日から計算すると日がずれることがあるので、月初にしてから足す\n- **0埋めは `leftPad(桁数, '0')`**。`leftPad` は String のメソッドなので、整数は先に `String.valueOf` で文字列にする。もともと6桁以上なら何も足されない\n- **同じ処理は1か所に**。カテゴリ名をそろえる処理を `normalizeCategory` に切り出しておけば、ルールが変わったときに1か所直すだけで済む。外から使わないので `private` にする\n- **割引の基準は定数にする**（L1-06 と同じ）。`10000` が何の数なのかが名前でわかる\n- **Map で「キーごとに合計する」**のは L1-05 の「キーごとに数える」と同じ形。`+ 1` が `+ 金額` に変わっただけ\n- **`buildSummary` の `+` は左から順につながる**。先頭が文字列なので、あとの数値はすべて文字列としてつながる。途中で足し算したいときは `( )` で囲む\n- **境目の値（4999・5000）・切り捨て（7777 → 388.85）・年またぎ・うるう年を確認コードに入れている**。自分でテストを書く Lv4 でも、この考え方で確認する値を選ぶ\n\n### よくある間違い\n- `getAmountByCategory` で `amounts.get(key) + line.getAmount()` をキーがないときにも実行して `NullPointerException`（`get` はキーがないと `null`）\n- 除外条件を `getTotalAmount` だけに書き、`getAmountByCategory` では書き忘れて結果が合わない\n- 支払期限の日にちを 30 や 31 と決め打ちして、2月や4月で間違える\n- `orderNumber.leftPad(6, '0')` と書いて保存できない（Integer には `leftPad` がない）\n- `buildSummary` で `top` が `null` のとき `'最多: null'` になる\n- 割引の判定を `> 10000` にして、ちょうど 10000 のときに割引されない\n\n### 動かないときは\n- 保存や実行でエラーが出たら、メッセージの **`Line`（行）と `Column`（列）** を見て、その行の前後を読む。`Variable does not exist` は名前の打ち間違い、`Method does not exist or incorrect signature` は型が合っていない（例：Integer に String のメソッドを呼んでいる）ことが多い\n- `System.NullPointerException: Attempt to de-reference a null object` は、**`null` の変数の `.` の右側を呼んだ**という意味。出た行で `.` を使っている変数のうち、どれが `null` になりうるかを探す\n\n### さらに良くするには（発展）\n- `getTopCategory` や `buildSummary` は、呼ばれるたびに合計を計算し直している。明細の数が多いときは、コンストラクタで一度だけ計算して変数に覚えておく書き方もある\n- 金額の表示を `12,800円` のようにカンマ区切りにしたい場合は、`Decimal.format()` を調べてみる（ユーザーのロケールによって表示が変わる点に注意）\n\n### 調べ先\n- Apex Developer Guide「Classes, Objects, and Interfaces」\n- Apex Reference Guide「Date Class」の `toStartOfMonth` / `addMonths` / `addDays`\n- Apex Reference Guide「String Class」の `leftPad`、「Map Class」「Decimal Class」の `setScale`"},{"id":"G-001","title":"割り算・+ の順番・null・日付をまとめて押さえる","level":1,"type":"write","skills":["APEX-BASIC-01","APEX-BASIC-03"],"difficulty":2,"minutes":30,"environment":"org","language":"ja","source":"generated","memo_ids":["M-20261114-222005"],"learned_ids":["Q-001","Q-005"],"question":"## 問題\nわからなかったこと（割り算とキャスト・`+` の順番・初期化しない変数・月をまたぐ日付）を、**予想する → 書く**の2段階で1問にまとめた。\n\n## パート1：結果を予想する（紙とペン）\n次のコードを匿名実行したとき、①〜⑨の `System.debug` に何が出るか答えなさい。\n⑩は「エラーになる / ならない」と、エラーなら何のエラーかを答える。\n\n```apex\nInteger total = 7;\nInteger count = 2;\nInteger notSet;\n\nDecimal a = total / count;\nDecimal b = (Decimal) total / count;\nDecimal c = (Decimal) (total / count);\nSystem.debug(a);                          // ①\nSystem.debug(b);                          // ②\nSystem.debug(c);                          // ③\n\nSystem.debug(notSet);                     // ④\nSystem.debug('合計: ' + total + count);    // ⑤\nSystem.debug('合計: ' + (total + count));  // ⑥\nSystem.debug(total + count + '個');        // ⑦\n\nDate lastDay = Date.newInstance(2026, 12, 31);\nSystem.debug(lastDay.addDays(1).year());                       // ⑧\nSystem.debug(Date.newInstance(2026, 3, 1).addDays(-1).day());  // ⑨\n\nInteger next = notSet + 1;                // ⑩\n```\n\n## パート2：キャンペーンの期間と1日平均を求めるクラスを書く\n### 使う名前\nクラス名とメソッド名は次のとおりにする。**引数（何を受け取るか）と戻り値の型（何を返すか）は自分で決める**。引数名・変数名・`private` のメソッドも自由。\n\n| 何を作るか | 名前 | 種類 |\n|---|---|---|\n| クラス | `CampaignCalculator` |  |\n| 機能1：終了日 | `endDate` | static メソッド |\n| 機能2：1日あたりの平均 | `dailyAverage` | static メソッド |\n| 機能3：表示用の文字列 | `buildSummary` | static メソッド |\n\n- **機能1：終了日**\n  - 開始日と日数（整数）を受け取り、終了日を返す。**開始日を1日目**として数える（12月25日から10日間なら、1月3日まで）\n  - 日数が `null` か 0 以下なら `null` を返す\n- **機能2：1日あたりの平均**\n  - 売上の合計（整数）と日数（整数）を受け取り、1日あたりの平均を**小数第1位まで**（第2位を四捨五入）返す\n  - 合計が `null` なら 0 として計算する\n  - 日数が `null` か 0 以下なら `null` を返す\n- **機能3：表示用の文字列**\n  - 日数と売上の合計から、`'10日間 / 合計: 1000円 / 1日平均: 100.0円'` の形の文字列を返す\n  - 日数が `null` か 0 以下なら `'期間なし'`\n\n### 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、「使う名前」のクラス・メソッドを呼んで自分で書く。\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | 2026年12月25日・10日 | 2027年1月3日（年をまたぐ） |\n| 1 | 2026年2月20日・10日 | 2026年3月1日（2月は28日まで） |\n| 1 | 2026年5月1日・1日 | 2026年5月1日（1日間なら同じ日） |\n| 1 | 2026年5月1日・0日 | `null` |\n| 2 | 合計 1000・6日 | `166.7` |\n| 2 | 合計 7・2日 | `3.5`（`3` ではない） |\n| 2 | 合計 `null`・3日 | `0.0` |\n| 2 | 合計 1000・0日 | `null` |\n| 3 | 10日・合計 1000 | `'10日間 / 合計: 1000円 / 1日平均: 100.0円'` |\n| 3 | `null`・合計 1000 | `'期間なし'` |\n\n小数は `String.valueOf(結果)` が上の文字列になることで確かめる。\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1（パート1）\u003c/summary>\n\n`Integer / Integer` は、割る前の時点で答えも整数に決まる。`(Decimal)` を**割る前の数**に付けたか、**割った結果**に付けたかで答えが変わる。\n`+` は左から順に計算する。左が文字列になった時点で、そのあとは全部「つなぐ」になる。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2（パート2）\u003c/summary>\n\n終了日は「開始日に（日数 − 1）日足す」。四捨五入は `setScale(1, RoundingMode.HALF_UP)`。\n\u003c/details>","answer":"## パート1の解答\n| 番号 | 答え | 理由 |\n|---|---|---|\n| ① | `3` | `7 / 2` は Integer 同士なので、割った時点で小数が切り捨てられて `3`。そのあと Decimal に入れても `3` のまま |\n| ② | `3.5` | `(Decimal) total` で 7 を先に Decimal にしてから割るので、小数まで計算される |\n| ③ | `3` | `( )` の中の `total / count` が先に計算されて `3`。その結果を Decimal にしても戻らない |\n| ④ | `null` | 何も入れていない変数は `null`。Integer でも `0` にはならない |\n| ⑤ | `合計: 72` | 左から順に `'合計: ' + 7` → `'合計: 7'`（文字列）、そこに `2` がつながる |\n| ⑥ | `合計: 9` | `( )` の中が先に計算されて `9`。それが文字列につながる |\n| ⑦ | `9個` | 左から順に `7 + 2` → `9`（整数同士の足し算）、そこに `'個'` がつながる |\n| ⑧ | `2027` | 12月31日の1日後は 2027年1月1日。年も繰り上がる |\n| ⑨ | `28` | 3月1日の1日前は 2月28日（2026年はうるう年ではない） |\n| ⑩ | エラーになる。`System.NullPointerException` | `notSet` は `null`。`null + 1` は計算できない |\n\n## パート2の確認コード\nクラス名・メソッド名は指定どおりなので、引数と戻り値を解答例と同じ形にしていればそのまま使える。違う形にしたときは、呼び出す部分だけ自分の形に合わせる。\n\n```apex\nAssert.areEqual(Date.newInstance(2027, 1, 3), CampaignCalculator.endDate(Date.newInstance(2026, 12, 25), 10), '年をまたぐ');\nAssert.areEqual(Date.newInstance(2026, 3, 1), CampaignCalculator.endDate(Date.newInstance(2026, 2, 20), 10), '2月をまたぐ');\nAssert.areEqual(Date.newInstance(2026, 5, 1), CampaignCalculator.endDate(Date.newInstance(2026, 5, 1), 1), '1日間なら同じ日');\nAssert.isNull(CampaignCalculator.endDate(Date.newInstance(2026, 5, 1), 0), '0日なら null');\n\nAssert.areEqual('166.7', String.valueOf(CampaignCalculator.dailyAverage(1000, 6)));\nAssert.areEqual('3.5', String.valueOf(CampaignCalculator.dailyAverage(7, 2)), '整数の割り算で 3 にしない');\nAssert.areEqual('0.0', String.valueOf(CampaignCalculator.dailyAverage(null, 3)), '合計 null は 0');\nAssert.isNull(CampaignCalculator.dailyAverage(1000, 0), '0日なら null');\n\nAssert.areEqual('10日間 / 合計: 1000円 / 1日平均: 100.0円', CampaignCalculator.buildSummary(10, 1000));\nAssert.areEqual('期間なし', CampaignCalculator.buildSummary(null, 1000));\n\nSystem.debug('すべて正解です');\n```\n\n## パート2の解答例\n引数と戻り値の型、メソッドの中身は一例。指定したクラス名・メソッド名で作り、要件と確認方法の表を満たしていれば正解とする。\n\n```apex\npublic class CampaignCalculator {\n    public static Date endDate(Date startDate, Integer days) {\n        if (days == null || days \u003c= 0) {\n            return null;\n        }\n        return startDate.addDays(days - 1);\n    }\n\n    public static Decimal dailyAverage(Integer totalSales, Integer days) {\n        if (days == null || days \u003c= 0) {\n            return null;\n        }\n        Decimal total = totalSales ?? 0;\n        return (total / days).setScale(1, RoundingMode.HALF_UP);\n    }\n\n    public static String buildSummary(Integer days, Integer totalSales) {\n        if (days == null || days \u003c= 0) {\n            return '期間なし';\n        }\n        return days + '日間 / 合計: ' + totalSales + '円 / 1日平均: ' + dailyAverage(totalSales, days) + '円';\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>**Integer 同士の割り算は、割った時点で小数が消える**\u003c/mark>。小数が欲しいときは、**割る前に** 片方を `Decimal` にする。`(Decimal) total / count` と `(Decimal) (total / count)` は見た目が似ているが、後者は切り捨てたあとの `3` を Decimal にしているだけ\n- 解答例の `Decimal total = totalSales ?? 0;` も同じ考え方。先に Decimal の変数に入れてから割っている\n- \u003cmark>**`+` は左から順に計算する**\u003c/mark>。文字列が出てきた時点で、そのあとの `+` は全部「つなぐ」になる。数を足してから文字列にしたいときは `( )` で囲む\n- \u003cmark>**何も入れていない変数は `null`**\u003c/mark>。Integer も Boolean も、`0` や `false` にはならない。`null` に `+ 1` したり `.` でメソッドを呼んだりすると `NullPointerException` になる\n- \u003cmark>**日付の計算は `addDays` / `addMonths` に任せる**\u003c/mark>。月末・年末・うるう年をまたいでも正しく繰り上がる。日にちを数値として自分で足し引きしない\n- **「開始日を1日目と数える」ときは `日数 − 1` 日足す**。10日間なら、開始日 + 9日 が最終日。期間の計算で1日ずれる間違いはとても多いので、「1日間なら同じ日」を確認に入れておく\n\n### よくある間違い\n- `(Decimal) (totalSales / days)` と書いて、7 ÷ 2 が `3.0` になる\n- 終了日を `startDate.addDays(days)` にして、1日後ろにずれる\n- `days \u003c= 0` より先に `days - 1` を計算して、`days` が `null` のときに落ちる\n\n### 調べ先\n- Apex Developer Guide「Expression Operators」（`+` と `/` の動き）\n- Apex Reference Guide「Date Class」の `addDays` / `addMonths` / `year` / `day`\n- Apex Reference Guide「Decimal Class」の `setScale`"},{"id":"G-002","title":"List の番号・size と length・null のリストを押さえる","level":1,"type":"write","skills":["APEX-BASIC-02"],"difficulty":2,"minutes":30,"environment":"org","language":"ja","source":"generated","memo_ids":[],"learned_ids":["Q-002","Q-006","Q-007"],"question":"## 問題\nわからなかったこと（`remove` のあとの番号・`size` と `length`・`null` のリスト）を、**予想する → 書く**の2段階で1問にまとめた。\n\n## パート1：結果を予想する（紙とペン）\n次のコードを匿名実行したとき、①〜⑨の `System.debug` に何が出るか答えなさい。\n⑩と⑪は「エラーになる / ならない」と、エラーならどんなエラーかを答える（⑩と⑪は、それぞれ1行だけを別に実行したと考える）。\n\n```apex\nList\u003cString> fruits = new List\u003cString>{ 'りんご', 'みかん', 'ぶどう', 'もも' };\nfruits.remove(1);\nSystem.debug(fruits);                    // ①\nSystem.debug(fruits.indexOf('もも'));     // ②\nSystem.debug(fruits.indexOf('みかん'));   // ③\n\nfruits.add(0, 'いちご');\nSystem.debug(fruits.indexOf('もも'));     // ④\nSystem.debug(fruits.size());             // ⑤\nSystem.debug(fruits[0].length());        // ⑥\n\nList\u003cString> emptyList = new List\u003cString>();\nList\u003cString> notSet;\nSystem.debug(emptyList.isEmpty());       // ⑦\nSystem.debug(notSet == null);            // ⑧\nSystem.debug(notSet?.isEmpty());         // ⑨\n\nSystem.debug(notSet.isEmpty());          // ⑩\nSystem.debug(fruits.length);             // ⑪\n```\n\n## パート2：キャンセルされた商品を取り除くクラスを書く\n### 使う名前\nクラス名とメソッド名は次のとおりにする。**引数（何を受け取るか）と戻り値の型（何を返すか）は自分で決める**。引数名・変数名・`private` のメソッドも自由。\n\n| 何を作るか | 名前 | 種類 |\n|---|---|---|\n| クラス | `ProductListUtil` |  |\n| 機能1：指定した商品をすべて取り除く | `removeAll` | static メソッド |\n| 機能2：一番長い商品名の文字数 | `longestNameLength` | static メソッド |\n| 機能3：件数のメッセージ | `buildCountMessage` | static メソッド |\n\n- **機能1：指定した商品をすべて取り除く**\n  - 商品名のリストと、取り除く商品名を受け取り、その商品名と同じ要素を**すべて**取り除いたリストを返す\n  - **受け取ったリストは変えない**（新しいリストを返す）\n  - 受け取ったリストが `null` なら空のリストを返す\n- **機能2：一番長い商品名の文字数**\n  - 商品名のリストを受け取り、一番長い商品名の文字数を返す\n  - `null` の要素は 0 文字として扱う\n  - リストが `null` か空なら `0`\n- **機能3：件数のメッセージ**\n  - リストが `null` か空なら `'商品なし'`、それ以外は `'商品: 3件'` の形\n\n### 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、「使う名前」のクラス・メソッドを呼んで自分で書く。\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `'ペン'`, `'ノート'`, `'ペン'`, `'のり'`, `'ペン'` から `'ペン'` | `'ノート'`, `'のり'`（2件） |\n| 1 | 上と同じ | 受け取ったリストは5件のまま |\n| 1 | `'ペン'` から `'消しゴム'` | `'ペン'`（何も取り除かない） |\n| 1 | `null` から `'ペン'` | 空のリスト（0件） |\n| 2 | `'ペン'`, `'ボールペン'`, `null` | `5` |\n| 2 | `null` | `0` |\n| 3 | `'ペン'`, `'ノート'`, `'のり'` | `'商品: 3件'` |\n| 3 | 空のリスト / `null` | `'商品なし'` / `'商品なし'` |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1（パート1）\u003c/summary>\n\n`remove(1)` は「1番の要素」を取り除く（番号は 0 から）。取り除くと、うしろの要素が1つずつ前に詰まる。`add(0, 値)` は先頭に差し込むので、うしろの要素が1つずつうしろにずれる。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2（パート2）\u003c/summary>\n\nループで回しながら同じリストから `remove` すると、番号がずれて取りこぼす。**残したいものだけを新しいリストに `add` する**と、ずれを気にしなくてよい。\n\u003c/details>","answer":"## パート1の解答\n| 番号 | 答え | 理由 |\n|---|---|---|\n| ① | `(りんご, ぶどう, もも)` | 1番（0から数えて2つ目）の「みかん」が取り除かれ、うしろが前に詰まる |\n| ② | `2` | もも は 3番 → 詰まって 2番 |\n| ③ | `-1` | みかん はもうない。見つからないときは `-1` |\n| ④ | `3` | 先頭に いちご が入り、うしろが1つずつずれる：`(いちご, りんご, ぶどう, もも)` |\n| ⑤ | `4` | リストの件数は `size()` |\n| ⑥ | `3` | `fruits[0]` は いちご。**文字列**の文字数は `length()` |\n| ⑦ | `true` | 中身0件のリストは「空」 |\n| ⑧ | `true` | 何も入れていない変数は `null`。空のリストとは別物 |\n| ⑨ | `null` | `?.` は左が `null` ならそこで止まって `null` を返す |\n| ⑩ | エラーになる。`System.NullPointerException` | `null` には `.isEmpty()` を呼べない。空のリストとは違い、リストそのものがない |\n| ⑪ | エラーになる（実行の前に `Variable does not exist: length` というエラーで止まる） | リストには `length` がない。件数は `size()` |\n\n## パート2の確認コード\nクラス名・メソッド名は指定どおりなので、引数と戻り値を解答例と同じ形にしていればそのまま使える。違う形にしたときは、呼び出す部分だけ自分の形に合わせる。\n\n```apex\nList\u003cString> items = new List\u003cString>{ 'ペン', 'ノート', 'ペン', 'のり', 'ペン' };\nList\u003cString> remaining = ProductListUtil.removeAll(items, 'ペン');\nAssert.areEqual(new List\u003cString>{ 'ノート', 'のり' }, remaining, 'ペンをすべて取り除く');\nAssert.areEqual(5, items.size(), '受け取ったリストは変えない');\nAssert.areEqual(new List\u003cString>{ 'ペン' }, ProductListUtil.removeAll(new List\u003cString>{ 'ペン' }, '消しゴム'));\nAssert.areEqual(0, ProductListUtil.removeAll(null, 'ペン').size(), 'null なら空のリスト');\n\nAssert.areEqual(5, ProductListUtil.longestNameLength(new List\u003cString>{ 'ペン', 'ボールペン', null }));\nAssert.areEqual(0, ProductListUtil.longestNameLength(null));\n\nAssert.areEqual('商品: 3件', ProductListUtil.buildCountMessage(new List\u003cString>{ 'ペン', 'ノート', 'のり' }));\nAssert.areEqual('商品なし', ProductListUtil.buildCountMessage(new List\u003cString>()));\nAssert.areEqual('商品なし', ProductListUtil.buildCountMessage(null));\n\nSystem.debug('すべて正解です');\n```\n\n## パート2の解答例\n引数と戻り値の型、メソッドの中身は一例。指定したクラス名・メソッド名で作り、要件と確認方法の表を満たしていれば正解とする。\n\n```apex\npublic class ProductListUtil {\n    public static List\u003cString> removeAll(List\u003cString> names, String target) {\n        List\u003cString> remaining = new List\u003cString>();\n        if (names == null) {\n            return remaining;\n        }\n        for (String name : names) {\n            if (name != target) {\n                remaining.add(name);\n            }\n        }\n        return remaining;\n    }\n\n    public static Integer longestNameLength(List\u003cString> names) {\n        Integer longest = 0;\n        if (names == null) {\n            return longest;\n        }\n        for (String name : names) {\n            Integer nameLength = (name == null) ? 0 : name.length();\n            if (nameLength > longest) {\n                longest = nameLength;\n            }\n        }\n        return longest;\n    }\n\n    public static String buildCountMessage(List\u003cString> names) {\n        if (names == null || names.isEmpty()) {\n            return '商品なし';\n        }\n        return '商品: ' + names.size() + '件';\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>**`remove(番号)` のあとは、うしろの要素が前に詰まる**\u003c/mark>。`add(番号, 値)` で差し込むと、うしろにずれる。番号を覚えておいて使い回すと、別の要素を指してしまう。値で探し直すときは `indexOf`（なければ `-1`）\n- \u003cmark>**件数はリストの `size()`、文字数は文字列の `length()`**\u003c/mark>。リストに `length` はなく、文字列に `size()` はない。「何の数か」で使い分ける\n- \u003cmark>**`null` のリストと空のリストは別物**\u003c/mark>。空のリスト（`new List\u003cString>()`）は `isEmpty()` が `true` を返すが、`null` のリストに `.isEmpty()` を呼ぶと `NullPointerException` で落ちる。外から受け取ったリストは **`names == null || names.isEmpty()`** の順で確かめる（`||` は左が `true` なら右を見ないので、`null` のときに `isEmpty()` は呼ばれない）\n- **取り除くより「残すものを集める」**。ループしながら同じリストから `remove` すると、詰まった要素を飛ばしてしまう。新しいリストに `add` すれば、元のリストも変わらず、ずれも起きない\n- **`name != target` の `!=` は、大文字・小文字を区別しない**（`'Pen' != 'pen'` は `false`）。区別したいときは `equals` を使う（G-003 で扱う）\n- **リストの中身の比較は `Assert.areEqual(リスト, リスト)` でできる**。順番と中身が同じなら等しい\n\n### よくある間違い\n- `names.isEmpty() || names == null` の順に書いて、`null` のときに落ちる\n- `for (Integer i = 0; i \u003c names.size(); i++)` の中で `names.remove(i)` して、続けて並んだ `'ペン'` を取りこぼす\n- `names.remove('ペン')` と書いて保存できない（List の `remove` は番号を受け取る。値で取り除けるのは Set）\n\n### 調べ先\n- Apex Reference Guide「List Class」の `remove` / `add(index, element)` / `indexOf` / `size` / `isEmpty`\n- Apex Reference Guide「String Class」の `length`"},{"id":"G-003","title":"Set の add の戻り値・重複・大文字と小文字を押さえる","level":1,"type":"write","skills":["APEX-BASIC-02","APEX-BASIC-03"],"difficulty":2,"minutes":30,"environment":"org","language":"ja","source":"generated","memo_ids":[],"learned_ids":["Q-003","Q-008","Q-009"],"question":"## 問題\nわからなかったこと（`Set.add` が返す値・重複の見つけ方・大文字と小文字の区別）を、**予想する → 書く**の2段階で1問にまとめた。\n\n## パート1：結果を予想する（紙とペン）\n次のコードを匿名実行したとき、①〜⑩の `System.debug` に何が出るか答えなさい。\n\n```apex\nSet\u003cString> codes = new Set\u003cString>();\nSystem.debug(codes.add('A-01'));          // ①\nSystem.debug(codes.add('A-01'));          // ②\nSystem.debug(codes.add('a-01'));          // ③\nSystem.debug(codes.size());               // ④\nSystem.debug(codes.contains('a-01'));     // ⑤\nSystem.debug(codes.remove('B-01'));       // ⑥\n\nSystem.debug('A-01' == 'a-01');           // ⑦\nSystem.debug('A-01'.equals('a-01'));      // ⑧\n\nList\u003cString> received = new List\u003cString>{ 'x', 'y', 'x' };\nSet\u003cString> unique = new Set\u003cString>(received);\nSystem.debug(received.size() + ' / ' + unique.size());   // ⑨\n\nreceived.addAll(unique);\nSystem.debug(received.size());            // ⑩\n```\n\n## パート2：受付番号とメールアドレスをチェックするクラスを書く\n### 使う名前\nクラス名とメソッド名は次のとおりにする。**引数（何を受け取るか）と戻り値の型（何を返すか）は自分で決める**。引数名・変数名・`private` のメソッドも自由。\n\n| 何を作るか | 名前 | 種類 |\n|---|---|---|\n| クラス | `InputChecker` |  |\n| 機能1：重複した受付番号を見つける | `findDuplicates` | static メソッド |\n| 機能2：許可されたドメインのメールアドレスだけを通す | `filterAllowedEmails` | static メソッド |\n\n- **機能1：重複した受付番号を見つける**\n  - 受付番号のリストを受け取り、**2回以上出てきた**受付番号の Set を返す\n  - 前後の空白を取り除き、大文字にそろえてから比べる（`' r-001 '` と `'R-001'` は同じ番号）。返す番号もそろえたあとの形\n  - `null`・空白だけの番号は無視する。リストが `null` なら空の Set\n- **機能2：許可されたドメインのメールアドレスだけを通す**\n  - メールアドレスのリストと、許可するドメインの Set を受け取り、ドメイン（`@` のうしろ）が許可されたものだけをリストで返す\n  - メールアドレスも許可ドメインも、**大文字・小文字を区別しない**（`'Taro@Example.COM'` は `'example.com'` で許可される）\n  - 返すメールアドレスは、前後の空白を取り除いて小文字にしたもの。受け取った順番のまま\n  - `null`・空白だけのアドレスは無視する\n\n### 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、「使う名前」のクラス・メソッドを呼んで自分で書く。\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `'R-001'`, `' r-001 '`, `'R-002'`, `null`, `'R-003'`, `'r-002'`, `'R-001'` | `{'R-001', 'R-002'}` |\n| 1 | `'R-001'`, `'R-002'` | 空の Set |\n| 1 | `null` | 空の Set |\n| 2 | `' Taro@Example.COM '`, `'hanako@other.jp'`, `null`, `'jiro@SUB.example.com'`, `'ken@shop.co.jp'` と、許可 `{'EXAMPLE.com', 'shop.co.jp'}` | `'taro@example.com'`, `'ken@shop.co.jp'`（`sub.example.com` は別のドメイン） |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1（パート1）\u003c/summary>\n\n`add` は「入った（新しかった）なら `true`、もうあったので入らなかったなら `false`」を返す。`remove` も「取り除けたかどうか」を返す。\nSet の中で文字列を比べるときと、`==` で比べるときは、大文字・小文字の扱いが違う。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2（パート2）\u003c/summary>\n\n機能1は「1回目を入れる Set」と「重複を入れる Set」の2つを使う。1回目の Set への `add` が `false` を返したら、それは重複。\n機能2は、許可ドメインを**先に小文字にそろえた Set に作り直す**と、`contains` で比べられる。ドメインは `substringAfter('@')`。\n\u003c/details>","answer":"## パート1の解答\n| 番号 | 答え | 理由 |\n|---|---|---|\n| ① | `true` | 新しく入った |\n| ② | `false` | `'A-01'` はもうあるので入らない。**重複していたことがわかる** |\n| ③
