きは、先に `containsKey` で確かめる\n- \u003cmark>`keySet()` はすべてのキーを `Set` で返す\u003c/mark>。`for (String key : map.keySet())` でキーを1つずつ取り出し、`map.get(key)` で値を引く。Map の中身を全部見るときの決まった形\n- `keySet()` の順番は決まっていないと考える。順番に頼る処理（「同数なら辞書順で先」など）は、`compareTo` で自分で比べて書く\n- \u003cmark>`a.compareTo(b)` は a が先ならマイナス、同じなら 0、後ならプラス\u003c/mark>。数字そのもの（-1 か -2 か）ではなく、**符号**で判定する（`\u003c 0` / `== 0` / `> 0`）\n- `compareTo` は大文字・小文字を区別する。大文字は小文字より先になる\n\n### よくある間違い\n- ① を `3` と答える：同じキーでも別に追加されると思う\n- ③ を `0` と答える：キーがないと 0 が返ると思う\n- ⑩ を `false` と答える：大文字・小文字を区別しない辞書（国語辞典）の順番で考える\n- `compareTo` の結果を `== -1` で判定する：マイナスであることは決まっているが、-1 とは限らない\n\n### 調べ先\n- Apex Reference Guide「Map Class」の `put` / `get` / `containsKey` / `keySet` / `size`\n- Apex Reference Guide「String Class」の `compareTo`"},{"id":"G-022","title":"会員ごとの購入金額を合計し、一番買った会員を求める","level":1,"type":"write","skills":["APEX-BASIC-02","APEX-BASIC-03","APEX-BASIC-04"],"difficulty":2,"minutes":25,"environment":"org","language":"ja","source":"generated","memo_ids":["M-20261122-233619"],"learned_ids":[],"question":"## 問題\nポイントカードのレジから、購入の記録が `'会員ID:金額'` の形の文字列のリストで届く（例：`'m01:300'`）。\n会員ごとの購入金額を合計し、集計するクラスを作りなさい。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n\n- **機能1：会員ごとに金額を合計する**\n  - 記録のリストを受け取り、会員IDごとの合計金額を返す（会員IDから合計金額を引ける形にする）\n  - 記録は `:` で会員IDと金額に分ける。会員IDと金額の前後の空白は取り除く（`' m03 : 200 '` は会員 `m03`、金額 `200`）\n  - `null`・空文字・空白だけの記録は飛ばす\n  - 受け取ったリストが `null` なら、空の結果（0人）を返す\n- **機能2：一番多く買った会員を求める**\n  - 機能1の結果から、合計金額が一番多い会員IDを返す\n  - 合計金額が同じ会員がいる場合は、会員IDを `compareTo` で比べて小さいほう（辞書順で先のもの）を返す\n  - 結果が空なら `null` を返す\n- **機能3：金額以上の会員を数える**\n  - 機能1の結果と金額を受け取り、合計金額がその金額**以上**の会員の人数を返す\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n機能1は「まだキーがなければその金額を入れる、あれば今の合計に足して入れ直す」。数えるときの `+ 1` が `+ 金額` に変わるだけ。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n使うメソッド：`String.split`・`String.trim`・`String.isBlank`・`Integer.valueOf`、`Map.containsKey` / `Map.get` / `Map.put` / `Map.keySet`、`String.compareTo`\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `'m02:500'`, `'m01:300'`, `' m03 : 200 '`, `'m01:200'`, `null`, `'m02:0'`, `''` | m01 500、m02 500、m03 200（3人） |\n| 1 | `null` | 0人 |\n| 2 | 上の合計の結果 | `'m01'`（m01 と m02 が同額なので辞書順で先） |\n| 2 | 空 | `null` |\n| 3 | 上の合計の結果、`500` | `2` |\n| 3 | 上の合計の結果、`600` | `0` |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nList\u003cString> records = new List\u003cString>{ 'm02:500', 'm01:300', ' m03 : 200 ', 'm01:200', null, 'm02:0', '' };\nMap\u003cString, Integer> totals = PointTotalizer.totalByMember(records);\n\nAssert.areEqual(500, totals.get('m01'), 'm01 は 300 + 200');\nAssert.areEqual(500, totals.get('m02'), 'm02 は 500 + 0');\nAssert.areEqual(200, totals.get('m03'), '空白を取って m03 は 200');\nAssert.areEqual(3, totals.size(), '会員は3人');\nAssert.areEqual(0, PointTotalizer.totalByMember(null).size(), 'null なら空の Map');\n\nAssert.areEqual('m01', PointTotalizer.topMember(totals), '同額なら辞書順で先の m01');\nAssert.isNull(PointTotalizer.topMember(new Map\u003cString, Integer>()), '空なら null');\n\nAssert.areEqual(2, PointTotalizer.countAtLeast(totals, 500), '500 以上は2人');\nAssert.areEqual(0, PointTotalizer.countAtLeast(totals, 600), '600 以上は0人');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class PointTotalizer {\n    public static Map\u003cString, Integer> totalByMember(List\u003cString> records) {\n        Map\u003cString, Integer> totals = new Map\u003cString, Integer>();\n        if (records == null) {\n            return totals;\n        }\n        for (String record : records) {\n            if (String.isBlank(record)) {\n                continue;\n            }\n            List\u003cString> parts = record.split(':');\n            String memberId = parts[0].trim();\n            Integer amount = Integer.valueOf(parts[1].trim());\n\n            if (totals.containsKey(memberId)) {\n                totals.put(memberId, totals.get(memberId) + amount);\n            } else {\n                totals.put(memberId, amount);\n            }\n        }\n        return totals;\n    }\n\n    public static String topMember(Map\u003cString, Integer> totals) {\n        String top = null;\n        for (String memberId : totals.keySet()) {\n            Integer amount = totals.get(memberId);\n            if (top == null\n                    || amount > totals.get(top)\n                    || (amount == totals.get(top) && memberId.compareTo(top) \u003c 0)) {\n                top = memberId;\n            }\n        }\n        return top;\n    }\n\n    public static Integer countAtLeast(Map\u003cString, Integer> totals, Integer threshold) {\n        Integer count = 0;\n        for (String memberId : totals.keySet()) {\n            if (totals.get(memberId) >= threshold) {\n                count++;\n            }\n        }\n        return count;\n    }\n}\n```\n\n## 解説\n### ポイント\n- **「キーごとに数える」と「キーごとに合計する」は同じ形**。違うのは、キーがないときに入れる値（数えるなら `1`、合計なら `金額`）と、あるときに足す値だけ\n- \u003cmark>`get` はキーがないと `null` を返すので、`containsKey` で分けてから `put` する\u003c/mark>。`totals.get(memberId) + amount` をいきなり書くと、初めての会員で `NullPointerException` になる\n- \u003cmark>Map の中身を全部調べるときは `for (String key : map.keySet())` でキーを回し、`map.get(key)` で値を引く\u003c/mark>（機能2・3）\n- \u003cmark>同数のときは `key.compareTo(top) \u003c 0`（key のほうが辞書順で先）なら入れ替える\u003c/mark>。`keySet()` の順番に頼らず、ルールを自分で書くことで、いつ実行しても同じ結果になる\n- 機能2で `top == null` を最初に判定しているのは、最初の1人目を必ず候補にするため。`top` を `''` で始める書き方もできるが、空の Map で `''` が返ってしまわないよう、`null` を返す処理と組み合わせる\n- `split(':')` の結果は `List\u003cString>`。`[0]` が会員ID、`[1]` が金額。数値にするのは `Integer.valueOf`\n\n### よくある間違い\n- 機能1で `put(memberId, amount)` だけを書き、同じ会員の2回目で合計ではなく上書きになる\n- 機能2で `compareTo` の比べる向きを逆にして（`top.compareTo(memberId) \u003c 0`）、辞書順で後のものが返る\n- 機能3を「より大きい」（`>`）で書き、ちょうど 500 の会員が数に入らない\n\n### 調べ先\n- Apex Reference Guide「Map Class」の `put` / `get` / `containsKey` / `keySet`\n- Apex Reference Guide「String Class」の `split` / `trim` / `isBlank` / `compareTo`\n- Apex Reference Guide「Integer Class」の `valueOf`"},{"id":"G-023","title":"保存できない・落ちるスコア加算のコードを直す","level":1,"type":"fix","skills":["APEX-BASIC-02","APEX-BASIC-04"],"difficulty":1,"minutes":10,"environment":"org","language":"ja","source":"generated","memo_ids":["M-20261122-233619"],"learned_ids":[],"question":"## 問題\nゲームの点数表（選手名 → 点数の Map）に、選手の点数を足すクラスを書いた。\nところが、開発者コンソールで**保存しようとするとエラーになる**。保存できるように直しても、**初めての選手に点数を足すと実行時エラー**になる。\n問題点をすべて見つけて、直しなさい。クラス名・メソッド名はこのまま使う。\n\n```apex\npublic class ScoreBoard {\n    public static Map\u003cString, Integer> addPoints（Map\u003cString, Integer> board, String player, Integer points） {\n        board.put(player, board.get(player) + points)；\n        return board;\n    }\n}\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n保存できない原因は、目で見ても気づきにくい**文字そのもの**にある。日本語入力のまま記号を打っていないか。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n`board.get(player)` は、`player` がまだ Map にないと何を返すか。\n\u003c/details>\n\n## 確認方法\n直したら、次のコードを匿名実行する。\n\n```apex\nMap\u003cString, Integer> board = new Map\u003cString, Integer>();\nScoreBoard.addPoints(board, 'A', 10);\nScoreBoard.addPoints(board, 'A', 5);\nScoreBoard.addPoints(board, 'B', 3);\n\nAssert.areEqual(15, board.get('A'), 'A は 10 + 5');\nAssert.areEqual(3, board.get('B'), '初めての B は 3');\nAssert.areEqual(2, board.size(), '選手は2人');\nSystem.debug('すべて正解です');\n```\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。","answer":"## 解答\n### 問題点\n| 場所 | 問題 | 直し方 |\n|---|---|---|\n| 2行目 | 引数を囲むカッコが**全角**の `（` `）` | 半角の `(` `)` にする |\n| 3行目 | 行の最後のセミコロンが**全角**の `；` | 半角の `;` にする |\n| 3行目 | `board.get(player)` は初めての選手だと `null`。`null + points` で `NullPointerException` | `containsKey` で分ける |\n\n### 直したコード\n```apex\npublic class ScoreBoard {\n    public static Map\u003cString, Integer> addPoints(Map\u003cString, Integer> board, String player, Integer points) {\n        if (board.containsKey(player)) {\n            board.put(player, board.get(player) + points);\n        } else {\n            board.put(player, points);\n        }\n        return board;\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>Apex のコードで使える記号は半角だけ\u003c/mark>。`（ ）` `；` `，` `＝` のような全角の記号や、全角の空白はコードとして読めず、保存（コンパイル）の時点でエラーになる\n- 全角が混ざるのは、**日本語入力をオンにしたまま記号を打ったとき**が多い。メソッド名や変数名を打ったあと、続けてカッコを打つと起きやすい\n- \u003cmark>保存エラーが出たら、エラーの行番号の行を見て、記号が全角になっていないか確かめる\u003c/mark>。全角のカッコは半角より幅が広く、前後に隙間があるように見える\n- `''`（文字列）の中の全角文字は問題ない。`'未分類'` のように、文字列の値として日本語を書くのは正しい\n- \u003cmark>`get` はキーがないと `null` を返すので、足す前に `containsKey` で分ける\u003c/mark>。`board.put(player, (board.get(player) ?? 0) + points);` と1行で書いてもよい\n\n### よくある間違い\n- 全角のカッコだけ直して、行末の全角セミコロンを見落とす\n- 保存できたことで安心し、初めての選手のケースを試さない\n\n### 調べ先\n- Apex Developer Guide「Expressions and Operators」（使える記号と演算子）\n- Apex Reference Guide「Map Class」の `get` / `containsKey`\n- Apex Developer Guide「Null Coalescing Operator」"}],"skills":[{"id":"APEX-BASIC-01","group":"Apex","area":"基本文法","name":"データ型・変数・演算子・制御構文（if / for / while / switch）","requirement":"必須","file":"01_apex/01"},{"id":"APEX-BASIC-02","group":"Apex","area":"基本文法","name":"List / Set / Map の使い分けと操作","requirement":"必須","file":"01_apex/01"},{"id":"APEX-BASIC-03","group":"Apex","area":"基本文法","name":"`?.` `??`、String / Date / Datetime メソッド","requirement":"必須","file":"01_apex/01"},{"id":"APEX-BASIC-04","group":"Apex","area":"基本文法","name":"クラス・メソッド・コンストラクタ・static とインスタンス・アクセス修飾子","requirement":"必須","file":"01_apex/01"},{"id":"APEX-BASIC-05","group":"Apex","area":"基本文法","name":"SObject 型と項目アクセス","requirement":"必須","file":"01_apex/01"},{"id":"APEX-BASIC-06","group":"Apex","area":"基本文法","name":"インターフェース・継承・Enum・Schema","requirement":"推奨","file":"01_apex/01"},{"id":"APEX-BASIC-07","group":"Apex","area":"基本文法","name":"正規表現（`matches` / `replaceAll` / `split`、Pattern / Matcher）","requirement":" elated":["L1-07","L1-12"],"date":"2026-11-14","question":"```apex\nDate d = Date.newInstance(2026, 1, 31);\nSystem.debug(d.addDays(1).month());\n```\n\nこのコードが何を出力するのか、1行ずつ何をしているのかがわからなかった。","explanation":"### 答え：`2`\n\n1月31日の1日後は **2月1日**。その「月」を取り出すので `2` が出る。\n\n### 1行ずつ読む\n\n**1行目：`Date d = Date.newInstance(2026, 1, 31);`**\n\n- `Date.newInstance(年, 月, 日)` で、指定した日付の `Date` を作る\n- ここでは **2026年1月31日**。時刻は持たない（日付だけの型）\n- **月は 1 から数える**（1 = 1月、12 = 12月）。JavaScript の `new Date(2026, 1, 31)` は月を 0 から数える（1 が2月を意味し、2月31日は存在しないので3月3日になる）が、Apex は違う。LWC も書くようになると混乱しやすいので注意\n\n**2行目：`System.debug(d.addDays(1).month());`**\n\n内側から順に3段階で動く。\n\n| 順番 | 式 | 結果 | 型 |\n|---|---|---|---|\n| 1 | `d` | 2026-01-31 | Date |\n| 2 | `d.addDays(1)` | 2026-02-01 | Date |\n| 3 | `d.addDays(1).month()` | `2` | Integer |\n| 4 | `System.debug(...)` | デバッグログに `2` と出る | — |\n\n- `addDays(n)`：n 日後の日付を**新しく作って返す**。月末を越えたら自動で翌月に繰り上がる（年末なら翌年になる）\n- `.month()`：その日付の「月」を Integer で返す。ほかに `year()`・`day()` もある\n- このように `.` でメソッドをつなげて書くことを**メソッドチェーン**という。`addDays` が Date を返すので、その結果に続けて `month()` を呼べる\n\n### よくある勘違い\n\n**① 「1月の日付に1日足しただけだから `1`」**\n`addDays` は暦どおりに計算するので、月をまたぐ。31日の次は 32日ではなく翌月1日になる。\n\n**② 「`d` 自体が2月1日に変わる」**\n`addDays` は `d` を書き換えない。新しい Date を返すだけ。\n\n```apex\nDate d = Date.newInstance(2026, 1, 31);\nd.addDays(1);                 // 結果を受け取っていないので、何も起きない\nSystem.debug(d);              // 2026-01-31 00:00:00 のまま\n\nd = d.addDays(1);             // 受け取って入れ直すと変わる\nSystem.debug(d);              // 2026-02-01 00:00:00\n```\n\n**③ 「日を自分で計算すればいい」**\n`Date.newInstance(2026, 1, d.day() + 1)` のように数値で足すと、月末の処理を自分で書くことになり間違えやすい。日付の計算はメソッドに任せる。\n\n### 関連して覚えておくメソッド\n\n| やりたいこと | 書き方 | 例（d = 2026-01-31） |\n|---|---|---|\n| n 日後・n 日前 | `d.addDays(n)` / `d.addDays(-n)` | `addDays(-31)` → 2025-12-31 |\n| n か月後 | `d.addMonths(n)` | `addMonths(1)` → **2026-02-28**（2月に31日はないので月末に合わせる） |\n| 2つの日付の差（日数） | `d.daysBetween(別の日付)` | `d.daysBetween(Date.newInstance(2026, 2, 1))` → `1` |\n| その月の日数 | `Date.daysInMonth(年, 月)` | `Date.daysInMonth(2026, 2)` → `28` |\n| 月初 | `d.toStartOfMonth()` | 2026-01-01 |\n| 今日 | `Date.today()` | 実行した日 |\n\n`addMonths` が月末に合わせる動きは、L1-12 の「支払期日（翌月末）」でそのまま使う。\n\n### 現場ではどこで使うか\n契約終了日・支払期日・「期限まで残り何日か」など、日付の計算はとてもよく出てくる。月末・年末・うるう年（2月29日）をまたぐケースで不具合が起きやすいので、テストでもこの境目の日付を必ず試す。\n\n### 調べ先\n- Apex Reference Guide「Date Class」の `newInstance` / `addDays` / `addMonths` / `month` / `daysBetween`"},{"id":"Q-002","title":"remove したあとの indexOf は何番になるか","problem":"L1-02","point":"④","level":1,"skills":["APEX-BASIC-02"],"related":["L1-03"],"date":"2026-11-14","question":"```apex\nList\u003cString> fruits = new List\u003cString>{ 'りんご', 'みかん', 'ぶどう' };\nfruits.add('もも');\nfruits.add(1, 'バナナ');\nfruits.remove(0);\nSystem.debug(fruits.indexOf('ぶどう'));     // ④\n```\n\n自分の答えは **`3`**、正解は **`2`**。","explanation":"### 答え：`2`\n\n\u003cmark>`indexOf` は「その要素が**今**何番目にあるか」を 0 から数えて返す\u003c/mark>。`remove(0)` で先頭が消えたあとの List で数える。\n\n### List の中身を1行ずつ追う\n\n| 行 | 中身（上の数字が番号） | ぶどうの番号 |\n|---|---|---|\n| 作った直後 | `[0:りんご, 1:みかん, 2:ぶどう]` | 2 |\n| `add('もも')` | `[0:りんご, 1:みかん, 2:ぶどう, 3:もも]` | 2 |\n| `add(1, 'バナナ')` | `[0:りんご, 1:バナナ, 2:みかん, 3:ぶどう, 4:もも]` | **3** |\n| `remove(0)` | `[0:バナナ, 1:みかん, 2:ぶどう, 3:もも]` | \u003cmark>2\u003c/mark> |\n\n\u003cmark>`3` は、`remove(0)` の**前**の番号\u003c/mark>。③ を `バナナ` と正しく答えられているので、「先頭が消えて詰まる」ことはわかっていた。④ で\u003cmark>詰まったあとの番号に数え直すのを忘れた\u003c/mark>、というのがいちばんありそうな原因。\n\n### 覚えておくこと\n- \u003cmark>`remove(番号)` をすると、後ろの要素の番号が全部1つずつ前にずれる\u003c/mark>。\u003cmark>番号は要素にくっついた名札ではなく、「今の位置」\u003c/mark>\n- **`add(番号, 要素)` は逆に、後ろの要素の番号が1つずつ後ろにずれる**\n- 番号は **0 から**。「3番目の要素」は `fruits[2]`\n- `indexOf` は見つからないと **`-1`** を返す（エラーにはならない）。「入っているか」だけ知りたいなら `contains` の方が読みやすい\n\n```apex\nList\u003cString> l = new List\u003cString>{ 'a', 'b', 'c' };\nSystem.debug(l.indexOf('c'));    // 2\nl.remove(0);                     // [b, c]\nSystem.debug(l.indexOf('c'));    // 1  ← ずれた\nSystem.debug(l.indexOf('z'));    // -1\nSystem.debug(l.contains('b'));   // true\n```\n\n### 現場ではどこで気をつけるか\nfor ループの中で `remove` すると、番号がずれて要素を飛ばしたりエラーになったりする。ループ中に消したいときは、**残したいものを新しい List に入れていく**書き方が安全。\n\n### 調べ先\n- Apex Reference Guide「List Class」の `add` / `remove` / `indexOf` / `contains`"},{"id":"Q-003","title":"Set の add は何を返すか","problem":"L1-02","point":"⑥","level":1,"skills":["APEX-BASIC-02"],"related":["L1-04"],"date":"2026-11-14","question":"```apex\nSet\u003cInteger> nums = new Set\u003cInteger>{ 3, 1, 3, 2, 1 };\nSystem.debug(nums.add(2));                 // ⑥\n```\n\n自分の答えは **`?`（わからなかった）**、正解は **`false`**。\n`add` を `System.debug` の中に入れると何が出るのかがわからなかった。","explanation":"### 答え：`false`\n\n\u003cmark>Set の `add` は、追加するだけでなく結果を Boolean で返すメソッド\u003c/mark>。\n\n| 状況 | `add` の戻り値 | Set の中身 |\n|---|---|---|\n| まだ入っていない値を追加した | `true` | 1つ増える |\n| \u003cmark>もう入っている値を追加しようとした\u003c/mark> | \u003cmark>`false`\u003c/mark> | 変わらない |\n\n`nums` は作った時点で重複が消えて `{1, 2, 3}`（⑤ の `3` は正解）。\u003cmark>`2` はもう入っているので追加されず、`false` が返る\u003c/mark>。\u003cmark>`System.debug` はその戻り値を出力する\u003c/mark>。\n\n### 「メソッドの戻り値」を意識する\n`System.debug(〇〇)` には、〇〇を実行した**結果の値**が出る。メソッドごとに何を返すかが決まっている。\n\n| メソッド | 戻り値 | 例 |\n|---|---|---|\n| `Set.add(x)` | Boolean（追加できたか） | `nums.add(4)` → `true` |\n| `Set.contains(x)` | Boolean（入っているか） | ⑦ `nums.contains(4)` → `false` |\n| `List.add(x)` | なし（`void`） | `System.debug(list.add('x'))` は**コンパイルエラー** |\n| `Map.put(k, v)` | そのキーに**前に入っていた値**（なければ `null`） | `stock.put('A', 7)` → `10` |\n\n\u003cmark>同じ `add` でも、List と Set で戻り値が違う\u003c/mark>点に注意。わからないときは Apex Reference Guide でメソッドの **Return Value** を見る。\n\n### 何に使えるか：重複チェック\n「初めて出てきたものだけ処理する」が1行で書ける。L1-04（メールアドレスの重複を取り除く）でそのまま使える。\n\n```apex\nSet\u003cString> seen = new Set\u003cString>();\nfor (String email : new List\u003cString>{ 'a@x.com', 'b@x.com', 'a@x.com' }) {\n    if (seen.add(email)) {\n        System.debug('初めて: ' + email);    // a@x.com, b@x.com だけ出る\n    } else {\n        System.debug('重複: ' + email);      // 2回目の a@x.com\n    }\n}\n```\n\n`contains` で確かめてから `add` する2行の書き方と同じ意味になる。\n\n### 調べ先\n- Apex Reference Guide「Set Class」の `add`（Return Value の欄）\n- Apex Reference Guide「Map Class」の `put`"},{"id":"Q-004","title":"Map で同じキーに値を入れたら上書きされるか（put の戻り値）","problem":"L1-02","point":"⑧⑨","level":1,"skills":["APEX-BASIC-02"],"related":["L1-05"],"date":"2026-11-14","question":"```apex\nMap\u003cString, Integer> stock = new Map\u003cString, Integer>();\nstock.put('A', 10);\nstock.put('B', 5);\nstock.put('A', 7);\nSystem.debug(stock.size());                // ⑧\nSystem.debug(stock.get('A'));              // ⑨\n```\n\nMap で同じキーに値を入れたら上書きされるのか。また、「`put` は前の値を返す」というのは本当か。","explanation":"### 答え：上書きされる。⑧ は `2`、⑨ は `7`\n\n\u003cmark>Map のキーは重複しない。同じキーで `put` すると、古い値は消えて新しい値に置き換わる\u003c/mark>。キーの数は増えないので、`A` と `B` の2つのまま。\n\n- Map に `add` はない。値を入れるのは **`put(キー, 値)`**\n- 上書きしてもエラーにはならない。知らないうちに上書きしてしまうことがあるので注意する\n\n### `put` は前の値を返す（本当）\n\nApex Reference Guide「Map Class」の `put(key, value)` に、そのキーに前から値があれば古い値を返してから置き換える、と書かれている。\n\n| 状況 | `put` の戻り値 |\n|---|---|\n| そのキーが初めて | `null` |\n| そのキーに前から値があった | \u003cmark>上書きされる前の古い値\u003c/mark> |\n\n```apex\nMap\u003cString, Integer> stock = new Map\u003cString, Integer>();\nSystem.debug(stock.put('A', 10));   // null（'A' は初めて）\nSystem.debug(stock.put('A', 7));    // 10（前の値が返る）\nSystem.debug(stock.get('A'));       // 7（中身は上書き済み）\n```\n\n実際には `put` の戻り値を使う場面は少なく、`stock.put('A', 7);` のように戻り値を無視して書くのが普通。「上書き前の値を知りたいときに使える」くらいに覚えておけば十分。\n\n### 似たメソッドの戻り値（Q-003 とあわせて）\n\n| メソッド | 戻り値 |\n|---|---|\n| `Set.add(x)` | Boolean（追加できたら `true`、もう入っていたら `false`） |\n| `List.add(x)` | なし（`void`） |\n| `Map.put(k, v)` | そのキーに前に入っていた値（なければ `null`） |\n\n### 上書きではなく足したいとき\n\n\u003cmark>今の値を `get` で取り出して足してから `put` し直す\u003c/mark>。L1-05（カテゴリごとの件数を数える）で使う形。\n\n```apex\nMap\u003cString, Integer> counts = new Map\u003cString, Integer>();\nfor (String c : new List\u003cString>{ '果物', '野菜', '果物' }) {\n    if (counts.containsKey(c)) {\n        counts.put(c, counts.get(c) + 1);   // 今の値 + 1 で上書き\n    } else {\n        counts.put(c, 1);                    // 初めてのキー\n    }\n}\nSystem.debug(counts);   // {果物=2, 野菜=1}\n```\n\n`containsKey` で確かめずに `counts.get(c) + 1` と書くと、初めてのキーでは `get` が `null` を返すので `NullPointerException` になる（L1-02 の ⑩ と同じ理由）。\n\n### 値を全部残したいとき\n\n値を List にする（`Map\u003cString, List\u003cString>>`）。同じキーの値を1つの List にまとめて入れていく。\n\n### 調べ先\n- Apex Reference Guide「Map Class」の `put` / `get` / `containsKey`"},{"id":"Q-005","title":"平均を小数で出すには割り算の前に何を書くか","problem":"L1-03","point":"⑤","level":1,"skills":["APEX-BASIC-01"],"related":["L1-01"],"date":"2026-11-14","question":"```apex\nDecimal average = 【⑤】total / scores.【⑥】();\nSystem.debug('平均: ' + average.setScale(1));      // 平均: 79.8\n```\n\n自分の答えは **`?`（わからなかった）**、正解は **`(Decimal) `**。","explanation":"### 答え：`(Decimal) `\n\n```apex\nDecimal average = (Decimal) total / scores.size();   // 399 / 5 = 79.8\n```\n\n`(Decimal)` は**キャスト**（型の変換）。`total` を Integer から Decimal に変えてから割り算する。\n\n### なぜ必要か\n\n\u003cmark>Integer どうしの割り算は、小数が切り捨てられる\u003c/mark>（L1-01 の ① と同じ）。`total` も `scores.size()` も Integer なので、何も書かないとこうなる。\n\n```apex\nDecimal average = total / scores.size();\nSystem.debug(average.setScale(1));   // 79.0（79.8 にならない）\n```\n\n左側を `Decimal average` にしていても助けにならない。\u003cmark>右側が先に Integer のまま計算されて `79` になり、その `79` が Decimal に入るだけ\u003c/mark>。\n\n| 書き方 | 計算の順番 | 結果 |\n|---|---|---|\n| `total / scores.size()` | 399 / 5 を Integer で → 79 | `79` |\n| `(Decimal) total / scores.size()` | 399 を Decimal に → 399 / 5 を Decimal で | \u003cmark>`79.8`\u003c/mark> |\n| `(Decimal) (total / scores.size())` | 先に 399 / 5 = 79 → それを Decimal に | `79`（キャストが遅すぎる） |\n\n最後の行のように、割り算をカッコで囲んでからキャストすると、切り捨てが済んだあとなので意味がない。\u003cmark>キャストは割り算の**前**に、割られる数（または割る数）にかける\u003c/mark>。\n\n### 同じ意味の書き方\n```apex\nDecimal average = Decimal.valueOf(total) / scores.size();   // 79.8\nDecimal average = total / (Decimal) scores.size();          // 79.8（割る数の方でもよい）\n```\nどちらか一方が Decimal なら、結果も Decimal になる（L1-01 の ②）。\n\n### 覚えておくこと\n- 割り算の結果に小数が要るとき（平均・率・割合・金額）は、\u003cmark>割り算の前にどちらかを Decimal にする\u003c/mark>\n- `setScale(1)` は「小数第1位までにそろえる」。`79` を `setScale(1)` しても `79.0` になるだけで、消えた `.8` は戻らない\n\n### 調べ先\n- Apex Developer Guide「Expression Operators」「Understanding Rules of Conversion」\n- Apex Reference Guide「Decimal Class」の `valueOf` / `setScale`"},{"id":"Q-006","title":"List の件数は length ではなく size","problem":"L1-03","point":"⑥","level":1,"skills":["APEX-BASIC-02"],"related":["L1-02"],"date":"2026-11-14","question":"```apex\nDecimal average = 【⑤】total / scores.【⑥】();\n```\n\n自分の答えは **`length`**、正解は **`size`**。","explanation":"### 答え：`size`\n\n\u003cmark>Apex で List・Set・Map の件数を数えるのは `size()`\u003c/mark>。`scores.size()` は `5` を返す。\n\n`scores.length()` と書くと、List にそのメソッドはないので**コンパイルエラー**になる（保存・実行できない）。\n\n### なぜ間違えやすいか\n\n言語や型によって呼び方がばらばらだから。\n\n| 書き方 | どこで使う |\n|---|---|\n| `list.size()` | \u003cmark>Apex の List / Set / Map\u003c/mark>、Java の List |\n| `str.length()` | \u003cmark>Apex の String\u003c/mark>（文字数） |\n| `arr.length` | JavaScript の配列・文字列、Java の配列（カッコなし） |\n\nApex にも `length()` はあるが、それは **String の文字数**。コレクションには使えない。\n\n```apex\nList\u003cInteger> scores = new List\u003cInteger>{ 72, 85, 90 };\nSystem.debug(scores.size());      // 3\nString name = 'Apex';\nSystem.debug(name.length());      // 4\n// System.debug(scores.length()); // コンパイルエラー\n```\n\n### 覚え方\n- \u003cmark>コレクション（入れ物）は `size`、文字列は `length`\u003c/mark>\n- LWC（JavaScript）を書くときは逆に `array.length` になる。Apex と JavaScript を行き来するときに混ざりやすいので注意\n- 空かどうかだけ知りたいときは `scores.isEmpty()` の方が読みやすい\n\n### 調べ先\n- Apex Reference Guide「List Class」の `size` / `isEmpty`\n- Apex Reference Guide「String Class」の `length`"},{"id":"Q-007","title":"null のリストに isEmpty() を呼ぶと落ちる","problem":"L1-04","point":"機能1・機能2","level":1,"skills":["APEX-BASIC-02"],"related":["L1-10","L1-11"],"date":"2026-11-15","question":"「受け取ったリストが `null` なら空のリストを返す」を、次のように書いていた。\n\n```apex\nif (targetEmails.isEmpty()) {\n    return resultEmails;\n}\n```\n\n`null` を渡すと、ここで落ちる。","explanation":"### 答え：`== null` で確かめる\n\n\u003cmark>`null` の変数に `.isEmpty()` などのメソッドを呼ぶと NullPointerException\u003c/mark> になる。`null` は「入れ物そのものがない」状態なので、「中身が空か」を聞くことができない。\n\n```apex\nif (targetEmails == null) {\n    return resultEmails;\n}\n```\n\n### `null` と空のリストは別物\n\n| 状態 | `== null` | `.isEmpty()` |\n|---|---|---|\n| `null` | `true` | 落ちる |\n| `new List\u003cString>()` | `false` | `true` |\n\n空のリストなら、for ループが0回回るだけで正しく動く。\u003cmark>`isEmpty()` の判定がなくても正しく動くことが多い\u003c/mark>。\n\n両方まとめて調べたいときは、`null` の判定を先に書く。`||` は左が `true` なら右を実行しないので、落ちない。\n\n```apex\nif (targetEmails == null || targetEmails.isEmpty()) {\n```\n\n### 調べ先\n- Apex Reference Guide「List Class」の `isEmpty`"},{"id":"Q-008","title":"Set の String は大文字・小文字を区別する（== は区別しない）","problem":"L1-04","point":"機能1","level":1,"skills":["APEX-BASIC-02","APEX-BASIC-03"],"related":["L1-01","L1-05","L1-07"],"date":"2026-11-15","question":"メールアドレスをそろえるときに、`trim()` だけで `toLowerCase()` を書いていなかった。\n\n```apex\ntargetEmail = targetEmail.trim();\n```\n\nこれだと `'Taro@Example.com'` と `'taro@example.com'` が別々に残る。","explanation":"### 答え：`trim().toLowerCase()` の両方でそろえる\n\n\u003cmark>Set と Map のキーは、String の大文字・小文字を区別する\u003c/mark>。Set の中では、`'Taro@Example.com'` と `'taro@example.com'` は別のものとして扱われる。\n\n```apex\nString normalizedEmail = targetEmail.trim().toLowerCase();\n```\n\n### 間違えやすい理由：`==` は区別しない\n\n| 比べ方 | `'ABC'` と `'abc'` |\n|---|---|\n| `==` | 同じ（`true`） |\n| `equals()` | 違う（`false`） |\n| Set の `contains` / `add`、Map のキー | 違うものとして扱う |\n\n機能2を `==` で比べていたときは、大文字・小文字の違いをたまたま同じと判定していた。ただ、Set を使うと同じとはみなされない。\u003cmark>Set や Map に入れる前に、そろえる処理（正規化）をする\u003c/mark>。\n\n### 調べ先\n- Apex Reference Guide「String Class」の `trim` / `toLowerCase` / `equals`\n- Apex Developer Guide「Sets」（大文字・小文字の扱い）"},{"id":"Q-009","title":"重複は Set.add が false を返すかで判定する","problem":"L1-04","point":"機能1・機能2","level":1,"skills":["APEX-BASIC-02"],"related":["L1-02","L1-05"],"date":"2026-11-15","question":"機能1では、List に Set をそのまま渡していた（コンパイルエラー）。\n\n```apex\nnoDuplicateEmailsSet.add(targetEmail);\nresultEmails.add(noDuplicateEmailsSet);\n```\n\n機能2では、二重ループと `==` で比べていた。これだと空白の違いや空の要素を正しく扱えない。機能1と同じ Set の形を使えることに気づけず、答えを見て直した。\n\n```apex\nfor (Integer i = 0; i \u003c targetEmails.size(); i++) {\n    for (Integer j = i + 1; j \u003c targetEmails.size(); j++) {\n        if (targetEmails[i] == targetEmails[j]) {\n            return true;\n        }\n    }\n}\n```","explanation":"### 答え：`add` の戻り値を使う\n\n`Set.add` は、初めて入れたときは `true`、すでに入っていたときは `false` を返す（Q-003）。\u003cmark>「覚えておく Set」と「結果の List」を組み合わせるのが、重複を取り除く定番の形\u003c/mark>。\n\n| | `add` が `true`（初めて） | `add` が `false`（もう出てきた） |\n|---|---|---|\n| 機能1（重複を取り除く） | List に足す | 何もしない |\n| 機能2（重複があるか調べる） | 何もしない | \u003cmark>重複なので `return true`\u003c/mark> |\n\n```apex\n// 機能1\nif (seenEmailSet.add(normalizedEmail)) {\n    resultEmails.add(normalizedEmail);\n}\n\n// 機能2\nif (!seenEmailSet.add(normalizedEmail)) {\n    return true;\n}\n```\n\n### List.add には1件だけ\n\u003cmark>`List\u003cString>.add` に渡せるのは String 1つだけ\u003c/mark>。Set を渡すとコンパイルエラーになる。Set をまとめて List にしたいときは、`new List\u003cString>(set)` か `list.addAll(set)` を使う。ただしこの方法では、最初に出てきた順番が保たれない。\n\n### 二重ループより Set\n- 二重ループは、件数の2乗の回数だけ比べることになる。Set なら1回のループで済む\n- 機能1と同じ形で書けるので、そろえ方（`isBlank` で飛ばす → `trim().toLowerCase()`）も自然に同じになる\n\n### 調べ先\n- Apex Reference Guide「Set Class」の `add`\n- Apex Reference Guide「List Class」の `add` / `addAll`"}],"naming":[{"id":"N-001","title":"英語で、略さずに書く","target":"common","source":"basic","problems":[],"date":"2026-11-15","rule":"\u003cmark>名前は英単語で、略さずに書く\u003c/mark>。前後のコードを読まなくても、名前だけで意味がわかるようにする。\n\nただし、\u003cmark>Salesforce や開発で定着している略語はそのまま使ってよい\u003c/mark>：`Id`・`Url`・`Http`・`Json`・`Soql`・`Dml`・`Api`","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| `acc` | `account` | 3文字縮めても読む人が補って読むことになる |\n| `cnt` | `accountCount` | 「何の」数かまで書く |\n| `tmp`・`data`・`val` | `discountedPrice` | 中身が何もわからない |\n| `kingaku`・`seikyuDate` | `amount`・`billingDate` | ローマ字は読み方が人によって違い、検索もしにくい |\n| `calcDisc()` | `calculateDiscount()` | 独自の略し方は人によって違う |","why":"コードは書く回数より読まれる回数の方がずっと多い。VS Code では名前が補完されるので、長い名前でも打つ手間はほとんど変わらない。現場では\u003cmark>半年後の自分も「他人」\u003c/mark>として読むことになる。","learnedFrom":"","refs":""},{"id":"N-002","title":"種類ごとに書き方（ケース）をそろえる","target":"common","source":"basic","problems":[],"date":"2026-11-15","rule":"| 種類 | 書き方 | 例 |\n|---|---|---|\n| クラス・インターフェース・enum の型 | \u003cmark>パスカルケース\u003c/mark>（単語の頭を大文字） | `AccountService`・`Schedulable`・`MemberRank` |\n| メソッド・変数・引数 | \u003cmark>キャメルケース\u003c/mark>（最初だけ小文字） | `calculateDiscount`・`accountIds` |\n| 定数（`static final`）・enum の値 | \u003cmark>大文字スネーク\u003c/mark>（大文字を `_` でつなぐ） | `MAX_RETRY_COUNT`・`GOLD` |\n| LWC のフォルダ名 | キャメルケース | `accountList`（N-017） |","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| `public class account_service` | `public class AccountService` | クラスはパスカルケース |\n| `Decimal Total_Price` | `Decimal totalPrice` | 変数はキャメルケース |\n| `static final Integer maxCount = 3;` | `static final Integer MAX_COUNT = 3;` | 定数だと一目でわかるようにする |","why":"\u003cmark>Apex は大文字と小文字を区別しない\u003c/mark>ので、`accountId` と `AccountID` は同じ名前として扱われる。言語が区別しないからこそ、書き方をそろえて「クラスか・変数か・定数か」を目で見分けられるようにする。","learnedFrom":"","refs":"- Apex Developer Guide「Variables」（Case Sensitivity）"},{"id":"N-003","title":"頭字語（HTTP・JSON など）も1つの単語として書く","target":"common","source":"basic","problems":[],"date":"2026-11-15","rule":"自分で付ける名前では、\u003cmark>頭字語も普通の単語と同じく「先頭だけ大文字」\u003c/mark>にする。","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| `HTTPCalloutService` | `HttpCalloutService` | どこで単語が切れるかわかる |\n| `parseJSON()` | `parseJson()` | |\n| `recordID` | `recordId` | Salesforce の項目名も `AccountId` の形 |\n| `SMSURLBuilder` | `SmsUrlBuilder` | 頭字語が続くと区切りが読めない |","why":"頭字語を全部大文字にすると、2つ続いたときに単語の区切りが消える。Salesforce の標準クラスには `JSON`・`URL` のように全部大文字のものもあるが、それは決まった名前としてそのまま使い、自分で付ける名前ではそろえる。","learnedFrom":"","refs":""},{"id":"N-004","title":"クラス名は「対象 + 役割」","target":"class","source":"basic","problems":["L1-04"],"date":"2026-11-15","rule":"\u003cmark>クラス名は名詞で、「何についての」+「何の役割の」クラスかを並べる\u003c/mark>。役割の部分は現場で決まった言葉を使う。\n\n| 役割 | 名前の最後 | 例 |\n|---|---|---|\n| 業務の処理をまとめる | `Service` | `AccountService` |\n| トリガーの処理 | `TriggerHandler` | `AccountTriggerHandler` |\n| LWC・Visualforce から呼ばれる | `Controller` | `AccountSearchController` |\n| SOQL をまとめる | `Selector` | `AccountSelector` |\n| 一括処理（Batch Apex） | `Batch` | `InactiveAccountCleanupBatch` |\n| 非同期処理（Queueable） | `Queueable`・`Job` | `ContactSyncQueueable` |\n| 定期実行（Schedulable） | `Scheduler` | `DailyReportScheduler` |\n| 自分で作る例外 | `Exception`（**必須**） | `InvalidOrderException` |\n| 変換・計算・組み立て | `Converter`・`Calculator`・`Builder`・`Formatter` | `TemperatureConverter` |","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| `Account2` | `AccountService` | 番号では役割がわからない |\n| `CalculateTax` | `TaxCalculator` | クラスは「もの」なので名詞。動詞はメソッドに使う |\n| `OrderErr extends Exception` | `OrderException extends Exception` | \u003cmark>例外クラスは名前の最後を `Exception` にしないと保存できない\u003c/mark> |","why":"クラス一覧を見たとき、名前だけで「どこに何が書いてあるか」がわかると、修正する場所をすぐ見つけられる。役割の言葉がそろっていると、初めて見るコードでも構成が読める。","learnedFrom":"| 問題 | 自分が付けた名前 | よりよい名前 | 理由 |\n|---|---|---|---|\n| L1-04 | `RemoveDuplicateEmails` | `EmailDeduplicationService` | 動詞で始まる動作の名前になっていた。対象（Email）と役割（Service）を並べる |","refs":"- Apex Developer Guide「Create Custom Exceptions」"},{"id":"N-005","title":"何でも入る名前（Manager・Helper・Common）を避ける","target":"class","source":"basic","problems":[],"date":"2026-11-15","rule":"`Manager`・`Helper`・`Common`・`Processor`・`Data`・`Info` だけで終わるクラス名は、\u003cmark>中に何でも入れられてしまうので避ける\u003c/mark>。`Util` を使うなら\u003cmark>「何の」道具かを前に付ける\u003c/mark>。","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| `Util`・`CommonUtil` | `EmailUtil`・`DateUtil` | 何の道具か書く |\n| `AccountManager` | `AccountService`・`AccountSelector` | 「管理」では何をするかわからない |\n| `OrderHelper` | `OrderTotalCalculator` | 実際にやっていることを名前にする |\n| `AccountData` | `AccountSummary` | データでないクラスはない |","why":"ぼんやりした名前のクラスには、置き場所に迷った処理が集まり、そのうち何百行にもなる。\u003cmark>名前が付けにくいのは、1つのクラスに役割を詰め込みすぎているサイン\u003c/mark>。そのときはクラスを分ける。","learnedFrom":"","refs":""},{"id":"N-006","title":"メソッド名は動詞で始める","target":"method","source":"basic","problems":[],"date":"2026-11-15","rule":"メソッドは「動作」なので、\u003cmark>動詞で始めて「何をするか」を書く\u003c/mark>。\n\n| 動詞 | 使う場面 | 例 |\n|---|---|---|\n| `get` | 値を取り出す・計算して返す | `getDiscountRate` |\n| `find`・`query` | 探す・SOQL で取ってくる | `findActiveAccounts` |\n| `calculate` | 計算する | `calculateTotalPrice` |\n| `format` | 表示用の文字列に整える | `formatInvoiceNo` |\n| `validate` | 正しいか確かめ、だめなら例外やエラー | `validateOrder` |\n| `send`・`notify` | 外に送る・知らせる | `sendWelcomeEmail` |\n| `update`・`set` | 値を書き換える | `setDefaultRating` |\n\n値を計算して返すだけのメソッドは、名詞の形（`daysUntil`・`firstDayOfMonth`）も読みやすければよい。Salesforce の標準でも `Date.daysBetween()`・`month()` のような名前がある。\u003cmark>迷ったら動詞から始める\u003c/mark>。","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| `discount(price)` | `calculateDiscount(price)` | 割引を計算するのか、割引するのかわからない |\n| `accountProcess()` | `deactivateAccounts()` | 「処理」では何をするか伝わらない |\n| `doIt()`・`execute2()` | `sendInvoiceEmails()` | |","why":"呼び出す側では `calculateDiscount(price)` のように文として読める。メソッドの中身を開かなくても、何が起きるかわかる。","learnedFrom":"","refs":""},{"id":"N-007","title":"Boolean を返すメソッドは is / has / can で始める","target":"method","source":"basic","problems":["L1-04"],"date":"2026-11-15","rule":"\u003cmark>true / false を返すメソッドは、`is`・`has`・`can`・`should` で始め、「はい / いいえ」で答えられる質問の形にする\u003c/mark>。\n\n| 始め方 | 意味 | 例 |\n|---|---|---|\n| `is` | 〜である | `isFreezing`・`isClosed` |\n| `has` | 〜を持っている | `hasDuplicate`・`hasOpenCases` |\n| `can` | 〜できる | `canEdit` |\n| `should` | 〜すべき | `shouldRetry` |","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| `checkDuplicate(emails)` | `hasDuplicate(emails)` | check では true が「重複あり」か「問題なし」かわからない |\n| `freezing(temp)` | `isFreezing(temp)` | |\n| `validateEmail(email)` が Boolean を返す | `isValidEmail(email)` | validate は「だめなら例外」と読まれやすい |","why":"`if (hasDuplicate(emails))` は「もし重複があれば」とそのまま読める。\u003cmark>true が何を意味するかが名前で決まる\u003c/mark>ので、条件を逆に書く間違いが減る。","learnedFrom":"| 問題 | 自分が付けた名前 | よりよい名前 | 理由 |\n|---|---|---|---|\n| L1-04 | `searchDuplicateEmails` | `hasDuplicateEmails` | true / false を返すのに search で始まると、検索結果の一覧を返すように読める |","refs":""},{"id":"N-008","title":"変換・集計・組み立てには決まった形を使う","target":"method","source":"basic","problems":[],"date":"2026-11-15","rule":"よくある処理には、現場でよく使われる決まった形がある。\u003cmark>形がそろっていると、名前だけで戻り値の形まで想像できる\u003c/mark>。\n\n| 形 | 意味 | 戻り値の例 | 例 |\n|---|---|---|---|\n| `toXxx` | 別の形に変換する | 変換後の値 | `toFahrenheit`・`toJson` |\n| `countByXxx` | Xxx ごとに数える | `Map\u003cキー, Integer>` | `countByCategory` |\n| `groupByXxx` | Xxx ごとにまとめる | `Map\u003cキー, List\u003c…>>` | `groupByCustomer` |\n| `sumByXxx` | Xxx ごとに合計する | `Map\u003cキー, Decimal>` | `sumByAccount` |\n| `buildXxx` | \u003cmark>メモリ上で組み立てる（insert しない）\u003c/mark> | 新しいレコード | `buildAccount` |\n| `createXxx` | \u003cmark>作って insert まで行う\u003c/mark> | 作ったレコード | `createAccount` |","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| `categoryMap(items)` | `countByCategory(items)` | 何の Map かわからない |\n| `createAccount()` だが insert しない | `buildAccount()` | 呼んだ人が insert 済みだと思い込む |\n| `fahrenheit(temps)` | `toFahrenheit(temps)` | |","why":"`build` と `create` の違いのように、名前が DML の有無まで伝えると、呼び出す側で insert を忘れたり二重に insert したりしなくなる。","learnedFrom":"","refs":""},{"id":"N-009","title":"変数名は中身を表す名詞にし、型の略号を付けない","target":"variable","source":"basic","problems":["L1-04"],"date":"2026-11-15","rule":"\u003cmark>変数名には「何が入っているか」を書く\u003c/mark>。`str`・`int` のような型の略号は付けない。List は複数形で表す（N-010）。\n\nただし次の2つは付けてよい。\n- \u003cmark>Set・Map は名前の最後に `Set`・`Map` を付ける\u003c/mark>（N-010）\n- \u003cmark>戻り値を入れる変数には `result` を付けてよい\u003c/mark>：`result`・`resultEmails`","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| `strName` | `name` | `str` は型の略号。中身は名前 |\n| `accountList` | `accounts` | List は複数形で表す（N-010） |\n| `idSet` | `accountIdSet` | `Set` は付けてよいが、何の Id かを書く（N-010） |\n| `obj`・`rec`・`data`・`tmp` | `opportunity` | 中身がわからない |\n| `limit` | `maxCount`・`recordLimit` | \u003cmark>`limit`・`select`・`delete` などの予約語は変数名に使えない\u003c/mark> |\n\n○ のままでよい名前：`result`（戻り値）、`resultEmails`（戻り値にするメールアドレスの List）","why":"名前を読めば中身がわかるようにするため。`str` などの略号は宣言を見ればわかるので、書いても情報が増えない。\n\n一方で Set・Map は、名前に `Set`・`Map` があると\u003cmark>`contains`・`get` で使う入れ物だと、使う場所ですぐわかる\u003c/mark>。`result` も、メソッドの最後に返す値だと一目でわかるので付けてよい。","learnedFrom":"| 問題 | 自分が付けた名前 | よりよい名前 | 理由 |\n|---|---|---|---|\n| L1-04 | `noDuplicateEmailsSet` | `seenEmailSet` | `Set` は付けてよい。役割は「もう出てきたメールを覚えておく」こと。`no` の否定も入れない |\n| L1-04 | `resultEmails` | `resultEmails`（そのままでよい） | 戻り値を入れる変数には `result` を付けてよい |","refs":"- Apex Developer Guide「Reserved Keywords」"},{"id":"N-010","title":"List は複数形、Set・Map は「中身 + Set / Map」","target":"collection","source":"basic","problems":["L1-04"],"date":"2026-11-15","rule":"- \u003cmark>List は中身の複数形\u003c/mark>：`accounts`・`emails`\n- \u003cmark>Set は「中身の単数形 + Set」\u003c/mark>：`accountIdSet`・`emailSet`\n- \u003cmark>Map は「値の単数形 + Map」\u003c/mark>：値が List なら `xxxListMap`\n\n| 型 | 名前 |\n|---|---|\n| `List\u003cAccount>` | `accounts` |\n| `List\u003cId>` | `accountIds` |\n| `Set\u003cId>` | `accountIdSet` |\n| `Set\u003cString>`（もう出てきたメール） | `seenEmailSet` |\n| `Map\u003cId, Account>` | `accountMap` |\n| `Map\u003cId, List\u003cContact>>` | `contactListMap` |\n| `Map\u003cString, Integer>`（カテゴリごとの件数） | `categoryCountMap` |","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| `accountList` | `accounts` | List は複数形で表す |\n| `idSet` | `accountIdSet` | 何の Id か書く |\n| `accountIds`（中身は Set） | `accountIdSet` | Set なら `Set` を付ける |\n| `accMap` | `accountMap` | 略さない（N-001） |\n| `contactMap`（値が List） | `contactListMap` | 値が1件なのか List なのかがわかる |\n| `account`（中身は List） | `accounts` | 単数形だと1件だと思われる |","why":"名前に `Set`・`Map` があると、\u003cmark>`contains`・`get` で引く入れ物だと、使う場所ですぐわかる\u003c/mark>。List（順番に並べたもの）と見分けやすい。\n\nキーが何かは名前に入れないので、宣言の型（`Map\u003cId, Account>`）で確かめる。`get` に渡すものが正しいか、宣言と見比べる。","learnedFrom":"| 問題 | 自分が付けた名前 | よりよい名前 | 理由 |\n|---|---|---|---|\n| L1-04 | `noDuplicateEmailsSet` | `seenEmailSet` | Set は「中身の単数形 + Set」。役割は「もう出てきたメール」 |","refs":""},{"id":"N-011","title":"Boolean の変数は is / has で始め、否定を入れない","target":"variable","source":"basic","problems":[],"date":"2026-11-15","rule":"\u003cmark>Boolean の変数は `is`・`has` などで始め、肯定の形にする\u003c/mark>（N-007 と同じ考え方）。`not`・`no` を名前に入れない。","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| `flag`・`flg` | `isActive` | 何が true なのかわからない |\n| `isNotValid` | `isValid` | \u003cmark>`!isNotValid` は二重否定で読み間違えやすい\u003c/mark> |\n| `noError` | `hasError` | |\n| `status`（Boolean） | `isApproved` | status は文字列や選択リストに見える |","why":"`if (!isValid)` は「正しくなければ」とすぐ読めるが、`if (!isNotValid)` は頭の中で裏返す必要がある。","learnedFrom":"","refs":""},{"id":"N-012","title":"ループ変数はコレクションの単数形","target":"variable","source":"basic","problems":[],"date":"2026-11-15","rule":"\u003cmark>拡張 for 文の変数は、コレクション名の単数形にする\u003c/mark>。`i`・`j` は短いループの番号（添字）だけに使う。\n\n```apex\nfor (Account account : accounts) {\n    for (Contact contact : contactListMap.get(account.Id)) {\n        contact.MailingCity = account.BillingCity;\n    }\n}\n```","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| `for (Account a : accounts)` | `for (Account account : accounts)` | ループが長くなると `a` が何かわからなくなる |\n| `for (Account acc : accs)` | `for (Account account : accounts)` | N-001 |\n| `for (Contact c : contacts)` の中で `for (Case c2 : cases)` | `contact`・`caseRecord` | `case` は予約語なので使えない |","why":"ループの中では「1件分」を扱っていることが名前からわかる。二重ループで外と内の変数を取り違えるバグを防げる。","learnedFrom":"","refs":""},{"id":"N-013","title":"定数は大文字スネークで、意味まで書く","target":"constant","source":"basic","problems":[],"date":"2026-11-15","rule":"`static final` の定数は\u003cmark>大文字スネーク\u003c/mark>にし、\u003cmark>値の意味（率か・金額か・上限か）まで名前に書く\u003c/mark>。数字そのものを名前にしない。","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| `static final Decimal TAX = 0.10;` | `static final Decimal TAX_RATE = 0.10;` | 税率か税額かわからない |\n| `static final Integer MAX = 3;` | `static final Integer MAX_RETRY_COUNT = 3;` | 何の上限か書く |\n| `static final Integer TEN = 10;` | `static final Integer BATCH_SIZE = 10;` | 値を変えると名前がうそになる |\n| `static final String S = 'Closed Won';` | `static final String STAGE_CLOSED_WON = 'Closed Won';` | |","why":"コードの途中に `0.10` や `'Closed Won'` が直接書いてあると、何の値か・どこを直せばよいかわからない。意味のある名前の定数にすると、値を変えるときも1か所で済む。","learnedFrom":"","refs":""},{"id":"N-014","title":"単位・基準がまぎらわしい値は名前に入れる","target":"variable","source":"basic","problems":[],"date":"2026-11-15","rule":"時間・割合・金額など、\u003cmark>単位や基準を取り違えやすい値は、それを名前に入れる\u003c/mark>。","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| `timeout` | `timeoutSeconds`・`timeoutMillis` | 秒かミリ秒か |\n| `discount`（0.1 が入る） | `discountRate` | 10 なら `discountPercent`、100円なら `discountAmount` |\n| `price`（税込） | `priceWithTax` | 税込か税抜か |\n| `start`（Datetime） | `startDateTime` | Date と Datetime は別の型で、比べ方も違う |","why":"`Decimal` や `Integer` という型は単位までは守ってくれない。\u003cmark>単位の取り違えはコンパイルで見つからず、計算結果だけがずれる\u003c/mark>ので、名前で防ぐ。","learnedFrom":"","refs":""},{"id":"N-015","title":"テストは「対象クラス名 + Test」、メソッドは「対象_条件_結果」","target":"test","source":"basic","problems":[],"date":"2026-11-15","rule":"- テストクラス：\u003cmark>テストするクラス名 + `Test`\u003c/mark>（`CategoryCounterTest`）\n- テストメソッド：\u003cmark>`対象のメソッド_条件_期待する結果`\u003c/mark>（`countByCategory_emptyList_returnsEmptyMap`）\n- テストデータを作るクラス：`TestDataFactory`\n\n```apex\n@IsTest\nprivate class CategoryCounterTest {\n    @IsTest\n    static void countByCategory_emptyList_returnsEmptyMap() { ... }\n\n    @IsTest\n    static void countByCategory_sameCategoryTwice_countsTwo() { ... }\n}\n```","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| `TestCategoryCounter`・`CategoryCounter_Test` | `CategoryCounterTest` | 一覧で対象クラスの隣に並ぶ |\n| `test1()`・`testMethod2()` | `countByCategory_nullInput_returnsEmptyMap()` | 何を確かめているかわからない |","why":"テストが失敗したとき、\u003cmark>テストの名前だけで「どの条件で何が壊れたか」がわかる\u003c/mark>。デプロイ時のテスト結果一覧でもすぐ原因の見当がつく。","learnedFrom":"","refs":""},{"id":"N-016","title":"トリガーは「オブジェクト名 + Trigger」、処理はハンドラへ","target":"trigger","source":"basic","problems":[],"date":"2026-11-15","rule":"- トリガー：\u003cmark>`オブジェクト名 + Trigger`\u003c/mark>。1つのオブジェクトに1つだけ作る（`AccountTrigger`）\n- カスタムオブジェクトは `__c` を取る（`Invoice__c` → `InvoiceTrigger`）\n- 処理を書くクラス：`オブジェクト名 + TriggerHandler`（`AccountTriggerHandler`）\n- ハンドラのメソッドは、タイミング（`beforeInsert`・`afterUpdate`）から、\u003cmark>やることの名前のメソッド\u003c/mark>（`setDefaultRating`・`createFollowUpTasks`）を呼ぶ","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| `AccountBeforeInsert`・`AccountTrigger2` | `AccountTrigger` | 1オブジェクトに1トリガー。複数あると実行順が決まらない |\n| `Invoice__cTrigger` | `InvoiceTrigger` | |\n| ハンドラに `beforeInsert` だけがあり中に全部書く | `beforeInsert` から `setDefaultRating` を呼ぶ | タイミングではなく、やることで探せる |","why":"トリガーの名前がそろっていると、オブジェクト名で探すだけで見つかる。やることの名前のメソッドに分けると、「何がいつ動くか」が一覧で読める。","learnedFrom":"","refs":""},{"id":"N-017","title":"LWC のフォルダ名・プロパティ・イベントの名前","target":"lwc","source":"basic","problems":[],"date":"2026-11-15","rule":"| 対象 | 書き方 | 例 |\n|---|---|---|\n| コンポーネントのフォルダ名 | \u003cmark>小文字で始まるキャメルケース\u003c/mark>（`-` は使えない） | `accountList` |\n| HTML で使うとき | \u003cmark>ケバブケース\u003c/mark>（`-` でつなぐ） | `\u003cc-account-list>` |\n| 公開プロパティ（`@api`） | JS はキャメルケース、HTML の属性はケバブケース | `recordId` ↔ `record-id` |\n| イベント名 | \u003cmark>大文字・空白を使わず、`on` で始めない\u003c/mark> | `new CustomEvent('select')` |\n| 親での受け取り | `on` + イベント名 | `onselect={handleSelect}` |\n| イベントを処理するメソッド | `handle` + 何が起きたか | `handleSelect`・`handleSearchChange` |","examples":"| ✕ | ○ | 理由 |\n|---|---|---|\n| フォルダ `AccountList`・`account-list` | `accountList` | フォルダ名の決まりに合わない |\n| `new CustomEvent('onSelect')` | `new CustomEvent('select')` | 親で `ononselect` になってしまう |\n| `click1()` | `handleSaveClick()` | 何のボタンの処理かわからない |","why":"LWC は名前の書き方で JS と HTML をつないでいるので、決まりに合わないと部品やプロパティが見つからない。イベントに大文字を使うと、HTML の属性で受け取れない。","learnedFrom":"","refs":"- LWC Developer Guide「Component Folder」「Create and Dispatch Events」"}],"namingTips":"## 値の種類で決まる形\n- **Boolean** → \u003cmark>`is` / `has` / `can` / `should` で始める\u003c/mark>：`isActive`・`hasError`・`canEdit`〔N-007〕〔N-011〕\n- **Boolean に否定は入れない** → `isNotValid` ではなく `isValid`（`!isNotValid` は読み間違える）〔N-011〕\n- **List** → \u003cmark>複数形\u003c/mark>：`accounts`・`accountIds`・`emails`〔N-010〕\n- **Set** → \u003cmark>「中身の単数形 + Set」\u003c/mark>：`accountIdSet`・`seenEmailSet`〔N-010〕\n- **Map** → \u003cmark>「値の単数形 + Map」\u003c/mark>、値が List なら `xxxListMap`：`accountMap`・`contactListMap`・`categoryCountMap`〔N-010〕\n- **ループ変数** → コレクションの単数形：`for (Account account : accounts)`〔N-012〕\n- **Id** → `xxxId`、Id の List は `xxxIds`、Set は `xxxIdSet`：`accountId`・`ownerIds`・`ownerIdSet`〔N-010〕\n- **件数・合計** → `xxxCount`・`totalXxx`：`caseCount`・`totalAmount`（`cnt`・`sum` だけにしない）〔N-001〕\n- **定数** → \u003cmark>大文字スネーク + 意味\u003c/mark>：`TAX_RATE`・`MAX_RETRY_COUNT`（`TAX`・`MAX` だけにしない）〔N-013〕\n- **単位・基準があいまいな値** → 名前の最後に付ける：`timeoutSeconds`・`discountRate`（0.1）・`discountPercent`（10）・`priceWithTax`〔N-014〕\n- **日付と日時** → `xxxDate` と `xxxDateTime` を使い分ける：`dueDate`・`sentDateTime`〔N-014〕\n\n## メソッド\n- **基本** → \u003cmark>動詞で始める\u003c/mark>：`calculateDiscount`・`sendWelcomeEmail`〔N-006〕\n- **true / false を返す** → `is` / `has` で始める：`isFreezing(temp)`・`hasDuplicate(emails)`〔N-007〕\n- **取ってくる** → 手元の値から返すなら `get`、SOQL で探すなら `find` / `query`：`getDiscountRate`・`findActiveAccounts`〔N-006〕\n- **変換** → `toXxx`：`toFahrenheit`・`toJson`〔N-008〕\n- **集計** → `countByXxx`（件数）・`groupByXxx`（List にまとめる）・`sumByXxx`（合計）〔N-008〕\n- **作る** → \u003cmark>メモリ上で組み立てるだけなら `build`、insert までするなら `create`\u003c/mark>〔N-008〕\n- **入力チェック** → だめなら例外を投げるなら `validateXxx`、true / false を返すなら `isValidXxx`〔N-007〕\n- **表示用に整える** → `formatXxx`：`formatInvoiceNo`〔N-006〕\n- **LWC のイベント処理** → `handle` + 起きたこと：`handleSelect`・`handleSaveClick`〔N-017〕\n\n## クラス\n- **基本** → \u003cmark>「対象 + 役割」の名詞\u003c/mark>：`AccountService`・`AccountSelector`・`TaxCalculator`〔N-004〕\n- **トリガー** → `オブジェクト名 + Trigger`（1オブジェクトに1つ）、処理は `オブジェクト名 + TriggerHandler`〔N-016〕\n- **例外** → \u003cmark>名前の最後は必ず `Exception`\u003c/mark>（そうしないと保存できない）：`InvalidOrderException`〔N-004〕\n- **テスト** → `対象クラス名 + Test`、メソッドは `対象_条件_結果`：`countByCategory_emptyList_returnsEmptyMap`〔N-015〕\n- **Util** → 「何の」道具かを前に付ける：`DateUtil`・`EmailUtil`（`Util`・`CommonUtil` だけにしない）〔N-005〕\n- **LWC** → フォルダは `accountList`、HTML では `\u003cc-account-list>`、イベント名は小文字だけで `on` を付けない〔N-017〕\n\n## 書き方\n- **略さない・ローマ字にしない** → `acc` → `account`、`kingaku` → `amount`（`Id`・`Url`・`Json` は略してよい）〔N-001〕\n- **型の略号を付けない** → `accountList` → `accounts`、`strName` → `name`（Set・Map の `Set`・`Map` は付ける）〔N-009〕\n- **戻り値の変数** → `result` を付けてよい：`result`・`resultEmails`〔N-009〕\n- **頭字語は先頭だけ大文字** → `parseJson`・`recordId`・`HttpCalloutService`〔N-003〕\n- **ケース** → クラスは `PascalCase`、メソッド・変数は `camelCase`、定数は `UPPER_SNAKE`〔N-002〕\n- **予約語は使えない** → `limit` → `maxCount`、`case` → `caseRecord`〔N-009〕〔N-012〕\n\n## 迷ったときの確かめ方\n- \u003cmark>呼ぶ側で英語の文として読めるか\u003c/mark>：`if (order.isPaid())`・`accountMap.get(accountId)` は読める〔N-006〕\n- `data`・`tmp`・`flag`・`info` を付けたくなったら、\u003cmark>中身が何かを名前にする\u003c/mark>合図〔N-009〕\n- 名前が長くなりすぎる・うまく付かないときは、そのメソッドやクラスが\u003cmark>2つ以上のことをしている\u003c/mark>サイン。分ける〔N-005〕"}</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>// db（Artifact のデータベース）の読み書きをここにまとめる。
// コレクション: attempts/{問題ID}・answers/{問題ID}・memos/{メモID}・trailhead/{項目ID}・namingReviews/{問題ID}・scratch/{問題ID か general}
const Store = (() => {
  const LIVE_COLLECTIONS = ['attempts', 'memos', 'trailhead', 'namingReviews'];
  const HISTORY_LIMIT = 5;

  const state = {
    status: 'loading', // loading / ready / unavailable
    stale: false,
    error: null,
    attempts: {},
    memos: {},
    trailhead: {},
    namingReviews: {},
  };
  const loaded = {};
  const listeners = new Set();
  const queues = new Map();
  let db = null;

  const emit = () => listeners.forEach((fn) => fn());

  async function init() {
    db = window.claude && window.claude.use ? await window.claude.use('db').catch(() => null) : null;
    if (!db) {
      state.status = 'unavailable';
      emit();
      return;
    }
    const timer = setTimeout(() => {
      if (!LIVE_COLLECTIONS.every((name) => loaded[name])) {
        state.stale = true;
        emit();
      }
    }, 10000);
    for (const name of LIVE_COLLECTIONS) {
      db.collection(name).onSnapshot(
        (snap) => {
          const map = {};
          for (const doc of snap.docs) if (doc.exists) map[doc.id] = doc.data();
          state[name] = map;
          if (!snap.metadata.fromCache) loaded[name] = true;
          if (LIVE_COLLECTIONS.every((n) => loaded[n])) {
            clearTimeout(timer);
            state.stale = false;
          }
          emit();
        },
        (err) => {
          state.error = err.code;
          emit();
        },
      );
    }
    state.status = 'ready';
    emit();
  }

  // 同じドキュメントへの書き込みは1つずつ順番に行う
  function enqueue(path, fn) {
    const previous = queues.get(path) || Promise.resolve();
    const next = previous.catch(() => {}).then(fn);
    queues.set(path, next);
    return next;
  }

  function write(path, data) {
    if (!db) return Promise.reject({ code: 'not_granted', message: 'db is not available' });
    return enqueue(path, () => db.doc(path).set(data));
  }

  const now = () => new Date().toISOString();

  // ---- 問題の状態 ----
  function attempt(problemId) {
    return state.attempts[problemId] || { status: 'none', attemptCount: 0, answerViewed: false, solvedWithoutAnswer: false };
  }

  function saveAttempt(problemId, patch) {
    const body = { ...attempt(problemId), ...patch, updatedAt: now() };
    return write(`attempts/${problemId}`, body);
  }

  function markTrying(problemId) {
    if (attempt(problemId).status !== 'none') return Promise.resolve();
    return saveAttempt(problemId, { status: 'trying' });
  }

  function markResult(problemId, correct) {
    const current = attempt(problemId);
    return saveAttempt(problemId, {
      status: correct ? 'correct' : 'failed',
      attemptCount: (current.attemptCount || 0) + 1,
      solvedWithoutAnswer: correct ? current.solvedWithoutAnswer || !current.answerViewed : current.solvedWithoutAnswer,
      solvedAt: correct ? current.solvedAt || now() : current.solvedAt || null,
    });
  }

  function markAnswerViewed(problemId) {
    const current = attempt(problemId);
    if (current.answerViewed) return Promise.resolve();
    return saveAttempt(problemId, {
      answerViewed: true,
      status: current.status === 'correct' ? 'correct' : 'viewed',
    });
  }

  // ---- 解答コード ----
  async function loadAnswer(problemId) {
    if (!db) return null;
    const snap = await db.doc(`answers/${problemId}`).get();
    return snap.exists ? snap.data() : null;
  }

  async function saveAnswer(problemId, code, previous) {
    const history = previous && Array.isArray(previous.history) ? previous.history.slice() : [];
    history.unshift({ code, savedAt: now() });
    const body = { code, history: history.slice(0, HISTORY_LIMIT), updatedAt: now() };
    await write(`answers/${problemId}`, body);
    await markTrying(problemId);
    return body;
  }

  // ---- メモ ----
  function newMemoId() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    return `M-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  }

  async function addMemo({ kind, problemId = null, trailheadId = null, skills = [], text }) {
    const id = newMemoId();
    const memo = {
      id,
      kind,
      problemId,
      trailheadId,
      skills,
      text,
      status: 'open',
      generatedProblemIds: [],
      createdAt: now(),
      resolvedAt: null,
    };
    await write(`memos/${id}`, memo);
    if (problemId) await markTrying(problemId);
    return memo;
  }

  function updateMemo(id, patch) {
    const current = state.memos[id];
    if (!current) return Promise.resolve();
    return write(`memos/${id}`, { ...current, ...patch });
  }

  function deleteMemo(id) {
    if (!db) return Promise.reject({ code: 'not_granted' });
    return enqueue(`memos/${id}`, () => db.doc(`memos/${id}`).delete());
  }

  // ---- Trailhead ----
  function trailheadStatus(id) {
    return (state.trailhead[id] && state.trailhead[id].status) || '未着手';
  }

  function setTrailheadStatus(id, status) {
    const current = state.trailhead[id] || {};
    return write(`trailhead/${id}`, { ...current, status, updatedAt: now() });
  }

  // ---- 命名チェック ----
  function namingReview(problemId) {
    return state.namingReviews[problemId] || null;
  }

  function saveNamingReview(problemId, review) {
    return write(`namingReviews/${problemId}`, { ...review, problemId, checkedAt: now() });
  }

  // ---- メモ用紙（問題を読みながら書く下書き） ----
  async function loadScratch(key) {
    if (!db) return null;
    const snap = await db.doc(`scratch/${key}`).get();
    return snap.exists ? snap.data() : null;
  }

  function saveScratch(key, text) {
    return write(`scratch/${key}`, { text, updatedAt: now() });
  }

  // ---- 書き出し ----
  async function exportAll() {
    const answers = {};
    if (db) {
      const snap = await db.collection('answers').get();
      for (const doc of snap.docs) if (doc.exists) answers[doc.id] = doc.data();
    }
    return {
      exportedAt: now(),
      attempts: state.attempts,
      answers,
      memos: state.memos,
      trailhead: state.trailhead,
      namingReviews: state.namingReviews,
    };
  }

  return {
    state,
    init,
    subscribe: (fn) => listeners.add(fn),
    canWrite: () => !!db,
    attempt,
    markResult,
    markAnswerViewed,
    loadAnswer,
    saveAnswer,
    addMemo,
    updateMemo,
    deleteMemo,
    trailheadStatus,
    setTrailheadStatus,
    namingReview,
    saveNamingReview,
    loadScratch,
    saveScratch,
    exportAll,
  };
})();

// 画面の描画と操作。データの読み書きは Store（store.js）に任せる。
const CONTENT = JSON.parse(document.getElementById('content').textContent);
const LEVELS = CONTENT.levels;
const PROBLEMS = CONTENT.problems;
const SKILLS = CONTENT.skills;
const TRAILHEAD = CONTENT.trailhead;
const LEARNED = CONTENT.learned || [];
const NAMING = CONTENT.naming || [];
const NAMING_TIPS = CONTENT.namingTips || '';
const problemById = new Map(PROBLEMS.map((p) => [p.id, p]));
const skillById = new Map(SKILLS.map((s) => [s.id, s]));
const trailheadById = new Map(TRAILHEAD.map((t) => [t.id, t]));

const TYPE_LABELS = {
  predict: '出力予測', fill: '穴埋め', write: '一から書く', fix: 'バグ修正', review: 'レビュー',
  choose: '判断', lookup: '調べて書く', error: 'エラー解読', 'th-style': 'Trailhead 形式',
  project: '総合', setup: '環境準備',
};
const ENV_LABELS = { none: '紙とペン', org: '組織', vscode: 'VS Code' };
const STATUS_LABELS = { none: '未着手', trying: '挑戦中', failed: '解けなかった', viewed: '解答を見た', correct: '正解' };
const MEMO_LABELS = { open: '未対応', generated: '問題作成済み', resolved: '解決済み' };
const TH_STATUSES = ['未着手', '挑戦中', '完了'];
const TH_ROLE_LABELS = { prep: '始める前に', test: '実地テスト', optional: '任意', graduation: '卒業課題' };
const NAMING_TARGETS = [
  ['common', '共通'], ['class', 'クラス'], ['method', 'メソッド'], ['variable', '変数'],
  ['collection', 'コレクション'], ['constant', '定数'], ['test', 'テスト'], ['trigger', 'トリガー'], ['lwc', 'LWC'],
];
const NAMING_TARGET_LABELS = Object.fromEntries(NAMING_TARGETS);
const TH_TYPE_LABELS = { module: 'モジュール', project: 'プロジェクト', superbadge: 'スーパーバッジ' };

const main = document.getElementById('main');

// ---------- 小さな道具 ----------
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function md(text) {
  if (!window.marked || !window.DOMPurify) return `<pre class="memo-text">${esc(text)}</pre>`;
  return DOMPurify.sanitize(marked.parse(text || '', { gfm: true }));
}

function enhance(root) {
  root.querySelectorAll('.md table').forEach((table) => {
    if (table.parentElement.classList.contains('table-wrap')) return;
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    table.replaceWith(wrap);
    wrap.appendChild(table);
  });
  root.querySelectorAll('.md pre > code').forEach((code) => {
    if (code.dataset.enhanced) return;
    code.dataset.enhanced = '1';
    const match = code.className.match(/language-([\w-]+)/);
    const lang = match ? ({ apex: 'java', js: 'javascript', html: 'xml' }[match[1]] || match[1]) : null;
    if (window.hljs && lang && hljs.getLanguage(lang)) {
      code.className = `language-${lang}`;
      hljs.highlightElement(code);
    }
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'copy-btn';
    button.dataset.action = 'copy-code';
    button.textContent = 'コピー';
    code.parentElement.appendChild(button);
  });
}

function toast(message) {
  document.querySelectorAll('.toast').forEach((el) => el.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

function formatDate(iso, withTime = true) {
  if (!iso) return '';
  const options = withTime
    ? { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }
    : { year: 'numeric', month: 'numeric', day: 'numeric' };
  return new Date(iso).toLocaleString('ja-JP', options);
}

function storage(action, key, value) {
  try {
    if (action === 'get') return localStorage.getItem(key);
    if (action === 'set') localStorage.setItem(key, value);
    if (action === 'remove') localStorage.removeItem(key);
  } catch (e) {
    return null;
  }
  return null;
}

function failMessage(err) {
  if (err && err.code === 'quota_exceeded') return '保存できる容量がいっぱいです。データを書き出してから古い解答を整理してください。';
  if (err && err.code === 'not_granted') return 'この画面では保存できません。claude.ai にログインして開いてください。';
  return '保存できませんでした。少し待ってからもう一度押してください。';
}

// ---------- 集計 ----------
const levelOf = (n) => LEVELS.find((l) => l.level === n);
const isGenerated = (p) => p.source === 'generated' || /^G-/.test(p.id);

function levelEntries(n) {
  // README の問題一覧の順に並べ、まだ作っていない問題は planned として返す
  const level = levelOf(n);
  const entries = level.planned.map((row) => ({ ...row, problem: problemById.get(row.id) || null }));
  for (const p of PROBLEMS) {
    if (p.level === n && !isGenerated(p) && !entries.some((e) => e.id === p.id)) entries.push({ id: p.id, title: p.title, type: p.type, problem: p });
  }
  return entries;
}

const generatedFor = (n) => PROBLEMS.filter((p) => isGenerated(p) && p.level === n);

function levelStats(n) {
  const entries = levelEntries(n);
  const written = entries.filter((e) => e.problem);
  const correct = written.filter((e) => Store.attempt(e.id).status === 'correct').length;
  return { total: entries.length, written: written.length, correct };
}

function passStatus(n) {
  const entries = levelEntries(n);
  const projects = entries.filter((e) => e.type === 'project');
  const finalProject = projects[projects.length - 1] || null;
  const attempt = finalProject ? Store.attempt(finalProject.id) : null;
  const projectOk = !!(finalProject && finalProject.problem && attempt.status === 'correct' && attempt.solvedWithoutAnswer);
  const thItems = TRAILHEAD.filter((t) => t.level === n && (t.role === 'test' || t.role === 'graduation'));
  const thDone = thItems.filter((t) => Store.trailheadStatus(t.id) === '完了');
  return { finalProject, projectOk, thItems, thOk: thDone.length === thItems.length, passed: projectOk && thDone.length === thItems.length };
}

const currentLevel = () => LEVELS.find((l) => !passStatus(l.level).passed) || LEVELS[LEVELS.length - 1];

function nextProblem(n) {
  const candidates = [...levelEntries(n).filter((e) => e.problem).map((e) => e.problem), ...generatedFor(n)];
  return candidates.find((p) => Store.attempt(p.id).status !== 'correct') || null;
}

const allMemos = () => Object.values(Store.state.memos).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
const openMemos = () => allMemos().filter((m) => m.status === 'open');

function memosForProblem(problem) {
  return allMemos().filter((m) => m.problemId === problem.id || (problem.memo_ids || []).includes(m.id));
}

// ---------- 共通の部品 ----------
function statusPill(problemId) {
  const a = Store.attempt(problemId);
  const label = a.status === 'correct' && a.solvedWithoutAnswer ? '自力で正解' : STATUS_LABELS[a.status] || '未着手';
  return `<span class="pill" data-status="${esc(a.status)}">${esc(label)}</span>`;
}

function stars(n) {
  const level = Number(n) || 1;
  return `<span class="stars" aria-label="難しさ ${level}">${'★'.repeat(level)}${'☆'.repeat(Math.max(0, 3 - level))}</span>`;
}

function skillChips(ids) {
  return (ids || []).map((id) => {
    const skill = skillById.get(id);
    return `<span class="chip" title="${esc(skill ? skill.name : '')}">${esc(id)}</span>`;
  }).join(' ');
}

function problemRow(entry) {
  const p = entry.problem;
  if (!p) {
    return `<div class="list-item planned">
      <span class="id">${esc(entry.id)}</span><span class="title">${esc(entry.title)}</span>
      <span class="pill" data-status="planned">準備中</span>
      <span class="meta"><span>${esc(TYPE_LABELS[entry.type] || entry.type)}</span></span>
    </div>`;
  }
  const memoCount = memosForProblem(p).filter((m) => m.status === 'open').length;
  return `<button type="button" class="list-item" data-action="open-problem" data-id="${esc(p.id)}">
    <span class="id">${esc(p.id)}</span><span class="title">${esc(p.title)}</span>
    ${statusPill(p.id)}
    <span class="meta">
      <span>${esc(TYPE_LABELS[p.type] || p.type)}</span><span>${stars(p.difficulty)}</span>
      <span>${esc(p.minutes)}分</span><span>${esc(ENV_LABELS[p.environment] || p.environment)}</span>
      ${memoCount ? `<span class="pill" data-memo="open">メモ ${memoCount}</span>` : ''}
    </span>
  </button>`;
}

function levelRows() {
  const current = currentLevel().level;
  return LEVELS.map((l) => {
    const s = levelStats(l.level);
    const pass = passStatus(l.level);
    const percent = s.total ? Math.round((s.correct / s.total) * 100) : 0;
    const badge = pass.passed
      ? '<span class="pill" data-status="correct">合格</span>'
      : s.written === 0 ? '<span class="pill" data-status="planned">準備中</span>' : '';
    const stateClass = pass.passed ? ' passed' : l.level === current ? ' current' : '';
    return `<button type="button" class="list-item level-row${stateClass}" data-action="open-level" data-level="${l.level}">
      <span class="level-num">Lv${l.level}</span><span class="title">${esc(l.theme)}</span>${badge}
      <span class="level-progress"><span class="bar thin"><span style="width:${percent}%"></span></span><span>${s.correct} / ${s.total}</span></span>
    </button>`;
  }).join('');
}

function trailheadItem(t) {
  const status = Store.trailheadStatus(t.id);
  const buttons = TH_STATUSES.map((value) =>
    `<button type="button" data-action="th-status" data-id="${esc(t.id)}" data-value="${value}" aria-pressed="${status === value}">${value}</button>`).join('');
  return `<div class="th-item">
    <div class="th-head">
      <a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a>
      <span class="pill${t.role === 'test' || t.role === 'graduation' ? ' weak' : ''}">${esc(TH_ROLE_LABELS[t.role] || t.role)}</span>
    </div>
    <div class="row">
      <span class="segmented" role="group" aria-label="${esc(t.title)} の状態">${buttons}</span>
      <span class="small muted">${esc(TH_TYPE_LABELS[t.type] || t.type)}</span>
      <button type="button" class="btn quiet small" data-action="memo-for-th" data-id="${esc(t.id)}">つまずきをメモ</button>
    </div>
  </div>`;
}

// ---------- 命名ルール ----------
const namingFor = (problemId) => NAMING.filter((r) => r.problems.includes(problemId));
// 解答のチェックから学んだルール（新しく足したもの、または基本ルールにきっかけの問題が付いたもの）
const fromAnswers = (r) => r.source === 'review' || r.problems.length > 0;
const plainText = (text) => String(text || '').replace(/<\/?mark>/g, '').replace(/\n{2,}/g, '\n').trim();

// 保存した解答の名前を、このページから Claude に見てもらう（sample 機能）。結果は db の namingReviews に残す
const NamingCheck = (() => {
  let samplePromise = null;
  const getSample = () => {
    if (!samplePromise) {
      samplePromise = window.claude && window.claude.use
        ? window.claude.use('sample').catch(() => null)
        : Promise.resolve(null);
    }
    return samplePromise;
  };

  function prompt(problem, code) {
    const rules = NAMING.map((r) =>
      `${r.id}（${NAMING_TARGET_LABELS[r.target] || r.target}）${r.title}\n${plainText(r.rule).slice(0, 500)}`).join('\n\n');
    return `あなたは Salesforce の Apex / LWC のコードレビュアーです。学習者が問題を解いて書いたコードの「名前」だけをレビューしてください。ロジックの正しさは見ません。

# 命名ルール（このプロジェクトのルール）
${rules}

# 問題 ${problem.id}「${problem.title}」
${String(problem.question || '').slice(0, 4000)}

# 学習者の解答コード
\`\`\`apex
${code.slice(0, 20000)}
\`\`\`

# やること
1. 学習者が自分で付けた名前（クラス・メソッド・引数・ローカル変数・ループ変数・定数・テストメソッドなど）を拾う。問題文で指定された名前、Apex の標準クラス・メソッドの名前、Salesforce のオブジェクト名・項目名、確認用に問題文からそのまま写したコードの名前は対象外。同じ名前は1回だけ。最大20個。
2. それぞれを "good"（このままでよい）か "improve"（もっとよい名前がある）に分ける。好みの差にすぎないものは "good" にする。
3. "improve" のときは suggestion によりよい名前、reason に理由を日本語で1〜2文。当てはまる命名ルールの ID を ruleIds に入れる（なければ空配列）。"good" のときも、守れているルールがあれば ruleIds に入れ、reason は空文字でよい。
4. lessons に、"improve" の指摘から今後に生かす学びを最大3つ書く。既存のルールに当てはまるなら ruleId にその ID、どのルールにもない新しい学びなら ruleId を null にし、title を新しいルールとして1行で書く。target は common / class / method / variable / collection / constant / test / trigger / lwc のどれか。text には、学習者が付けた名前とよりよい名前を入れて、何を覚えればよいかを日本語で2文以内で書く。"improve" がなければ lessons は空配列。
5. summary に全体の感想を日本語で1文。

JSON だけを返す。形:
{"summary":"…","items":[{"kind":"class|method|parameter|variable|constant|test|other","name":"accountMap","verdict":"good|improve","suggestion":"","reason":"","ruleIds":["N-008"]}],"lessons":[{"ruleId":"N-010","title":"…","target":"collection","text":"…"}]}`;
  }

  // 受け取った JSON を、表示と保存に使う形に整える（足りない項目は空にする）
  function normalize(raw) {
    const ruleIds = new Set(NAMING.map((r) => r.id));
    const ids = (list) => (Array.isArray(list) ? list.map(String).filter((id) => ruleIds.has(id)) : []);
    const items = (Array.isArray(raw && raw.items) ? raw.items : []).slice(0, 30).map((it) => ({
      kind: String(it.kind || 'other'),
      name: String(it.name || ''),
      verdict: it.verdict === 'improve' ? 'improve' : 'good',
      suggestion: String(it.suggestion || ''),
      reason: String(it.reason || ''),
      ruleIds: ids(it.ruleIds),
    })).filter((it) => it.name);
    const targets = new Set(NAMING_TARGETS.map(([key]) => key));
    const lessons = (Array.isArray(raw && raw.lessons) ? raw.lessons : []).slice(0, 5).map((l) => ({
      ruleId: ruleIds.has(String(l.ruleId)) ? String(l.ruleId) : null,
      title: String(l.title || ''),
      target: targets.has(l.target) ? l.target : 'common',
      text: String(l.text || ''),
    })).filter((l) => l.title || l.text);
    return { summary: String((raw && raw.summary) || ''), items, lessons };
  }

  async function run(problem, code, { signal, onProgress } = {}) {
    const sample = await getSample();
    if (!sample) throw { code: 'unavailable' };
    const raw = await sample.json(prompt(problem, code), {
      signal,
      onText: () => onProgress && onProgress(),
    });
    const review = normalize(raw);
    return {
      ...review,
      code,
      by: 'page',
      status: review.lessons.length ? 'open' : 'none',
      appliedRuleIds: [],
    };
  }

  return { run, available: async () => !!(await getSample()) };
})();

function memoCard(m) {
  let source = '自由メモ';
  if (m.problemId) {
    const p = problemById.get(m.problemId);
    source = `<button type="button" class="btn quiet small" data-action="open-problem" data-id="${esc(m.problemId)}">${esc(m.problemId)}${p ? ' ' + esc(p.title) : ''}</button>`;
  } else if (m.trailheadId) {
    const t = trailheadById.get(m.trailheadId);
    source = `Trailhead: ${esc(t ? t.title : m.trailheadId)}`;
  }
  const generated = (m.generatedProblemIds || []).map((id) => problemById.has(id)
    ? `<button type="button" class="btn small" data-action="open-problem" data-id="${esc(id)}">${esc(id)} ${esc(problemById.get(id).title)}</button>`
    : `<span class="chip">${esc(id)}（サイトに反映待ち）</span>`).join(' ');
  const actions = [];
  if (m.status !== 'resolved') actions.push(`<button type="button" class="btn small ok" data-action="memo-resolve" data-id="${esc(m.id)}">解決済みにする</button>`);
  if (m.status === 'resolved') actions.push(`<button type="button" class="btn small" data-action="memo-reopen" data-id="${esc(m.id)}">未対応に戻す</button>`);
  actions.push(`<button type="button" class="btn quiet small" data-action="memo-delete" data-id="${esc(m.id)}">削除</button>`);
  return `<div class="memo">
    <div class="memo-head">
      <span class="pill" data-memo="${esc(m.status)}">${esc(MEMO_LABELS[m.status] || m.status)}</span>
      <span class="mono">${esc(m.id)}</span><span>${esc(formatDate(m.createdAt))}</span><span>${source}</span>
    </div>
    <div class="memo-text">${esc(m.text)}</div>
    ${m.skills && m.skills.length ? `<div class="row">${skillChips(m.skills)}</div>` : ''}
    ${generated ? `<div class="row small"><span class="muted">作った問題:</span> ${generated}</div>` : ''}
    ${Store.canWrite() ? `<div class="memo-actions">${actions.join('')}</div>` : ''}
  </div>`;
}

function skillOptions(selected = '') {
  const groups = [...new Set(SKILLS.map((s) => s.group))];
  return groups.map((g) => `<optgroup label="${esc(g)}">${SKILLS.filter((s) => s.group === g)
    .map((s) => `<option value="${esc(s.id)}"${s.id === selected ? ' selected' : ''}>${esc(s.id)} ${esc(s.name)}</option>`).join('')}</optgroup>`).join('');
}

  },

  html() {
    const p = this.problem;

    this.confirming = false;
    this.answerDoc = null;
    this.answerLoaded = false;
    this.dirty = false;
    this.draftRestored = false;
    const level = levelOf(p.level);
    const { prev, next } = this.siblings();

      ? `<option value="__all__">この問題のトピックすべて</option>${p.skills.map((id) => `<option value="${esc(id)}">${esc(id)} ${esc(skillById.get(id) ? skillById.get(id).name : '')}</option>`).join('')}`
