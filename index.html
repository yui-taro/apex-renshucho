リごとの金額の合計\n    - カテゴリは前後の空白を取り除く。`null`・空文字・空白だけなら `'未分類'`\n  - 金額が一番大きいカテゴリ（同額なら `compareTo` で小さいほう）。明細0件なら `null`\n  - 割引額\n    - 合計が 10000 以上なら合計の 10%、5000 以上なら 5%、それ未満は 0\n    - 1円未満は切り捨て\n  - 請求額（合計 − 割引額）\n  - 次の形の1行の文字列\n\n    ```\n    明細: 5件 / カテゴリ数: 4 / 合計: 12800円 / 割引: 1280円 / 請求額: 11520円 / 最多: 食品\n    ```\n    明細0件のときの「最多」は `なし` にする\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nAssert.isTrue(条件, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n**明細（8行）**\n\n| 商品名 | カテゴリ | 単価 | 数量 |\n|---|---|---|---|\n| ノート | `'文具'` | 150 | 10 |\n| ボールペン | `' 文具 '` | 120 | 20 |\n| コーヒー | `'食品'` | 980 | 5 |\n| USBケーブル | `'家電'` | 1200 | 3 |\n| 付箋 | `'文具'` | 300 | 0 |\n| （明細が `null`） | | | |\n| 電池 | `null` | 400 | 1 |\n| おまけ | `'文具'` | `null` | 1 |\n\n**この注文の結果**\n\n| 項目 | 結果 |\n|---|---|\n| 明細の件数 | `5`（数量0・`null`・単価 `null` の明細は除く） |\n| 合計 | `12800` |\n| カテゴリごとの金額 | 4種類：文具 `3900`、食品 `4900`、家電 `3600`、未分類 `400` |\n| 一番大きいカテゴリ | `食品` |\n| 割引額 / 請求額 | `1280` / `11520` |\n| 1行の文字列 | `明細: 5件 / カテゴリ数: 4 / 合計: 12800円 / 割引: 1280円 / 請求額: 11520円 / 最多: 食品` |\n\n**境目の確認**\n\n| 注文 | 結果 |\n|---|---|\n| 5000円×1 だけ | 割引 `250`（5000ちょうどは5%） |\n| 4999円×1 だけ | 割引 `0` |\n| 7777円×1 だけ | 割引 `388`（388.85 を切り捨て） |\n| カテゴリ B 100円×1、カテゴリ A 100円×1 | 一番大きいカテゴリ `A`（同額なら辞書順） |\n| リストが `null` | 件数 `0`、一番大きいカテゴリ `null`、文字列 `明細: 0件 / カテゴリ数: 0 / 合計: 0円 / 割引: 0円 / 請求額: 0円 / 最多: なし` |\n\n金額は `String.valueOf(結果)` が上の文字列になることで確かめる。\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1（設計）\u003c/summary>\n\nコンストラクタで「集計対象の明細だけ」を private な List に入れておくと、ほかのメソッドは除外条件を気にせずに済む。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2（使うもの）\u003c/summary>\n\nL1-05（Map で数える）、L1-06（金額の段階と切り捨て）、L1-08（内部クラスとインスタンス変数）の組み合わせ。カテゴリ名をそろえる処理は private メソッドに切り出すとよい。\n\u003c/details>","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nList\u003cOrderReport.OrderLine> lines = new List\u003cOrderReport.OrderLine>{\n    new OrderReport.OrderLine('ノート', '文具', 150, 10),\n    new OrderReport.OrderLine('ボールペン', ' 文具 ', 120, 20),\n    new OrderReport.OrderLine('コーヒー', '食品', 980, 5),\n    new OrderReport.OrderLine('USBケーブル', '家電', 1200, 3),\n    new OrderReport.OrderLine('付箋', '文具', 300, 0),\n    null,\n    new OrderReport.OrderLine('電池', null, 400, 1),\n    new OrderReport.OrderLine('おまけ', '文具', null, 1)\n};\nOrderReport report = new OrderReport(lines);\n\nAssert.areEqual(5, report.getLineCount(), '数量0・null・単価nullの明細は除く');\nAssert.areEqual('12800', String.valueOf(report.getTotalAmount()));\n\nMap\u003cString, Decimal> byCategory = report.getAmountByCategory();\nAssert.areEqual(4, byCategory.size());\nAssert.areEqual('3900', String.valueOf(byCategory.get('文具')), '前後の空白を除いて文具にまとめる');\nAssert.areEqual('4900', String.valueOf(byCategory.get('食品')));\nAssert.areEqual('3600', String.valueOf(byCategory.get('家電')));\nAssert.areEqual('400', String.valueOf(byCategory.get('未分類')));\n\nAssert.areEqual('食品', report.getTopCategory());\nAssert.areEqual('1280', String.valueOf(report.getDiscount()), '10000以上は10%');\nAssert.areEqual('11520', String.valueOf(report.getBillingAmount()));\nAssert.areEqual(\n    '明細: 5件 / カテゴリ数: 4 / 合計: 12800円 / 割引: 1280円 / 請求額: 11520円 / 最多: 食品',\n    report.buildSummary()\n);\n\n// 割引の境目\nOrderReport r5000 = new OrderReport(new List\u003cOrderReport.OrderLine>{\n    new OrderReport.OrderLine('A', 'X', 5000, 1) });\nAssert.areEqual('250', String.valueOf(r5000.getDiscount()), '5000ちょうどは5%');\n\nOrderReport r4999 = new OrderReport(new List\u003cOrderReport.OrderLine>{\n    new OrderReport.OrderLine('A', 'X', 4999, 1) });\nAssert.areEqual('0', String.valueOf(r4999.getDiscount()), '5000未満は割引なし');\n\nOrderReport r7777 = new OrderReport(new List\u003cOrderReport.OrderLine>{\n    new OrderReport.OrderLine('A', 'X', 7777, 1) });\nAssert.areEqual('388', String.valueOf(r7777.getDiscount()), '388.85 は切り捨てて 388');\n\n// 同額のときは辞書順\nOrderReport tie = new OrderReport(new List\u003cOrderReport.OrderLine>{\n    new OrderReport.OrderLine('A', 'B', 100, 1),\n    new OrderReport.OrderLine('B', 'A', 100, 1) });\nAssert.areEqual('A', tie.getTopCategory());\n\n// 明細なし\nOrderReport empty = new OrderReport(null);\nAssert.areEqual(0, empty.getLineCount());\nAssert.isNull(empty.getTopCategory());\nAssert.areEqual(\n    '明細: 0件 / カテゴリ数: 0 / 合計: 0円 / 割引: 0円 / 請求額: 0円 / 最多: なし',\n    empty.buildSummary()\n);\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class OrderReport {\n    private List\u003cOrderLine> validLines = new List\u003cOrderLine>();\n\n    public class OrderLine {\n        public String productName;\n        public String category;\n        public Decimal unitPrice;\n        public Integer quantity;\n\n        public OrderLine(String productName, String category, Decimal unitPrice, Integer quantity) {\n            this.productName = productName;\n            this.category = category;\n            this.unitPrice = unitPrice;\n            this.quantity = quantity;\n        }\n\n        public Decimal getAmount() {\n            return unitPrice * quantity;\n        }\n    }\n\n    public OrderReport(List\u003cOrderLine> lines) {\n        if (lines == null) {\n            return;\n        }\n        for (OrderLine line : lines) {\n            if (line == null || line.unitPrice == null || line.quantity == null || line.quantity \u003c= 0) {\n                continue;\n            }\n            validLines.add(line);\n        }\n    }\n\n    public Integer getLineCount() {\n        return validLines.size();\n    }\n\n    public Decimal getTotalAmount() {\n        Decimal total = 0;\n        for (OrderLine line : validLines) {\n            total += line.getAmount();\n        }\n        return total;\n    }\n\n    public Map\u003cString, Decimal> getAmountByCategory() {\n        Map\u003cString, Decimal> amounts = new Map\u003cString, Decimal>();\n        for (OrderLine line : validLines) {\n            String key = normalizeCategory(line.category);\n            if (!amounts.containsKey(key)) {\n                amounts.put(key, 0);\n            }\n            amounts.put(key, amounts.get(key) + line.getAmount());\n        }\n        return amounts;\n    }\n\n    public String getTopCategory() {\n        Map\u003cString, Decimal> amounts = getAmountByCategory();\n        String top = null;\n        for (String key : amounts.keySet()) {\n            if (top == null\n                    || amounts.get(key) > amounts.get(top)\n                    || (amounts.get(key) == amounts.get(top) && key.compareTo(top) \u003c 0)) {\n                top = key;\n            }\n        }\n        return top;\n    }\n\n    public Decimal getDiscount() {\n        Decimal total = getTotalAmount();\n        Decimal rate = 0;\n        if (total >= 10000) {\n            rate = 0.10;\n        } else if (total >= 5000) {\n            rate = 0.05;\n        }\n        return (total * rate).setScale(0, RoundingMode.DOWN);\n    }\n\n    public Decimal getBillingAmount() {\n        return getTotalAmount() - getDiscount();\n    }\n\n    public String buildSummary() {\n        String top = getTopCategory();\n        return '明細: ' + getLineCount() + '件'\n            + ' / カテゴリ数: ' + getAmountByCategory().size()\n            + ' / 合計: ' + getTotalAmount() + '円'\n            + ' / 割引: ' + getDiscount() + '円'\n            + ' / 請求額: ' + getBillingAmount() + '円'\n            + ' / 最多: ' + (top == null ? 'なし' : top);\n    }\n\n    private static String normalizeCategory(String category) {\n        return String.isBlank(category) ? '未分類' : category.trim();\n    }\n}\n```\n\n## 解説\n### ポイント\n- **入口でデータをきれいにする**。コンストラクタで対象外の明細を取り除いて `validLines` に入れておけば、残りのメソッドは「正しいデータだけがある」前提で書ける。現場でも、外から来たデータのチェックは処理の最初にまとめて行う\n- **同じ処理は1か所に**。カテゴリ名をそろえる処理を `normalizeCategory` に切り出しておけば、ルールが変わったときに1か所直すだけで済む。外から使わないので `private` にする\n- **メソッドからメソッドを呼んで組み立てる**。`buildSummary` は他のメソッドの結果を並べているだけ。どこかの計算が間違っていても、確認コードでどのメソッドが原因か切り分けられる\n- **Map で「キーごとに合計する」**のは L1-05 の「キーごとに数える」と同じ形。`+ 1` が `+ 金額` に変わっただけ\n- **境目の値（4999・5000）と切り捨て（7777 → 388.85）を確認コードに入れている**。自分でテストを書く Lv4 でも、この考え方で確認する値を選ぶ\n\n### よくある間違い\n- `getAmountByCategory` で `amounts.get(key) + line.getAmount()` をキーがないときにも実行して `NullPointerException`\n- 除外条件を `getTotalAmount` だけに書き、`getAmountByCategory` では書き忘れて結果が合わない\n- `buildSummary` で `top` が `null` のとき `'最多: null'` になる\n- 割引の判定を `> 10000` にして、ちょうど 10000 のときに割引されない\n\n### さらに良くするには（発展）\n- `getTopCategory` や `buildSummary` は、呼ばれるたびに合計を計算し直している。明細の数が多いときは、コンストラクタで一度だけ計算して変数に覚えておく書き方もある\n- 金額の表示を `12,800円` のようにカンマ区切りにしたい場合は、`Decimal.format()` を調べてみる（ユーザーのロケールによって表示が変わる点に注意）\n\n### 調べ先\n- Apex Developer Guide「Classes, Objects, and Interfaces」\n- Apex Reference Guide「Map Class」「Decimal Class」「String Class」"},{"id":"G-001","title":"月末・年末をまたぐ日付を予想する","level":1,"type":"predict","skills":["APEX-BASIC-03"],"difficulty":1,"minutes":10,"environment":"none","language":"ja","source":"generated","learned_ids":["Q-001"],"memo_ids":["M-20261114-222005"],"question":"## 問題\n次のコードを匿名実行したとき、①〜⑥の `System.debug` には何が出力されるか答えなさい。\n日付が途中で変わるかどうかに注意し、変数の中身を紙に書きながら追うこと。\n\n```apex\nDate d = Date.newInstance(2026, 1, 31);\nSystem.debug(d.addDays(1).month());        // ①\nSystem.debug(d.addDays(1).day());          // ②\n\nd.addDays(1);\nSystem.debug(d.day());                     // ③\n\nDate e = Date.newInstance(2026, 12, 31);\nSystem.debug(e.addDays(1).year());         // ④\n\nSystem.debug(d.addMonths(1).day());        // ⑤\n\nDate f = Date.newInstance(2028, 2, 28);    // 2028年はうるう年\nSystem.debug(f.addDays(1).month());        // ⑥\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n`addDays` が返すのは新しい Date。元の変数は書き換わるか？\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n`addMonths` で行き先の月に同じ日がないとき、日付はどうなるか。\n\u003c/details>","answer":"## 解答\n| 番号 | 答え | 理由 |\n|---|---|---|\n| ① | `2` | 1月31日の1日後は2月1日 |\n| ② | `1` | 2月**1日** |\n| ③ | `31` | `d.addDays(1);` は結果を受け取っていないので、`d` は1月31日のまま |\n| ④ | `2027` | 12月31日の1日後は翌年の1月1日 |\n| ⑤ | `28` | 2月31日はないので、2月の月末（28日）に合わせる |\n| ⑥ | `2` | 2028年はうるう年なので、2月28日の次は2月29日（まだ2月） |\n\n## 解説\n### ポイント\n- \u003cmark>`addDays` は暦どおりに計算し、月末を越えたら翌月、年末を越えたら翌年に繰り上がる\u003c/mark>\n- \u003cmark>`addDays` も `addMonths` も元の Date を書き換えない\u003c/mark>。変えたいときは `d = d.addDays(1);` と受け取り直す\n- `addMonths` は、行き先の月に同じ日がなければ月末に合わせる\n- うるう年の2月は29日まである。月末の計算を自分でしないで、メソッドに任せる\n\n### よくある間違い\n- ③ を `1` と答える：`d.addDays(1);` の行で `d` が変わったと思い込む\n- ⑤ を `3`（3月3日）と考える：JavaScript の Date のように「あふれた日数を翌月に回す」と勘違いする。Apex の `addMonths` は月末に合わせる\n- ⑥ を `3` と答える：うるう年を忘れる\n\n### 調べ先\n- Apex Reference Guide「Date Class」の `addDays` / `addMonths` / `day` / `month` / `year`"},{"id":"G-002","title":"期間の終了日を求める","level":1,"type":"write","skills":["APEX-BASIC-03","APEX-BASIC-04"],"difficulty":2,"minutes":20,"environment":"org","language":"ja","source":"generated","learned_ids":["Q-001"],"memo_ids":["M-20261114-222005"],"question":"## 問題\n無料お試し期間を管理する処理を作る。開始日と日数から終了日を求め、期間が月をまたぐかどうかを判定するクラスを作りなさい。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n\n- **機能1：終了日を求める**\n  - 開始日と日数を受け取り、終了日を返す\n  - 開始日を1日目として数える（1月20日から3日間なら、終了日は1月22日）\n  - 開始日が `null`、または日数が `null` か 1 未満なら `null` を返す\n- **機能2：月をまたぐか判定する**\n  - 開始日と終了日を受け取り、2つが違う月なら `true`、同じ月なら `false` を返す\n  - 「同じ月」は年も同じときだけ（2026年12月と2027年12月は違う月）\n  - どちらかが `null` なら `false` を返す\n\n日付の繰り上がり（月末・年末）は、自分で数値を足して計算しないこと。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n「1日目が開始日」なので、開始日に足す日数は「日数 − 1」になる。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n使うメソッド：`Date.addDays` / `Date.month` / `Date.year`\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual(Date.newInstance(2026, 2, 2), 実際の値, '何の確認か');\nAssert.isTrue(条件, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | 2026-01-20、14日 | 2026-02-02 |\n| 1 | 2026-12-25、10日 | 2027-01-03 |\n| 1 | 2026-03-01、1日 | 2026-03-01 |\n| 1 | 2026-03-01、0日 | `null` |\n| 1 | `null`、5日 | `null` |\n| 2 | 2026-01-20 と 2026-02-02 | `true` |\n| 2 | 2026-03-01 と 2026-03-31 | `false` |\n| 2 | 2026-12-01 と 2027-12-01 | `true`（年が違う） |\n| 2 | `null` と 2026-03-01 | `false` |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nAssert.areEqual(Date.newInstance(2026, 2, 2), TrialPeriod.endDate(Date.newInstance(2026, 1, 20), 14), '月をまたぐ');\nAssert.areEqual(Date.newInstance(2027, 1, 3), TrialPeriod.endDate(Date.newInstance(2026, 12, 25), 10), '年をまたぐ');\nAssert.areEqual(Date.newInstance(2026, 3, 1), TrialPeriod.endDate(Date.newInstance(2026, 3, 1), 1), '1日なら開始日と同じ');\nAssert.isNull(TrialPeriod.endDate(Date.newInstance(2026, 3, 1), 0), '0日なら null');\nAssert.isNull(TrialPeriod.endDate(null, 5), '開始日が null なら null');\n\nAssert.isTrue(TrialPeriod.crossesMonth(Date.newInstance(2026, 1, 20), Date.newInstance(2026, 2, 2)), '1月と2月');\nAssert.isFalse(TrialPeriod.crossesMonth(Date.newInstance(2026, 3, 1), Date.newInstance(2026, 3, 31)), '同じ3月');\nAssert.isTrue(TrialPeriod.crossesMonth(Date.newInstance(2026, 12, 1), Date.newInstance(2027, 12, 1)), '月が同じでも年が違う');\nAssert.isFalse(TrialPeriod.crossesMonth(null, Date.newInstance(2026, 3, 1)), 'null なら false');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class TrialPeriod {\n    public static Date endDate(Date startDate, Integer days) {\n        if (startDate == null || days == null || days \u003c 1) {\n            return null;\n        }\n        return startDate.addDays(days - 1);\n    }\n\n    public static Boolean crossesMonth(Date startDate, Date endDate) {\n        if (startDate == null || endDate == null) {\n            return false;\n        }\n        return startDate.year() != endDate.year() || startDate.month() != endDate.month();\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>月末・年末の繰り上がりは `addDays` に任せる\u003c/mark>。`Date.newInstance(年, 月, 日 + 13)` のように数値を足すと、月末を自分で処理することになる\n- 「開始日を1日目とする」ので足すのは `days - 1`。期間の計算では、端の日を含むかどうかを最初に決める\n- \u003cmark>`month()` だけを比べると、年が違う同じ月（2026年12月と2027年12月）を「同じ月」と判定してしまう\u003c/mark>。年と月の両方を比べる\n\n### よくある間違い\n- `addDays(days)` と書いて、終了日が1日ずれる（2026-02-03 になる）\n- `startDate.month() != endDate.month()` だけで判定し、表の8行目で失敗する\n- `null` チェックの前に `startDate.addDays` を呼んで `NullPointerException` になる\n\n### 調べ先\n- Apex Reference Guide「Date Class」の `addDays` / `month` / `year` / `newInstance`"},{"id":"G-003","title":"追加・削除のあとの番号を追う","level":1,"type":"predict","skills":["APEX-BASIC-02"],"difficulty":1,"minutes":10,"environment":"none","language":"ja","source":"generated","learned_ids":["Q-002"],"memo_ids":[],"question":"## 問題\n次のコードを匿名実行したとき、①〜⑦の `System.debug` には何が出力されるか答えなさい。\n`add` や `remove` の行のたびに、List の中身と番号を紙に書き直すこと。\n\n```apex\nList\u003cString> tasks = new List\u003cString>{ '洗濯', '掃除', '買い物' };\ntasks.add(0, '料理');\nSystem.debug(tasks.indexOf('掃除'));       // ①\n\ntasks.remove(1);\nSystem.debug(tasks.indexOf('掃除'));       // ②\nSystem.debug(tasks[1]);                    // ③\n\ntasks.add('洗濯');\nSystem.debug(tasks.indexOf('洗濯'));       // ④\n\ntasks.remove(tasks.indexOf('料理'));\nSystem.debug(tasks.indexOf('洗濯'));       // ⑤\nSystem.debug(tasks.indexOf('料理'));       // ⑥\nSystem.debug(tasks.size());                // ⑦\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n番号は要素についた名札ではなく、「今その要素がある位置」。`add` や `remove` のたびに数え直す。\n\u003c/details>","answer":"## 解答\n| 行 | 中身（数字が番号） |\n|---|---|\n| 作った直後 | `[0:洗濯, 1:掃除, 2:買い物]` |\n| `add(0, '料理')` | `[0:料理, 1:洗濯, 2:掃除, 3:買い物]` |\n| `remove(1)` | `[0:料理, 1:掃除, 2:買い物]` |\n| `add('洗濯')` | `[0:料理, 1:掃除, 2:買い物, 3:洗濯]` |\n| `remove(0)`（料理の番号は 0） | `[0:掃除, 1:買い物, 2:洗濯]` |\n\n| 番号 | 答え |\n|---|---|\n| ① | `2` |\n| ② | `1` |\n| ③ | `掃除` |\n| ④ | `3` |\n| ⑤ | `2` |\n| ⑥ | `-1` |\n| ⑦ | `3` |\n\n## 解説\n### ポイント\n- \u003cmark>`add(番号, 要素)` をすると、その番号から後ろの要素が1つずつ後ろにずれる\u003c/mark>（① は元の `1` ではなく `2`）\n- \u003cmark>`remove(番号)` をすると、後ろの要素が1つずつ前にずれる\u003c/mark>（② は `2` から `1` に戻る）\n- `remove(1)` で消えるのは「今1番にある要素」。この時点では `洗濯`（`掃除` ではない）\n- \u003cmark>`indexOf` は見つからないと `-1` を返す\u003c/mark>。エラーにはならない\n\n### よくある間違い\n- `remove(1)` で、最初に1番だった `掃除` が消えると考える\n- ⑤ を、`料理` を消す前の番号 `3` で答える（Q-002 と同じ間違い）\n\n### 調べ先\n- Apex Reference Guide「List Class」の `add` / `remove` / `indexOf` / `size`"},{"id":"G-004","title":"リストから指定した値を取り除く","level":1,"type":"write","skills":["APEX-BASIC-02","APEX-BASIC-01"],"difficulty":2,"minutes":20,"environment":"org","language":"ja","source":"generated","learned_ids":["Q-002"],"memo_ids":[],"question":"## 問題\n入力フォームから受け取った値のリストを整理する処理を作る。指定した値をすべて取り除く機能と、その値がどの位置にあるかを調べる機能を持つクラスを作りなさい。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n\n- **機能1：指定した値をすべて取り除く**\n  - 文字列のリストと取り除く値を受け取り、その値をすべて除いた**新しい**リストを返す\n  - 受け取ったリストは変えない\n  - 大文字・小文字は区別する（`'x'` を取り除くとき、`'X'` は残す）\n  - 受け取ったリストが `null` なら空のリストを返す\n- **機能2：指定した値の位置をすべて調べる**\n  - 文字列のリストと調べる値を受け取り、その値がある位置（0 から数えた番号）をすべて、小さい順のリストで返す\n  - 大文字・小文字は区別する\n  - 見つからない、または受け取ったリストが `null` なら空のリストを返す\n\n取り除く値・調べる値は `null` ではないものとする。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n元のリストの番号を使ってループしながら `remove` すると、消したあとに番号がずれて、連続した値を消し損ねる。「残したいものを新しいリストに入れていく」方が安全。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\nApex の `==` は文字列の大文字・小文字を区別しない。区別するには `String.equals` を使う。\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual('a,b', String.join(実際のリスト, ','), '何の確認か');\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `'a'`, `'x'`, `'x'`, `'b'`, `'x'` から `'x'` | `'a'`, `'b'`（元のリストは5件のまま） |\n| 1 | `'x'`, `'X'` から `'x'` | `'X'` の1件 |\n| 1 | `'a'`, `'b'` から `'z'` | `'a'`, `'b'` |\n| 1 | `null` から `'x'` | 空（0件） |\n| 2 | `'a'`, `'x'`, `'x'`, `'b'`, `'x'` で `'x'` | `1`, `2`, `4` |\n| 2 | `'a'`, `'b'` で `'z'` | 空（0件） |\n| 2 | `null` で `'x'` | 空（0件） |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nList\u003cString> items = new List\u003cString>{ 'a', 'x', 'x', 'b', 'x' };\nList\u003cString> cleaned = ListCleaner.removeAll(items, 'x');\nAssert.areEqual('a,b', String.join(cleaned, ','), 'x をすべて取り除く（連続していても）');\nAssert.areEqual(5, items.size(), '元のリストは変えない');\n\nList\u003cString> mixed = ListCleaner.removeAll(new List\u003cString>{ 'x', 'X' }, 'x');\nAssert.areEqual(1, mixed.size(), '大文字の X は残る');\nAssert.isTrue(mixed[0].equals('X'), '残るのは大文字の X');\n\nAssert.areEqual('a,b', String.join(ListCleaner.removeAll(new List\u003cString>{ 'a', 'b' }, 'z'), ','), 'ない値なら全部残る');\nAssert.areEqual(0, ListCleaner.removeAll(null, 'x').size(), 'null なら空');\n\nAssert.areEqual('1,2,4', String.join(ListCleaner.positionsOf(items, 'x'), ','), 'x の位置');\nAssert.areEqual(0, ListCleaner.positionsOf(new List\u003cString>{ 'a', 'b' }, 'z').size(), '見つからなければ空');\nAssert.areEqual(0, ListCleaner.positionsOf(null, 'x').size(), 'null なら空');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class ListCleaner {\n    public static List\u003cString> removeAll(List\u003cString> items, String target) {\n        List\u003cString> result = new List\u003cString>();\n        if (items == null) {\n            return result;\n        }\n        for (String item : items) {\n            if (!target.equals(item)) {\n                result.add(item);\n            }\n        }\n        return result;\n    }\n\n    public static List\u003cInteger> positionsOf(List\u003cString> items, String target) {\n        List\u003cInteger> result = new List\u003cInteger>();\n        if (items == null) {\n            return result;\n        }\n        for (Integer i = 0; i \u003c items.size(); i++) {\n            if (target.equals(items[i])) {\n                result.add(i);\n            }\n        }\n        return result;\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>番号でループしながら `remove` すると、消したあと後ろの要素が前にずれて、次の要素を飛ばす\u003c/mark>。下のコードは `'x'` が連続していると1つ残る\n\n```apex\n// よくない例：[a, x, x, b, x] → [a, x, b] になる\nfor (Integer i = 0; i \u003c items.size(); i++) {\n    if (items[i] == 'x') {\n        items.remove(i);   // 後ろが前にずれるので、次の x を飛ばす\n    }\n}\n```\n\n- \u003cmark>残したいものを新しいリストに入れていく\u003c/mark>と、番号のずれを気にしなくてよく、元のリストも変えずに済む\n- 機能2 は番号そのものが答えなので、`for (Integer i = 0; ...)` の形でループする。要素だけ要るときは `for (String item : items)` の方が読みやすい\n- `target.equals(item)` の順に書くと、`item` が `null` でもエラーにならない（`target` は `null` ではない前提）\n\n### よくある間違い\n- 元のリストから `remove` してしまい、「元のリストは変えない」を満たさない\n- `==` で比べて、`'X'` まで取り除いてしまう\n- `indexOf` を使って最初の1つしか見つけられない\n\n### 調べ先\n- Apex Reference Guide「List Class」の `add` / `remove` / `size`\n- Apex Reference Guide「String Class」の `equals`\n- Apex Developer Guide「Expression Operators」（`==` が文字列の大文字・小文字を区別しないこと）"},{"id":"G-005","title":"Set の add と remove が返す値を予想する","level":1,"type":"predict","skills":["APEX-BASIC-02"],"difficulty":1,"minutes":10,"environment":"none","language":"ja","source":"generated","learned_ids":["Q-003"],"memo_ids":[],"question":"## 問題\n次のコードを匿名実行したとき、①〜⑨の `System.debug` には何が出力されるか答えなさい。\nメソッドを `System.debug` の中に書くと、そのメソッドが**返した値**が出力される。\n\n```apex\nSet\u003cString> tags = new Set\u003cString>{ 'apex', 'lwc', 'apex' };\nSystem.debug(tags.size());                 // ①\nSystem.debug(tags.add('soql'));            // ②\nSystem.debug(tags.add('lwc'));             // ③\nSystem.debug(tags.size());                 // ④\n\nSystem.debug(tags.remove('flow'));         // ⑤\nSystem.debug(tags.remove('lwc'));          // ⑥\nSystem.debug(tags.add('lwc'));             // ⑦\n\nSystem.debug(tags.add('APEX'));            // ⑧\nSystem.debug(tags.size());                 // ⑨\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n`add` は「追加できたか」、`remove` は「取り除けたか」を Boolean で返す。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\nSet の文字列は大文字・小文字を区別する。\n\u003c/details>","answer":"## 解答\n| 番号 | 答え | Set の中身（この行のあと） |\n|---|---|---|\n| ① | `2` | `{apex, lwc}`（作るときに重複が消える） |\n| ② | `true` | `{apex, lwc, soql}` |\n| ③ | `false` | 変わらない（`lwc` はもう入っている） |\n| ④ | `3` | `{apex, lwc, soql}` |\n| ⑤ | `false` | 変わらない（`flow` は入っていない） |\n| ⑥ | `true` | `{apex, soql}` |\n| ⑦ | `true` | `{apex, soql, lwc}`（⑥ で消えたので、また入る） |\n| ⑧ | `true` | `{apex, soql, lwc, APEX}` |\n| ⑨ | `4` | |\n\n## 解説\n### ポイント\n- \u003cmark>Set の `add` は、追加できたら `true`、もう入っていたら `false` を返す\u003c/mark>\n- \u003cmark>Set の `remove` も、取り除けたら `true`、入っていなかったら `false` を返す\u003c/mark>\n- 戻り値は「その時点で」の結果。⑦ は ③ と同じ `add('lwc')` だが、⑥ で取り除いたあとなので `true`\n- Set の文字列は大文字・小文字を区別するので、`'APEX'` は `'apex'` と別の値として入る（⑧）\n- List の `add` は何も返さない（`void`）。同じ名前でも、型ごとに戻り値を Reference Guide の Return Value で確かめる\n\n### よくある間違い\n- ③ を `lwc` や `3` と答える：`add` が「追加した値」や「件数」を返すと思う\n- ⑦ を `false` と答える：③ の結果をそのまま覚えていて、⑥ で消えたことを忘れる\n- ⑧ を `false` と答える：大文字・小文字を区別しないと思う\n\n### 調べ先\n- Apex Reference Guide「Set Class」の `add` / `remove` / `size`（Return Value の欄）"},{"id":"G-006","title":"重複して届いた受付番号を見つける","level":1,"type":"write","skills":["APEX-BASIC-02","APEX-BASIC-01"],"difficulty":2,"minutes":20,"environment":"org","language":"ja","source":"generated","learned_ids":["Q-003"],"memo_ids":[],"question":"## 問題\n外部システムから届いた受付番号の中に、同じ番号が何度か入っていることがある。重複した番号を見つけるクラスを作りなさい。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n\n- **機能1：重複した番号の一覧を返す**\n  - 受付番号（文字列）のリストを受け取り、2回以上出てくる番号を返す\n  - 同じ番号は1回だけ入れる。並び順は「2回目が出てきた順」\n  - 受け取ったリストが `null` なら空のリストを返す\n- **機能2：重複があるかどうかを判定する**\n  - 受付番号のリストを受け取り、重複が1つでもあれば `true`、なければ `false` を返す\n  - 重複が見つかった時点で調べるのをやめる\n  - 受け取ったリストが `null` か空なら `false` を返す\n\nどちらの機能も、「もう入っているか」を確かめるメソッドを別に呼ばずに、**追加した結果**で判断すること。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\nこれまでに見た番号を Set に入れていく。Set に追加したときの戻り値で、初めてかどうかがわかる。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n機能1 で同じ番号を2回入れないためには、「もう一覧に入れた番号」も別の Set で覚えておく。\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual('A1,B2', String.join(実際のリスト, ','), '何の確認か');\nAssert.isTrue(条件, '何の確認か');\nAssert.isFalse(条件, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `'A1'`, `'B2'`, `'A1'`, `'C3'`, `'B2'`, `'A1'` | `'A1'`, `'B2'` |\n| 1 | `'C3'`, `'A1'`, `'A1'`, `'C3'` | `'A1'`, `'C3'`（2回目が出てきた順） |\n| 1 | `'A1'`, `'B2'` | 空（0件） |\n| 1 | `null` | 空（0件） |\n| 2 | `'A1'`, `'B2'`, `'A1'` | `true` |\n| 2 | `'A1'`, `'B2'` | `false` |\n| 2 | 空のリスト | `false` |\n| 2 | `null` | `false` |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nList\u003cString> codes = new List\u003cString>{ 'A1', 'B2', 'A1', 'C3', 'B2', 'A1' };\nAssert.areEqual('A1,B2', String.join(DuplicateFinder.duplicates(codes), ','), '重複した番号を1回ずつ');\nAssert.areEqual('A1,C3', String.join(DuplicateFinder.duplicates(new List\u003cString>{ 'C3', 'A1', 'A1', 'C3' }), ','), '2回目が出てきた順');\nAssert.areEqual(0, DuplicateFinder.duplicates(new List\u003cString>{ 'A1', 'B2' }).size(), '重複なし');\nAssert.areEqual(0, DuplicateFinder.duplicates(null).size(), 'null なら空');\n\nAssert.isTrue(DuplicateFinder.hasDuplicate(new List\u003cString>{ 'A1', 'B2', 'A1' }), '重複あり');\nAssert.isFalse(DuplicateFinder.hasDuplicate(new List\u003cString>{ 'A1', 'B2' }), '重複なし');\nAssert.isFalse(DuplicateFinder.hasDuplicate(new List\u003cString>()), '空なら false');\nAssert.isFalse(DuplicateFinder.hasDuplicate(null), 'null なら false');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class DuplicateFinder {\n    public static List\u003cString> duplicates(List\u003cString> codes) {\n        List\u003cString> result = new List\u003cString>();\n        if (codes == null) {\n            return result;\n        }\n        Set\u003cString> seen = new Set\u003cString>();\n        Set\u003cString> reported = new Set\u003cString>();\n        for (String code : codes) {\n            // seen に入れられなかった = 2回目以降。reported に入れられた = 一覧にはまだない\n            if (!seen.add(code) && reported.add(code)) {\n                result.add(code);\n            }\n        }\n        return result;\n    }\n\n    public static Boolean hasDuplicate(List\u003cString> codes) {\n        if (codes == null) {\n            return false;\n        }\n        Set\u003cString> seen = new Set\u003cString>();\n        for (String code : codes) {\n            if (!seen.add(code)) {\n                return true;\n            }\n        }\n        return false;\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>`seen.add(code)` が `false` を返したら、その番号は前に出てきている\u003c/mark>。`contains` で確かめてから `add` する2行が、1行になる\n- `&&` は左が `false` なら右を実行しない。`!seen.add(code)` が `false`（初めての番号）のときは `reported.add` が呼ばれないので、`reported` には重複した番号だけが入る\n- 結果の並び順に決まりがあるので、返すのは List。Set は並び順を保証しない\n- 機能2 は `return true;` でループを途中で抜ける。全部調べる必要はない\n\n### よくある間違い\n- 重複した番号を `result.add` だけで入れて、3回出てくる `'A1'` が2回入る\n- 結果を Set で返して、並び順が表と合わない\n- 空のリストを渡すとループが回らないので、最後の `return false;` を書き忘れるとコンパイルエラーになる\n\n### 調べ先\n- Apex Reference Guide「Set Class」の `add`（Return Value の欄）\n- Apex Developer Guide「Expression Operators」の `&&`（左が false なら右を評価しない）"},{"id":"G-007","title":"Map の put が返す値と上書きを予想する","level":1,"type":"predict","skills":["APEX-BASIC-02"],"difficulty":1,"minutes":10,"environment":"none","language":"ja","source":"generated","learned_ids":["Q-004"],"memo_ids":[],"question":"## 問題\n次のコードを匿名実行したとき、①〜⑦の `System.debug` には何が出力されるか答えなさい。\n最後の ⑧ の行は、実行するとどうなるかを答えなさい。\n\n```apex\nMap\u003cString, Integer> score = new Map\u003cString, Integer>();\nSystem.debug(score.put('佐藤', 70));       // ①\nSystem.debug(score.put('鈴木', 85));       // ②\nSystem.debug(score.put('佐藤', 90));       // ③\nSystem.debug(score.size());               // ④\nSystem.debug(score.get('佐藤'));           // ⑤\n\nscore.put('鈴木', score.get('鈴木') + 5);\nSystem.debug(score.get('鈴木'));           // ⑥\nSystem.debug(score.get('田中'));           // ⑦\n\nscore.put('田中', score.get('田中') + 5);    // ⑧\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n`put` は、そのキーに**前に入っていた値**を返す。前に何もなければ何が返るか。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n`get` はキーがないと `null` を返す。`null + 5` は計算できるか。\n\u003c/details>","answer":"## 解答\n| 番号 | 答え | Map の中身（この行のあと） |\n|---|---|---|\n| ① | `null` | `{佐藤=70}`（佐藤は初めて） |\n| ② | `null` | `{佐藤=70, 鈴木=85}` |\n| ③ | `70` | `{佐藤=90, 鈴木=85}`（上書きされる前の値が返る） |\n| ④ | `2` | キーは佐藤と鈴木の2つのまま |\n| ⑤ | `90` | |\n| ⑥ | `90` | 85 + 5 で上書き |\n| ⑦ | `null` | 田中はキーにない |\n| ⑧ | **`NullPointerException`**（実行時エラー） | `score.get('田中')` が `null` なので `null + 5` で落ちる |\n\n## 解説\n### ポイント\n- \u003cmark>同じキーで `put` すると、古い値は消えて新しい値に置き換わる\u003c/mark>。キーの数は増えない\n- \u003cmark>`put` の戻り値は、上書きされる前の古い値。初めてのキーなら `null`\u003c/mark>\n- 足して入れ直すときは、\u003cmark>`get` で取り出して足してから `put` し直す\u003c/mark>（⑥）\n- キーがないときに `get` の結果に足すと `NullPointerException`。`containsKey` で確かめるか、`(score.get('田中') ?? 0) + 5` のように `null` のときの値を決めておく\n\n### よくある間違い\n- ③ を `90` と答える：`put` が「入れた値」を返すと思う\n- ④ を `3` と答える：同じキーでも別に追加されると思う\n- ⑧ を「田中が 5 で入る」と答える：`null` が 0 として扱われると思う\n\n### 調べ先\n- Apex Reference Guide「Map Class」の `put` / `get` / `size` / `containsKey`\n- Apex Developer Guide「Safe Navigation Operator」と「Null Coalescing Operator」"},{"id":"G-008","title":"担当者ごとに売上を合計し、目標を登録する","level":1,"type":"write","skills":["APEX-BASIC-02","APEX-BASIC-01"],"difficulty":2,"minutes":25,"environment":"org","language":"ja","source":"generated","learned_ids":["Q-004"],"memo_ids":[],"question":"## 問題\n営業チームの売上を担当者ごとにまとめ、担当者ごとの目標額を登録するクラスを作りなさい。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n\n- **機能1：担当者ごとの合計を求める**\n  - 担当者名のリストと、同じ順番で並んだ金額（整数）のリストの2つを受け取り、担当者名ごとの合計金額を返す（担当者名から合計を引ける形にする）\n  - 金額が `null` のものは 0 として足す\n  - どちらかのリストが `null`、または2つのリストの件数が違うときは、空の結果（0人）を返す\n- **機能2：目標額を登録する**\n  - 「担当者名ごとの目標額」と、担当者名・新しい目標額を受け取り、その担当者の目標額を登録（または上書き）する\n  - 上書きしたときは**前の目標額**を、初めての登録なら `null` を返す\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n機能1 は「まだキーがなければその金額を入れる、あれば今の値に足して入れ直す」を繰り返す。2つのリストを同じ番号で読むので、番号を使うループにする。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n機能2 は1行で書ける。Map に値を入れるメソッドが何を返すかを、Reference Guide の Return Value で確かめる。\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | 担当者 `'佐藤'`, `'鈴木'`, `'佐藤'`, `'田中'`, `'佐藤'`／金額 `100`, `200`, `300`, `50`, `null` | 佐藤 400、鈴木 200、田中 50（3人） |\n| 1 | 担当者 `'佐藤'`, `'鈴木'`／金額 `100` | 0人（件数が違う） |\n| 1 | 担当者 `null`／金額 `100` | 0人 |\n| 2 | 空の目標に 佐藤 1000 を登録 | `null` を返す |\n| 2 | 続けて 佐藤 1200 を登録 | `1000` を返す。佐藤の目標は 1200 |\n| 2 | 続けて 鈴木 800 を登録 | `null` を返す。目標は2人分 |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nList\u003cString> names = new List\u003cString>{ '佐藤', '鈴木', '佐藤', '田中', '佐藤' };\nList\u003cInteger> amounts = new List\u003cInteger>{ 100, 200, 300, 50, null };\nMap\u003cString, Integer> totals = SalesSummary.totalByPerson(names, amounts);\nAssert.areEqual(400, totals.get('佐藤'), '佐藤は 100 + 300 + 0');\nAssert.areEqual(200, totals.get('鈴木'), '鈴木は 200');\nAssert.areEqual(50, totals.get('田中'), '田中は 50');\nAssert.areEqual(3, totals.size(), '3人');\n\nAssert.areEqual(0, SalesSummary.totalByPerson(new List\u003cString>{ '佐藤', '鈴木' }, new List\u003cInteger>{ 100 }).size(), '件数が違えば空');\nAssert.areEqual(0, SalesSummary.totalByPerson(null, new List\u003cInteger>{ 100 }).size(), 'null なら空');\n\nMap\u003cString, Integer> targets = new Map\u003cString, Integer>();\nAssert.isNull(SalesSummary.setTarget(targets, '佐藤', 1000), '初めての登録は null');\nAssert.areEqual(1000, SalesSummary.setTarget(targets, '佐藤', 1200), '上書きしたら前の目標額');\nAssert.areEqual(1200, targets.get('佐藤'), '目標は上書きされている');\nAssert.isNull(SalesSummary.setTarget(targets, '鈴木', 800), '鈴木は初めて');\nAssert.areEqual(2, targets.size(), '目標は2人分');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class SalesSummary {\n    public static Map\u003cString, Integer> totalByPerson(List\u003cString> names, List\u003cInteger> amounts) {\n        Map\u003cString, Integer> totals = new Map\u003cString, Integer>();\n        if (names == null || amounts == null || names.size() != amounts.size()) {\n            return totals;\n        }\n        for (Integer i = 0; i \u003c names.size(); i++) {\n            Integer amount = amounts[i] == null ? 0 : amounts[i];\n            if (totals.containsKey(names[i])) {\n                totals.put(names[i], totals.get(names[i]) + amount);\n            } else {\n                totals.put(names[i], amount);\n            }\n        }\n        return totals;\n    }\n\n    public static Integer setTarget(Map\u003cString, Integer> targets, String name, Integer amount) {\n        return targets.put(name, amount);\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>同じキーで `put` すると上書きになる\u003c/mark>。足したいときは `get` で今の値を取り出し、足してから `put` し直す\n- \u003cmark>`put` は上書きされる前の値（初めてなら `null`）を返す\u003c/mark>ので、機能2 は `return targets.put(name, amount);` の1行で済む\n- 2つのリストを同じ番号で読むときは、先に件数が同じかを確かめる。違うと `amounts[i]` で `ListException`（範囲外）になる\n- 機能2 で受け取った Map に `put` すると、呼び出し元の Map も変わる（同じ Map を指しているため）。確認コードの `targets.get('佐藤')` が 1200 になるのはこのため\n\n### よくある間違い\n- `totals.put(names[i], amounts[i]);` だけを書いて、佐藤が最後の金額で上書きされる\n- 機能2 で `get` してから `put` する2段階に分け、前の値を返し忘れる\n- 金額が `null` のまま足して `NullPointerException` になる\n\n### 別解\nnull 合体演算子 `??` を使うと、機能1 のループの中身を短くできる。\n\n```apex\nInteger amount = amounts[i] ?? 0;\ntotals.put(names[i], (totals.get(names[i]) ?? 0) + amount);\n```\n\n### 調べ先\n- Apex Reference Guide「Map Class」の `put`（Return Value の欄）/ `get` / `containsKey`\n- Apex Developer Guide「Null Coalescing Operator」"},{"id":"G-009","title":"キャストの位置で変わる割り算の結果を予想する","level":1,"type":"predict","skills":["APEX-BASIC-01"],"difficulty":1,"minutes":10,"environment":"none","language":"ja","source":"generated","learned_ids":["Q-005"],"memo_ids":[],"question":"## 問題\n次のコードを匿名実行したとき、①〜⑧の `System.debug` には何が出力されるか答えなさい。\nそれぞれの式で、**どの順番で**、**どの型で**計算されるかを考えること。\n\n```apex\nInteger total = 10;\nInteger count = 4;\nSystem.debug(total / count);                              // ①\nSystem.debug((Decimal) total / count);                    // ②\nSystem.debug((Decimal) (total / count));                  // ③\nSystem.debug(total / (Decimal) count);                    // ④\n\nDecimal rate = total / count;\nSystem.debug(rate);                                       // ⑤\n\nSystem.debug(((Decimal) 7 / 3).setScale(2));              // ⑥\n\nInteger passed = 3;\nInteger all = 8;\nSystem.debug(((Decimal) passed / all * 100).setScale(1)); // ⑦\nSystem.debug(passed / all * 100);                         // ⑧\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\nInteger どうしの割り算は、小数を切り捨てた Integer になる。どちらか一方が Decimal なら Decimal で計算する。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n`(Decimal)` は、すぐ右にある1つの値（またはカッコの中身）だけにかかる。`*` と `/` は左から順に計算する。\n\u003c/details>","answer":"## 解答\n| 番号 | 答え | 計算の順番 |\n|---|---|---|\n| ① | `2` | 10 / 4 を Integer で → 2（.5 は切り捨て） |\n| ② | `2.5` | 10 を Decimal に → 10 / 4 を Decimal で |\n| ③ | `2` | 先に 10 / 4 = 2（Integer）→ それを Decimal に |\n| ④ | `2.5` | 割る数が Decimal なので Decimal で計算 |\n| ⑤ | `2` | 右側が Integer で計算されて 2 → それが Decimal の変数に入る |\n| ⑥ | `2.33` | 7 / 3 を Decimal で → 2.333… → 小数第2位までにそろえる |\n| ⑦ | `37.5` | 3 / 8 を Decimal で 0.375 → × 100 で 37.5 |\n| ⑧ | `0` | 3 / 8 を Integer で → 0 → × 100 でも 0 |\n\n## 解説\n### ポイント\n- \u003cmark>Integer どうしの割り算は、小数が切り捨てられる\u003c/mark>（①・⑧）\n- \u003cmark>キャストは割り算の**前**に、割られる数か割る数にかける\u003c/mark>（②・④）。\u003cmark>割り算をカッコで囲んでからキャストしても、切り捨てたあとなので遅い\u003c/mark>（③）\n- \u003cmark>左側の変数が Decimal でも、右側は Integer のまま計算される\u003c/mark>（⑤）\n- 割合（%）は「割ってから 100 をかける」順番だと、Integer では 0 になりやすい（⑧）。Decimal にしてから割る\n\n### よくある間違い\n- ③ を `2.5` と答える：`(Decimal)` を付ければ、どこに書いても小数になると思う\n- ⑤ を `2.5` と答える：入れる先の型に合わせて計算されると思う\n- ⑧ を `37` と答える：先に 100 をかけると思う（実際は左から順に `/` が先）\n\n### 調べ先\n- Apex Developer Guide「Expression Operators」「Understanding Rules of Conversion」\n- Apex Reference Guide「Decimal Class」の `setScale`"},{"id":"G-010","title":"合格率と平均点を小数で求める","level":1,"type":"write","skills":["APEX-BASIC-01","APEX-BASIC-02"],"difficulty":2,"minutes":20,"environment":"org","language":"ja","source":"generated","learned_ids":["Q-005"],"memo_ids":[],"question":"## 問題\n社内試験の結果をまとめる処理を作る。合格率（%）と平均点を、小数第1位まで求めるクラスを作りなさい。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n\n- **機能1：合格率を求める**\n  - 合格者数と受験者数（どちらも整数）を受け取り、合格率（%）を返す\n  - 小数第2位を四捨五入して、小数第1位までにする（6.25 → 6.3）\n  - 受験者数が 0、またはどちらかが `null` なら `null` を返す\n- **機能2：平均点を求める**\n  - 点数（整数）のリストを受け取り、平均点を返す\n  - 小数第2位を四捨五入して、小数第1位までにする\n  - リストが `null` か空なら `null` を返す\n\n結果は小数を持てる型で返すこと。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\nInteger どうしで割ると小数が消える。割り算の**前**に、どちらかを Decimal にする。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n`setScale` は、2つ目の引数で丸め方を指定できる。四捨五入は `RoundingMode.HALF_UP`。\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual(37.5, 実際の値, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | 合格 3 人／受験 8 人 | `37.5` |\n| 1 | 合格 2 人／受験 3 人 | `66.7` |\n| 1 | 合格 1 人／受験 16 人 | `6.3`（6.25 を四捨五入） |\n| 1 | 合格 0 人／受験 5 人 | `0.0` |\n| 1 | 合格 0 人／受験 0 人 | `null` |\n| 2 | `70`, `85`, `92` | `82.3`（247 / 3 = 82.33…） |\n| 2 | `1`, `1`, `1`, `2` | `1.3`（5 / 4 = 1.25 を四捨五入） |\n| 2 | 空のリスト | `null` |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nAssert.areEqual(37.5, ExamStats.passRate(3, 8), '3 / 8 = 37.5%');\nAssert.areEqual(66.7, ExamStats.passRate(2, 3), '2 / 3 = 66.66…%');\nAssert.areEqual(6.3, ExamStats.passRate(1, 16), '6.25 は四捨五入で 6.3');\nAssert.areEqual(0.0, ExamStats.passRate(0, 5), '0人なら 0.0');\nAssert.isNull(ExamStats.passRate(0, 0), '受験者 0 なら null');\n\nAssert.areEqual(82.3, ExamStats.average(new List\u003cInteger>{ 70, 85, 92 }), '247 / 3');\nAssert.areEqual(1.3, ExamStats.average(new List\u003cInteger>{ 1, 1, 1, 2 }), '1.25 は四捨五入で 1.3');\nAssert.isNull(ExamStats.average(new List\u003cInteger>()), '空なら null');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class ExamStats {\n    public static Decimal passRate(Integer passed, Integer total) {\n        if (passed == null || total == null || total == 0) {\n            return null;\n        }\n        return ((Decimal) passed / total * 100).setScale(1, RoundingMode.HALF_UP);\n    }\n\n    public static Decimal average(List\u003cInteger> scores) {\n        if (scores == null || scores.isEmpty()) {\n            return null;\n        }\n        Integer sum = 0;\n        for (Integer score : scores) {\n            sum += score;\n        }\n        return ((Decimal) sum / scores.size()).setScale(1, RoundingMode.HALF_UP);\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>割り算の前にどちらかを Decimal にする\u003c/mark>。`(Decimal) passed / total` は「passed を Decimal にしてから割る」\n- \u003cmark>`(passed / total * 100)` のように Integer のまま計算すると、3 / 8 の時点で 0 になる\u003c/mark>。あとから Decimal にしても戻らない\n- 戻り値の型を Decimal にしても、中の計算が Integer なら小数は消える（Q-005 の「左側の型は助けにならない」と同じ）\n- \u003cmark>四捨五入を指定するときは `setScale(1, RoundingMode.HALF_UP)`\u003c/mark>。\u003cmark>丸め方を書かない `setScale(1)` は「偶数丸め」（`HALF_EVEN`）\u003c/mark>で、6.25 → 6.2、1.25 → 1.2 のように、ちょうど 5 のときに四捨五入と結果が変わる\n- 受験者数が 0 のまま割ると `MathException`（0 で割った）になるので、先に確かめる\n\n### よくある間違い\n- `(Decimal) (passed / total) * 100` と書いて、`0.0` になる\n- `setScale(1)` だけを書いて、1 / 16 が `6.2`、平均の 1.25 が `1.2` になる\n- 平均で `scores.size()` が 0 のときを確かめず、`MathException` になる\n\n### 調べ先\n- Apex Developer Guide「Understanding Rules of Conversion」\n- Apex Reference Guide「Decimal Class」の `setScale`\n- Apex Reference Guide「RoundingMode Enum」"},{"id":"G-011","title":"size と length のどちらが使えるかを見分ける","level":1,"type":"predict","skills":["APEX-BASIC-02","APEX-BASIC-03"],"difficulty":1,"minutes":10,"environment":"none","language":"ja","source":"generated","learned_ids":["Q-006"],"memo_ids":[],"question":"## 問題\n次の変数があるとき、①〜⑩の式を `System.debug(式);` で出力すると何が出るか答えなさい。\nコンパイルエラーになる（保存・実行できない）ものは「エラー」と答えること。\n\n```apex\nList\u003cString> names = new List\u003cString>{ 'Apex', 'LWC', 'SOQL' };\nSet\u003cInteger> ids = new Set\u003cInteger>{ 1, 2, 2, 3 };\nMap\u003cString, Integer> stock = new Map\u003cString, Integer>{ 'a' => 1, 'b' => 2 };\nString word = 'Salesforce';\n```\n\n| 番号 | 式 |\n|---|---|\n| ① | `names.size()` |\n| ② | `names[0].length()` |\n| ③ | `ids.size()` |\n| ④ | `stock.size()` |\n| ⑤ | `word.length()` |\n| ⑥ | `names.length()` |\n| ⑦ | `word.size()` |\n| ⑧ | `names.isEmpty()` |\n| ⑨ | `new List\u003cString>().size()` |\n| ⑩ | `stock.keySet().size()` |\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\nその式の左側が何の型かを先に決める。`names[0]` は List か、それとも String か。\n\u003c/details>","answer":"## 解答\n| 番号 | 答え | 理由 |\n|---|---|---|\n| ① | `3` | List の件数 |\n| ② | `4` | `names[0]` は String の `'Apex'`。その文字数 |\n| ③ | `3` | 作るときに重複の `2` が消えて `{1, 2, 3}` |\n| ④ | `2` | キーの数 |\n| ⑤ | `10` | `'Salesforce'` の文字数 |\n| ⑥ | **エラー** | List に `length()` はない |\n| ⑦ | **エラー** | String に `size()` はない |\n| ⑧ | `false` | 3件入っている |\n| ⑨ | `0` | 空の List |\n| ⑩ | `2` | `keySet()` は Set を返すので `size()` が使える |\n\n## 解説\n### ポイント\n- \u003cmark>List・Set・Map の件数は `size()`、String の文字数は `length()`\u003c/mark>\n- \u003cmark>どちらを使うかは、変数の名前ではなく**式の左側の型**で決まる\u003c/mark>。`names` は List だが、`names[0]` は String（②）\n- `keySet()` や `values()` のように、コレクションを返すメソッドの結果にも `size()` が使える（⑩）\n- JavaScript（LWC）では配列も文字列も `.length`（カッコなし）。Apex と行き来すると混ざりやすい\n\n### よくある間違い\n- ② を `3` と答える：`names` の件数を数えてしまう\n- ⑥ を `3` と答える：JavaScript の感覚で List にも `length` があると思う\n- ③ を `4` と答える：Set が重複を消すことを忘れる\n\n### 調べ先\n- Apex Reference Guide「List Class」「Set Class」「Map Class」の `size` / `isEmpty` / `keySet`\n- Apex Reference Guide「String Class」の `length`"},{"id":"G-012","title":"言葉のリストの文字数を調べる","level":1,"type":"write","skills":["APEX-BASIC-02","APEX-BASIC-03"],"difficulty":2,"minutes":20,"environment":"org","language":"ja","source":"generated","learned_ids":["Q-006"],"memo_ids":[],"question":"## 問題\n入力されたキーワードのリストについて、文字数を調べるクラスを作りなさい。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n\n- **機能1：一番長い言葉の文字数を求める**\n  - 文字列のリストを受け取り、一番長い言葉の文字数を返す\n  - `null` の要素は数えない（空文字 `''` は 0 文字として扱う）\n  - リストが `null` か空なら `0` を返す\n- **機能2：指定した文字数以上の言葉が何件あるかを「件数/全体」の形で返す**\n  - 文字列のリストと文字数を受け取り、その文字数以上の言葉の件数と、リスト全体の件数を `'2/5'` のような文字列で返す\n  - 全体の件数には `null` の要素も含める。`null` の要素は「文字数以上」には数えない\n  - リストが `null` なら `'0/0'` を返す\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n「件数」と「文字数」で、使うメソッドが違う。どの変数が List で、どの変数が String かを確かめながら書く。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n`null` の要素に `length()` を呼ぶと `NullPointerException` になる。先に `null` かどうかを確かめる。\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `'Apex'`, `'LWC'`, `'Salesforce'`, `null`, `''` | `10` |\n| 1 | `''`, `null` | `0` |\n| 1 | `null` | `0` |\n| 2 | `'Apex'`, `'LWC'`, `'Salesforce'`, `null`, `''` で 4 文字以上 | `'2/5'` |\n| 2 | `'Apex'`, `'LWC'` で 1 文字以上 | `'2/2'` |\n| 2 | `null` で 4 文字以上 | `'0/0'` |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nList\u003cString> words = new List\u003cString>{ 'Apex', 'LWC', 'Salesforce', null, '' };\nAssert.areEqual(10, KeywordStats.maxLength(words), 'Salesforce が10文字');\nAssert.areEqual(0, KeywordStats.maxLength(new List\u003cString>{ '', null }), '空文字と null だけなら 0');\nAssert.areEqual(0, KeywordStats.maxLength(null), 'null なら 0');\n\nAssert.areEqual('2/5', KeywordStats.countAtLeast(words, 4), 'Apex と Salesforce の2件、全体は5件');\nAssert.areEqual('2/2', KeywordStats.countAtLeast(new List\u003cString>{ 'Apex', 'LWC' }, 1), '全部1文字以上');\nAssert.areEqual('0/0', KeywordStats.countAtLeast(null, 4), 'null なら 0/0');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class KeywordStats {\n    public static Integer maxLength(List\u003cString> words) {\n        Integer max = 0;\n        if (words == null) {\n            return max;\n        }\n        for (String word : words) {\n            if (word != null && word.length() > max) {\n                max = word.length();\n            }\n        }\n        return max;\n    }\n\n    public static String countAtLeast(List\u003cString> words, Integer minLength) {\n        if (words == null) {\n            return '0/0';\n        }\n        Integer count = 0;\n        for (String word : words) {\n            if (word != null && word.length() >= minLength) {\n                count++;\n            }\n        }\n        return count + '/' + words.size();\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>`words` は List なので件数は `words.size()`、`word` は String なので文字数は `word.length()`\u003c/mark>。1つのメソッドの中で両方を使い分ける\n- ループの変数（`word`）と元のリスト（`words`）の名前が似ているので、どちらの型かを意識する。名前を `keyword` と `keywords` のようにはっきり分けてもよい\n- \u003cmark>`word != null && word.length()` の順に書くと、`null` のときは右側が実行されない\u003c/mark>ので落ちない\n- `count + '/' + words.size()` は、左から順に文字列としてつながる（Integer + String は String になる）\n\n### よくある間違い\n- `words.length()` と書いてコンパイルエラーになる（Q-006 と同じ）\n- `word.size()` と書いてコンパイルエラーになる\n- 全体の件数を数えるときに `null` を除いてしまい、`'2/4'` になる\n\n### 調べ先\n- Apex Reference Guide「List Class」の `size`\n- Apex Reference Guide「String Class」の `length`"},{"id":"G-013","title":"文字列と数値の + の順番を予想する","level":1,"type":"predict","skills":["APEX-BASIC-01"],"difficulty":1,"minutes":10,"environment":"none","language":"ja","source":"generated","memo_ids":["M-20261114-222005"],"learned_ids":[],"question":"## 問題\n次のコードを匿名実行したとき、①〜⑪の `System.debug` には何が出力されるか答えなさい。\n⑧ はコメントを外すとどうなるか、⑫ は実行するとどうなるかを答えなさい。\n\n```apex\nInteger a = 7;\nInteger b = 2;\nString unit = '個';\nSystem.debug('合計: ' + a + b);            // ①\nSystem.debug('合計: ' + (a + b));          // ②\nSystem.debug(a + b + unit);               // ③\nSystem.debug(a + unit + b);               // ④\nSystem.debug('' + a + b);                 // ⑤\nSystem.debug(a + b + '' + a + b);         // ⑥\nSystem.debug('差: ' + (a - b));            // ⑦\n// System.debug('差: ' + a - b);           // ⑧\n\nInteger n;\nBoolean flag;\nSystem.debug(n);                          // ⑨\nSystem.debug(flag);                       // ⑩\nSystem.debug('件数: ' + n);                // ⑪\nSystem.debug(n + 1);                      // ⑫\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n`+` は左から2つずつ計算する。その2つのどちらかが文字列なら連結、両方が数値なら足し算になる。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n何も入れていない変数には何が入っているか。それを文字列につなぐとどう表示されるか。\n\u003c/details>","answer":"## 解答\n| 番号 | 答え | 計算の順番 |\n|---|---|---|\n| ① | `合計: 72` | `'合計: ' + 7` → `'合計: 7'`（文字列）→ `+ 2` で `'合計: 72'` |\n| ② | `合計: 9` | カッコの中が先：`7 + 2 = 9` → `'合計: ' + 9` |\n| ③ | `9個` | `7 + 2 = 9`（数値）→ `9 + '個'` |\n| ④ | `7個2` | `7 + '個'` → `'7個'`（文字列）→ `+ 2` で `'7個2'` |\n| ⑤ | `72` | `'' + 7` → `'7'`（文字列）→ `+ 2` で `'72'` |\n| ⑥ | `972` | `7 + 2 = 9` → `9 + ''` → `'9'` → `'97'` → `'972'` |\n| ⑦ | `差: 5` | カッコの中が先：`7 - 2 = 5` |\n| ⑧ | **コンパイルエラー** | `'差: ' + 7` → `'差: 7'`（文字列）→ 文字列から `2` は引けない |\n| ⑨ | `null` | 何も入れていない Integer は `null` |\n| ⑩ | `null` | Boolean も、何も入れなければ `false` ではなく `null` |\n| ⑪ | `件数: null` | `null` を文字列につなぐと `null` という文字になる |\n| ⑫ | **`NullPointerException`**（実行時エラー） | `null + 1` は計算できない |\n\n## 解説\n### ポイント\n- \u003cmark>`+` は左から順に2つずつ計算し、一度文字列になると、そのあとはずっと文字列の連結になる\u003c/mark>（①・④・⑤・⑥）\n- \u003cmark>文字列の前で合計を出したいときは、足し算をカッコで囲む\u003c/mark>（`'合計: ' + (a + b)`）\n- 先頭が数値どうしなら、文字列が出てくるまでは足し算（③・⑥の最初の `7 + 2`）\n- `-` には連結の意味がないので、文字列から引こうとするとコンパイルエラー（⑧）。引き算も掛け算もカッコで囲む習慣をつける\n- \u003cmark>初期化していない変数は、Integer でも Boolean でも `null`\u003c/mark>。表示すると `null`、計算に使うと `NullPointerException`\n\n### よくある間違い\n- ① を `合計: 9` と答える：文字列の中でも数値どうしは先に足されると思う\n- ④ を `9個` と答える：数値を前に集めて計算すると思う\n- ⑩ を `false` と答える：Java などの感覚で、Boolean の初期値を `false` と思う\n- ⑪ を `件数: 0` や `件数: ` と答える\n\n### 調べ先\n- Apex Developer Guide「Expression Operators」（`+` の連結と、演算子の順番）\n- Apex Developer Guide「Operator Precedence」\n- Apex Developer Guide「Primitive Data Types」（初期化しない変数は `null`）"},{"id":"G-014","title":"レシートの1行と合計の文字列を作る","level":1,"type":"write","skills":["APEX-BASIC-01","APEX-BASIC-03"],"difficulty":2,"minutes":20,"environment":"org","language":"ja","source":"generated","memo_ids":["M-20261114-222005"],"learned_ids":[],"question":"## 問題\nレジの画面に出す文字列を作る処理を作る。商品ごとの1行と、数量の合計の行を作るクラスを作りなさい。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n\n- **機能1：商品の1行を作る**\n  - 商品名・数量・単価（数量と単価は整数）を受け取り、`'りんご × 3 = 360円'` の形の文字列を返す（金額は 数量 × 単価）\n  - 数量・単価が `null` なら 0 として扱う\n  - 商品名が `null`・空文字・空白だけなら `'（名前なし）'` と表示する\n- **機能2：数量の合計の行を作る**\n  - 数量（整数）のリストを受け取り、`'合計: 9個'` の形の文字列を返す\n  - `null` の要素は数えない\n  - リストが `null` なら `'合計: 0個'` を返す\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n文字列に数値をつなぐとき、計算したい部分が先に計算されるかどうかを確かめる。迷ったらカッコで囲む。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n何も入れていない Integer は `null`。`null` のまま掛け算や足し算をするとエラー、文字列につなぐと `null` と表示される。\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual('りんご × 3 = 360円', 実際の値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `'りんご'`、3、120 | `'りんご × 3 = 360円'` |\n| 1 | `'みかん'`、`null`、80 | `'みかん × 0 = 0円'` |\n| 1 | `null`、2、50 | `'（名前なし） × 2 = 100円'` |\n| 1 | `'  '`、1、`null` | `'（名前なし） × 1 = 0円'` |\n| 2 | 7、2 | `'合計: 9個'` |\n| 2 | 7、`null`、2 | `'合計: 9個'` |\n| 2 | `null` | `'合計: 0個'` |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nAssert.areEqual('りんご × 3 = 360円', ReceiptFormatter.line('りんご', 3, 120), '普通の1行');\nAssert.areEqual('みかん × 0 = 0円', ReceiptFormatter.line('みかん', null, 80), '数量 null は 0');\nAssert.areEqual('（名前なし） × 2 = 100円', ReceiptFormatter.line(null, 2, 50), '名前 null');\nAssert.areEqual('（名前なし） × 1 = 0円', ReceiptFormatter.line('  ', 1, null), '名前が空白だけ・単価 null');\n\nAssert.areEqual('合計: 9個', ReceiptFormatter.total(new List\u003cInteger>{ 7, 2 }), '7 + 2');\nAssert.areEqual('合計: 9個', ReceiptFormatter.total(new List\u003cInteger>{ 7, null, 2 }), 'null は数えない');\nAssert.areEqual('合計: 0個', ReceiptFormatter.total(null), 'null なら 0個');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class ReceiptFormatter {\n    public static String line(String name, Integer quantity, Integer unitPrice) {\n        String label = String.isBlank(name) ? '（名前なし）' : name;\n        Integer qty = quantity == null ? 0 : quantity;\n        Integer price = unitPrice == null ? 0 : unitPrice;\n        return label + ' × ' + qty + ' = ' + (qty * price) + '円';\n    }\n\n    public static String total(List\u003cInteger> quantities) {\n        Integer sum = 0;\n        if (quantities != null) {\n            for (Integer q : quantities) {\n                if (q != null) {\n                    sum += q;\n                }\n            }\n        }\n        return '合計: ' + sum + '個';\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>文字列に数値をつなぐときは、計算したい部分をカッコで囲む\u003c/mark>。`(qty * price)` のカッコは、`*` が `+` より先に計算されるのでなくても動くが、書いておくと読む人が迷わない。足し算や引き算の場合はカッコがないと結果が変わる\n- 機能2 は、合計を先に `sum` に計算してから文字列につなぐ。`'合計: ' + 7 + 2` のように文字列の中で足そうとすると `'合計: 72'` になる\n- \u003cmark>何も入れていない Integer は `null`\u003c/mark>。\u003cmark>`null` を文字列につなぐと `null` と表示され、計算に使うと `NullPointerException` になる\u003c/mark>。だから先に 0 に置き換える\n- 合計用の変数は `Integer sum = 0;` と必ず 0 を入れておく。`Integer sum;` のままだと `sum += q` で落ちる\n\n### よくある間違い\n- `'合計: ' + 7 + 2` の形で作って `'合計: 72個'` になる\n- `Integer sum;` と初期値なしで書いて `NullPointerException` になる\n- 数量 `null` をそのまま使って `'みかん × null = …'` になる、または掛け算で落ちる\n\n### 別解\nnull 合体演算子 `??` を使うと、`null` を 0 に置き換える部分を短く書ける。\n\n```apex\nInteger qty = quantity ?? 0;\nInteger price = unitPrice ?? 0;\n```\n\n### 調べ先\n- Apex Developer Guide「Expression Operators」「Operator Precedence」\n- Apex Developer Guide「Null Coalescing Operator」\n- Apex Reference Guide「String Class」の `isBlank`"},{"id":"G-015","title":"null と空のリスト、落ちるのはどれかを予想する","level":1,"type":"predict","skills":["APEX-BASIC-02","APEX-BASIC-01"],"difficulty":1,"minutes":10,"environment":"none","language":"ja","source":"generated","learned_ids":["Q-007"],"memo_ids":[],"question":"## 問題\nはじめの3行のあとに①〜⑫を**1つずつ別々に**実行したとき、何が出力されるか答えなさい。\nNullPointerException で落ちるものは「エラー」と答える。\n\n```apex\nList\u003cString> nothing = null;\nList\u003cString> empty = new List\u003cString>();\nString blank = null;\n```\n\n```apex\nSystem.debug(nothing == null);                       // ①\nSystem.debug(empty == null);                         // ②\nSystem.debug(empty.isEmpty());                       // ③\nSystem.debug(nothing.isEmpty());                     // ④\nSystem.debug(nothing.size());                        // ⑤\nSystem.debug(nothing == null || nothing.isEmpty());  // ⑥\nSystem.debug(nothing.isEmpty() || nothing == null);  // ⑦\nSystem.debug(nothing != null && nothing.size() > 0); // ⑧\nSystem.debug(String.isBlank(blank));                 // ⑨\nSystem.debug(blank.trim());                          // ⑩\n\n// ⑪ 'ループ' は何回出るか。'終わり' は出るか\nfor (String name : empty) {\n    System.debug('ループ');\n}\nSystem.debug('終わり');\n\n// ⑫ '終わり' は出るか\nfor (String name : nothing) {\n    System.debug('ループ');\n}\nSystem.debug('終わり');\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n`null` は「入れ物そのものがない」状態。ない入れ物のメソッドは呼べない。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n`||` は左が `true` なら右を実行しない。`&&` は左が `false` なら右を実行しない。\n\u003c/details>","answer":"## 解答\n| 番号 | 答え | 理由 |\n|---|---|---|\n| ① | `true` | |\n| ② | `false` | 空のリストは `null` ではない |\n| ③ | `true` | |\n| ④ | エラー | `null` に `isEmpty()` を呼んでいる |\n| ⑤ | エラー | `null` に `size()` を呼んでいる |\n| ⑥ | `true` | 左が `true` なので、右の `isEmpty()` は実行されない |\n| ⑦ | エラー | 先に左の `nothing.isEmpty()` を実行して落ちる |\n| ⑧ | `false` | 左が `false` なので、右の `size()` は実行されない |\n| ⑨ | `true` | `String.isBlank` は `null` を渡しても落ちない |\n| ⑩ | エラー | `null` に `trim()` を呼んでいる |\n| ⑪ | 0回。`終わり` は出る | 空のリストはループが0回回るだけ |\n| ⑫ | 出ない（エラー） | `null` のリストを for で回そうとして落ちる |\n\n## 解説\n### ポイント\n- \u003cmark>`null` の変数に `.` を付けてメソッドを呼ぶと落ちる\u003c/mark>（④⑤⑩）。for で回すのも同じ（⑫）\n- \u003cmark>空のリストは `null` ではない\u003c/mark>。`isEmpty()` も `size()` も使えるし、for はただ0回回る（②③⑪）\n- \u003cmark>`null` の判定は必ず左に書く\u003c/mark>。⑥と⑦は同じ2つの条件で、順番が違うだけ。⑦は左の `isEmpty()` を先に実行するので落ちる\n- `String.isBlank(blank)` は、`blank` を**引数として渡しているだけ**なので落ちない（⑨）。`blank.trim()` は `blank` のメソッドを呼ぶので落ちる（⑩）。L1-04 で `isBlank` を `trim` より前に書いたのはこのため\n\n### よくある間違い\n- ④を `true` と答える：`null` を「空」と同じものだと思う\n- ⑦を `true` と答える：`||` の左右を入れ替えても同じだと思う\n- ⑨をエラーと答える：`null` を使ったら必ず落ちると思う\n\n### 調べ先\n- Apex Reference Guide「List Class」の `isEmpty` / `size`\n- Apex Developer Guide「Expression Operators」の `&&` / `||`（左だけで結果が決まれば右を評価しない）"},{"id":"G-016","title":"抜けのある注文数量を合計し、最大値を求める","level":1,"type":"write","skills":["APEX-BASIC-01","APEX-BASIC-02"],"difficulty":2,"minutes":20,"environment":"org","language":"ja","source":"generated","learned_ids":["Q-007"],"memo_ids":[],"question":"## 問題\n店舗から届いた注文数量の一覧がある。入力漏れの行は数量が `null` になっている。返品はマイナスの数で入る。\n店舗から一覧そのものが届かず、`null` が渡されることもある。注文数量を集計するクラスを作りなさい。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n\n- **機能1：合計を求める**\n  - 注文数量（整数）のリストを受け取り、合計を返す\n  - `null` の要素は数えない\n  - リストが `null` か空なら `0` を返す\n- **機能2：最大値を求める**\n  - 注文数量のリストを受け取り、いちばん大きい数量を返す\n  - `null` の要素は数えない\n  - リストが `null` か空、または要素が全部 `null` なら `null` を返す\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\nまず、リストそのものが `null` かどうかを確かめる。次に、要素ごとに `null` かどうかを確かめる。`null` を足し算に使うと落ちる。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n最大値の最初の値を `0` にすると、全部マイナスのときに答えがずれる。「まだ何も入っていない」を `null` で表して、`最大値 == null || 数量 > 最大値` で入れ替える。\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `3`, `null`, `5`, `2` | `10` |\n| 1 | `-1`, `-4` | `-5` |\n| 1 | 空のリスト | `0` |\n| 1 | `null` | `0` |\n| 2 | `3`, `null`, `5`, `2` | `5` |\n| 2 | `-1`, `-4` | `-1` |\n| 2 | `null`, `null` | `null` |\n| 2 | 空のリスト | `null` |\n| 2 | `null` | `null` |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nList\u003cInteger> quantities = new List\u003cInteger>{ 3, null, 5, 2 };\nList\u003cInteger> returns = new List\u003cInteger>{ -1, -4 };\n\nAssert.areEqual(10, OrderQuantityCalculator.sumQuantities(quantities), 'null を飛ばして合計');\nAssert.areEqual(-5, OrderQuantityCalculator.sumQuantities(returns), 'マイナスも足す');\nAssert.areEqual(0, OrderQuantityCalculator.sumQuantities(new List\u003cInteger>()), '空なら 0');\nAssert.areEqual(0, OrderQuantityCalculator.sumQuantities(null), 'null なら 0');\n\nAssert.areEqual(5, OrderQuantityCalculator.getMaxQuantity(quantities), 'null を飛ばして最大値');\nAssert.areEqual(-1, OrderQuantityCalculator.getMaxQuantity(returns), '全部マイナスでも最大値');\nAssert.isNull(OrderQuantityCalculator.getMaxQuantity(new List\u003cInteger>{ null, null }), '全部 null なら null');\nAssert.isNull(OrderQuantityCalculator.getMaxQuantity(new List\u003cInteger>()), '空なら null');\nAssert.isNull(OrderQuantityCalculator.getMaxQuantity(null), 'null なら null');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class OrderQuantityCalculator {\n    public static Integer sumQuantities(List\u003cInteger> quantities) {\n        Integer totalQuantity = 0;\n        if (quantities == null) {\n            return totalQuantity;\n        }\n        for (Integer quantity : quantities) {\n            if (quantity == null) {\n                continue;\n            }\n            totalQuantity += quantity;\n        }\n        return totalQuantity;\n    }\n\n    public static Integer getMaxQuantity(List\u003cInteger> quantities) {\n        if (quantities == null) {\n            return null;\n        }\n        Integer maxQuantity = null;\n        for (Integer quantity : quantities) {\n            if (quantity == null) {\n                continue;\n            }\n            if (maxQuantity == null || quantity > maxQuantity) {\n                maxQuantity = quantity;\n            }\n        }\n        return maxQuantity;\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>リストの `null` は `== null` で、ループより前に確かめる\u003c/mark>。`quantities.isEmpty()` で確かめると、`null` が渡されたときにそこで落ちる\n- 空のリストは、特別に扱わなくてよい。ループが0回回り、合計は `0`、最大値は `null` のまま返る\n- \u003cmark>要素の `null` も確かめる\u003c/mark>。`totalQuantity += null` は NullPointerException になる\n- `maxQuantity == null || quantity > maxQuantity` は、`null` の判定を左に書いている（G-015 の⑥と同じ考え方）\n\n### よくある間違い\n- `if (quantities.isEmpty())` と書いて、`null` を渡すと落ちる（L1-04 の最初の解答と同じ）\n- 最大値の最初の値を `0` にして、`-1`, `-4` の答えが `0` になる\n- `maxQuantity == null ||` を書き忘れる：Apex では `null` との大小比較は `false` になるので、最大値がずっと `null` のまま\n\n### 調べ先\n- Apex Reference Guide「List Class」の `isEmpty`\n- Apex Developer Guide「Expression Operators」（`||` の評価の順番、`null` との比較）"},{"id":"G-017","title":"大文字・小文字を区別するのはどこかを予想する","level":1,"type":"predict","skills":["APEX-BASIC-02","APEX-BASIC-03"],"difficulty":1,"minutes":10,"environment":"none","language":"ja","source":"generated","learned_ids":["Q-008"],"memo_ids":[],"question":"## 問題\n次のコードを匿名実行したとき、①〜⑫の `System.debug` には何が出力されるか答えなさい。\n\n```apex\nString lower = 'Apex';\nString upper = 'APEX';\nSystem.debug(lower == upper);                 // ①\nSystem.debug(lower != upper);                 // ②\nSystem.debug(lower.equals(upper));            // ③\nSystem.debug(lower.equalsIgnoreCase(upper));  // ④\n\nSet\u003cString> tagSet = new Set\u003cString>{ 'Apex', 'apex', 'APEX', ' apex' };\nSystem.debug(tagSet.size());                  // ⑤\nSystem.debug(tagSet.contains('apex'));        // ⑥\nSystem.debug(tagSet.contains('aPex'));        // ⑦\n\nSet\u003cString> normalizedTagSet = new Set\u003cString>();\nfor (String tag : tagSet) {\n    normalizedTagSet.add(tag.trim().toLowerCase());\n}\nSystem.debug(normalizedTagSet.size());        // ⑧\n\nMap\u003cString, Integer> stockMap = new Map\u003cString, Integer>{ 'Tokyo' => 5 };\nSystem.debug(stockMap.get('Tokyo'));          // ⑨\nSystem.debug(stockMap.get('TOKYO'));          // ⑩\nSystem.debug(stockMap.containsKey('tokyo'));  // ⑪\nstockMap.put('TOKYO', 3);\nSystem.debug(stockMap.size());                // ⑫\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\nString の比べ方は3通りある。`==`、`equals`、`equalsIgnoreCase`。このうち1つだけ、大文字・小文字を区別する。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\nSet の要素と Map のキーは、`equals` と同じように比べる。\n\u003c/details>","answer":"## 解答\n| 番号 | 答え | 理由 |\n|---|---|---|\n| ① | `true` | `==` は大文字・小文字を区別しない |\n| ② | `false` | `!=` も区別しない |\n| ③ | `false` | `equals` は区別する |\n| ④ | `true` | `equalsIgnoreCase` は区別しない |\n| ⑤ | `4` | 4つとも別のものとして入る（`' apex'` は空白もある） |\n| ⑥ | `true` | `'apex'` そのものが入っている |\n| ⑦ | `false` | `'aPex'` は入っていない |\n| ⑧ | `1` | そろえると4つとも `'apex'` になる |\n| ⑨ | `5` | |\n| ⑩ | `null` | `'TOKYO'` というキーはない |\n| ⑪ | `false` | `'tokyo'` というキーもない |\n| ⑫ | `2` | `'Tokyo'` は上書きされず、`'TOKYO'` が別のキーとして増える |\n\n## 解説\n### ポイント\n- \u003cmark>String の `==` と `!=` は大文字・小文字を区別しない\u003c/mark>（①②）。区別したいときは `equals` を使う（③）\n- \u003cmark>Set の要素と Map のキーは、大文字・小文字を区別する\u003c/mark>（⑤〜⑦、⑩〜⑫）。空白の違いも別のものになる\n- \u003cmark>Set や Map に入れる前に、`trim().toLowerCase()` でそろえる\u003c/mark>と、同じものとして扱える（⑧）\n- ⑫は、Map の `put` で上書きになると思うと間違える。キーが違うので、上書きではなく追加になる（Q-004）\n\n### よくある間違い\n- ⑤を `1` や `2` と答える：`==` と同じように、Set も大文字・小文字を区別しないと思う\n- ⑩を `5` と答える：Map のキーも区別しないと思う\n- ⑫を `1` と答える：`'TOKYO'` で `'Tokyo'` が上書きされると思う\n\n### 調べ先\n- Apex Reference Guide「String Class」の `equals` / `equalsIgnoreCase` / `toLowerCase`\n- Apex Developer Guide「Sets」「Maps」（String の大文字・小文字の扱い）\n- Apex Developer Guide「Expression Operators」の `==`（String は大文字・小文字を区別しない）"},{"id":"G-018","title":"許可されたドメインのメールアドレスだけを通す","level":1,"type":"write","skills":["APEX-BASIC-02","APEX-BASIC-03"],"difficulty":2,"minutes":25,"environment":"org","language":"ja","source":"generated","learned_ids":["Q-008"],"memo_ids":[],"question":"## 問題\n社外向けの案内メールは、許可した取引先のドメイン（`@` より後ろ）にだけ送る決まりがある。\nメールアドレスも許可ドメインの一覧も人が入力したもので、大文字・小文字や前後の空白がばらばらになっている。許可ドメインかどうかを調べるクラスを作りなさい。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n\n- **機能1：1件のメールアドレスが許可ドメインかを調べる**\n  - メールアドレス1件と、許可ドメインの一覧を受け取り、許可ドメインなら `true` を返す\n  - メールアドレスも許可ドメインも、**前後の空白を取り、小文字にそろえてから**比べる\n  - メールアドレスが `null`・空・空白だけなら `false`\n  - `@` がないメールアドレスは `false`\n  - 許可ドメインの一覧が `null` なら `false`\n- **機能2：許可ドメインのメールアドレスだけを返す**\n  - メールアドレスのリストと許可ドメインの一覧を受け取り、許可ドメインのものだけを返す\n  - 返すメールアドレスは、前後の空白を取り、小文字にそろえた形にする\n  - 元の順番を保つ（重複は取り除かなくてよい）\n  - メールアドレスのリストか許可ドメインの一覧が `null` なら、空のリストを返す\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n`'taro@example.com'.substringAfter('@')` は `'example.com'` を返す。`@` がなければ空文字を返す。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n許可ドメインの一覧も、そろえてから Set に入れる。そうすれば、`contains` で調べるだけで済む。\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n許可ドメインの一覧は、どの行も `'example.com'`, `' Sample.JP '` の2つ（機能1の最後の行と、機能2の最後の行だけ `null`）。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.isTrue(条件, '何の確認か');\nAssert.isFalse(条件, '何の確認か');\nAssert.areEqual('a,b', String.join(実際のリスト, ','), '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力（メールアドレス） | 結果 |\n|---|---|---|\n| 1 | `'Taro@Example.COM'` | `true` |\n| 1 | `' hanako@sample.jp '` | `true`（許可ドメイン側の空白・大文字もそろえる） |\n| 1 | `'jiro@other.com'` | `false` |\n| 1 | `'no-at-mark'` | `false` |\n| 1 | `null` | `false` |\n| 1 | `'taro@example.com'`（許可ドメインが `null`） | `false` |\n| 2 | `' Taro@Example.COM'`, `'jiro@other.com'`, `null`, `'HANAKO@sample.jp'` | `'taro@example.com'`, `'hanako@sample.jp'` |\n| 2 | `null` | 空（0件） |\n| 2 | `'taro@example.com'`（許可ドメインが `null`） | 空（0件） |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nList\u003cString> allowedDomains = new List\u003cString>{ 'example.com', ' Sample.JP ' };\n\nAssert.isTrue(EmailDomainFilter.isAllowedDomain('Taro@Example.COM', allowedDomains), '大文字でも許可');\nAssert.isTrue(EmailDomainFilter.isAllowedDomain(' hanako@sample.jp ', allowedDomains), '許可ドメイン側もそろえる');\nAssert.isFalse(EmailDomainFilter.isAllowedDomain('jiro@other.com', allowedDomains), '許可されていない');\nAssert.isFalse(EmailDomainFilter.isAllowedDomain('no-at-mark', allowedDomains), '@ がない');\nAssert.isFalse(EmailDomainFilter.isAllowedDomain(null, allowedDomains), 'null なら false');\nAssert.isFalse(EmailDomainFilter.isAllowedDomain('taro@example.com', null), '許可ドメインが null なら false');\n\nList\u003cString> emails = new List\u003cString>{ ' Taro@Example.COM', 'jiro@other.com', null, 'HANAKO@sample.jp' };\nAssert.areEqual(\n    'taro@example.com,hanako@sample.jp',\n    String.join(EmailDomainFilter.filterAllowedEmails(emails, allowedDomains), ','),\n    '許可ドメインだけ、そろえた形で元の順番'\n);\nAssert.areEqual(0, EmailDomainFilter.filterAllowedEmails(null, allowedDomains).size(), 'リストが null なら空');\nAssert.areEqual(0, EmailDomainFilter.filterAllowedEmails(new List\u003cString>{ 'taro@example.com' }, null).size(), '許可ドメインが null なら空');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class EmailDomainFilter {\n    public static Boolean isAllowedDomain(String email, List\u003cString> allowedDomains) {\n        if (String.isBlank(email) || allowedDomains == null) {\n            return false;\n        }\n        String domain = email.trim().toLowerCase().substringAfter('@');\n        return toDomainSet(allowedDomains).contains(domain);\n    }\n\n    public static List\u003cString> filterAllowedEmails(List\u003cString> emails, List\u003cString> allowedDomains) {\n        List\u003cString> allowedEmails = new List\u003cString>();\n        if (emails == null || allowedDomains == null) {\n            return allowedEmails;\n        }\n        Set\u003cString> allowedDomainSet = toDomainSet(allowedDomains);\n        for (String email : emails) {\n            if (String.isBlank(email)) {\n                continue;\n            }\n            String normalizedEmail = email.trim().toLowerCase();\n            if (allowedDomainSet.contains(normalizedEmail.substringAfter('@'))) {\n                allowedEmails.add(normalizedEmail);\n            }\n        }\n        return allowedEmails;\n    }\n\n    // 許可ドメインを、そろえた形の Set にする（空のものは入れない）\n    private static Set\u003cString> toDomainSet(List\u003cString> domains) {\n        Set\u003cString> domainSet = new Set\u003cString>();\n        for (String domain : domains) {\n            if (String.isBlank(domain)) {\n                continue;\n            }\n            domainSet.add(domain.trim().toLowerCase());\n        }\n        return domainSet;\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>比べる両側をそろえる\u003c/mark>。メールアドレスだけを小文字にしても、許可ドメインに `' Sample.JP '` が入っていると、Set の `contains` では見つからない\n- \u003cmark>Set の `contains` は大文字・小文字を区別する\u003c/mark>。`==` で1つずつ比べると区別しないので、気づきにくい（Q-008）\n- `@` がないときは、`substringAfter('@')` が空文字を返す。空のドメインは Set に入れていないので、`false` になる\n- 同じそろえ方を2つのメソッドで使うので、private メソッドに切り出している。切り出さずに両方に書いても正解\n\n### よくある間違い\n- メールアドレスだけ `toLowerCase()` して、許可ドメイン側をそろえ忘れる（表の2行目で失敗する）\n- `trim()` を `String.isBlank` より前に書いて、`null` で落ちる（G-015 の⑩）\n- `allowedDomains == null` を確かめずに for で回して落ちる（G-015 の⑫）\n\n### 調べ先\n- Apex Reference Guide「String Class」の `substringAfter` / `trim` / `toLowerCase`\n- Apex Reference Guide「Set Class」の `contains`"},{"id":"G-019","title":"List と Set の add・addAll・変換を見分ける","level":1,"type":"predict","skills":["APEX-BASIC-02"],"difficulty":1,"minutes":10,"environment":"none","language":"ja","source":"generated","learned_ids":["Q-009"],"memo_ids":[],"question":"## 問題\n### 問1\n次の A〜F のうち、**コンパイルエラーになる行**をすべて選びなさい（どの行も、はじめの2行のあとに1行だけ書いたとする）。\n\n```apex\nList\u003cString> names = new List\u003cString>{ 'aki', 'ben', 'aki' };\nSet\u003cString> tagSet = new Set\u003cString>{ 'ben', 'cid' };\n```\n\n```apex\nnames.add(tagSet);                             // A\nnames.addAll(tagSet);                          // B\nList\u003cString> copiedNames = new List\u003cString>(tagSet); // C\ntagSet.addAll(names);                          // D\ntagSet.add(names);                             // E\nString firstTag = tagSet[0];                   // F\n```\n\n### 問2\n次のコードを匿名実行したとき、①〜⑦の `System.debug` には何が出力されるか答えなさい。\n\n```apex\nList\u003cString> names = new List\u003cString>{ 'aki', 'ben', 'aki' };\nSet\u003cString> tagSet = new Set\u003cString>{ 'ben', 'cid' };\nSystem.debug(names.size());                    // ①\n\nSet\u003cString> nameSet = new Set\u003cString>(names);\nSystem.debug(nameSet.size());                  // ②\n\nnames.addAll(tagSet);\nSystem.debug(names.size());                    // ③\n\ntagSet.addAll(names);\nSystem.debug(tagSet.size());                   // ④\n\nList\u003cString> uniqueNames = new List\u003cString>(new Set\u003cString>(names));\nSystem.debug(uniqueNames.size());              // ⑤\n\nSystem.debug(nameSet.add('ben'));              // ⑥\nSystem.debug(nameSet.add('dan'));              // ⑦\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n`add` は1件だけ、`addAll` はまとめて足す。`List\u003cString>` の `add` に渡せるのは String だけ。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\nList は重複をそのまま持つ。Set は重複を持たない。③のあとの `names` の中身を書き出してみる。\n\u003c/details>","answer":"## 解答\n### 問1：A、E、F\n| 行 | 結果 | 理由 |\n|---|---|---|\n| A | エラー | `List\u003cString>.add` に渡せるのは String 1つ。Set は渡せない |\n| B | OK | `addAll` には Set も List も渡せる |\n| C | OK | Set から List を作れる |\n| D | OK | `Set.addAll` には List も渡せる |\n| E | エラー | `Set\u003cString>.add` に渡せるのも String 1つ |\n| F | エラー | Set には番号（`[0]`）がない |\n\n### 問2\n| 番号 | 答え | 理由 |\n|---|---|---|\n| ① | `3` | List は重複をそのまま持つ |\n| ② | `2` | Set にすると `{aki, ben}` |\n| ③ | `5` | `names` は `aki, ben, aki, ben, cid`。List は `ben` が2つあってもそのまま足す |\n| ④ | `3` | `tagSet` は `{ben, cid, aki}`。重複は増えない |\n| ⑤ | `3` | 5件の `names` を Set にすると `{aki, ben, cid}`、それを List にしても3件 |\n| ⑥ | `false` | `ben` はもう入っている |\n| ⑦ | `true` | `dan` は初めて |\n\n## 解説\n### ポイント\n- \u003cmark>`add` は1件、`addAll` はまとめて\u003c/mark>。L1-04 の最初の解答の `resultEmails.add(noDuplicateEmailsSet)` は A と同じでコンパイルエラーになる\n- \u003cmark>`new List\u003cString>(set)` で Set を List にできる\u003c/mark>（C、⑤）。重複を取り除くだけで、順番がいらないなら、これが一番短い\n- Set には番号がない（F）。Set から List にすると番号で取り出せるが、**どの順番になるかは決まっていない**。出てきた順番を保ちたいときは、L1-04 のように「覚えておく Set + 結果の List」で1件ずつ足す\n- ⑥⑦は `Set.add` の戻り値。\u003cmark>`false` なら「もう入っていた」＝重複\u003c/mark>（Q-003、Q-009）\n\n### よくある間違い\n- A を OK と答える：`add` に何でも渡せると思う\n- ③を `4` と答える：List の `addAll` でも重複が消えると思う\n- ④を `5` と答える：Set の `addAll` で重複も足されると思う\n\n### 調べ先\n- Apex Reference Guide「List Class」の `add` / `addAll` / コンストラクタ `List\u003cT>(setToCopy)`\n- Apex Reference Guide「Set Class」の `add` / `addAll` / コンストラクタ `Set\u003cT>(listToCopy)`"},{"id":"G-020","title":"商品コードの重複と、2日続けて注文されたコードを見つける","level":1,"type":"write","skills":["APEX-BASIC-02","APEX-BASIC-03"],"difficulty":2,"minutes":25,"environment":"org","language":"ja","source":"generated","learned_ids":["Q-009","Q-008"],"memo_ids":[],"question":"## 問題\n倉庫の注文画面から、その日に注文された商品コードの一覧が届く。コードは手入力なので、大文字・小文字や前後の空白がばらばらになっている。\n商品コードを調べるクラスを作りなさい。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\nどちらの機能も、**for の中に for を書かず**（二重ループにせず）に書くこと。\n\n- **機能1：最初に重複したコードを返す**\n  - 商品コードのリストを受け取り、**2回目が最初に出てきた**コードを返す\n  - コードは、前後の空白を取り、**大文字にそろえて**から比べる。返すのもそろえた形\n  - `null`・空・空白だけの要素は数えない\n  - 重複がなければ `null` を返す。リストが `null` のときも `null` を返す\n- **機能2：2日続けて注文されたコードを返す**\n  - 今日のコードのリストと昨日のコードのリストを受け取り、両方に出てくるコードを返す\n  - 機能1と同じルールでそろえてから比べる。返すのもそろえた形\n  - 今日のリストで出てきた順番にする。同じコードは1回だけ入れる\n  - どちらかのリストが `null` なら、空のリストを返す\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n機能1は、L1-04 の機能2と同じ形で書ける。違うのは、`true` ではなく、そろえたコードを返すところ。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n機能2は、先に昨日のコードをそろえて Set に入れる。今日のコードを1つずつ見て、昨日の Set に入っているかを `contains` で調べる。同じコードを2回入れないためには、もう1つ「結果に入れたコード」を覚える Set を使い、その `add` の戻り値を見る。\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nAssert.isNull(値, '何の確認か');\nAssert.areEqual('a,b', String.join(実際のリスト, ','), '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `'a-01'`, `'B-02'`, `' A-01 '`, `'b-02'` | `'A-01'` |\n| 1 | `'C-03'`, `'b-02'`, `'B-02 '`, `'c-03'` | `'B-02'`（`C-03` より先に2回目が出てくる） |\n| 1 | `'A-01'`, `''`, `' '`, `null`, `'B-02'` | `null` |\n| 1 | `null` | `null` |\n| 2 | 今日 `'B-02'`, `'a-01'`, `'C-03'`, `'b-02'`, `'D-04'`／昨日 `'A-01 '`, `'b-02'`, `'X-99'` | `'B-02'`, `'A-01'` |\n| 2 | 今日 `'A-01'`／昨日 `null` | 空（0件） |\n| 2 | 今日 `null`／昨日 `'A-01'` | 空（0件） |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nAssert.areEqual('A-01', ProductCodeChecker.findFirstRepeatedCode(new List\u003cString>{ 'a-01', 'B-02', ' A-01 ', 'b-02' }), '最初に重複したコード');\nAssert.areEqual('B-02', ProductCodeChecker.findFirstRepeatedCode(new List\u003cString>{ 'C-03', 'b-02', 'B-02 ', 'c-03' }), '2回目が先に出てきたほう');\nAssert.isNull(ProductCodeChecker.findFirstRepeatedCode(new List\u003cString>{ 'A-01', '', ' ', null, 'B-02' }), '空は数えない');\nAssert.isNull(ProductCodeChecker.findFirstRepeatedCode(null), 'null なら null');\n\nList\u003cString> todayCodes = new List\u003cString>{ 'B-02', 'a-01', 'C-03', 'b-02', 'D-04' };\nList\u003cString> yesterdayCodes = new List\u003cString>{ 'A-01 ', 'b-02', 'X-99' };\nAssert.areEqual('B-02,A-01', String.join(ProductCodeChecker.findCommonCodes(todayCodes, yesterdayCodes), ','), '両方にあるコードを今日の順で1回ずつ');\nAssert.areEqual(0, ProductCodeChecker.findCommonCodes(new List\u003cString>{ 'A-01' }, null).size(), '昨日が null なら空');\nAssert.areEqual(0, ProductCodeChecker.findCommonCodes(null, new List\u003cString>{ 'A-01' }).size(), '今日が null なら空');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class ProductCodeChecker {\n    public static String findFirstRepeatedCode(List\u003cString> codes) {\n        if (codes == null) {\n            return null;\n        }\n        Set\u003cString> seenCodeSet = new Set\u003cString>();\n        for (String code : codes) {\n            if (String.isBlank(code)) {\n                continue;\n            }\n            String normalizedCode = code.trim().toUpperCase();\n            if (!seenCodeSet.add(normalizedCode)) {\n                return normalizedCode;\n            }\n        }\n        return null;\n    }\n\n    public static List\u003cString> findCommonCodes(List\u003cString> todayCodes, List\u003cString> yesterdayCodes) {\n        List\u003cString> commonCodes = new List\u003cString>();\n        if (todayCodes == null || yesterdayCodes == null) {\n            return commonCodes;\n        }\n        Set\u003cString> yesterdayCodeSet = new Set\u003cString>();\n        for (String code : yesterdayCodes) {\n            if (String.isBlank(code)) {\n                continue;\n            }\n            yesterdayCodeSet.add(code.trim().toUpperCase());\n        }\n        Set\u003cString> addedCodeSet = new Set\u003cString>();\n        for (String code : todayCodes) {\n            if (String.isBlank(code)) {\n                continue;\n            }\n            String normalizedCode = code.trim().toUpperCase();\n            if (yesterdayCodeSet.contains(normalizedCode) && addedCodeSet.add(normalizedCode)) {\n                commonCodes.add(normalizedCode);\n            }\n        }\n        return commonCodes;\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>`add` が `false` を返したら、その場で重複がわかる\u003c/mark>。機能1は、L1-04 の機能2の `return true` を `return normalizedCode` に変えただけ\n- \u003cmark>「両方にあるか」は、片方を Set にして `contains` で調べる\u003c/mark>。今日のコードごとに昨日のリストを for で回す（二重ループ）と、件数が増えるほど遅くなる\n- 機能2で同じコードを1回だけ入れるのは、L1-04 の機能1と同じ「覚えておく Set + 結果の List」の形。`&&` は左が `false` なら右を実行しないので、昨日にないコードは `addedCodeSet` に入らない\n- そろえ方（`isBlank` で飛ばす → `trim().toUpperCase()`）は、比べる両側で同じにする（Q-008）\n\n### よくある間違い\n- 機能1で「最初に出てきたコードのうち、あとで重複するもの」を返す：2行目の表では `C-03` になってしまう\n- 機能2で `todayCodes` の中に `yesterdayCodes` の for を書く（二重ループ）\n- 機能2で `addedCodeSet` を使わずに、`'B-02'` が2回入る\n- 昨日のコードをそろえずに Set に入れて、`'A-01 '` や `'b-02'` が見つからない\n\n### 調べ先\n- Apex Reference Guide「Set Class」の `add` / `contains`\n- Apex Reference Guide「String Class」の `trim` / `toUpperCase` / `isBlank`"},{"id":"G-021","title":"Map のメソッドと compareTo の結果を予想する","level":1,"type":"predict","skills":["APEX-BASIC-02","APEX-BASIC-03"],"difficulty":1,"minutes":10,"environment":"none","language":"ja","source":"generated","memo_ids":["M-20261122-233619"],"learned_ids":[],"question":"## 問題\n次のコードを匿名実行したとき、①〜⑪の `System.debug` には何が出力されるか答えなさい。\n⑧・⑩・⑪は `true` か `false` で答える。\nまた、⑫ `stock.keySet()` が返す値の型を答えなさい。\n\n```apex\nMap\u003cString, Integer> stock = new Map\u003cString, Integer>();\nstock.put('りんご', 3);\nstock.put('みかん', 5);\nstock.put('りんご', 4);\n\nSystem.debug(stock.size());                       // ①\nSystem.debug(stock.get('りんご'));                 // ②\nSystem.debug(stock.get('ぶどう'));                 // ③\nSystem.debug(stock.containsKey('みかん'));         // ④\nSystem.debug(stock.containsKey('ミカン'));         // ⑤\nSystem.debug(stock.keySet().contains('りんご'));   // ⑥\n\nInteger total = 0;\nfor (String key : stock.keySet()) {\n    total += stock.get(key);\n}\nSystem.debug(total);                              // ⑦\n\nSystem.debug('apple'.compareTo('banana') \u003c 0);    // ⑧\nSystem.debug('cat'.compareTo('cat'));             // ⑨\nSystem.debug('Zoo'.compareTo('apple') \u003c 0);       // ⑩\nSystem.debug('ab'.compareTo('abc') \u003c 0);          // ⑪\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n同じキーで `put` すると、キーは増えずに値が置き換わる。`get` はキーがないと何を返すか。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n`compareTo` は、呼び出した側が辞書順で**先ならマイナス、同じなら 0、後ならプラス**を返す。比べるのは文字の Unicode の値で、大文字（`A`〜`Z`）は小文字（`a`〜`z`）より小さい。\n\u003c/details>","answer":"## 解答\n| 番号 | 答え | 理由 |\n|---|---|---|\n| ① | `2` | りんごは2回 `put` したが、同じキーなので上書き。キーはりんご・みかんの2つ |\n| ② | `4` | あとから入れた 4 で上書きされている |\n| ③ | `null` | ぶどうはキーにない |\n| ④ | `true` | |\n| ⑤ | `false` | String のキーは文字が完全に同じでないと別のキー（ひらがなとカタカナは別） |\n| ⑥ | `true` | `keySet()` はキーの Set なので、Set の `contains` が使える |\n| ⑦ | `9` | りんご 4 + みかん 5。`keySet()` でキーを1つずつ取り出し、`get` で値を引いて足す |\n| ⑧ | `true` | `a` は `b` より前なのでマイナス |\n| ⑨ | `0` | 同じ文字列 |\n| ⑩ | `true` | `Z`（90）は `a`（97）より小さいので、`'Zoo'` が先になりマイナス |\n| ⑪ | `true` | 途中まで同じなら、短いほうが先 |\n| ⑫ | `Set\u003cString>` | キーの型が String の Map なので、キーの Set も `Set\u003cString>` |\n\n## 解説\n### ポイント\n- \u003cmark>`put(key, value)` は、キーがなければ追加、あれば値を上書きする\u003c/mark>。`size()` はキーの数\n- \u003cmark>`get(key)` はキーがないと `null` を返す\u003c/mark>。数を足していくと
