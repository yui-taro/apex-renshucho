<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<title>Apex 練習帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>/* レイアウト: PC は左にサイドバー＋本文 880px の1カラム、スマホは下にタブ。
   白いカードを淡い青みのグレーの地に置き、強調は青1色。状態（正解・つまずき・未対応）だけ緑・赤・琥珀を使う */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #eef1f7;
  --surface-3: #e3e8f1;
  --line: #dde3ec;
  --line-strong: #c7d0dd;
  --fg: #141a26;
  --fg-2: #3a4456;
  --muted: #6a7487;
  --accent: #2856e0;
  --accent-hover: #1e47c4;
  --accent-soft: #e8eefe;
  --accent-fg: #ffffff;
  --ok: #17803d;
  --ok-soft: #e4f5ea;
  --warn: #b25e00;
  --warn-soft: #fff1dc;
  --bad: #c62f2f;
  --bad-soft: #fde8e8;
  --nav-bg: #ffffff;
  --code-bg: #10151f;
  --code-fg: #e6ebf3;
  --code-line: #273042;
  --hl-keyword: #8fb4ff;
  --hl-string: #f2c879;
  --hl-number: #f59f80;
  --hl-comment: #7d889c;
  --hl-type: #7fd8c4;
  --hl-title: #f3e3a2;
  --shadow: 0 1px 2px rgb(20 26 38 / 0.05), 0 2px 8px rgb(20 26 38 / 0.04);
  --font-body: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 12px;
  --radius-sm: 8px;
  --tab-height: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117;
    --surface: #151b24;
    --surface-2: #1c2330;
    --surface-3: #252e3d;
    --line: #262f3d;
    --line-strong: #364152;
    --fg: #e9edf4;
    --fg-2: #c3cbd8;
    --muted: #8f9aad;
    --accent: #7ea2ff;
    --accent-hover: #9ab6ff;
    --accent-soft: #1b2744;
    --accent-fg: #0d1117;
    --ok: #5cc98a;
    --ok-soft: #14291e;
    --warn: #f0a94b;
    --warn-soft: #2e2111;
    --bad: #f27979;
    --bad-soft: #321819;
    --nav-bg: #11161e;
    --code-bg: #0a0e14;
    --code-line: #222b39;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117;
  --surface: #151b24;
  --surface-2: #1c2330;
  --surface-3: #252e3d;
  --line: #262f3d;
  --line-strong: #364152;
  --fg: #e9edf4;
  --fg-2: #c3cbd8;
  --muted: #8f9aad;
  --accent: #7ea2ff;
  --accent-hover: #9ab6ff;
  --accent-soft: #1b2744;
  --accent-fg: #0d1117;
  --ok: #5cc98a;
  --ok-soft: #14291e;
  --warn: #f0a94b;
  --warn-soft: #2e2111;
  --bad: #f27979;
  --bad-soft: #321819;
  --nav-bg: #11161e;
  --code-bg: #0a0e14;
  --code-line: #222b39;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
button, select, textarea, input { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- 枠組み ---------- */
.shell { min-height: 100%; }
.page {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(var(--tab-height) + 32px + env(safe-area-inset-bottom, 0px));
}
#main { max-width: 880px; margin-inline: auto; display: grid; gap: 28px; }
#main:focus { outline: none; }

.tabs {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: var(--nav-bg);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.brand { display: none; }
.tab {
  position: relative;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 3px;
  height: var(--tab-height);
  padding: 6px 2px;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
}
.tab svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.tab[aria-current="page"] { color: var(--accent); }
.tab-badge {
  position: absolute;
  top: 7px;
  left: calc(50% + 8px);
  min-width: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--warn);
  color: var(--surface);
  font-size: 10.5px;
  font-weight: 700;
  line-height: 18px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

@media (min-width: 900px) {
  body { font-size: 15.5px; }
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); }
  .tabs {
    position: sticky;
    top: 0;
    height: 100vh;
    inset: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 24px 14px;
    border-top: 0;
    border-right: 1px solid var(--line);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 2px 10px 22px;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.02em;
  }
  .brand-mark {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: var(--accent);
    color: var(--accent-fg);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 12px;
    height: auto;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-size: 14.5px;
    color: var(--fg-2);
    text-align: left;
  }
  .tab svg { width: 20px; height: 20px; color: var(--muted); }
  .tab:hover { background: var(--surface-2); }
  .tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .tab[aria-current="page"] svg { color: var(--accent); }
  .tab-badge { position: static; margin-left: auto; }
  .page { padding-block: 40px 56px; }
  #main { gap: 32px; }
}

/* ---------- 文字 ---------- */
h1, h2, h3 { font-weight: 700; text-wrap: balance; line-height: 1.45; margin: 0; letter-spacing: 0.01em; }
h1 { font-size: 26px; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-mono); font-size: 0.9em; }
.eyebrow {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.lead { color: var(--fg-2); }

/* ---------- 部品 ---------- */
.section { display: grid; gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stack { display: grid; gap: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  display: grid;
  gap: 14px;
  min-width: 0;
}
.panel > h2 { font-size: 17px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  padding: 7px 16px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  color: var(--fg);
  transition: background-color 0.15s, border-color 0.15s;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ok { color: var(--ok); border-color: currentColor; }
.btn.ok:hover { background: var(--ok-soft); }
.btn.ok[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn.bad { color: var(--bad); border-color: currentColor; }
.btn.bad:hover { background: var(--bad-soft); }
.btn.bad[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.quiet { border-color: transparent; background: none; color: var(--muted); padding-inline: 10px; }
.btn.quiet:hover { color: var(--fg); background: var(--surface-2); }
.btn.small { min-height: 32px; padding: 3px 12px; font-size: 13px; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 1px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.75;
  white-space: nowrap;
  background: var(--surface-2);
  color: var(--fg-2);
}
.pill[data-status]::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.85;
}
.pill[data-status="none"] { color: var(--muted); }
.pill[data-status="trying"] { background: var(--accent-soft); color: var(--accent); }
.pill[data-status="failed"] { background: var(--bad-soft); color: var(--bad); }
.pill[data-status="viewed"] { background: var(--warn-soft); color: var(--warn); }
.pill[data-status="correct"] { background: var(--ok-soft); color: var(--ok); }
.pill[data-status="planned"] { background: none; border: 1px dashed var(--line-strong); color: var(--muted); }
.pill[data-status="planned"]::before { display: none; }
.pill[data-memo="open"] { background: var(--warn-soft); color: var(--warn); }
.pill[data-memo="generated"] { background: var(--accent-soft); color: var(--accent); }
.pill[data-memo="resolved"] { background: var(--ok-soft); color: var(--ok); }
.pill.weak { background: var(--accent-soft); color: var(--accent); }

.chip {
  display: inline-block;
  padding: 0 8px;
  border-radius: 6px;
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.9;
  color: var(--fg-2);
  white-space: nowrap;
}

.bar { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.bar > span { display: block; height: 100%; min-width: 0; background: var(--accent); border-radius: 4px; }
.bar.thin { height: 5px; }

/* ---------- ホーム ---------- */
.hero {
  display: grid;
  gap: 18px;
  padding: 24px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.hero-top { display: flex; gap: 16px; align-items: center; }
.level-badge {
  display: grid;
  place-items: center;
  flex: none;
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: var(--accent);
  color: var(--accent-fg);
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 18px;
}
.hero h1 { font-size: 24px; }
.progress-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.progress-count { font-family: var(--font-mono); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.progress-count span { color: var(--muted); font-weight: 400; }
.next-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 16px;
  align-items: center;
  padding: 16px 18px;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  border: 1px solid transparent;
  text-align: left;
  cursor: pointer;
  width: 100%;
  color: var(--fg);
  transition: border-color 0.15s;
}
.next-card:hover { border-color: var(--accent); }
.next-card .eyebrow { color: var(--accent); }
.next-card strong { font-size: 16.5px; line-height: 1.5; }
.next-card .go {
  grid-row: 1 / 4;
  grid-column: 2;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-fg);
  font-size: 18px;
}
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat {
  display: grid;
  gap: 2px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 18px;
}
.stat-value { font-family: var(--font-mono); font-size: 26px; font-weight: 600; line-height: 1.3; font-variant-numeric: tabular-nums; }
.stat-value .small { font-size: 14px; font-weight: 400; }
.stat-label { font-size: 12.5px; color: var(--muted); }
.stat[data-kind="memo"] .stat-value { color: var(--warn); }
.stat[data-kind="ok"] .stat-value { color: var(--ok); }

/* ---------- 一覧 ---------- */
.list {
  display: grid;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.list-item {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 4px 14px;
  align-items: center;
  padding: 14px 18px;
  border: 0;
  border-top: 1px solid var(--line);
  background: none;
  text-align: left;
  width: 100%;
  min-width: 0;
  color: var(--fg);
}
.list-item:first-child { border-top: 0; }
button.list-item { cursor: pointer; transition: background-color 0.12s; }
button.list-item:hover { background: var(--surface-2); }
.list-item .id { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; }
.list-item .title { min-width: 0; font-weight: 500; }
.list-item .meta { grid-column: 2 / 4; display: flex; gap: 6px 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.list-item.planned .title { color: var(--muted); font-weight: 400; }
.level-num {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--fg-2);
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 13.5px;
  grid-row: 1 / 3;
}
.level-row.current .level-num { background: var(--accent); color: var(--accent-fg); }
.level-row.passed .level-num { background: var(--ok-soft); color: var(--ok); }
.level-progress { grid-column: 2 / 4; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 12.5px; color: var(--muted); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.checklist { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.checklist li { display: flex; gap: 10px; align-items: baseline; }
.check {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  font-size: 12px;
  color: transparent;
  transform: translateY(4px);
}
.check.done { background: var(--ok); border-color: var(--ok); color: var(--surface); }

/* ---------- Trailhead ---------- */
.th-item { display: grid; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
.th-item:first-child { border-top: 0; }
.th-head { display: flex; gap: 8px 12px; align-items: baseline; flex-wrap: wrap; justify-content: space-between; }
.th-head a { font-weight: 500; text-decoration: none; }
.th-head a:hover { text-decoration: underline; }
.segmented { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--surface-2); }
.segmented button {
  border: 0;
  border-radius: 7px;
  background: none;
  padding: 3px 12px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  color: var(--muted);
}
.segmented button:hover { color: var(--fg); }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.segmented button[aria-pressed="true"][data-value="完了"] { color: var(--ok); }

/* ---------- 問題ページ ---------- */
.crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.crumbs button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; }
.crumbs button:hover { text-decoration: underline; }
.problem-head { display: grid; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.problem-head h1 { font-size: 25px; }
.badges { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; }
.badge-type { font-weight: 700; color: var(--accent); background: var(--accent-soft); }
.stars { color: var(--warn); letter-spacing: 1px; font-size: 13px; }
.generated-note { background: var(--accent-soft); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13.5px; }
.resolve-offer { background: var(--ok-soft); border-radius: var(--radius-sm); padding: 14px; display: grid; gap: 10px; }

.code-input {
  width: 100%;
  min-height: 240px;
  resize: vertical;
  padding: 14px;
  border: 1px solid var(--code-line);
  border-radius: var(--radius-sm);
  background: var(--code-bg);
  color: var(--code-fg);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.65;
  tab-size: 4;
  white-space: pre;
  overflow: auto;
}
.code-input::placeholder { color: var(--hl-comment); }
.text-input, .select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
}
.text-input:focus, .select:focus, .code-input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
textarea.text-input { min-height: 96px; resize: vertical; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 500; color: var(--fg-2); }
.save-state { font-size: 12.5px; color: var(--muted); }
.save-state.dirty { color: var(--warn); font-weight: 500; }

.answer-box { padding: 20px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); }
.confirm-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--warn-soft); font-size: 13.5px; }
.pager { display: flex; justify-content: space-between; gap: 8px; }

/* ---------- メモ ---------- */
.memo { display: grid; gap: 10px; padding: 16px 18px; border-top: 1px solid var(--line); }
.memo:first-child { border-top: 0; }
.memo-head { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.memo-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.memo-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button {
  border: 1px solid var(--line-strong);
  background: var(--surface);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  color: var(--fg-2);
}
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

/* ---------- スキル ---------- */
.skill-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 18px; border-top: 1px solid var(--line); align-items: center; }
.skill-row:first-child { border-top: 0; }
.skill-name { min-width: 0; }
.skill-counts { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

"【総合】「悪いコード」を直す（直書きのトリガー・ハードコード・インジェクション・テストなし）","type":"project","skillsText":"APEX-SEC-01〜04, APEX-DESIGN-01〜02, WORK-ANTI-01","environment":"vscode"}]},{"level":9,"theme":"現場シミュレーション","dir":"lv09-field-simulation","goal":"現場のチケットと同じ形の要件から、オブジェクト作成 → Apex → LWC → テスト → デプロイまでを一人でやり切る。ここを解答を見ずに解ければ中級者の到達とする。","prep":"","format":"すべて `project`。現場のチケットに近い形で出す。\n- **背景**：誰が何に困っているか\n- **要件**：受け入れ条件（「〜のとき〜になること」）\n- **制約**：既存コードの流儀、使ってはいけない方法など\n- **成果物**：作るメタデータの一覧、テストのカバレッジ条件\n- **既存コード**（改修案件のみ）：問題フォルダに一式を置く\n\n1問あたり 2〜4 時間を想定する。","pass":"- L9-09 を解答を見ずに作り切る\n- `research/00_goal/intermediate-definition.md` のチェックリストをすべて満たす\n- Trailhead の卒業課題：**Superbadge: Apex Callouts**、**Superbadge: Apex Web Services** を完了する","planned":[{"id":"L9-01","title":"商談が成立したら契約と請求予定を自動で作る","type":"project","skillsText":"APEX-TRG-01〜03, PF-SETUP-01, APEX-TEST-01〜03","environment":"vscode"},{"id":"L9-02","title":"既存のトリガーに条件を追加する（改修案件）","type":"project","skillsText":"WORK-TASK-01, APEX-DESIGN-01","environment":"vscode"},{"id":"L9-03","title":"取引先ページの「関連案件サマリー」コンポーネント","type":"project","skillsText":"LWC-APEX-01〜03, LWC-LDS-02, LWC-DEPLOY-01","environment":"vscode"},{"id":"L9-04","title":"取引先責任者の一括更新画面","type":"project","skillsText":"LWC-COMP-02〜03, LWC-APEX-02〜04","environment":"vscode"},{"id":"L9-05","title":"夜間バッチ + エラーログの記録 + 完了メール","type":"project","skillsText":"APEX-ASYNC-04〜06, APEX-DML-02","environment":"vscode"},{"id":"L9-06","title":"外部システムとの連携（受け口の API と送信）","type":"project","skillsText":"APEX-INT-01〜04, APEX-TEST-05","environment":"vscode"},{"id":"L9-07","title":"フローから呼ぶ Apex と、画面フロー用の LWC","type":"project","skillsText":"PF-AUTO-01〜03, LWC-DEPLOY-02","environment":"vscode"},{"id":"L9-08","title":"本番障害の対応（報告 → 原因調査 → 修正 → テスト → デプロイ）","type":"project","skillsText":"APEX-DEBUG-03, WORK-LOOKUP-02, PF-TOOL-04","environment":"vscode"},{"id":"L9-09","title":"【卒業制作】要件定義書から小さな業務アプリを1本作る","type":"project","skillsText":"全体","environment":"vscode"}]}],"problems":[{"id":"L1-00","title":"問題用の Playground を作り、匿名実行を動かす","level":1,"type":"setup","skills":["PF-TOOL-01","APEX-DEBUG-03"],"difficulty":1,"minutes":20,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\nこの問題集を解くための練習用組織（Trailhead Playground）を用意し、開発者コンソールで Apex を実行できるようにする。\n\n## 手順\n1. **Trailhead にログインする**（アカウントがなければ作成する）\n2. **Playground を作る**\n   - Trailhead 右上のプロフィールアイコン → **Hands-On Orgs**（ハンズオン組織）→ **Create Playground**\n   - 名前は `Apex練習用` など、Trailhead のチャレンジ用と区別できるものにする\n   - 作成には数分かかる\n3. **Playground を開く**\n   - Hands-On Orgs の一覧で、作った Playground の **Launch** を押す\n4. **開発者コンソールを開く**\n   - 画面右上の歯車アイコン → **開発者コンソール**（Developer Console）\n5. **匿名実行する**\n   - 開発者コンソールのメニュー **Debug → Open Execute Anonymous Window**（ショートカット：Ctrl+E / Mac は Cmd+E）\n   - 次のコードを貼り付ける\n\n   ```apex\n   String name = 'Apex';\n   System.debug('Hello, ' + name);\n   System.debug('今日は ' + Date.today());\n   ```\n\n   - **Open Log** にチェックを入れて **Execute** を押す\n6. **ログを見る**\n   - 開いたログの下にある **Debug Only** にチェックを入れる\n   - `USER_DEBUG` の行に `Hello, Apex` と今日の日付が出ていることを確認する\n\n## 確認方法\n次のすべてに当てはまれば完了。\n- [ ] 問題用の Playground が Hands-On Orgs の一覧にある\n- [ ] 開発者コンソールの匿名実行で `Hello, Apex` が出た\n- [ ] Debug Only で `System.debug` の行だけを表示できた\n- [ ] 開発者コンソールのメニュー **File → New → Apex Class** を開けることを確認した（L1-04 以降で使う）","answer":"## 解説\n### ポイント\n- **問題用とチャレンジ用の Playground を分ける**。Trailhead のチャレンジは、新しい Playground で解くことが推奨されている。この問題集で作ったクラスが残っていると、チャレンジで同じ名前のクラスを作れずに失敗することがある\n- **匿名実行は「保存しないで1回だけ動かす」機能**。Lv1〜4 の多くの問題は、クラスを作ったあと、匿名実行で確認用のコードを動かして答え合わせをする\n- **`System.debug` の出力はデバッグログの `USER_DEBUG` 行に出る**。ログには他にも大量の行が出るので、Debug Only で絞り込むのが基本\n\n### よくあるつまずき\n- 匿名実行でエラーになる → 下に出るメッセージの `Line` と `Column` を見る。全角スペースや全角の記号が混ざっていることが多い\n- ログが開かない → Open Log のチェックを確認する。上のタブの **Logs** から開くこともできる\n- ログの日付の時刻がずれている → `Date.today()` は日付だけ。時刻まで欲しいときは `Datetime.now()`\n\n### 調べ先\n- Trailhead ヘルプ「Trailhead Playground の作成と管理」\n- Salesforce ヘルプ「開発者コンソール」「匿名実行」"},{"id":"L1-01","title":"計算結果を予想する（型と演算子）","level":1,"type":"predict","skills":["APEX-BASIC-01","APEX-BASIC-03"],"difficulty":1,"minutes":10,"environment":"none","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\n次のコードを匿名実行したとき、①〜⑨の `System.debug` には何が出力されるか答えなさい。\n実行せずに、まず紙に書いてから答え合わせをすること。\n\n```apex\nInteger a = 7;\nInteger b = 2;\nSystem.debug(a / b);                    // ①\n\nDecimal c = 7;\nSystem.debug(c / b);                    // ②\n\nSystem.debug(Math.mod(a, b));           // ③\n\nString s1 = 'Apex';\nString s2 = 'APEX';\nSystem.debug(s1 == s2);                 // ④\nSystem.debug(s1.equals(s2));            // ⑤\n\nInteger n;\nSystem.debug(n == null);                // ⑥\n\nSystem.debug('合計: ' + a + b);          // ⑦\nSystem.debug(a + b + '個');              // ⑧\n\nDate d = Date.newInstance(2026, 1, 31);\nSystem.debug(d.addDays(1).month());     // ⑨\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n整数どうしの割り算と、Decimal が入った割り算では結果の型が違う。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n`+` は左から順に計算される。最初に文字列が出てくると、そこから先は文字列の連結になる。\n\u003c/details>","answer":"## 解答例\n| 番号 | 出力 |\n|---|---|\n| ① | `3` |\n| ② | `3.5` |\n| ③ | `1` |\n| ④ | `true` |\n| ⑤ | `false` |\n| ⑥ | `true` |\n| ⑦ | `合計: 72` |\n| ⑧ | `9個` |\n| ⑨ | `2` |\n\n## 解説\n### ポイント\n- **① 整数どうしの割り算は小数が切り捨てられる**。`7 / 2` は `3`。金額や率の計算で小数が必要なら `Decimal` を使う\n- **② どちらかが Decimal なら結果も Decimal**。`7 / 2` が `3.5` になる\n- **③ 余りは `Math.mod`**。Apex には `%` 演算子がない\n- **④ String の `==` は大文字・小文字を区別しない**。Java とは違う点なので注意\n- **⑤ 区別したいときは `equals`**。大文字・小文字を区別して比べる\n- **⑥ 初期化していない変数は `null`**。Apex では `Integer` も `Boolean` も、何も入れなければ `0` や `false` ではなく `null` になる\n- **⑦⑧ `+` は左から順に評価される**。⑦は `'合計: ' + 7` で文字列になり、そこに `2` が連結されて `合計: 72`。⑧は先に `7 + 2 = 9` が計算されてから `'個'` が連結される。⑦で合計を出したいなら `'合計: ' + (a + b)` と書く\n- **⑨ 日付の計算は月や年をまたいでも正しく繰り上がる**。1月31日の1日後は2月1日なので `month()` は `2`。日付を数値として自分で計算せず、`addDays` / `addMonths` / `daysBetween` などのメソッドに任せる。契約終了日や期日の計算でよく出てくる\n\n### よくある間違い\n- ① を `3.5` と答える（Integer のまま計算されることを忘れる）\n- ⑥ を `false`、または「`0` が出る」と答える\n- ⑨ を `1` と答える（`addDays` が月をまたぐことを見落とす）\n\n### 調べ先\n- Apex Developer Guide「Expression Operators」（演算子と評価の順番）\n- Apex Reference Guide「Math Class」「String Class」の `equals` / `equalsIgnoreCase`\n- Apex Reference Guide「Date Class」の `addDays` / `month`"},{"id":"L1-02","title":"コレクションの中身を予想する","level":1,"type":"predict","skills":["APEX-BASIC-02"],"difficulty":1,"minutes":15,"environment":"none","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\n次のコードを匿名実行したとき、①〜⑪の `System.debug` には何が出力されるか答えなさい。\nList の中身が途中でどう変わるかを、紙に書きながら追うこと。\n\n```apex\nList\u003cString> fruits = new List\u003cString>{ 'りんご', 'みかん', 'ぶどう' };\nfruits.add('もも');\nfruits.add(1, 'バナナ');\nSystem.debug(fruits.size());               // ①\nSystem.debug(fruits[1]);                   // ②\n\nfruits.remove(0);\nSystem.debug(fruits[0]);                   // ③\nSystem.debug(fruits.indexOf('ぶどう'));     // ④\n\nSet\u003cInteger> nums = new Set\u003cInteger>{ 3, 1, 3, 2, 1 };\nSystem.debug(nums.size());                 // ⑤\nSystem.debug(nums.add(2));                 // ⑥\nSystem.debug(nums.contains(4));            // ⑦\n\nMap\u003cString, Integer> stock = new Map\u003cString, Integer>();\nstock.put('A', 10);\nstock.put('B', 5);\nstock.put('A', 7);\nSystem.debug(stock.size());                // ⑧\nSystem.debug(stock.get('A'));              // ⑨\nSystem.debug(stock.get('C'));              // ⑩\nSystem.debug(stock.containsKey('B'));      // ⑪\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n`add(1, 'バナナ')` は「1番目に差し込む」。List の番号は 0 から始まる。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\nSet は同じ値を2つ持てない。Map は同じキーに `put` すると上書きになる。\n\u003c/details>","answer":"## 解答例\n| 番号 | 出力 | そのときの中身 |\n|---|---|---|\n| ① | `5` | `[りんご, バナナ, みかん, ぶどう, もも]` |\n| ② | `バナナ` | |\n| ③ | `バナナ` | `[バナナ, みかん, ぶどう, もも]` |\n| ④ | `2` | |\n| ⑤ | `3` | `{1, 2, 3}` |\n| ⑥ | `false` | |\n| ⑦ | `false` | |\n| ⑧ | `2` | `{A=7, B=5}` |\n| ⑨ | `7` | |\n| ⑩ | `null` | |\n| ⑪ | `true` | |\n\n## 解説\n### ポイント\n- **List は順番があり、番号（インデックス）は 0 から**。`add(要素)` は末尾に追加、`add(番号, 要素)` はその位置に差し込み、`remove(番号)` で削除すると後ろの要素が前に詰まる\n- **Set は重複を持たない**。`{3, 1, 3, 2, 1}` は3種類だけ残る。`add` は「追加できたら true、もう入っていたら false」を返すので、⑥は `false`。この戻り値は重複チェックに使える（L1-04 で使う）\n- **Map は同じキーに `put` すると上書き**。キーの数は増えない\n- **Map にないキーを `get` すると `null`**。エラーにはならない。`null` に対してメソッドを呼ぶと `NullPointerException` になるので、`containsKey` で確かめるか null チェックをする（L1-10 で扱う）\n\n### 3つの使い分け\n| 種類 | 順番 | 重複 | 主な用途 |\n|---|---|---|---|\n| List | あり | あり | SOQL の結果、DML でまとめて保存するレコード |\n| Set | 頼らない | なし | Id を集めて `WHERE Id IN :ids` に渡す |\n| Map | 頼らない | キーはなし | Id からレコードを引く、キーごとに集計する |\n\n### よくある間違い\n- ② を `みかん` と答える（`add(1, ...)` が上書きではなく差し込みであることを見落とす）\n- ⑥ を `true` と答える\n- ⑩ でエラーになると考える\n\n### 調べ先\n- Apex Developer Guide「Collections」\n- Apex Reference Guide「List Class」「Set Class」「Map Class」"},{"id":"L1-03","title":"List と for ループで合計・平均を出す","level":1,"type":"fill","skills":["APEX-BASIC-01","APEX-BASIC-02"],"difficulty":1,"minutes":10,"environment":"none","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\nテストの点数のリストから、合計・平均・最高点を出すコードを書いた。\n【①】〜【⑥】に入るものを答えなさい。実行すると、コメントに書いた結果が出るようにすること。\n\n```apex\nList\u003cInteger> scores = new List\u003cInteger>{ 72, 85, 90, 64, 88 };\nInteger total = 0;\nInteger maxScore = null;\n\nfor (【①】 score : 【②】) {\n    total 【③】 score;\n    if (maxScore == null || score 【④】 maxScore) {\n        maxScore = score;\n    }\n}\n\nDecimal average = 【⑤】total / scores.【⑥】();\n\nSystem.debug('合計: ' + total);                   // 合計: 399\nSystem.debug('平均: ' + average.setScale(1));      // 平均: 79.8\nSystem.debug('最高: ' + maxScore);                 // 最高: 90\n```\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n①② は「リストの要素を1つずつ取り出す」for ループの書き方。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n⑤ を空欄のままにすると、`399 / 5` が Integer どうしの割り算になり、平均が `79` になってしまう。\n\u003c/details>","answer":"## 解答例\n| 空欄 | 答え |\n|---|---|\n| ① | `Integer` |\n| ② | `scores` |\n| ③ | `+=` |\n| ④ | `>` |\n| ⑤ | `(Decimal) ` |\n| ⑥ | `size` |\n\n⑤ は `Decimal.valueOf(total)` と書いて `Decimal.valueOf(total) / scores.size()` にしてもよい。\n\n## 解説\n### ポイント\n- **拡張 for ループ**：`for (型 変数 : リスト)` で要素を先頭から1つずつ取り出す。番号が要らないときはこちらを使う。番号も必要なら `for (Integer i = 0; i \u003c scores.size(); i++)`\n- **Integer どうしの割り算は小数が切り捨てられる**（L1-01 の①と同じ）。`Decimal average = total / scores.size();` と書いても、右側が先に Integer のまま計算されて `79` になり、それが Decimal に入るだけ。**計算する前に**どちらかを Decimal にする\n- **最大値は「まだ何もない（null）」から始める**。`maxScore = 0` から始めると、全部マイナスの値のときに正しく求められない。最初の要素で必ず置き換わるように `null` を使う\n- **リストの件数は `size()`**。Java の `length` や JavaScript の `length` と混同しやすい\n\n### よくある間違い\n- ⑤ を空欄のままにして平均が `79.0` になる\n- ⑥ を `length` や `count` と書く\n\n### 調べ先\n- Apex Developer Guide「Loops」\n- Apex Reference Guide「List Class」の `size`"},{"id":"L1-04","title":"メールアドレスの重複を Set で取り除く","level":1,"type":"write","skills":["APEX-BASIC-02","APEX-BASIC-03"],"difficulty":2,"minutes":20,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\nイベントの申込フォームから集めたメールアドレスの一覧がある。同じ人が何度も申し込んでいたり、大文字・小文字や前後の空白がばらばらだったりする。\n案内メールを1人1通だけ送れるように、重複を取り除くクラスを作りなさい。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n\n- **機能1：重複を取り除く**\n  - メールアドレスのリストを受け取り、重複を取り除いたリストを返す\n  - メールアドレスを**前後の空白を取り除き、すべて小文字にした形**にそろえる\n  - そろえた形で同じものは1つだけ残す\n  - **最初に出てきた順番**を保つ\n  - `null`・空文字・空白だけの要素は結果に含めない\n  - 受け取ったリストが `null` なら空のリストを返す\n- **機能2：重複があるか調べる**\n  - メールアドレスのリストを受け取り、重複が1つでもあるかどうかを返す\n  - 機能1と同じルールでそろえてから比べる\n  - `null`・空文字・空白だけの要素は数えない\n  - 受け取ったリストが `null` なら「重複なし」\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\nSet だけでは順番が保てない。「もう出てきたものを覚えておく Set」と「結果を入れる List」の2つを使う。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n`Set.add` は追加できたら `true`、すでに入っていたら `false` を返す（L1-02 の⑥）。`if (seen.add(email))` と書くと「初めて出てきたら」の判定になる。\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nAssert.isTrue(条件, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `'Taro@Example.com'`, `'hanako@example.com'`, `' taro@example.com '`, `null`, `''`, `'jiro@example.com'`, `'HANAKO@example.com'` | `taro@example.com`, `hanako@example.com`, `jiro@example.com` の3件（この順番） |\n| 1 | `null` | 空のリスト |\n| 2 | 上と同じ7件 | 重複あり |\n| 2 | `'a@example.com'`, `'b@example.com'` | 重複なし |\n| 2 | `''`, `' '`, `null` | 重複なし |\n| 2 | `null` | 重複なし |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nList\u003cString> input = new List\u003cString>{\n    'Taro@Example.com', 'hanako@example.com', ' taro@example.com ',\n    null, '', 'jiro@example.com', 'HANAKO@example.com'\n};\nList\u003cString> result = EmailUtil.uniqueEmails(input);\n\nAssert.areEqual(3, result.size(), '重複と空を除いて3件');\nAssert.areEqual('taro@example.com', result[0], '1番目は taro（小文字にそろえる）');\nAssert.areEqual('hanako@example.com', result[1], '2番目は hanako');\nAssert.areEqual('jiro@example.com', result[2], '3番目は jiro');\nAssert.areEqual(0, EmailUtil.uniqueEmails(null).size(), 'null なら空のリスト');\n\nAssert.isTrue(EmailUtil.hasDuplicate(input), '大文字・空白違いも重複とみなす');\nAssert.isFalse(EmailUtil.hasDuplicate(new List\u003cString>{ 'a@example.com', 'b@example.com' }), '重複なし');\nAssert.isFalse(EmailUtil.hasDuplicate(new List\u003cString>{ '', ' ', null }), '空は数えない');\nAssert.isFalse(EmailUtil.hasDuplicate(null), 'null なら false');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class EmailUtil {\n    public static List\u003cString> uniqueEmails(List\u003cString> emails) {\n        List\u003cString> results = new List\u003cString>();\n        if (emails == null) {\n            return results;\n        }\n        Set\u003cString> seen = new Set\u003cString>();\n        for (String email : emails) {\n            if (String.isBlank(email)) {\n                continue;\n            }\n            String normalized = email.trim().toLowerCase();\n            if (seen.add(normalized)) {\n                results.add(normalized);\n            }\n        }\n        return results;\n    }\n\n    public static Boolean hasDuplicate(List\u003cString> emails) {\n        if (emails == null) {\n            return false;\n        }\n        Set\u003cString> seen = new Set\u003cString>();\n        for (String email : emails) {\n            if (String.isBlank(email)) {\n                continue;\n            }\n            if (!seen.add(email.trim().toLowerCase())) {\n                return true;\n            }\n        }\n        return false;\n    }\n}\n```\n\n## 解説\n### ポイント\n- **Set の String は大文字・小文字を区別する**。String の `==` は区別しない（L1-01 の④）のに、Set と Map のキーは区別する。`'Taro@Example.com'` と `'taro@example.com'` は Set の中では別物なので、先に `toLowerCase()` でそろえる必要がある\n- **「覚えておく Set」+「結果の List」は重複排除の定番**。順番を保ちたいときはこの形にする。順番が要らなければ `new List\u003cString>(seen)` で Set をそのまま List にしてもよい\n- **そろえる処理（正規化）は1か所で決める**。`trim().toLowerCase()` を2つのメソッドで同じように書いている。L1-08 以降では、こうした共通処理を private メソッドに切り出す書き方も覚える\n- **重複が見つかった時点で `return true`**。最後まで調べる必要がないときは早めに抜ける\n\n### よくある間違い\n- `trim` か `toLowerCase` の片方だけで、`' taro@example.com '` や `'HANAKO@...'` が残る\n- `new Set\u003cString>(emails)` で Set に変換し、順番が崩れる・空要素が残る\n- `email.trim()` を `isBlank` の判定より前に書き、`null` で落ちる\n\n### 調べ先\n- Apex Reference Guide「Set Class」の `add`\n- Apex Reference Guide「String Class」の `trim` / `toLowerCase` / `isBlank`"},{"id":"L1-05","title":"カテゴリごとの件数を Map で数える","level":1,"type":"write","skills":["APEX-BASIC-02","APEX-BASIC-03","APEX-BASIC-04"],"difficulty":2,"minutes":20,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\nネットショップの注文データから、商品カテゴリの一覧（`List\u003cString>`）を受け取った。\nカテゴリごとに何件あるかを数え、一番多いカテゴリを求めるクラスを作りなさい。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n\n- **機能1：カテゴリごとに数える**\n  - カテゴリ名のリストを受け取り、カテゴリ名ごとの件数を返す（カテゴリ名から件数を引ける形にする）\n  - カテゴリ名の前後の空白は取り除いてから数える（`' 文具 '` は `'文具'` として数える）\n  - `null` や空文字・空白だけのカテゴリは `'未分類'` として数える\n  - 受け取ったリストが `null` なら、空の結果（0種類）を返す\n- **機能2：一番多いカテゴリを求める**\n  - 機能1で数えた結果から、件数が一番多いカテゴリ名を返す\n  - 件数が同じカテゴリがある場合は、名前を `compareTo` で比べて小さいほう（辞書順で先のもの）を返す\n  - 数えた結果が空なら `null` を返す\n\n開発者コンソールの「File → New → Apex Class」でクラスを作ること。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\nMap に「まだキーがなければ 1 を入れる、あれば今の値に 1 を足す」を、リストの要素の数だけ繰り返す。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n使うメソッド：`Map.containsKey` / `Map.get` / `Map.put` / `Map.keySet`、`String.isBlank`、`String.trim`、`String.compareTo`\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nAssert.isTrue(条件, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `'文具'`, `'食品'`, `'文具'`, `'家電'`, `null`, `'食品'`, `' 文具 '`, `''` | 文具 3件、食品 2件、家電 1件、未分類 2件（4種類） |\n| 1 | `null` | 0種類 |\n| 2 | 上の数えた結果 | `'文具'` |\n| 2 | B が2件・A が2件・C が1件 | `'A'`（同数なら辞書順で先） |\n| 2 | 空 | `null` |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nList\u003cString> items = new List\u003cString>{ '文具', '食品', '文具', '家電', null, '食品', ' 文具 ', '' };\nMap\u003cString, Integer> result = CategoryCounter.countByCategory(items);\n\nAssert.areEqual(3, result.get('文具'), '文具は3件');\nAssert.areEqual(2, result.get('食品'), '食品は2件');\nAssert.areEqual(1, result.get('家電'), '家電は1件');\nAssert.areEqual(2, result.get('未分類'), 'null と空文字は未分類で2件');\nAssert.areEqual(4, result.size(), 'カテゴリは4種類');\nAssert.areEqual('文具', CategoryCounter.topCategory(result), '一番多いのは文具');\n\nAssert.areEqual(0, CategoryCounter.countByCategory(null).size(), 'null なら空の Map');\n\nMap\u003cString, Integer> tie = new Map\u003cString, Integer>{ 'B' => 2, 'A' => 2, 'C' => 1 };\nAssert.areEqual('A', CategoryCounter.topCategory(tie), '同数なら辞書順で先のもの');\nAssert.isNull(CategoryCounter.topCategory(new Map\u003cString, Integer>()), '空なら null');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class CategoryCounter {\n    public static Map\u003cString, Integer> countByCategory(List\u003cString> categories) {\n        Map\u003cString, Integer> counts = new Map\u003cString, Integer>();\n        if (categories == null) {\n            return counts;\n        }\n        for (String category : categories) {\n            String key = String.isBlank(category) ? '未分類' : category.trim();\n            if (counts.containsKey(key)) {\n                counts.put(key, counts.get(key) + 1);\n            } else {\n                counts.put(key, 1);\n            }\n        }\n        return counts;\n    }\n\n    public static String topCategory(Map\u003cString, Integer> counts) {\n        String top = null;\n        for (String key : counts.keySet()) {\n            if (top == null\n                    || counts.get(key) > counts.get(top)\n                    || (counts.get(key) == counts.get(top) && key.compareTo(top) \u003c 0)) {\n                top = key;\n            }\n        }\n        return top;\n    }\n}\n```\n\n## 解説\n### ポイント\n- **「キーごとに数える」は Map の一番よく使う形**。現場では「取引先 Id ごとの商談の件数」「担当者ごとのケースの件数」など、毎日のように書く。`Map\u003cId, Integer>` や `Map\u003cId, List\u003cSObject>>` に形を変えて何度も出てくる\n- **`String.isBlank` は null・空文字・空白だけをまとめて判定できる**。`category == null || category == ''` と書くより短く、空白だけのケースも拾える\n- **`String.isBlank` は static メソッド**なので、`category.isBlank()` ではなく `String.isBlank(category)` と書く。`category` が `null` のとき、`category.trim()` のようにインスタンスメソッドを呼ぶと `NullPointerException` になる。先に `isBlank` で判定してから `trim` を呼ぶ順番が大事\n- **Map の順番に頼らない**。`keySet()` の順番は要件にしないのが安全なので、同数のときのルール（辞書順）を明示的に書いている\n\n### よくある間違い\n- `counts.get(key) + 1` をキーがないときにも実行して `NullPointerException`（`get` はキーがないと `null` を返す）\n- `trim` を `isBlank` の判定より前に呼んで、`null` のときに落ちる\n- 同数のときの比較を忘れ、実行するたびに結果が変わりうるコードになる\n\n### 別解\n`containsKey` の代わりに、null 合体演算子 `??` で1行にまとめることもできる。\n\n```apex\ncounts.put(key, (counts.get(key) ?? 0) + 1);\n```\n\n### 調べ先\n- Apex Reference Guide「Map Class」\n- Apex Reference Guide「String Class」の `isBlank` / `trim` / `compareTo`"},{"id":"L1-06","title":"会員ランクと割引率を判定する（if と switch）","level":1,"type":"write","skills":["APEX-BASIC-01","APEX-BASIC-03"],"difficulty":2,"minutes":20,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\n会員のポイントからランクを決め、ランクに応じた割引をした価格を返すクラスを作りなさい。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n\n- **機能1：ランクを決める**\n  - ポイントを受け取り、ランクを返す\n\n  | ポイント | ランク |\n  |---|---|\n  | 0〜999 | `ブロンズ` |\n  | 1000〜4999 | `シルバー` |\n  | 5000〜9999 | `ゴールド` |\n  | 10000 以上 | `プラチナ` |\n  | `null` またはマイナス | `対象外` |\n\n- **機能2：割引率を決める**\n  - ランクを受け取り、割引率を返す\n  - **`switch` を使って**書くこと\n  - `プラチナ` → `0.15`、`ゴールド` → `0.10`、`シルバー` → `0.05`、それ以外（`ブロンズ`・`対象外`・`null` など）→ `0`\n- **機能3：割引後の価格を出す**\n  - ポイントと価格から、割引後の価格を返す（`価格 × (1 - 割引率)`）\n  - 機能1・2を使うこと\n  - **1円未満は切り捨て**る\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\nApex の `switch` は「値がこれと一致したら」の分岐しか書けず、「1000 以上なら」のような範囲の条件は書けない。範囲の判定は `if` / `else if` で書く。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n```apex\nswitch on rank {\n    when 'プラチナ' { ... }\n    when else { ... }\n}\n```\n切り捨ては `setScale(0, RoundingMode.DOWN)`。\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nAssert.isTrue(条件, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `0` / `999` | `ブロンズ` |\n| 1 | `1000` / `4999` | `シルバー` |\n| 1 | `5000` | `ゴールド` |\n| 1 | `10000` | `プラチナ` |\n| 1 | `-1` / `null` | `対象外` |\n| 3 | ポイント `500`、価格 `999` | `999`（ブロンズは割引なし） |\n| 3 | ポイント `1000`、価格 `999` | `949`（5%引き：949.05 → 949） |\n| 3 | ポイント `6000`、価格 `999` | `899`（10%引き：899.1 → 899） |\n| 3 | ポイント `20000`、価格 `999` | `849`（15%引き：849.15 → 849） |\n| 3 | ポイント `null`、価格 `999` | `999`（対象外は割引なし） |\n\n金額は `String.valueOf(結果)` が上の文字列になることで確かめる（`949.00` などにならないこと）。\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nAssert.areEqual('ブロンズ', MemberRank.getRank(0));\nAssert.areEqual('ブロンズ', MemberRank.getRank(999));\nAssert.areEqual('シルバー', MemberRank.getRank(1000));\nAssert.areEqual('シルバー', MemberRank.getRank(4999));\nAssert.areEqual('ゴールド', MemberRank.getRank(5000));\nAssert.areEqual('プラチナ', MemberRank.getRank(10000));\nAssert.areEqual('対象外', MemberRank.getRank(-1));\nAssert.areEqual('対象外', MemberRank.getRank(null));\n\nAssert.areEqual('999', String.valueOf(MemberRank.getDiscountedPrice(500, 999)), 'ブロンズは割引なし');\nAssert.areEqual('949', String.valueOf(MemberRank.getDiscountedPrice(1000, 999)), 'シルバーは5%引き（949.05 → 949）');\nAssert.areEqual('899', String.valueOf(MemberRank.getDiscountedPrice(6000, 999)), 'ゴールドは10%引き（899.1 → 899）');\nAssert.areEqual('849', String.valueOf(MemberRank.getDiscountedPrice(20000, 999)), 'プラチナは15%引き（849.15 → 849）');\nAssert.areEqual('999', String.valueOf(MemberRank.getDiscountedPrice(null, 999)), '対象外は割引なし');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class MemberRank {\n    public static String getRank(Integer points) {\n        if (points == null || points \u003c 0) {\n            return '対象外';\n        } else if (points >= 10000) {\n            return 'プラチナ';\n        } else if (points >= 5000) {\n            return 'ゴールド';\n        } else if (points >= 1000) {\n            return 'シルバー';\n        }\n        return 'ブロンズ';\n    }\n\n    public static Decimal getDiscountRate(String rank) {\n        Decimal rate;\n        switch on rank {\n            when 'プラチナ' {\n                rate = 0.15;\n            }\n            when 'ゴールド' {\n                rate = 0.10;\n            }\n            when 'シルバー' {\n                rate = 0.05;\n            }\n            when else {\n                rate = 0;\n            }\n        }\n        return rate;\n    }\n\n    public static Decimal getDiscountedPrice(Integer points, Decimal price) {\n        Decimal rate = getDiscountRate(getRank(points));\n        return (price * (1 - rate)).setScale(0, RoundingMode.DOWN);\n    }\n}\n```\n\n## 解説\n### ポイント\n- **範囲の判定は大きいほうから `else if` で並べる**。`points >= 10000` → `>= 5000` → `>= 1000` の順にすると、各条件で上限を書かなくて済む。小さいほうから書くと `points >= 1000 && points \u003c 5000` のように両側の条件が必要になる\n- **null とマイナスは最初にはじく**。`points \u003c 0` より前に `points == null` を書く。`null \u003c 0` を評価すると `NullPointerException` になるが、`||` は左が true なら右を評価しないので安全\n- **`switch on` は値の一致で分岐する**。`when 'A', 'B'` のようにカンマで複数の値を書ける。`when else` はどれにも当てはまらないとき。`switch` は `null` にも対応していて、`null` は `when null` か `when else` に入る\n- **switch の中で値を決めて、最後に1回だけ return する**。各 `when` の中で直接 `return` する書き方もあるが、変数に入れてから返すほうが、あとで処理を足すときに読みやすい\n- **切り捨ては `RoundingMode.DOWN`**。マイナスの値まで考えると `DOWN`（0 に近づける）と `FLOOR`（小さいほうへ）は違う結果になるが、価格は正の数なのでどちらでも同じ\n- **メソッドからメソッドを呼んで組み立てる**。メソッド3は1・2を組み合わせているだけ。小さいメソッドに分けておくと、それぞれを別々に確かめられる\n\n### よくある間違い\n- `switch` で `when >= 1000` のように範囲を書こうとしてコンパイルエラー\n- 割引率を `15` のように百分率で返して、価格がマイナスになる\n- 切り捨てを忘れて `949.05` が返る\n\n### 調べ先\n- Apex Developer Guide「Switch Statements」\n- Apex Reference Guide「Decimal Class」の `setScale`、「RoundingMode Enum」"},{"id":"L1-07","title":"氏名の整形と契約残り日数の計算","level":1,"type":"write","skills":["APEX-BASIC-03"],"difficulty":2,"minutes":25,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\n顧客一覧の画面に出す文字列を作るクラスを作りなさい。氏名の表示、電話番号の伏せ字、契約の残り日数を扱う。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n\n- **機能1：氏名を表示用にそろえる**\n  - 姓と名を受け取り、表示用の氏名を返す\n  - 姓と名の前後の空白を取り除き、**半角スペース1つ**でつなぐ（`'山田 太郎'`）\n  - 片方が空（`null`・空文字・空白だけ）なら、もう片方だけを返す\n  - 両方とも空なら `'（未設定）'` を返す\n- **機能2：電話番号を伏せ字にする**\n  - 電話番号を受け取り、ハイフンを取り除いて**下4桁以外を `*` に**したものを返す（`'090-1234-5678'` → `'*******5678'`）\n  - ハイフンを除いて4文字以下なら、ハイフンを除いたものをそのまま返す\n  - `null` なら `null` を返す\n- **機能3：契約終了日までの日数を出す**\n  - 契約終了日を受け取り、今日からの日数を返す（明日なら `1`、昨日なら `-1`）\n  - `null` なら `null` を返す\n- **機能4：契約の状態を返す**\n  - 契約終了日を受け取り、残り日数がマイナスなら `'期限切れ'`、0〜30日なら `'残りわずか'`、31日以上なら `'有効'`、`null` なら `'未設定'` を返す\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n使うメソッド：`String.isBlank`、`trim`、`replace`、`length`、`right`、`repeat`、`Date.today`、`daysBetween`\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n`'*'.repeat(3)` は `'***'`。`'12345678'.right(4)` は `'5678'`。\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nAssert.isTrue(条件, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | 姓 `' 山田 '`、名 `'太郎'` | `'山田 太郎'` |\n| 1 | 姓 `'山田'`、名 `null` | `'山田'` |\n| 1 | 姓 `'  '`、名 `'太郎'` | `'太郎'` |\n| 1 | 姓 `null`、名 `''` | `'（未設定）'` |\n| 2 | `'090-1234-5678'` | `'*******5678'` |\n| 2 | `'0312347890'` | `'******7890'` |\n| 2 | `'12-34'` | `'1234'` |\n| 2 | `null` | `null` |\n| 3 | 今日の30日後 / 5日前 / `null` | `30` / `-5` / `null` |\n| 4 | 昨日 | `'期限切れ'` |\n| 4 | 今日 / 30日後 | `'残りわずか'` |\n| 4 | 31日後 | `'有効'` |\n| 4 | `null` | `'未設定'` |\n\n「今日の30日後」は `Date.today().addDays(30)` で作れる。\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nAssert.areEqual('山田 太郎', CustomerFormatter.formatName(' 山田 ', '太郎'));\nAssert.areEqual('山田', CustomerFormatter.formatName('山田', null));\nAssert.areEqual('太郎', CustomerFormatter.formatName('  ', '太郎'));\nAssert.areEqual('（未設定）', CustomerFormatter.formatName(null, ''));\n\nAssert.areEqual('*******5678', CustomerFormatter.maskPhone('090-1234-5678'));\nAssert.areEqual('******7890', CustomerFormatter.maskPhone('0312347890'));\nAssert.areEqual('1234', CustomerFormatter.maskPhone('12-34'));\nAssert.isNull(CustomerFormatter.maskPhone(null));\n\nDate today = Date.today();\nAssert.areEqual(30, CustomerFormatter.daysUntil(today.addDays(30)));\nAssert.areEqual(-5, CustomerFormatter.daysUntil(today.addDays(-5)));\nAssert.isNull(CustomerFormatter.daysUntil(null));\n\nAssert.areEqual('期限切れ', CustomerFormatter.contractStatus(today.addDays(-1)));\nAssert.areEqual('残りわずか', CustomerFormatter.contractStatus(today));\nAssert.areEqual('残りわずか', CustomerFormatter.contractStatus(today.addDays(30)));\nAssert.areEqual('有効', CustomerFormatter.contractStatus(today.addDays(31)));\nAssert.areEqual('未設定', CustomerFormatter.contractStatus(null));\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class CustomerFormatter {\n    public static String formatName(String lastName, String firstName) {\n        Boolean hasLast = String.isNotBlank(lastName);\n        Boolean hasFirst = String.isNotBlank(firstName);\n        if (hasLast && hasFirst) {\n            return lastName.trim() + ' ' + firstName.trim();\n        } else if (hasLast) {\n            return lastName.trim();\n        } else if (hasFirst) {\n            return firstName.trim();\n        }\n        return '（未設定）';\n    }\n\n    public static String maskPhone(String phone) {\n        if (phone == null) {\n            return null;\n        }\n        String digits = phone.replace('-', '');\n        if (digits.length() \u003c= 4) {\n            return digits;\n        }\n        return '*'.repeat(digits.length() - 4) + digits.right(4);\n    }\n\n    public static Integer daysUntil(Date endDate) {\n        if (endDate == null) {\n            return null;\n        }\n        return Date.today().daysBetween(endDate);\n    }\n\n    public static String contractStatus(Date endDate) {\n        Integer days = daysUntil(endDate);\n        if (days == null) {\n            return '未設定';\n        } else if (days \u003c 0) {\n            return '期限切れ';\n        } else if (days \u003c= 30) {\n            return '残りわずか';\n        }\n        return '有効';\n    }\n}\n```\n\n## 解説\n### ポイント\n- **`String.isBlank` / `String.isNotBlank` は null でも安全**。static メソッドなので、変数が `null` でも呼べる。`lastName.trim()` のようなインスタンスメソッドは、null でないと確かめてから呼ぶ\n- **`a.daysBetween(b)` は「a から b まで」の日数**。`b` が `a` より前ならマイナスになる。向きを逆にすると符号が反対になるので注意。`Date.today().daysBetween(endDate)` と読み下せる順番で書く\n- **境界値は確認コードで必ず試す**。「0〜30日なら残りわずか」のような条件では、`-1`・`0`・`30`・`31` のように境目の両側を確かめる。テストクラス（Lv4）でも同じ考え方を使う\n- **伏せ字の長さは元の長さから計算する**。固定で `'*******'` と書くと、固定電話（10桁）のときにずれる\n\n### よくある間違い\n- `formatName` で `lastName + ' ' + firstName` とだけ書き、片方が null のとき `'山田 null'` になる（Apex では null を文字列連結すると `'null'` という文字になる）\n- `daysBetween` の向きを逆にして、期限切れと有効が入れ替わる\n- `replace` の結果を変数に入れ忘れる（String は変更できないので、`phone.replace(...)` は新しい文字列を返すだけ）\n\n### 調べ先\n- Apex Reference Guide「String Class」の `isNotBlank` / `replace` / `right` / `repeat`\n- Apex Reference Guide「Date Class」の `today` / `daysBetween`"},{"id":"L1-08","title":"買い物かごクラスを作る（static とインスタンス）","level":1,"type":"write","skills":["APEX-BASIC-04","APEX-BASIC-02"],"difficulty":2,"minutes":30,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\nネットショップの買い物かごを表すクラスを作りなさい。\nかごは利用者ごとに1つずつ作られ（インスタンス）、税率や「作られたかごの数」はすべてのかごで共通（static）である。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n**どれを `static` にして、どれをかごごと（インスタンス）にするかを決めるのが、この問題の練習**。\n\n- **商品**\n  - 商品名・単価・数量を持つ「商品」の型も作る（買い物かごのクラスの中に作る）\n  - 商品ごとに金額（`単価 × 数量`）を出せる\n- **税率**\n  - 10%。すべてのかごで共通で、途中で変えられない値にする\n- **かごを作る**\n  - かごを作るときに持ち主の名前を渡す\n  - かごを1つ作るたびに、**これまでに作られたかごの数**が1増える\n- **かごでできること**\n  - 持ち主の名前を返す\n  - 商品を追加する（商品名・単価・数量を渡す）。数量が `null` または 0 以下なら何もしない\n  - 入っている商品の**個数の合計**を返す（ノート3冊とペン2本なら `5`）\n  - 税抜の合計金額を返す\n  - 税込の合計金額を返す（`税抜合計 × (1 + 税率)`、1円未満は切り捨て）\n- **かごを作らなくてもできること**\n  - これまでに作られたかごの数を返す\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\nかごの数は、すべてのインスタンスで1つの値を共有したいので `private static Integer` の変数（static 変数）にする。商品のリストはかごごとに別なので、static を付けない。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n内部クラスはクラスの中に `public class 内部クラス名 { ... }` と書く。外から使うときは `外側のクラス名.内部クラス名` と書く。\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nAssert.isTrue(条件, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 操作 | 結果 |\n|---|---|\n| 太郎のかごを作り、ノート（150円×3）・ペン（120円×2）・消しゴム（80円×0）・定規（200円×数量 `null`）を追加 | 持ち主 `太郎`、個数 `5`、税抜 `690`、税込 `759` |\n| 花子のかごを作り、ペン（99円×1）を追加 | 税込 `108`（108.9 を切り捨て）、個数 `1`（太郎のかごの商品は入っていない） |\n| ここまでで作られたかごの数 | `2` |\n| 商品「ノート（150円×4）」だけを作って金額を出す | `600` |\n\n金額は `String.valueOf(結果)` が上の文字列になることで確かめる。\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nShoppingCart cart1 = new ShoppingCart('太郎');\ncart1.addItem('ノート', 150, 3);\ncart1.addItem('ペン', 120, 2);\ncart1.addItem('消しゴム', 80, 0);\ncart1.addItem('定規', 200, null);\n\nAssert.areEqual('太郎', cart1.getOwnerName());\nAssert.areEqual(5, cart1.getItemCount(), '数量0とnullは追加されない');\nAssert.areEqual('690', String.valueOf(cart1.getSubtotal()), '150×3 + 120×2');\nAssert.areEqual('759', String.valueOf(cart1.getTotalWithTax()), '690×1.1');\n\nShoppingCart cart2 = new ShoppingCart('花子');\ncart2.addItem('ペン', 99, 1);\nAssert.areEqual('108', String.valueOf(cart2.getTotalWithTax()), '108.9 は切り捨てて 108');\nAssert.areEqual(1, cart2.getItemCount(), 'cart1 の商品は入っていない');\n\nAssert.areEqual(2, ShoppingCart.getCartCount(), 'かごは2つ作られた');\n\nShoppingCart.Item item = new ShoppingCart.Item('ノート', 150, 4);\nAssert.areEqual('600', String.valueOf(item.getAmount()));\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n```apex\npublic class ShoppingCart {\n    public static final Decimal TAX_RATE = 0.10;\n    private static Integer cartCount = 0;\n\n    private String ownerName;\n    private List\u003cItem> items = new List\u003cItem>();\n\n    public class Item {\n        public String name;\n        public Decimal unitPrice;\n        public Integer quantity;\n\n        public Item(String name, Decimal unitPrice, Integer quantity) {\n            this.name = name;\n            this.unitPrice = unitPrice;\n            this.quantity = quantity;\n        }\n\n        public Decimal getAmount() {\n            return unitPrice * quantity;\n        }\n    }\n\n    public ShoppingCart(String ownerName) {\n        this.ownerName = ownerName;\n        cartCount++;\n    }\n\n    public String getOwnerName() {\n        return ownerName;\n    }\n\n    public void addItem(String name, Decimal unitPrice, Integer quantity) {\n        if (quantity == null || quantity \u003c= 0) {\n            return;\n        }\n        items.add(new Item(name, unitPrice, quantity));\n    }\n\n    public Integer getItemCount() {\n        Integer count = 0;\n        for (Item item : items) {\n            count += item.quantity;\n        }\n        return count;\n    }\n\n    public Decimal getSubtotal() {\n        Decimal subtotal = 0;\n        for (Item item : items) {\n            subtotal += item.getAmount();\n        }\n        return subtotal;\n    }\n\n    public Decimal getTotalWithTax() {\n        return (getSubtotal() * (1 + TAX_RATE)).setScale(0, RoundingMode.DOWN);\n    }\n\n    public static Integer getCartCount() {\n        return cartCount;\n    }\n}\n```\n\n## 解説\n### ポイント\n- **static は「クラスに1つ」、インスタンス変数は「オブジェクトごとに1つ」**。`cartCount` は cart1 と cart2 で共有されるので `2` になる。`items` は static でないので、cart2 には cart1 の商品が入らない\n- **static メソッドからインスタンス変数は使えない**。`getCartCount()` の中で `ownerName` を使うとコンパイルエラーになる。static メソッドは「どのかご」か決まっていない状態で呼ばれるため\n- **`this.ownerName = ownerName`**：引数とフィールドが同じ名前のとき、`this.` を付けたほうがフィールド\n- **フィールドは `private`、操作は `public` メソッドで**。`items` を外から直接いじれないようにし、`addItem` を通すことで「数量0は追加しない」というルールを必ず守らせられる\n- **Apex の static 変数は1回の実行（トランザクション）の間だけ値が残る**。匿名実行をもう一度すると `cartCount` は 0 から数え直しになる。Java のようにサーバーが動いている間ずっと残るわけではない。この性質は、Lv3 でトリガーの再帰を止めるときに使う\n\n### よくある間違い\n- `cartCount` に static を付け忘れて、いつも `1` になる\n- `items` に static を付けてしまい、cart2 に cart1 の商品が入る\n- `subtotal` を `Decimal subtotal;` と初期化せずに `+=` して `NullPointerException`\n\n### 調べ先\n- Apex Developer Guide「Classes, Objects, and Interfaces」「Static and Instance Methods, Variables, and Initialization Code」\n- Apex Developer Guide「Inner Classes」"},{"id":"L1-09","title":"SObject を作って項目を扱う","level":1,"type":"write","skills":["APEX-BASIC-05","PF-MODEL-01"],"difficulty":2,"minutes":30,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\nApex では、Salesforce のレコードを `Account` や `Contact` といった型（SObject）として扱う。\nこの問題では**保存（DML）はせず**、メモリ上でレコードを作り、項目を読み書きする練習をする。保存は Lv2 で扱う。\n\n## 準備：項目の API 参照名を調べる\nPlayground の **設定 → オブジェクトマネージャ → 取引先 → 項目とリレーション** を開き、次の表を埋める。Apex では表示ラベルではなく**API 参照名**を使う。\n\n| 表示ラベル | API 参照名 | データ型 |\n|---|---|---|\n| 取引先名 | | |\n| 業種 | | |\n| 年間売上 | | |\n| 評価 | | |\n| 電話 | | |\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n\n- **機能1：取引先を作る**\n  - 取引先名・業種・年間売上を受け取り、それを設定した取引先を返す（保存はしない）\n  - 年間売上に応じて**評価**を設定する\n    - 1億以上 → `Hot`、1千万以上 → `Warm`、1千万未満 → `Cold`\n    - 年間売上が `null` なら評価は設定しない（`null` のまま）\n- **機能2：レコードの中身を文字列にする**\n  - レコードと、表示したい項目名のリストを受け取り、`項目名=値` を `, `（カンマと半角スペース）でつないだ文字列を返す\n  - 値が `null` の項目は `項目名=(空)` にする\n  - **取引先だけでなく、取引先責任者など、どのオブジェクトのレコードでも使えるようにする**（受け取る型をよく考える）\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n`new Account(Name = 'xxx', Industry = 'yyy')` のように、作るときに項目をまとめて設定できる。あとから `acc.Rating = 'Hot';` と書いてもよい。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\nSObject 型の変数では `record.Name` のように書けない。`record.get('Name')` で項目名を文字列で指定して値を取り出す。戻り値は `Object` 型なので、文字列にするには `String.valueOf` を使う。文字列をつなぐには `String.join(リスト, ', ')`。\n\u003c/details>\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nAssert.isTrue(条件, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `'テスト商事'`、`'Manufacturing'`、`150000000` | 取引先名 `テスト商事`、業種 `Manufacturing`、評価 `Hot`、Id は `null`（保存していない） |\n| 1 | 年間売上 `10000000` | 評価 `Warm` |\n| 1 | 年間売上 `9999999` | 評価 `Cold` |\n| 1 | 年間売上 `null` | 評価 `null` |\n| 2 | 上の取引先、項目 `Name`, `Industry`, `Phone` | `'Name=テスト商事, Industry=Manufacturing, Phone=(空)'` |\n| 2 | 取引先責任者（`LastName = '山田'`, `Email = 'yamada@example.com'`）、項目 `LastName`, `Email` | `'LastName=山田, Email=yamada@example.com'` |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nAccount acc = AccountBuilder.buildAccount('テスト商事', 'Manufacturing', 150000000);\nAssert.areEqual('テスト商事', acc.Name);\nAssert.areEqual('Manufacturing', acc.Industry);\nAssert.areEqual('Hot', acc.Rating);\nAssert.isNull(acc.Id, '保存していないので Id はない');\n\nAssert.areEqual('Warm', AccountBuilder.buildAccount('A', null, 10000000).Rating);\nAssert.areEqual('Cold', AccountBuilder.buildAccount('B', null, 9999999).Rating);\nAssert.isNull(AccountBuilder.buildAccount('C', null, null).Rating);\n\nString text = AccountBuilder.describe(acc, new List\u003cString>{ 'Name', 'Industry', 'Phone' });\nAssert.areEqual('Name=テスト商事, Industry=Manufacturing, Phone=(空)', text);\n\nContact con = new Contact(LastName = '山田', Email = 'yamada@example.com');\nAssert.areEqual('LastName=山田, Email=yamada@example.com',\n    AccountBuilder.describe(con, new List\u003cString>{ 'LastName', 'Email' }), 'Contact でも使える');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n### 準備の表\n| 表示ラベル | API 参照名 | データ型 |\n|---|---|---|\n| 取引先名 | `Name` | 名前（テキスト） |\n| 業種 | `Industry` | 選択リスト |\n| 年間売上 | `AnnualRevenue` | 通貨 |\n| 評価 | `Rating` | 選択リスト |\n| 電話 | `Phone` | 電話 |\n\n### コード\n```apex\npublic class AccountBuilder {\n    public static Account buildAccount(String name, String industry, Decimal annualRevenue) {\n        Account acc = new Account(\n            Name = name,\n            Industry = industry,\n            AnnualRevenue = annualRevenue\n        );\n        if (annualRevenue == null) {\n            return acc;\n        }\n        if (annualRevenue >= 100000000) {\n            acc.Rating = 'Hot';\n        } else if (annualRevenue >= 10000000) {\n            acc.Rating = 'Warm';\n        } else {\n            acc.Rating = 'Cold';\n        }\n        return acc;\n    }\n\n    public static String describe(SObject record, List\u003cString> fieldNames) {\n        List\u003cString> parts = new List\u003cString>();\n        for (String fieldName : fieldNames) {\n            Object value = record.get(fieldName);\n            parts.add(fieldName + '=' + (value == null ? '(空)' : String.valueOf(value)));\n        }\n        return String.join(parts, ', ');\n    }\n}\n```\n\n## 解説\n### ポイント\n- **SObject はレコードを表す型**。`Account` や `Contact` など具体的な型なら `acc.Name` と書け、項目名の間違いはコンパイル時に見つかる。`SObject` 型はどのオブジェクトでも入れられる代わりに、`get('項目名')` / `put('項目名', 値)` で文字列を使って扱う\n- **API 参照名と表示ラベルは別物**。画面の「年間売上」は Apex では `AnnualRevenue`。カスタム項目は `Contract_End__c` のように `__c` が付く。設計書が表示ラベルで書かれていることは多いので、オブジェクトマネージャで API 参照名を確かめる習慣をつける\n- **選択リストの値も API 名で書く**。評価の `Hot` / `Warm` / `Cold` は、日本語の画面では「高」「中」「低」と表示されることがあるが、Apex で使うのは API 名のほう（オブジェクトマネージャの選択リスト値で確認できる）\n- **保存していないレコードの `Id` は `null`**。`insert` すると Id が付く（Lv2）\n- **メモリ上で作ったレコードは、設定していない項目を読んでも `null`**。一方、SOQL で取得したレコードは、SELECT に書いていない項目を読むとエラーになる（Lv2 で扱う）\n\n### よくある間違い\n- `acc.業種` や `acc.AnnualRevenue__c` のように、表示ラベルやありもしない `__c` を付ける\n- `describe` の引数を `Account` 型にして、Contact で使えない\n- `record.get(fieldName)` の戻り値をそのまま `String` に代入してコンパイルエラー（戻り値は `Object` 型）\n\n### 調べ先\n- Apex Developer Guide「Working with sObjects」\n- Apex Reference Guide「SObject Class」の `get` / `put`\n- Object Reference for Salesforce「Account」"},{"id":"L1-10","title":"NullPointerException を直す","level":1,"type":"fix","skills":["APEX-BASIC-02","APEX-BASIC-03","WORK-LOOKUP-02"],"difficulty":2,"minutes":25,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\n`'顧客名:商品名'` という形の注文データのリストを受け取り、顧客ごとに商品名をまとめるクラスを先輩が書いた。\nところが、動かすとエラーになる。バグを**すべて**見つけて直しなさい。\n\n```apex\npublic class OrderSummary {\n    public static Map\u003cString, List\u003cString>> groupByCustomer(List\u003cString> orders) {\n        Map\u003cString, List\u003cString>> result;\n        for (String orderText : orders) {\n            String customer = orderText.split(':')[0];\n            String product = orderText.split(':')[1];\n            result.get(customer).add(product);\n        }\n        return result;\n    }\n}\n```\n\n## 要件（直したあとの動き）\n- 顧客名をキー、その顧客の商品名のリスト（出てきた順）を値にした Map を返す\n- 顧客名・商品名の前後の空白は取り除く\n- 次の要素は**飛ばす**（エラーにしない）\n  - `null`・空文字・空白だけの要素\n  - `:` を含まない要素（`'不正なデータ'`）\n  - 顧客名か商品名が空の要素（`'田中:'`）\n- 引数が `null` なら空の Map を返す\n\n## 進め方\n1. まず上のコードをそのまま保存し、下の「確認方法」を匿名実行して、どんなエラーが出るかを見る\n2. エラーメッセージと行番号から原因を考えて直す\n3. 1つ直すと次のエラーが出ることがある。確認方法が通るまで繰り返す\n4. 見つけたバグを箇条書きで書き出す\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n`Attempt to de-reference a null object` は「null に対して `.` でメソッドや項目を使おうとした」という意味。その行で `.` の左側にあるものが null になっていないか見る。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n`'田中:'.split(':')` の結果は `['田中', '']` ではなく `['田中']`（要素1つ）になる。末尾の空の要素は捨てられる。\n\u003c/details>\n\n## 確認方法\n```apex\nList\u003cString> input = new List\u003cString>{\n    '佐藤:ノート', '鈴木:ペン', '佐藤:ペン', null, '不正なデータ', '田中:', ' 佐藤 : 消しゴム '\n};\nMap\u003cString, List\u003cString>> result = OrderSummary.groupByCustomer(input);\n\nAssert.areEqual(2, result.size(), '佐藤と鈴木の2人');\nAssert.areEqual(new List\u003cString>{ 'ノート', 'ペン', '消しゴム' }, result.get('佐藤'));\nAssert.areEqual(new List\u003cString>{ 'ペン' }, result.get('鈴木'));\nAssert.isFalse(result.containsKey('田中'), '商品名が空なので飛ばす');\nAssert.areEqual(0, OrderSummary.groupByCustomer(null).size(), 'null なら空の Map');\n\nSystem.debug('すべて正解です');\n```\n\n期待される結果：エラーが出ず、デバッグログに `すべて正解です` が出る。","answer":"## 解答例\n### 見つかるバグ\n1. `result` を初期化していない（`null` のまま `result.get` を呼んでいる）→ `NullPointerException`\n2. その顧客がまだ Map にないとき、`result.get(customer)` が `null` を返し、`.add` で `NullPointerException`\n3. 引数 `orders` が `null` のとき、`for` ループで `NullPointerException`\n4. 要素が `null` のとき、`orderText.split` で `NullPointerException`\n5. `:` がない要素や `'田中:'` で、`split(':')[1]` が `ListException: List index out of bounds: 1`\n6. 前後の空白を取り除いていない（`' 佐藤 '` が別の顧客になる）\n\n### 直したコード\n```apex\npublic class OrderSummary {\n    public static Map\u003cString, List\u003cString>> groupByCustomer(List\u003cString> orders) {\n        Map\u003cString, List\u003cString>> result = new Map\u003cString, List\u003cString>>();\n        if (orders == null) {\n            return result;\n        }\n        for (String orderText : orders) {\n            if (String.isBlank(orderText)) {\n                continue;\n            }\n            List\u003cString> parts = orderText.split(':');\n            if (parts.size() \u003c 2 || String.isBlank(parts[0]) || String.isBlank(parts[1])) {\n                continue;\n            }\n            String customer = parts[0].trim();\n            String product = parts[1].trim();\n            if (!result.containsKey(customer)) {\n                result.put(customer, new List\u003cString>());\n            }\n            result.get(customer).add(product);\n        }\n        return result;\n    }\n}\n```\n\n## 解説\n### ポイント\n- **`NullPointerException` は Apex で一番多いエラー**。原因はほぼ次の3つ\n  - 変数を宣言しただけで `new` していない（バグ1）\n  - `Map.get` がキーなしで `null` を返した（バグ2）\n  - 引数や要素が `null` で渡ってきた（バグ3・4）\n- **`Map\u003cキー, List\u003c...>>` に追加するときの定番の形**：「キーがなければ空のリストを入れる → `get` して `add`」。Lv2 以降で `Map\u003cId, List\u003cContact>>` を作るときにそのまま使う\n- **配列の番号を使う前に `size()` を確かめる**。外から来たデータ（CSV・画面の入力・外部システム）は、形が崩れている前提で書く\n- **1つ直すと次のエラーが出るのは普通**。エラーは最初に起きたものしか表示されない。メッセージの行番号を見て、1つずつつぶす\n\n### よくある間違い\n- `result = new Map\u003c...>()` だけ直して、バグ2に気づかない\n- `split(':')` の結果を2回作っている元のコードのままにする（動くが無駄。1回だけ分割して変数に入れる）\n- `try { ... } catch (Exception e) {}` で全部包んでエラーを消す（不正なデータ以外のエラーも隠れてしまう）\n\n### 調べ先\n- Apex Reference Guide「String Class」の `split`\n- Apex Reference Guide「Map Class」の `containsKey` / `get` / `put`"},{"id":"L1-11","title":"エラーメッセージから原因を答える","level":1,"type":"error","skills":["WORK-LOOKUP-02","APEX-BASIC-01","APEX-BASIC-02"],"difficulty":1,"minutes":15,"environment":"none","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\n次の①〜⑥は、匿名実行したときに出たエラーメッセージと、そのコードである。\nそれぞれについて、**(a) 何が原因か** と **(b) どう直すか** を答えなさい。\n（エラーの表示形式や列番号は、実行する画面によって少し違うことがある）\n\n### ①\n```apex\nString memo;\nInteger len = memo.length();\n```\n```\nLine: 2, Column: 1\nSystem.NullPointerException: Attempt to de-reference a null object\n```\n\n### ②\n```apex\nList\u003cInteger> nums = new List\u003cInteger>{ 1, 2, 3 };\nInteger last = nums[3];\n```\n```\nLine: 2, Column: 1\nSystem.ListException: List index out of bounds: 3\n```\n\n### ③\n```apex\nString input = '12a';\nInteger qty = Integer.valueOf(input);\n```\n```\nLine: 2, Column: 1\nSystem.TypeException: Invalid integer: 12a\n```\n\n### ④\n```apex\nDecimal total = 100;\nInteger count = 0;\nDecimal avg = total / count;\n```\n```\nLine: 3, Column: 1\nSystem.MathException: Divide by 0\n```\n\n### ⑤\n```apex\nInteger total = 10;\nSystem.debug(totl);\n```\n```\nCompile error at line 2 column 14\nVariable does not exist: totl\n```\n\n### ⑥\n```apex\nInteger n = '10';\n```\n```\nCompile error at line 1 column 13\nIllegal assignment from String to Integer\n```","answer":"## 解答例\n| 番号 | (a) 原因 | (b) 直し方 |\n|---|---|---|\n| ① | `memo` に何も入れておらず `null`。`null` に対して `.length()` を呼んだ | 値を入れる。入らない可能性があるなら `memo == null ? 0 : memo.length()` や `String.isBlank(memo)` で先に確かめる |\n| ② | 要素は3つで、番号は 0〜2。存在しない3番を読んだ | 最後の要素は `nums[nums.size() - 1]`。番号を使う前に `size()` を確かめる |\n| ③ | `'12a'` は数字ではないので Integer に変換できない | 変換前に `input.isNumeric()` で確かめる。または `try` / `catch (TypeException e)` で受け止めてエラーメッセージを出す |\n| ④ | 0 で割った | 割る前に `count == 0` を確かめ、0 件のときの値（`0` や `null`）を決めておく |\n| ⑤ | 変数名のつづり間違い（`total` を `totl` と書いた） | 正しい変数名に直す |\n| ⑥ | 文字列 `'10'` を Integer の変数に入れようとした | 数値なら `Integer n = 10;`、文字列から変換するなら `Integer.valueOf('10')` |\n\n## 解説\n### ポイント\n- **エラーには「実行時エラー」と「コンパイルエラー」の2種類がある**\n  - ①〜④は**実行時エラー**：コードとしては正しいが、動かしたときに起きる。`System.〇〇Exception` という名前で出る\n  - ⑤⑥は**コンパイルエラー**：コードとして間違っていて、そもそも実行されない。クラスの保存時や匿名実行の直後に出る\n- **最初に見るのは「例外の名前」と「行番号」**。例外の名前でだいたいの原因がわかる\n\n  | 例外 | よくある原因 |\n  |---|---|\n  | `NullPointerException` | null に対して `.` を使った |\n  | `ListException` | 存在しない番号を読んだ、同じ Id を2回入れて DML した（Lv2） |\n  | `TypeException` | 型の変換に失敗した |\n  | `MathException` | 0 で割った |\n  | `QueryException` | SOQL の結果が0件なのに1件として受け取った（Lv2） |\n  | `DmlException` | 保存に失敗した（必須項目・入力規則など。Lv2） |\n  | `LimitException` | ガバナ制限を超えた（Lv3） |\n\n- **メッセージの後半に、具体的な値が出ていることが多い**。②の `3`、③の `12a` のように、何が問題だったかを教えてくれる\n- **コンパイルエラーの列（Column）は、問題のある場所を指す**。⑤の `column 14` は `totl` が始まる位置\n\n### よくある間違い\n- ② を「要素が3つあるのに読めない」と考え、番号が 0 から始まることを見落とす\n- 実行時エラーを全部 `try` / `catch` で隠そうとする。①②④は**事前に確かめれば防げる**エラーなので、条件分岐で防ぐのが基本。`catch` は③のように外から来たデータで防ぎきれないときに使う\n\n### 調べ先\n- Apex Developer Guide「Exception Class and Built-In Exceptions」\n- このプロジェクトの `research/04_field-practice/04_how-to-lookup.md`「よく使うエラーメッセージと意味」"},{"id":"L1-12","title":"請求番号の0埋めと月初・月末を調べて書く","level":1,"type":"lookup","skills":["WORK-LOOKUP-01","APEX-BASIC-03"],"difficulty":2,"minutes":30,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\n請求書を作るためのクラスを作りなさい。\nこの問題は**調べて書く**練習なので、使うメソッドは自分で **Apex Reference Guide** から探すこと。どのクラスのどのメソッドを使ったかも答えること。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\n\n- **機能1：請求番号を作る**\n  - 連番と発行日を受け取り、`INV-（発行日の年4桁）（月2桁）-（連番を5桁に0埋め）` の形の請求番号を返す\n  - 例：連番 `42`、発行日 2026年11月14日 → `'INV-202611-00042'`\n  - 連番が5桁を超える場合はそのまま（`123456` → `'INV-202611-123456'`）\n  - 連番が `null` または 0 以下、発行日が `null` のときは `null` を返す\n- **機能2：月初**：日付を受け取り、その月の1日を返す\n- **機能3：月末**：日付を受け取り、その月の末日を返す（うるう年も正しく）\n- **機能4：支払期日**：発行日を受け取り、支払期日として**翌月末**を返す\n\n## 調べるときの手がかり\n- 文字列の左側を指定の文字で埋めるメソッドが **String クラス**にある\n- 月初を求めるメソッドと、ある月が何日まであるかを返すメソッドが **Date クラス**にある\n- 公式ドキュメントは英語版のほうが新しい。「Apex Reference Guide String Class」のように検索するとよい\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、**自分で付けた名前で**書く。\n\n```apex\n// 書き方の例（名前は自分のものに置き換える）\nAssert.areEqual(期待する値, 実際の値, '何の確認か');\nAssert.isTrue(条件, '何の確認か');\nAssert.isNull(値, '何の確認か');\nSystem.debug('すべて正解です');\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | 連番 `42`、2026-11-14 | `'INV-202611-00042'` |\n| 1 | 連番 `7`、2027-01-05 | `'INV-202701-00007'` |\n| 1 | 連番 `123456`、2026-11-14 | `'INV-202611-123456'` |\n| 1 | 連番 `0`、2026-11-14 / 連番 `5`、`null` | `null` |\n| 2 | 2026-11-14 | 2026-11-01 |\n| 3 | 2026-02-10 | 2026-02-28 |\n| 3 | 2028-02-10 | 2028-02-29（うるう年） |\n| 3 | 2026-12-31 | 2026-12-31 |\n| 4 | 2026-01-15 | 2026-02-28 |\n| 4 | 2026-12-10 | 2027-01-31（年をまたぐ） |\n| 4 | 2028-01-31 | 2028-02-29（月末の発行） |\n\nあわせて、**使ったメソッドと、それが載っていたドキュメントのページ名**を書き出すこと。\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n解答例の名前で書いた確認コードは、解答の最初にある（開くと「解答を見た」と記録される）。","answer":"## 確認コード（解答例の名前で書いたもの）\n自分で付けた名前に置き換えれば、そのまま使える。\n\n```apex\nDate nov14 = Date.newInstance(2026, 11, 14);\nAssert.areEqual('INV-202611-00042', InvoiceUtil.formatInvoiceNo(42, nov14));\nAssert.areEqual('INV-202701-00007', InvoiceUtil.formatInvoiceNo(7, Date.newInstance(2027, 1, 5)));\nAssert.areEqual('INV-202611-123456', InvoiceUtil.formatInvoiceNo(123456, nov14));\nAssert.isNull(InvoiceUtil.formatInvoiceNo(0, nov14));\nAssert.isNull(InvoiceUtil.formatInvoiceNo(5, null));\n\nAssert.areEqual(Date.newInstance(2026, 11, 1), InvoiceUtil.firstDayOfMonth(nov14));\n\nAssert.areEqual(Date.newInstance(2026, 2, 28), InvoiceUtil.lastDayOfMonth(Date.newInstance(2026, 2, 10)));\nAssert.areEqual(Date.newInstance(2028, 2, 29), InvoiceUtil.lastDayOfMonth(Date.newInstance(2028, 2, 10)), 'うるう年');\nAssert.areEqual(Date.newInstance(2026, 12, 31), InvoiceUtil.lastDayOfMonth(Date.newInstance(2026, 12, 31)));\n\nAssert.areEqual(Date.newInstance(2026, 2, 28), InvoiceUtil.paymentDueDate(Date.newInstance(2026, 1, 15)));\nAssert.areEqual(Date.newInstance(2027, 1, 31), InvoiceUtil.paymentDueDate(Date.newInstance(2026, 12, 10)), '年をまたぐ');\nAssert.areEqual(Date.newInstance(2028, 2, 29), InvoiceUtil.paymentDueDate(Date.newInstance(2028, 1, 31)), '月末の発行');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n名前と型は一例。要件と確認方法の表を満たしていれば、自分で決めた名前・形で正解とする。\n\n### 使ったメソッド\n| やりたいこと | クラス | メソッド | ページ |\n|---|---|---|---|\n| 0埋め | String | `leftPad(length, padStr)` | Apex Reference Guide「String Class」 |\n| 月初 | Date | `toStartOfMonth()` | Apex Reference Guide「Date Class」 |\n| 月の日数 | Date | `daysInMonth(year, month)`（static） | Apex Reference Guide「Date Class」 |\n| 月を足す | Date | `addMonths(additionalMonths)` | Apex Reference Guide「Date Class」 |\n\n### コード\n```apex\npublic class InvoiceUtil {\n    public static String formatInvoiceNo(Integer seq, Date issueDate) {\n        if (seq == null || seq \u003c= 0 || issueDate == null) {\n            return null;\n        }\n        String yearMonth = String.valueOf(issueDate.year())\n            + String.valueOf(issueDate.month()).leftPad(2, '0');\n        return 'INV-' + yearMonth + '-' + String.valueOf(seq).leftPad(5, '0');\n    }\n\n    public static Date firstDayOfMonth(Date d) {\n        return d.toStartOfMonth();\n    }\n\n    public static Date lastDayOfMonth(Date d) {\n        return Date.newInstance(d.year(), d.month(), Date.daysInMonth(d.year(), d.month()));\n    }\n\n    public static Date paymentDueDate(Date issueDate) {\n        return lastDayOfMonth(issueDate.toStartOfMonth().addMonths(1));\n    }\n}\n```\n\n## 解説\n### ポイント\n- **Apex には「月末を返す」メソッドがない**。`toStartOfMonth` はあるが `toEndOfMonth` はない。よく使われるのは次の2つの書き方\n  - `Date.newInstance(年, 月, Date.daysInMonth(年, 月))`（解答例）\n  - `d.toStartOfMonth().addMonths(1).addDays(-1)`（翌月1日の前日）\n- **月をまたぐ計算は「1日」にそろえてから月を足す**。`paymentDueDate` で `issueDate.addMonths(1)` を先にすると、1月31日のような月末の日付で、足した結果がどうなるかを気にしなければならない。先に `toStartOfMonth()` で1日にそろえれば、どの日付でも安全に翌月へ進める\n- **`leftPad` は指定した長さより長い文字列をそのまま返す**。5桁を超える連番が切り捨てられないことも、ドキュメントで確かめられる\n- **調べるときは「クラスを決めてから、メソッド一覧を眺める」**。文字列の加工なら String クラス、日付なら Date クラスのページを開き、メソッド名と説明を上から見ていくのが速い\n\n### よくある間違い\n- `issueDate.month()` を0埋めせず、`'INV-20261-...'` のように桁がずれる\n- 月末を「30日」や「31日」で決め打ちする\n- `Date.daysInMonth` を `d.daysInMonth()` と書いてコンパイルエラー（static メソッドなので `Date.` から呼ぶ）\n\n### 調べ先\n- Apex Reference Guide「String Class」の `leftPad`\n- Apex Reference Guide「Date Class」の `toStartOfMonth` / `daysInMonth` / `addMonths` / `newInstance`"},{"id":"L1-13","title":"Temperature Converter（英語）","level":1,"type":"th-style","skills":["WORK-EN-01","APEX-BASIC-01","APEX-BASIC-02","APEX-BASIC-04"],"difficulty":2,"minutes":20,"environment":"org","language":"en","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\nTrailhead のハンズオンチャレンジと同じ形式の問題。要件は英語で書かれている。\n**クラス名・メソッド名・引数と戻り値の型が完全に一致していないと不合格**になる、という前提で解くこと。\n\n## Requirements\nCreate an Apex class that converts temperatures from Celsius to Fahrenheit.\n\n- Create a public class named **`TemperatureConverter`**\n- Add a public static method named **`toFahrenheit`**\n  - The method must accept one argument: a `List\u003cDecimal>` of Celsius values\n  - The method must return a `List\u003cDecimal>` of Fahrenheit values, in the same order as the input\n  - Use the formula: **F = C × 9 / 5 + 32**\n  - Round each result to **1 decimal place**, rounding **half up**\n  - Skip `null` values in the input list (do not include them in the result)\n  - If the argument itself is `null`, return an empty list\n- Add a public static method named **`isFreezing`**\n  - The method must accept one `Decimal` argument (a Celsius value) and return a `Boolean`\n  - Return `true` if the value is **less than or equal to 0**, otherwise `false`\n  - Return `false` if the argument is `null`\n\n### 英語のポイント\n| 英語 | 意味 |\n|---|---|\n| accept one argument | 引数を1つ受け取る |\n| in the same order as the input | 入力と同じ順番で |\n| round ... to 1 decimal place | 小数第1位に丸める |\n| rounding half up | 四捨五入（0.5 は切り上げ） |\n| skip | 飛ばす（結果に含めない） |\n| less than or equal to | 以下（≦） |\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\nDecimal の丸めは `setScale` メソッドを使う。丸め方を指定しないと四捨五入にならない場合があるので、リファレンスで丸め方の指定方法を調べる。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\n`setScale(1, RoundingMode.HALF_UP)`\n\u003c/details>\n\n## 確認方法\nクラスを保存したら、次のコードを匿名実行する。\n\n```apex\nList\u003cDecimal> input = new List\u003cDecimal>{ 0, 100, null, -40, 36.6, 21.25 };\nList\u003cDecimal> result = TemperatureConverter.toFahrenheit(input);\n\nAssert.areEqual(5, result.size(), 'null は飛ばして5件');\nAssert.areEqual('32.0', String.valueOf(result[0]));\nAssert.areEqual('212.0', String.valueOf(result[1]));\nAssert.areEqual('-40.0', String.valueOf(result[2]));\nAssert.areEqual('97.9', String.valueOf(result[3]));\nAssert.areEqual('70.3', String.valueOf(result[4]), '70.25 は四捨五入で 70.3');\n\nAssert.areEqual(0, TemperatureConverter.toFahrenheit(null).size(), 'null なら空のリスト');\n\nAssert.isTrue(TemperatureConverter.isFreezing(0));\nAssert.isTrue(TemperatureConverter.isFreezing(-3.5));\nAssert.isFalse(TemperatureConverter.isFreezing(0.1));\nAssert.isFalse(TemperatureConverter.isFreezing(null));\n\nSystem.debug('すべて正解です');\n```\n\n期待される結果：エラーが出ず、デバッグログに `すべて正解です` が出る。","answer":"## 解答例\n```apex\npublic class TemperatureConverter {\n    public static List\u003cDecimal> toFahrenheit(List\u003cDecimal> celsiusValues) {\n        List\u003cDecimal> results = new List\u003cDecimal>();\n        if (celsiusValues == null) {\n            return results;\n        }\n        for (Decimal celsius : celsiusValues) {\n            if (celsius == null) {\n                continue;\n            }\n            Decimal fahrenheit = celsius * 9 / 5 + 32;\n            results.add(fahrenheit.setScale(1, RoundingMode.HALF_UP));\n        }\n        return results;\n    }\n\n    public static Boolean isFreezing(Decimal celsius) {\n        return celsius != null && celsius \u003c= 0;\n    }\n}\n```\n\n## 解説\n### ポイント\n- **Trailhead 形式では名前と型がすべて**。`TemperatureConverter` を `TempConverter` にしたり、戻り値を `List\u003cDouble>` にしたりすると、処理が正しくても不合格になる。要件の太字部分を書き写すつもりで実装する\n- **`setScale(1)` だけだと四捨五入にならない**。丸め方を指定しない `setScale` は「偶数丸め（HALF_EVEN）」になり、`70.25` が `70.2` になる。四捨五入なら `RoundingMode.HALF_UP` を指定する。確認方法の `21.25` はこの違いを見分けるための値\n- **`continue` で null を飛ばす**。ループの中で条件に合わない要素をスキップする定番の書き方\n- **`&&` は左から評価され、左が false なら右は評価されない**。`celsius != null && celsius \u003c= 0` は、`null` のときに `celsius \u003c= 0` が実行されないので安全\n\n### よくある間違い\n- `setScale(1)` だけで済ませて、`21.25` の確認で失敗する\n- 引数が `null` のときに `for` ループに入って `NullPointerException`\n- 戻り値を新しいリストにせず、引数のリストを書き換えてしまう（入力と同じ順番・null を飛ばす、の両方を守れない）\n\n### 調べ先\n- Apex Reference Guide「Decimal Class」の `setScale`\n- Apex Reference Guide「RoundingMode Enum」"},{"id":"L1-14","title":"【総合】注文明細の集計レポート","level":1,"type":"project","skills":["APEX-BASIC-01","APEX-BASIC-02","APEX-BASIC-03","APEX-BASIC-04"],"difficulty":3,"minutes":60,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\nネットショップの1回の注文に含まれる明細から、合計金額・カテゴリ別の金額・割引・請求額を計算するクラスを作りなさい。\nLv1 で学んだこと（型・コレクション・制御構文・String・クラス）をすべて使う。**解答とヒントを見ずに解けたら Lv1 合格**。\n\n## 要件\n名前（クラス・メソッド・引数）、引数と戻り値の型、`static` にするかどうかは自分で決める。\nクラスの分け方（明細を表す型をどう作るか、集計をどこで行うか）も自分で考える。\n\n- **明細**\n  - 1行の明細は、商品名・カテゴリ・単価・数量を持つ。明細ごとに金額（`単価 × 数量`）を出せる\n- **注文を受け取る**\n  - 明細のリストを受け取って、1回の注文として扱う\n  - 次の明細は**集計の対象外**にする：`null` の明細、数量が `null` か 0 以下、単価が `null`\n  - 受け取ったリストが `null` なら明細0件として扱う\n- **注文から出せるもの**\n  - 集計対象の明細の件数\n  - 集計対象の明細の金額の合計\n  - カテゴ
