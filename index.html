    return `
      <div class="crumbs">
        <button type="button" data-nav="levels">レベル</button><span>›</span>
        <button type="button" data-action="open-level" data-level="${p.level}">Lv${p.level}${level ? ' ' + esc(level.theme) : ''}</button><span>›</span>
        <span class="mono">${esc(p.id)}</span>
      </div>
      <header class="problem-head">
        <div class="eyebrow">${esc(p.id)}</div>
        <h1>${esc(p.title)}</h1>
        <div class="badges">
          ${isGenerated(p) ? '<span class="pill weak">苦手克服</span>' : ''}
          <span class="pill badge-type">${esc(TYPE_LABELS[p.type] || p.type)}</span>
          ${stars(p.difficulty)}
          <span class="small muted">${esc(p.minutes)}分・${esc(ENV_LABELS[p.environment] || p.environment)}${p.language === 'en' ? '・英語' : ''}</span>
        </div>
        <div class="row">${skillChips(p.skills)}</div>
        ${isGenerated(p) && p.memo_ids.length ? `<div class="generated-note">「わからない」メモ ${p.memo_ids.map(esc).join('、')} から作った問題です。</div>` : ''}
        ${isGenerated(p) && (p.learned_ids || []).length ? `<div class="generated-note">わからなかったこと ${p.learned_ids.map((id) => {
          const q = LEARNED.find((x) => x.id === id);
          return q ? `<button type="button" class="btn quiet small" data-action="open-learned" data-id="${esc(id)}">${esc(id)} ${esc(q.title)}</button>` : esc(id);
        }).join(' ')} から作った復習問題です。</div>` : ''}
      </header>
      <div id="resolve-offer"></div>
      <article class="md">${md(p.question)}</article>

      <section class="panel" aria-labelledby="answer-title">
        <h2 id="answer-title">自分の解答</h2>
        <textarea id="answer-code" class="code-input" spellcheck="false" autocapitalize="off" autocomplete="off"
          placeholder="書いたコードや答えをここに貼り付けて保存できます"></textarea>
        <div class="row">
          <button type="button" class="btn primary" data-action="save-answer">保存</button>
          <span class="save-state" id="save-state">読み込み中…</span>
        </div>
        <div id="answer-history"></div>
        <div id="naming-check" class="naming-check"></div>
      </section>

      <section class="panel" aria-labelledby="result-title">
        <h2 id="result-title">結果</h2>
        <div id="result-area"></div>
      </section>

      <section class="section" id="answer-reveal"></section>

      ${(() => {
        const own = learnedFor(p.id);
        const related = learnedRelatedTo(p.id);
        if (!own.length && !related.length) return '';
        return `<section class="section" aria-labelledby="learned-title">
          <h2 id="learned-title">この問題のわからなかったこと</h2>
          ${own.length ? `<div class="list">${own.map(learnedLink).join('')}</div>` : ''}
          ${related.length ? `<p class="small muted">ほかの問題で出てきた、この問題でも使う知識</p><div class="list">${related.map(learnedLink).join('')}</div>` : ''}
        </section>`;
      })()}

      ${(() => {
        const rules = namingFor(p.id);
        if (!rules.length) return '';
        return `<section class="section" aria-labelledby="naming-title">
          <h2 id="naming-title">この問題で学んだ命名ルール</h2>
          <div class="list">${rules.map(namingLink).join('')}</div>
        </section>`;
      })()}

      <section class="panel" aria-labelledby="memo-title">
        <h2 id="memo-title">わからないことをメモ</h2>
        <p class="small muted">つまずいた点を書いておくと、Claude Code で苦手克服問題を作るときに使われます。</p>
        <div class="field"><label for="memo-text">内容</label>
          <textarea id="memo-text" class="text-input" placeholder="例: containsKey で確かめずに get した値に + 1 するとなぜ落ちるのか"></textarea></div>
        <div class="field"><label for="memo-skill">トピック</label><select id="memo-skill" class="select">${skillSelect || '<option value="">（なし）</option>'}</select></div>
        <div class="row"><button type="button" class="btn" data-action="add-memo">メモを残す</button></div>
        <div id="problem-memos"></div>
      </section>

      <nav class="pager" aria-label="前後の問題">
        ${prev ? `<button type="button" class="btn" data-action="open-problem" data-id="${esc(prev.id)}">← ${esc(prev.id)}</button>` : '<span></span>'}
        ${next ? `<button type="button" class="btn" data-action="open-problem" data-id="${esc(next.id)}">${esc(next.id)} →</button>` : '<span></span>'}
      </nav>`;
  },

  mount() {
    const textarea = document.getElementById('answer-code');
    textarea.addEventListener('input', () => {
      this.dirty = true;
      this.updateSaveState();
      clearTimeout(this.draftTimer);
      this.draftTimer = setTimeout(() => storage('set', `draft:${route.id}`, textarea.value), 500);
    });
    textarea.addEventListener('keydown', (event) => {
      if (event.key !== 'Tab' || event.shiftKey) return;
      event.preventDefault();
      const { selectionStart: start, selectionEnd: end, value } = textarea;
      textarea.value = value.slice(0, start) + '    ' + value.slice(end);
      textarea.selectionStart = textarea.selectionEnd = start + 4;
      textarea.dispatchEvent(new Event('input'));
    });
    this.refresh();
  },

  refresh() {
    const p = this.problem;
    if (!this.answerLoaded && Store.state.status !== 'loading') this.loadAnswer();
    this.updateSaveState();
    this.renderResult();
    this.renderReveal();
    this.renderMemos();
    this.renderResolveOffer();
    this.renderNamingCheck();
    document.querySelector('[data-action="save-answer"]').disabled = !Store.canWrite();
    document.querySelector('[data-action="add-memo"]').disabled = !Store.canWrite();
    return p;
  },

  async loadAnswer() {
    this.answerLoaded = true;
    const problemId = route.id;
    const draft = storage('get', `draft:${problemId}`);
    let doc = null;
    try {
      doc = Store.canWrite() ? await Store.loadAnswer(problemId) : null;
    } catch (e) {
      doc = null;
    }
    // 読み込み中に別の問題へ移っていたら何もしない
    const textarea = document.getElementById('answer-code');
    if (route.name !== 'problem' || route.id !== problemId || !textarea) return;
    this.answerDoc = doc;
    if (this.dirty) return;
    const saved = this.answerDoc ? this.answerDoc.code : '';
    if (draft !== null && draft !== saved) {
      textarea.value = draft;
      this.dirty = true;
      this.draftRestored = true;
    } else {
      textarea.value = saved;
    }
    this.updateSaveState();
    this.renderHistory();
  },

  updateSaveState() {
    const el = document.getElementById('save-state');
    if (!el) return;
    el.classList.toggle('dirty', this.dirty);
    if (!Store.canWrite() && Store.state.status !== 'loading') el.textContent = 'この画面では保存できません';
    else if (this.dirty) el.textContent = this.draftRestored ? '前回の保存していない下書きを表示しています' : '保存していない変更があります';
    else if (this.answerDoc) el.textContent = `保存済み: ${formatDate(this.answerDoc.updatedAt)}`;
    else if (this.answerLoaded) el.textContent = 'まだ保存していません';
  },

  // 命名チェック：保存すると自動で動く。結果は db に残るので、次に開いたときも出る
  naming: { problemId: null, running: false, ctl: null, error: null, hidden: false },

  async checkNaming(code) {
    const p = this.problem;
    const n = this.naming;
    if (n.running || !code.trim() || !canCheckNaming(p)) return;
    n.problemId = p.id;
    n.running = true;
    n.error = null;
    n.ctl = new AbortController();
    this.renderNamingCheck();
    try {
      const review = await NamingCheck.run(p, code, { signal: n.ctl.signal });
      await Store.saveNamingReview(p.id, review);
    } catch (e) {
      const errorCode = (e && e.code) || 'upstream_error';
      if (errorCode !== 'cancelled') n.error = errorCode;
      if (HIDE_CHECK_CODES.has(errorCode)) n.hidden = true;
    } finally {
      n.running = false;
      n.ctl = null;
      if (route.name === 'problem' && route.id === p.id) this.renderNamingCheck();
    }
  },

  renderNamingCheck() {
    const el = document.getElementById('naming-check');
    if (!el) return;
    if (!canCheckNaming(this.problem)) { el.hidden = true; return; }
    el.hidden = false;
    const n = this.naming;
    if (n.problemId !== route.id) Object.assign(n, { problemId: route.id, running: false, ctl: null, error: null });
    const review = Store.namingReview(route.id);
    const savedCode = this.answerDoc ? this.answerDoc.code : '';
    const head = `<div class="naming-check-head"><h3>命名チェック</h3>
      ${n.running
        ? '<button type="button" class="btn small quiet" data-action="naming-check-stop">中止</button>'
        : (!n.hidden && savedCode.trim() ? `<button type="button" class="btn small" data-action="naming-check">${review ? 'もう一度チェック' : '名前をチェック'}</button>` : '')}
    </div>`;
    let body = '';
    if (n.running) body = '<p class="small muted">クラス名・メソッド名・変数名を命名ルールと照らし合わせています…（30秒〜1分ほど）</p>';
    else if (n.error) body = `<p class="small naming-error">${esc(NAMING_CHECK_ERRORS[n.error] || 'チェックが途中で止まりました。「もう一度チェック」を押してください。')}</p>`;
    if (!review) {
      if (!body) body = '<p class="small muted">解答を保存すると、付けた名前が命名ルールに合っているかを自動でチェックします。</p>';
      body += '<div class="row"><button type="button" class="btn small quiet" data-action="open-naming" data-id="tips">命名のコツを見る →</button></div>';
      el.innerHTML = head + body;
      return;
    }
    const ruleButtons = (ids) => ids.map((id) => `<button type="button" class="chip" data-action="open-naming" data-id="${esc(id)}">${esc(id)}</button>`).join('');
    const improve = review.items.filter((it) => it.verdict === 'improve');
    const good = review.items.filter((it) => it.verdict !== 'improve');
    const stale = savedCode && review.code !== savedCode ? '<p class="small muted">前に保存したコードのチェック結果です。</p>' : '';
    const lessonState = review.status === 'applied'
      ? '<span class="pill" data-memo="resolved">命名ルールに反映済み</span>'
      : '<span class="pill" data-memo="open">命名ルールに未反映</span>';
    el.innerHTML = head + body + `
      ${stale}
      ${review.summary ? `<p>${esc(review.summary)}</p>` : ''}
      ${improve.length ? `<div class="naming-items">${improve.map((it) => `<div class="naming-item">
        <div class="naming-rename"><code>${esc(it.name)}</code><span aria-hidden="true">→</span><code class="better">${esc(it.suggestion || '?')}</code></div>
        <p class="small">${esc(it.reason)}</p>
        ${it.ruleIds.length ? `<div class="row">${ruleButtons(it.ruleIds)}</div>` : ''}
      </div>`).join('')}</div>` : '<p class="small naming-ok">直したほうがよい名前はありませんでした。</p>'}
      ${good.length ? `<div class="small"><span class="muted">よい名前:</span> <span class="naming-good">${good.map((it) => `<code>${esc(it.name)}</code>`).join(' ')}</span></div>` : ''}
      ${review.lessons.length ? `<div class="naming-lessons"><div class="row"><span class="learned-label">この解答からの学び</span>${lessonState}</div>
        <ul>${review.lessons.map((l) => `<li>${l.ruleId ? `<button type="button" class="chip" data-action="open-naming" data-id="${esc(l.ruleId)}">${esc(l.ruleId)}</button> ` : '<span class="pill weak">新しいルール</span> '}<strong>${esc(l.title)}</strong>${l.text ? `<br><span class="small">${esc(l.text)}</span>` : ''}</li>`).join('')}</ul>
        ${review.status === 'open' ? '<p class="small muted">Claude Code で「命名の学びをルールに反映して」と頼むと、命名ルールに追加されます。</p>' : ''}
      </div>` : ''}
      <p class="small muted">チェック: ${esc(formatDate(review.checkedAt))}${review.by === 'claude-code' ? '（Claude Code）' : ''}</p>`;
  },

  renderHistory() {
    const el = document.getElementById('answer-history');
    const history = this.answerDoc && this.answerDoc.history ? this.answerDoc.history : [];
    if (!el) return;
    if (history.length < 2) { el.innerHTML = ''; return; }
    el.innerHTML = `<details class="small"><summary class="muted">保存した履歴（${history.length}件）</summary>
      <div class="stack" style="margin-top:8px">${history.map((h, i) => `<div class="row">
        <span class="muted">${esc(formatDate(h.savedAt))}</span>
        <button type="button" class="btn small" data-action="restore-history" data-index="${i}">入力欄に戻す</button></div>`).join('')}</div></details>`;
  },

  renderResult() {
    const el = document.getElementById('result-area');
    const a = Store.attempt(route.id);
    const disabled = Store.canWrite() ? '' : 'disabled';
    el.innerHTML = `
      <div class="row">${statusPill(route.id)}
        ${a.attemptCount ? `<span class="small muted">記録 ${a.attemptCount}回</span>` : ''}
        ${a.answerViewed ? '<span class="small muted">解答を見た</span>' : ''}</div>
      <div class="row">
        <button type="button" class="btn ok" data-action="mark-correct" aria-pressed="${a.status === 'correct'}" ${disabled}>正解した</button>
        <button type="button" class="btn bad" data-action="mark-failed" aria-pressed="${a.status === 'failed'}" ${disabled}>解けなかった</button>
      </div>
      <p class="small muted">確認方法のとおりに動いたら「正解した」を押します。解答を見る前に押すと「自力で正解」になります。</p>`;
  },

  renderReveal() {
    const el = document.getElementById('answer-reveal');
    const p = this.problem;
    const a = Store.attempt(p.id);
    if (!p.answer) { el.innerHTML = ''; return; }
    if (this.revealed) {
      el.innerHTML = `<div class="answer-box md">${md(p.answer)}</div>`;
      enhance(el);
      return;
    }
    if (this.confirming) {
      el.innerHTML = `<div class="confirm-row"><span>解答を見ると「解答を見た」と記録され、このあと正解しても「自力で正解」にはなりません。</span>
        <button type="button" class="btn small primary" data-action="reveal-confirm">見る</button>
        <button type="button" class="btn small" data-action="reveal-cancel">やめる</button></div>`;
      return;
    }
    const recorded = a.status === 'correct' || a.answerViewed;
    el.innerHTML = `<div class="row"><button type="button" class="btn" data-action="reveal">解答・解説を見る</button>
      ${recorded ? '' : '<span class="small muted">見ると記録されます</span>'}</div>`;
  },

  renderMemos() {
    const el = document.getElementById('problem-memos');

// ---------- メモ用紙（ドラッグで動かせる付箋。問題ごとに中身を分けて保存） ----------
const Scratch = (() => {
  const el = document.getElementById('scratch');
  const fab = document.getElementById('scratch-fab');
  const bar = document.getElementById('scratch-bar');
  const text = document.getElementById('scratch-text');
  const title = document.getElementById('scratch-title');
  const state = document.getElementById('scratch-state');
  const MARGIN = 8;
  let key = 'general';
  let timer = null;
  let dirty = false;
  let loadToken = 0;

  const readJson = (k, fallback) => { try { return JSON.parse(storage('get', k)) || fallback; } catch (e) { return fallback; } };
  const box = () => readJson('scratch:box', null);
  const saveBox = () => storage('set', 'scratch:box', JSON.stringify({
    x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.classList.contains('collapsed') ? (box() || {}).h : el.offsetHeight,
  }));

  function viewport() {
    const vv = window.visualViewport;
    return vv ? { left: vv.offsetLeft, top: vv.offsetTop, width: vv.width, height: vv.height } : { left: 0, top: 0, width: innerWidth, height: innerHeight };
  }

  // 画面からはみ出さないように位置と大きさを直す（キーボードが出たときも）
  function place(x, y, w, h) {
    const v = viewport();
    w = Math.max(180, Math.min(w, v.width - MARGIN * 2));
    h = Math.max(120, Math.min(h, v.height - MARGIN * 2));
    el.style.width = `${w}px`;
    if (!el.classList.contains('collapsed')) el.style.height = `${h}px`;
    const realH = el.classList.contains('collapsed') ? 44 : h;
    x = Math.min(Math.max(x, v.left + MARGIN), v.left + v.width - w - MARGIN);
    y = Math.min(Math.max(y, v.top + MARGIN), v.top + v.height - realH - MARGIN);
    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
  }

  function defaultBox() {
    const v = viewport();
    const w = Math.min(360, v.width - 32);
    const h = Math.min(260, Math.round(v.height * 0.4));
    const bottomGap = innerWidth >= 900 ? 28 : 64 + 16;
    return { x: v.width - w - 16, y: v.height - h - bottomGap, w, h };
  }

  function keyFor(r) { return r.name === 'problem' ? r.id : 'general'; }

  function setState(message) { state.textContent = message; }

  function flush() {
    clearTimeout(timer);
    if (!dirty) return;
    dirty = false;
    const k = key;
    const value = text.value;
    storage('set', `scratch:${k}`, JSON.stringify({ text: value, updatedAt: new Date().toISOString() }));
    if (!Store.canWrite()) { setState('この端末に保存'); return; }
    Store.saveScratch(k, value).then(() => { if (k === key && !dirty) setState('保存済み'); }).catch(() => setState('この端末にだけ保存'));
  }

  async function load() {
    const token = ++loadToken;
    const k = key;
    const local = readJson(`scratch:${k}`, null);
    text.value = local ? local.text : '';
    setState('');
    if (!Store.canWrite()) return;
    try {
      const remote = await Store.loadScratch(k);
      if (token !== loadToken || dirty || !remote) return;
      if (!local || (remote.updatedAt || '') > (local.updatedAt || '')) {
        text.value = remote.text || '';
        storage('set', `scratch:${k}`, JSON.stringify(remote));
      }
    } catch (e) { /* 読めなければこの端末の分を使う */ }
  }

  function onRoute(r) {
    const next = keyFor(r);
    if (next === key && title.dataset.ready) return;
    flush();
    key = next;
    title.dataset.ready = '1';
    title.textContent = key === 'general' ? 'メモ用紙' : `${key} のメモ`;
    if (!el.hidden) load();
  }

  function open() {
    el.hidden = false;
    fab.setAttribute('aria-expanded', 'true');
    const b = box() || defaultBox();
    place(b.x, b.y, b.w, b.h);
    load();
    storage('set', 'scratch:open', '1');
  }

  function close() {
    flush();
    el.hidden = true;
    fab.setAttribute('aria-expanded', 'false');
    storage('remove', 'scratch:open');
    fab.focus();
  }

  // ドラッグ（つまみ部分）と大きさ変更（右下の角）。マウスでも指でも動く
  function track(event, onMove) {
    if (event.button > 0) return;
    event.preventDefault();
    const start = { px: event.clientX, py: event.clientY, x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
    el.classList.add('dragging');
    const move = (e) => onMove(e.clientX - start.px, e.clientY - start.py, start);
    const up = () => {
      el.classList.remove('dragging');
      removeEventListener('pointermove', move);
      removeEventListener('pointerup', up);
      removeEventListener('pointercancel', up);
      saveBox();
    };
    addEventListener('pointermove', move);
    addEventListener('pointerup', up);
    addEventListener('pointercancel', up);
  }

  bar.addEventListener('pointerdown', (event) => {
    if (event.target.closest('button')) return;
    track(event, (dx, dy, s) => place(s.x + dx, s.y + dy, s.w, s.h));
  });
  // 角と辺のつまみ。左側をつかんだときは右端を動かさずに幅を変える
  el.querySelectorAll('[data-edge]').forEach((handle) => {
    const edge = handle.dataset.edge;
    handle.addEventListener('pointerdown', (event) => {
      track(event, (dx, dy, s) => {
        let { x, w, h } = s;
        if (edge.includes('e')) w = s.w + dx;
        if (edge.includes('w')) { w = Math.max(180, s.w - dx); x = s.x + s.w - w; }
        if (edge.includes('s')) h = s.h + dy;
        place(x, s.y, w, h);
      });
    });
  });
  document.getElementById('scratch-min').addEventListener('click', () => {
    const collapsed = el.classList.toggle('collapsed');
    const b = box() || defaultBox();
    if (!collapsed) el.style.height = `${b.h}px`;
    place(el.offsetLeft, el.offsetTop, el.offsetWidth, b.h);
    storage(collapsed ? 'set' : 'remove', 'scratch:collapsed', '1');
  });
  document.getElementById('scratch-close').addEventListener('click', close);
  fab.addEventListener('click', open);

  text.addEventListener('input', () => {
    dirty = true;
    setState('入力中…');
    clearTimeout(timer);
    timer = setTimeout(flush, 800);
  });
  text.addEventListener('keydown', (event) => {
    if (event.key !== 'Tab' || event.shiftKey) return;
    event.preventDefault();
    const { selectionStart: s, selectionEnd: e, value } = text;
    text.value = value.slice(0, s) + '    ' + value.slice(e);
    text.selectionStart = text.selectionEnd = s + 4;
    text.dispatchEvent(new Event('input'));
  });
  text.addEventListener('blur', flush);
  addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

  const refit = () => { if (!el.hidden) place(el.offsetLeft, el.offsetTop, el.offsetWidth, el.offsetHeight); };
  addEventListener('resize', refit);
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', refit);
    visualViewport.addEventListener('scroll', refit);
  }

  if (storage('get', 'scratch:collapsed')) el.classList.add('collapsed');

  return {
    onRoute,
    restore() { if (storage('get', 'scratch:open')) open(); },
  };
})();

// ---------- 画面の切り替え ----------
function routeFromHash() {
  const token = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (problemById.has(token)) return { name: 'problem', id: token };
  if (LEARNED.some((q) => q.id === token)) return { name: 'learned', focus: token };
  if (NAMING.some((r) => r.id === token)) return { name: 'naming', focus: token };
  const lv = token.match(/^lv(\d+)$/i);
  if (lv && levelOf(Number(lv[1]))) return { name: 'level', level: Number(lv[1]) };
  if (views[token] && token !== 'problem' && token !== 'level') return { name: token };
  return { name: 'home' };
}

function render() {
  view = views[route.name];
  Scratch.onRoute(route);
  main.innerHTML = view.html();
  enhance(main);
  if (view.mount) view.mount();
  document.querySelectorAll('[data-nav].tab').forEach((tab) => {
    if (tab.dataset.nav === view.tab) tab.setAttribute('aria-current', 'page');
    else tab.removeAttribute('aria-current');
  });
}

function go(next) {
  route = next;
  render();
  window.scrollTo(0, 0);
}

function refreshChrome() {
  const notice = document.getElementById('store-notice');
  const s = Store.state;
  let message = '';
  if (s.status === 'unavailable') message = '保存機能を使えない表示です。問題は読めますが、解答・結果・メモは保存されません。claude.ai にログインして開くと保存できます。';
  else if (s.error) message = 'データの読み込みが止まりました。ページを開き直してください。';
  else if (s.stale) message = 'データの読み込みに時間がかかっています。表示が古い可能性があります。';
  notice.textContent = message;
  notice.hidden = !message;
  const badge = document.getElementById('memo-badge');
  const count = openMemos().length;
  badge.textContent = count;
  badge.hidden = count === 0;
}

function onStoreChange() {
  refreshChrome();
  if (view && view.refresh) view.refresh();
  else render();
}

// ---------- 操作 ----------
const actions = {
  'open-problem': (el) => go({ name: 'problem', id: el.dataset.id }),
  'open-learned': (el) => go({ name: 'learned', focus: el.dataset.id }),
  'open-naming': (el) => go({ name: 'naming', focus: el.dataset.id }),
  'naming-check': () => {
    const v = views.problem;
    v.checkNaming(v.answerDoc ? v.answerDoc.code : '');
  },
  'naming-check-stop': () => {
    const n = views.problem.naming;
    if (n.ctl) n.ctl.abort();
  },
  'naming-filter': (el) => {
    views.naming.filter = el.dataset.value;
    views.naming.draw();
  },
  'open-level': (el) => go({ name: 'level', level: Number(el.dataset.level) }),

  'copy-code': (el) => {
    const code = el.parentElement.querySelector('code');
    const done = (label) => { el.textContent = label; setTimeout(() => { el.textContent = 'コピー'; }, 1600); };
    const selectFallback = () => {
      const range = document.createRange();
      range.selectNodeContents(code);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      done('選択しました');
    };
    try {
      navigator.clipboard.writeText(code.textContent).then(() => done('コピーしました'), selectFallback);
    } catch (e) {
      selectFallback();
    }
  },

  'th-status': async (el) => {
    try {
      await Store.setTrailheadStatus(el.dataset.id, el.dataset.value);
    } catch (e) {
      toast(failMessage(e));
    }
  },

  'memo-for-th': (el) => go({ name: 'memos', trailheadId: el.dataset.id }),

  'save-answer': async (el) => {
    const v = views.problem;
    const code = document.getElementById('answer-code').value;
    el.disabled = true;
    try {
      v.answerDoc = await Store.saveAnswer(route.id, code, v.answerDoc);
      v.dirty = false;
      v.draftRestored = false;
      storage('remove', `draft:${route.id}`);
      v.updateSaveState();
      v.renderHistory();
      toast('保存しました');
      const review = Store.namingReview(route.id);
      if (code.trim() && canCheckNaming(v.problem) && (!review || review.code !== code)) v.checkNaming(code);
      else v.renderNamingCheck();
    } catch (e) {
      toast(failMessage(e));
    } finally {
      el.disabled = !Store.canWrite();
    }
  },

  'restore-history': (el) => {
    const v = views.problem;
    const entry = v.answerDoc.history[Number(el.dataset.index)];
    const textarea = document.getElementById('answer-code');
    textarea.value = entry.code;
    textarea.dispatchEvent(new Event('input'));
    textarea.focus();
  },

  'mark-correct': async () => {
    try { await Store.markResult(route.id, true); toast('正解として記録しました'); } catch (e) { toast(failMessage(e)); }
  },
  'mark-failed': async () => {
    try { await Store.markResult(route.id, false); toast('記録しました。解答・解説で確認しましょう'); } catch (e) { toast(failMessage(e)); }
  },

  reveal: () => {
    const v = views.problem;
    const a = Store.attempt(route.id);
    if (a.status === 'correct' || a.answerViewed || !Store.canWrite()) v.revealed = true;
    else v.confirming = true;
    v.renderReveal();
  },
  'reveal-confirm': async () => {
    const v = views.problem;
    v.revealed = true;
    v.confirming = false;
    v.renderReveal();
    try { await Store.markAnswerViewed(route.id); } catch (e) { toast(failMessage(e)); }
  },
  'reveal-cancel': () => {
    views.problem.confirming = false;
    views.problem.renderReveal();
  },

  'add-memo': async (el) => {
    const p = problemById.get(route.id);
    const textarea = document.getElementById('memo-text');
    const text = textarea.value.trim();
    if (!text) { toast('メモの内容を書いてください'); textarea.focus(); return; }
    const selected = document.getElementById('memo-skill').value;
    const skills = selected === '__all__' ? p.skills : selected ? [selected] : [];
    el.disabled = true;
    try {
      await Store.addMemo({ kind: 'problem', problemId: p.id, skills, text });
      textarea.value = '';
      toast('メモを残しました');
    } catch (e) {
      toast(failMessage(e));
    } finally {
      el.disabled = !Store.canWrite();
    }
  },

  'add-free-memo': async (el) => {
    const textarea = document.getElementById('free-memo-text');
    const text = textarea.value.trim();
    if (!text) { toast('メモの内容を書いてください'); textarea.focus(); return; }
    const skill = document.getElementById('free-memo-skill').value;
    const trailheadId = document.getElementById('free-memo-th').value || null;
    el.disabled = true;
    try {
      await Store.addMemo({ kind: trailheadId ? 'trailhead' : 'free', trailheadId, skills: skill ? [skill] : [], text });
      textarea.value = '';
      views.memos.filter = 'open';
      views.memos.refresh();
      toast('メモを残しました');
    } catch (e) {
      toast(failMessage(e));
    } finally {
      el.disabled = !Store.canWrite();
    }
  },

  'memo-filter': (el) => {
    views.memos.filter = el.dataset.value;
    views.memos.refresh();
  },
  'memo-resolve': async (el) => {
    try { await Store.updateMemo(el.dataset.id, { status: 'resolved', resolvedAt: new Date().toISOString() }); } catch (e) { toast(failMessage(e)); }
  },
  'memo-reopen': async (el) => {
    const memo = Store.state.memos[el.dataset.id];
    const status = memo && memo.generatedProblemIds && memo.generatedProblemIds.length ? 'generated' : 'open';
    try { await Store.updateMemo(el.dataset.id, { status, resolvedAt: null }); } catch (e) { toast(failMessage(e)); }
  },
  'memo-delete': async (el) => {
    if (el.dataset.confirm !== '1') {
      el.dataset.confirm = '1';
      el.textContent = 'もう一度押すと削除';
      setTimeout(() => { el.dataset.confirm = ''; el.textContent = '削除'; }, 4000);
      return;
    }
    try { await Store.deleteMemo(el.dataset.id); toast('削除しました'); } catch (e) { toast(failMessage(e)); }
  },
  'resolve-source-memos': async () => {
    const p = problemById.get(route.id);
    try {
      for (const id of p.memo_ids) {
        const memo = Store.state.memos[id];
        if (memo && memo.status !== 'resolved') await Store.updateMemo(id, { status: 'resolved', resolvedAt: new Date().toISOString() });
      }
      toast('メモを解決済みにしました');
    } catch (e) {
      toast(failMessage(e));
    }
  },

  export: async (el) => {
    el.disabled = true;
    try {
      const data = await Store.exportAll();
      const downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (!downloads) { toast('この画面では書き出せません'); return; }
      const date = new Date().toISOString().slice(0, 10);
      await downloads.save({ filename: `apex-renshu-backup-${date}.json`, data: JSON.stringify(data, null, 2) });
      toast('書き出しました');
    } catch (e) {
      if (!e || e.code !== 'declined') toast('書き出せませんでした');
    } finally {
      el.disabled = false;
    }
  },
};

document.addEventListener('click', (event) => {
  const nav = event.target.closest('[data-nav]');
  if (nav) { go({ name: nav.dataset.nav }); return; }
  const target = event.target.closest('[data-action]');
  if (target && actions[target.dataset.action]) actions[target.dataset.action](target);
});

route = routeFromHash();
render();
refreshChrome();
Store.subscribe(onStoreChange);
Store.init().then(() => Scratch.restore());
</script>

</body>
</html>
