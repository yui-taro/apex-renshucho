| `true` | Set の中の文字列は**大文字・小文字を区別する**。`'a-01'` は別の要素として入る |\n| ④ | `2` | `'A-01'` と `'a-01'` |\n| ⑤ | `true` | ③で入れた `'a-01'` がある |\n| ⑥ | `false` | `'B-01'` はないので取り除けなかった |\n| ⑦ | `true` | Apex の `==` は文字列の**大文字・小文字を区別しない** |\n| ⑧ | `false` | `equals` は区別する |\n| ⑨ | `3 / 2` | Set にすると重複した `'x'` が1つになる。左が整数でも、`' / '` が出た時点でつなぐになる |\n| ⑩ | `5` | List の `addAll` は重複を気にせず全部足す：`x, y, x` に `x, y` が加わる |\n\n## パート2の確認コード\nクラス名・メソッド名は指定どおりなので、引数と戻り値を解答例と同じ形にしていればそのまま使える。違う形にしたときは、呼び出す部分だけ自分の形に合わせる。\n\n```apex\nList\u003cString> numbers = new List\u003cString>{ 'R-001', ' r-001 ', 'R-002', null, 'R-003', 'r-002', 'R-001' };\nAssert.areEqual(new Set\u003cString>{ 'R-001', 'R-002' }, InputChecker.findDuplicates(numbers), '空白と大文字・小文字をそろえて比べる');\nAssert.isTrue(InputChecker.findDuplicates(new List\u003cString>{ 'R-001', 'R-002' }).isEmpty(), '重複なし');\nAssert.isTrue(InputChecker.findDuplicates(null).isEmpty(), 'null なら空');\n\nList\u003cString> emails = new List\u003cString>{\n    ' Taro@Example.COM ', 'hanako@other.jp', null, 'jiro@SUB.example.com', 'ken@shop.co.jp' };\nSet\u003cString> allowed = new Set\u003cString>{ 'EXAMPLE.com', 'shop.co.jp' };\nAssert.areEqual(\n    new List\u003cString>{ 'taro@example.com', 'ken@shop.co.jp' },\n    InputChecker.filterAllowedEmails(emails, allowed),\n    '大文字・小文字を区別せずにドメインを比べる'\n);\n\nSystem.debug('すべて正解です');\n```\n\n## パート2の解答例\n引数と戻り値の型、メソッドの中身は一例。指定したクラス名・メソッド名で作り、要件と確認方法の表を満たしていれば正解とする。\n\n```apex\npublic class InputChecker {\n    public static Set\u003cString> findDuplicates(List\u003cString> receiptNumbers) {\n        Set\u003cString> seen = new Set\u003cString>();\n        Set\u003cString> duplicates = new Set\u003cString>();\n        if (receiptNumbers == null) {\n            return duplicates;\n        }\n        for (String receiptNumber : receiptNumbers) {\n            if (String.isBlank(receiptNumber)) {\n                continue;\n            }\n            String normalized = receiptNumber.trim().toUpperCase();\n            if (!seen.add(normalized)) {\n                duplicates.add(normalized);\n            }\n        }\n        return duplicates;\n    }\n\n    public static List\u003cString> filterAllowedEmails(List\u003cString> emails, Set\u003cString> allowedDomains) {\n        Set\u003cString> normalizedDomains = new Set\u003cString>();\n        for (String domain : allowedDomains) {\n            normalizedDomains.add(domain.trim().toLowerCase());\n        }\n\n        List\u003cString> accepted = new List\u003cString>();\n        if (emails == null) {\n            return accepted;\n        }\n        for (String email : emails) {\n            if (String.isBlank(email)) {\n                continue;\n            }\n            String normalized = email.trim().toLowerCase();\n            if (normalizedDomains.contains(normalized.substringAfter('@'))) {\n                accepted.add(normalized);\n            }\n        }\n        return accepted;\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>**`Set.add` は「入ったかどうか」を `true` / `false` で返す**\u003c/mark>。`false` なら「もうあった」＝重複。`contains` で確かめてから `add` する2行を、`if (!seen.add(値))` の1行で書ける\n- **重複を見つけるときは Set を2つ使う**。「一度でも見た番号」と「2回目以降に出てきた番号」。重複が3回出ても、2つ目の Set には1回しか入らない\n- \u003cmark>**大文字・小文字の扱いは場所によって違う**\u003c/mark>\n\n  | 比べ方 | 大文字・小文字 |\n  |---|---|\n  | `==` / `!=` | 区別しない |\n  | `equals` | 区別する（区別しないのは `equalsIgnoreCase`） |\n  | Set の `add` / `contains`、Map のキー | 区別する |\n\n  Set や Map で比べるときは、**入れる前に `toLowerCase()` か `toUpperCase()` でそろえる**のが決まった形。許可リストのように外から受け取る Set も、そろえ直してから使う\n- **List と Set の違い**：List は順番を持ち、重複も入る。Set は順番を持たず、重複は1つになる。`new Set\u003cString>(リスト)` で重複を消せる。順番が必要な結果（機能2）は List で返す\n- **`substringAfter('@')` は `@` のうしろを返す**。`'jiro@sub.example.com'` は `'sub.example.com'` になり、`'example.com'` とは別物として扱われる\n\n### よくある間違い\n- `seen.contains(番号)` で重複を確かめたあと `seen.add` を忘れて、何も見つからない\n- 番号をそろえずに Set に入れて、`'R-001'` と `'r-001'` を別の番号として数える\n- 許可ドメインの Set をそろえずに `contains` して、`'EXAMPLE.com'` が一致しない\n- `email.trim()` を `String.isBlank` より先に呼んで、`null` のときに落ちる\n\n### 調べ先\n- Apex Reference Guide「Set Class」の `add` / `remove` / `contains`\n- Apex Reference Guide「String Class」の `equals` / `equalsIgnoreCase` / `toLowerCase` / `substringAfter`"},{"id":"G-004","title":"Map の put・get・keySet と compareTo を押さえる","level":1,"type":"write","skills":["APEX-BASIC-02","APEX-BASIC-03"],"difficulty":2,"minutes":30,"environment":"org","language":"ja","source":"generated","memo_ids":["M-20261122-233619"],"learned_ids":["Q-004"],"question":"## 問題\nわからなかったこと（`put` の上書きと戻り値・`get` / `containsKey` / `keySet`・`compareTo`）を、**予想する → 書く**の2段階で1問にまとめた。\n\n## パート1：結果を予想する（紙とペン）\n次のコードを匿名実行したとき、①〜⑪の `System.debug` に何が出るか答えなさい。\n⑨〜⑪は `true` か `false` で答える。⑫は「エラーになる / ならない」と、エラーならどんなエラーかを答える。\n\n```apex\nMap\u003cString, Integer> stock = new Map\u003cString, Integer>();\nSystem.debug(stock.put('りんご', 3));            // ①\nSystem.debug(stock.put('りんご', 4));            // ②\nSystem.debug(stock.get('りんご'));               // ③\nSystem.debug(stock.size());                      // ④\nSystem.debug(stock.get('みかん'));               // ⑤\nSystem.debug(stock.containsKey('リンゴ'));       // ⑥\n\nstock.put('みかん', 5);\nInteger total = 0;\nfor (String key : stock.keySet()) {\n    total += stock.get(key);\n}\nSystem.debug(total);                             // ⑦\nSystem.debug(stock.keySet().contains('みかん')); // ⑧\n\nSystem.debug('apple'.compareTo('banana') \u003c 0);   // ⑨\nSystem.debug('Zoo'.compareTo('apple') \u003c 0);      // ⑩\nSystem.debug('ab'.compareTo('abc') \u003c 0);         // ⑪\n\nInteger grapes = stock.get('ぶどう') + 1;        // ⑫\n```\n\n## パート2：会員ごとの購入金額を集計するクラスを書く\n### 使う名前\nクラス名とメソッド名は次のとおりにする。**引数（何を受け取るか）と戻り値の型（何を返すか）は自分で決める**。引数名・変数名・`private` のメソッドも自由。\n\n| 何を作るか | 名前 | 種類 |\n|---|---|---|\n| クラス | `PurchaseSummary` |  |\n| 機能1：会員ごとの合計 | `sumByMember` | static メソッド |\n| 機能2：一番買った会員 | `topMember` | static メソッド |\n| 機能3：目標を達成した会員 | `achievedMembers` | static メソッド |\n\n購入記録は `'M001:1200'` のように「会員番号:金額」の形の文字列で届く。\n\n- **機能1：会員ごとの合計**\n  - 購入記録のリストを受け取り、会員番号ごとの購入金額の合計を返す（会員番号から合計を引ける形にする）\n  - 会員番号・金額の前後の空白は取り除く\n  - `null`・空白だけの記録は無視する。リストが `null` なら空の結果\n- **機能2：一番買った会員**\n  - 機能1の結果から、合計が一番大きい会員番号を返す\n  - 同じ金額なら、会員番号を `compareTo` で比べて小さいほう\n  - 結果が空なら `null`\n- **機能3：目標を達成した会員**\n  - 機能1の結果と目標金額を受け取り、合計が目標金額**以上**の会員番号の Set を返す\n\n### 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、「使う名前」のクラス・メソッドを呼んで自分で書く。\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `'M001:1200'`, `'M002:800'`, `' M001 : 300 '`, `null`, `'M003:1500'`, `'M002:700'` | M001 `1500`、M002 `1500`、M003 `1500`（3人） |\n| 1 | `null` | 0人 |\n| 2 | 上の結果 | `'M001'`（全員同じ金額なので、番号が一番小さい会員） |\n| 2 | M002 `2000`、M001 `500` | `'M002'` |\n| 2 | 空 | `null` |\n| 3 | M001 `1500`、M002 `999`、M003 `1000` と目標 `1000` | `{'M001', 'M003'}`（1000 ちょうどは達成） |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1（パート1）\u003c/summary>\n\n`put` は、**そのキーに前に入っていた値**を返す（なければ `null`）。`get` はキーがないと `null` を返す。\n`compareTo` は、呼び出した側が辞書順で先ならマイナス、同じなら 0、後ならプラス。大文字は小文字より先になる。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2（パート2）\u003c/summary>\n\n1つの記録は `split(':')` で2つに分けられる。金額は `Integer.valueOf(文字列)` で整数にする。\n合計に足すときは、`containsKey` で「まだないなら 0 を入れる」を先にやってから足す。\n\u003c/details>","answer":"## パート1の解答\n| 番号 | 答え | 理由 |\n|---|---|---|\n| ① | `null` | りんご はまだなかったので、「前の値」はない |\n| ② | `3` | りんご には前に 3 が入っていた。その 3 を返して、4 で**上書き**する |\n| ③ | `4` | 上書きされたあとの値 |\n| ④ | `1` | 同じキーで2回 `put` しても、キーは りんご の1つだけ |\n| ⑤ | `null` | みかん はまだキーにない。`0` ではない |\n| ⑥ | `false` | String のキーは文字が完全に同じでないと別のキー（ひらがなとカタカナは別） |\n| ⑦ | `9` | りんご 4 + みかん 5。`keySet()` でキーを1つずつ取り出し、`get` で値を引いて足す |\n| ⑧ | `true` | `keySet()` はキーの Set なので、Set の `contains` が使える |\n| ⑨ | `true` | `a` は `b` より先なのでマイナス |\n| ⑩ | `true` | `Z`（90）は `a`（97）より小さいので、`'Zoo'` が先になりマイナス |\n| ⑪ | `true` | 途中まで同じなら、短いほうが先 |\n| ⑫ | エラーになる。`System.NullPointerException` | ぶどう はキーにないので `get` が `null`。`null + 1` は計算できない |\n\n## パート2の確認コード\nクラス名・メソッド名は指定どおりなので、引数と戻り値を解答例と同じ形にしていればそのまま使える。違う形にしたときは、呼び出す部分だけ自分の形に合わせる。\n\n```apex\nList\u003cString> records = new List\u003cString>{ 'M001:1200', 'M002:800', ' M001 : 300 ', null, 'M003:1500', 'M002:700' };\nMap\u003cString, Integer> totals = PurchaseSummary.sumByMember(records);\nAssert.areEqual(3, totals.size(), '3人');\nAssert.areEqual(1500, totals.get('M001'), '空白を取って M001 にまとめる');\nAssert.areEqual(1500, totals.get('M002'));\nAssert.areEqual(1500, totals.get('M003'));\nAssert.areEqual(0, PurchaseSummary.sumByMember(null).size(), 'null なら空');\n\nAssert.areEqual('M001', PurchaseSummary.topMember(totals), '同じ金額なら番号が小さいほう');\nAssert.areEqual('M002', PurchaseSummary.topMember(new Map\u003cString, Integer>{ 'M002' => 2000, 'M001' => 500 }));\nAssert.isNull(PurchaseSummary.topMember(new Map\u003cString, Integer>()), '空なら null');\n\nMap\u003cString, Integer> goalCheck = new Map\u003cString, Integer>{ 'M001' => 1500, 'M002' => 999, 'M003' => 1000 };\nAssert.areEqual(new Set\u003cString>{ 'M001', 'M003' }, PurchaseSummary.achievedMembers(goalCheck, 1000), '1000 ちょうどは達成');\n\nSystem.debug('すべて正解です');\n```\n\n## パート2の解答例\n引数と戻り値の型、メソッドの中身は一例。指定したクラス名・メソッド名で作り、要件と確認方法の表を満たしていれば正解とする。\n\n```apex\npublic class PurchaseSummary {\n    public static Map\u003cString, Integer> sumByMember(List\u003cString> records) {\n        Map\u003cString, Integer> totals = new Map\u003cString, Integer>();\n        if (records == null) {\n            return totals;\n        }\n        for (String record : records) {\n            if (String.isBlank(record)) {\n                continue;\n            }\n            List\u003cString> parts = record.split(':');\n            String memberNumber = parts[0].trim();\n            Integer amount = Integer.valueOf(parts[1].trim());\n\n            if (!totals.containsKey(memberNumber)) {\n                totals.put(memberNumber, 0);\n            }\n            totals.put(memberNumber, totals.get(memberNumber) + amount);\n        }\n        return totals;\n    }\n\n    public static String topMember(Map\u003cString, Integer> totals) {\n        String top = null;\n        for (String memberNumber : totals.keySet()) {\n            if (top == null\n                    || totals.get(memberNumber) > totals.get(top)\n                    || (totals.get(memberNumber) == totals.get(top) && memberNumber.compareTo(top) \u003c 0)) {\n                top = memberNumber;\n            }\n        }\n        return top;\n    }\n\n    public static Set\u003cString> achievedMembers(Map\u003cString, Integer> totals, Integer goalAmount) {\n        Set\u003cString> achieved = new Set\u003cString>();\n        for (String memberNumber : totals.keySet()) {\n            if (totals.get(memberNumber) >= goalAmount) {\n                achieved.add(memberNumber);\n            }\n        }\n        return achieved;\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>**`put(key, value)` は、キーがなければ追加、あれば上書きする**\u003c/mark>。戻り値は「そのキーに**前に**入っていた値」（なければ `null`）。上書きしたかどうかを知りたいときに使える。`size()` はキーの数\n- \u003cmark>**`get(key)` はキーがないと `null` を返す**\u003c/mark>。そのまま `+ 1` や `+ 金額` をすると `NullPointerException`。足す前に `containsKey` で確かめて、なければ 0 を入れる（`(totals.get(key) ?? 0) + amount` でも書ける）\n- \u003cmark>**`keySet()` でキーを1つずつ取り出し、`get` で値を引く**\u003c/mark>。Map の中身を全部見るときの決まった形。`keySet()` の順番は決まっていないと考え、順番が関係する処理（同じ金額のとき）は `compareTo` で自分で決める\n- \u003cmark>**`a.compareTo(b)` は a が先ならマイナス、同じなら 0、後ならプラス**\u003c/mark>。`-1` かどうかではなく、**符号**で判定する（`\u003c 0` / `== 0` / `> 0`）。大文字は小文字より先\n- **「キーごとに合計する」は Lv2 以降で毎日のように書く**。`Map\u003cId, Decimal>`（取引先 Id ごとの商談金額）の形で、L1-07 の総合問題や Lv2 の集計でそのまま使う\n\n### よくある間違い\n- ① を `3`、② を `4` と答える：`put` が「入れた値」を返すと思う\n- ⑤ を `0` と答える：キーがないと 0 が返ると思う\n- ⑩ を `false` と答える：大文字・小文字を区別しない国語辞典の順番で考える\n- `split(':')` のあと `parts[1]` の空白を取らずに `Integer.valueOf` して、`System.TypeException` になる\n- 目標の判定を `>` にして、1000 ちょうどの会員が入らない\n\n### 調べ先\n- Apex Reference Guide「Map Class」の `put` / `get` / `containsKey` / `keySet` / `size`\n- Apex Reference Guide「String Class」の `compareTo` / `split`、「Integer Class」の `valueOf`"},{"id":"L2-01","title":"SOQL の結果を予想する（リレーション・集計・0件のとき）","level":2,"type":"predict","skills":["APEX-SOQL-01","APEX-SOQL-02","APEX-SOQL-04"],"difficulty":2,"minutes":20,"environment":"none","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\n組織に下の**練習データ**が入っているとする（L2-02 の準備スクリプトで作るデータと同じ）。\n次のコードについて、①〜⑩に答えなさい（エラーになる行は、それぞれその部分だけを別に実行したと考える）。SOQL の基本・リレーション・集計・「0件のとき」の動きを、この1問でまとめて確かめる。\n\n### 練習データ\n「今月5日」などは、実行した月の日付。\n\n**取引先（Account）**\n\n| 取引先名 | 業種（Industry） |\n|---|---|\n| L2 東京商事 | Technology |\n| L2 大阪物産 | Retail |\n| L2 札幌フーズ | Food & Beverage |\n| L2 名古屋工業 | Manufacturing |\n\n**商談（Opportunity）**\n\n| 商談名 | 取引先 | 金額 | フェーズ | 完了予定日 |\n|---|---|---|---|---|\n| L2 東京 大型 | L2 東京商事 | 3,000,000 | Prospecting（未完了） | 今月10日 |\n| L2 東京 小型 | L2 東京商事 | 200,000 | Closed Won（完了） | 今月5日 |\n| L2 大阪 更新 | L2 大阪物産 | 1,500,000 | Negotiation/Review（未完了） | 今月20日 |\n| L2 大阪 前月 | L2 大阪物産 | 2,000,000 | Closed Won（完了） | 先月 |\n| L2 札幌 新規 | L2 札幌フーズ | 800,000 | Qualification（未完了） | 来月 |\n\n**取引先責任者（Contact）**：L2 山田・L2 佐藤（L2 東京商事）、L2 鈴木（L2 大阪物産）、L2 フリー（取引先なし）\n\n**ケース（Case）**：L2 東京商事に未完了3件・完了1件、L2 大阪物産に未完了2件、L2 名古屋工業に完了1件\n\n### コード\n```apex\n// ① 何件か\nInteger thisMonth = [SELECT COUNT() FROM Opportunity\n                     WHERE Name LIKE 'L2 %' AND CloseDate = THIS_MONTH];\n\n// ② 何件か。1件目の Account.Name は何か\nDecimal minAmount = 1000000;\nList\u003cOpportunity> large = [SELECT Name, Account.Name FROM Opportunity\n                           WHERE Name LIKE 'L2 %' AND Amount >= :minAmount AND IsClosed = false\n                           ORDER BY Amount DESC];\n\n// ③ nagoya.Contacts.size() は何か（null か、数か）\nAccount nagoya = [SELECT Name, (SELECT LastName FROM Contacts) FROM Account\n                  WHERE Name = 'L2 名古屋工業'];\n\n// ④ 次の1行を実行するとどうなるか\nList\u003cAccount> none = [SELECT Id FROM Account WHERE Name = 'L2 存在しない'];\n\n// ⑤ 次の1行を実行するとどうなるか\nAccount missing = [SELECT Id FROM Account WHERE Name = 'L2 存在しない'];\n\n// ⑥ 次の2行を実行するとどうなるか\nOpportunity big = [SELECT Name FROM Opportunity WHERE Name = 'L2 東京 大型'];\nSystem.debug(big.Amount);\n\n// ⑦ 何行返るか。L2 大阪物産の行の total はいくつか\nList\u003cAggregateResult> totals = [SELECT AccountId, SUM(Amount) total FROM Opportunity\n                                WHERE Name LIKE 'L2 %' GROUP BY AccountId];\n\n// ⑧ 何行返るか。それはどの取引先か\nList\u003cAggregateResult> busy = [SELECT AccountId, COUNT(Id) caseCount FROM Case\n                              WHERE Subject LIKE 'L2 %' AND IsClosed = false\n                              GROUP BY AccountId HAVING COUNT(Id) >= 3];\n\n// ⑨ 2行目と3行目はそれぞれどうなるか\nContact free = [SELECT LastName, Account.Name FROM Contact WHERE LastName = 'L2 フリー'];\nSystem.debug(free.Account?.Name);\nSystem.debug(free.Account.Name);\n```\n\n⑩ ③のサブクエリを `(SELECT LastName FROM Contact)` と書くとどうなるか。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1\u003c/summary>\n\n`THIS_MONTH` のような**日付リテラル**は、実行した日を基準に「今月の1日〜末日」を表す。\n`:minAmount` のように `:` を付けると、Apex の変数の値を SOQL に入れられる（**バインド変数**）。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2\u003c/summary>\n\nSOQL の結果を `List` で受け取るか、1件の `SObject` で受け取るかで、0件のときの動きが変わる。\nSOQL で取得していない項目を読むと、値が `null` になるのではなくエラーになる。\n\u003c/details>","answer":"## 解答\n| 番号 | 答え | 理由 |\n|---|---|---|\n| ① | `3` | 今月が完了予定日なのは 東京 大型（10日）・東京 小型（5日）・大阪 更新（20日）。完了・未完了は関係ない |\n| ② | `2` 件。1件目は `L2 東京商事` | 100万以上で未完了なのは 東京 大型（300万）と 大阪 更新（150万）。大阪 前月 は完了済み。金額の大きい順なので、1件目は 東京 大型 |\n| ③ | `0` | 子がいないとき、サブクエリの結果は `null` ではなく**空のリスト** |\n| ④ | エラーにならない。`none.size()` は `0` | `List` で受け取れば、0件でも空のリストになる |\n| ⑤ | `System.QueryException: List has no rows for assignment to SObject` | 1件の SObject に代入しようとしたが、1件もなかった |\n| ⑥ | `System.SObjectException: SObject row was retrieved via SOQL without querying the requested field: Opportunity.Amount` | `SELECT` に `Amount` を書いていないので読めない |\n| ⑦ | `3` 行。total は `3500000` | 東京 320万・大阪 350万・札幌 80万。商談のない名古屋工業の行は**出ない** |\n| ⑧ | `1` 行。L2 東京商事 | 未完了のケースが3件以上なのは東京商事だけ（大阪物産は2件） |\n| ⑨ | 2行目：`null`。3行目：`System.NullPointerException` | 取引先がないので `free.Account` が `null`。`?.` ならそこで止まるが、`.` だと落ちる |\n| ⑩ | 保存（実行）できない。`Didn't understand relationship 'Contact' in FROM part of query call` | サブクエリの FROM には、**子リレーション名**（`Contacts`、複数形）を書く |\n\n## 解説\n### ポイント\n- \u003cmark>**日付リテラル（`THIS_MONTH`・`LAST_N_DAYS:30`・`TODAY` など）は、実行した日を基準にする**\u003c/mark>。「今月」「過去30日」を自分で計算しなくてよい。項目が Datetime 型（`CreatedDate` など）でも使える\n- \u003cmark>**バインド変数 `:変数名` で Apex の値を SOQL に入れる**\u003c/mark>。文字列をつなげて SOQL を組み立てるより安全（Lv8 の SOQL インジェクション対策につながる）。`IN :idSet` のように Set や List も渡せる\n- \u003cmark>**`List` で受け取れば0件でも落ちない。1件の SObject で受け取ると、0件で `QueryException`**\u003c/mark>。「必ず1件ある」と言い切れないときは、List で受け取って `isEmpty()` で確かめる\n- **SOQL で取っていない項目は読めない**（`null` ではなくエラー）。項目を足したら、`SELECT` にも足す\n- **子→親は `Account.Name` のように `.` でたどる**。親がいないと `Account` 自体が `null` なので、`?.` を使うか `AccountId != null` を確かめる\n- **親→子はサブクエリ `(SELECT … FROM Contacts)`**。FROM に書くのはオブジェクト名ではなく**子リレーション名**。標準オブジェクトはだいたい複数形（`Contacts`・`Opportunities`・`Cases`）、カスタムは `〜__r`。子がいなければ空のリスト\n- **集計（`GROUP BY`）は `AggregateResult` で受け取る**。値は `row.get('total')` のように**別名**で取り出し、`(Decimal)` や `(Id)` でキャストする。集計した結果で絞り込むときは `WHERE` ではなく `HAVING`\n- **`COUNT()` だけの SOQL は `Integer` で受け取れる**\n\n### よくある間違い\n- ② で 大阪 前月 を数える：`IsClosed = false` の条件を見落とす\n- ③ を `null` と答え、`if (nagoya.Contacts != null)` と書く（空のリストなので `isEmpty()` で確かめる）\n- ⑦ を 4 と答える：商談のない取引先も 0 として行が出ると思う\n- ⑧ の条件を `WHERE COUNT(Id) >= 3` と書く（集計した値の条件は `HAVING`）\n\n### 調べ先\n- SOQL and SOSL Reference「Date Formats and Date Literals」\n- SOQL and SOSL Reference「Relationship Queries」「GROUP BY」「HAVING」\n- Apex Developer Guide「Using Apex Variables in SOQL and SOSL Queries」"},{"id":"L2-02","title":"営業の依頼から SOQL・集計・SOSL・動的 SOQL を書く","level":2,"type":"write","skills":["APEX-SOQL-01","APEX-SOQL-02","APEX-SOQL-03","APEX-SOQL-04","APEX-SOQL-05","WORK-LOOKUP-01"],"difficulty":2,"minutes":60,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\n営業チームから「こういう一覧がほしい」と5つの依頼が来た。日本語の要件から SOQL・集計・SOSL・動的 SOQL を書き、1つのクラスにまとめなさい。\n\n## 準備：練習データを作る\n匿名実行で次のスクリプトを1回動かす（何度動かしても同じデータに作り直される）。L2-01 の表と同じデータができる。\n\n```apex\n// L2 の練習データを作り直す\ndelete [SELECT Id FROM Case WHERE Subject LIKE 'L2 %'];\ndelete [SELECT Id FROM Opportunity WHERE Name LIKE 'L2 %'];\ndelete [SELECT Id FROM Contact WHERE LastName LIKE 'L2 %'];\ndelete [SELECT Id FROM Account WHERE Name LIKE 'L2 %'];\n\nDate monthStart = Date.today().toStartOfMonth();\nList\u003cAccount> accounts = new List\u003cAccount>{\n    new Account(Name = 'L2 東京商事', Industry = 'Technology', BillingState = '東京都'),\n    new Account(Name = 'L2 大阪物産', Industry = 'Retail', BillingState = '大阪府'),\n    new Account(Name = 'L2 札幌フーズ', Industry = 'Food & Beverage', BillingState = '北海道'),\n    new Account(Name = 'L2 名古屋工業', Industry = 'Manufacturing', BillingState = '愛知県')\n};\ninsert accounts;\nAccount tokyo = accounts[0];\nAccount osaka = accounts[1];\nAccount sapporo = accounts[2];\nAccount nagoya = accounts[3];\n\ninsert new List\u003cOpportunity>{\n    new Opportunity(Name = 'L2 東京 大型', AccountId = tokyo.Id, Amount = 3000000, StageName = 'Prospecting', CloseDate = monthStart.addDays(9)),\n    new Opportunity(Name = 'L2 東京 小型', AccountId = tokyo.Id, Amount = 200000, StageName = 'Closed Won', CloseDate = monthStart.addDays(4)),\n    new Opportunity(Name = 'L2 大阪 更新', AccountId = osaka.Id, Amount = 1500000, StageName = 'Negotiation/Review', CloseDate = monthStart.addDays(19)),\n    new Opportunity(Name = 'L2 大阪 前月', AccountId = osaka.Id, Amount = 2000000, StageName = 'Closed Won', CloseDate = monthStart.addDays(-10)),\n    new Opportunity(Name = 'L2 札幌 新規', AccountId = sapporo.Id, Amount = 800000, StageName = 'Qualification', CloseDate = monthStart.addMonths(1).addDays(14))\n};\ninsert new List\u003cContact>{\n    new Contact(LastName = 'L2 山田', AccountId = tokyo.Id, Email = 'yamada@example.com'),\n    new Contact(LastName = 'L2 佐藤', AccountId = tokyo.Id),\n    new Contact(LastName = 'L2 鈴木', AccountId = osaka.Id, Email = 'suzuki@example.com'),\n    new Contact(LastName = 'L2 フリー')\n};\ninsert new List\u003cCase>{\n    new Case(Subject = 'L2 ログインできない', AccountId = tokyo.Id, Status = 'New'),\n    new Case(Subject = 'L2 請求書の再発行', AccountId = tokyo.Id, Status = 'Working'),\n    new Case(Subject = 'L2 画面が遅い', AccountId = tokyo.Id, Status = 'Escalated'),\n    new Case(Subject = 'L2 解約したい', AccountId = tokyo.Id, Status = 'Closed'),\n    new Case(Subject = 'L2 納品日の確認', AccountId = osaka.Id, Status = 'New'),\n    new Case(Subject = 'L2 見積の依頼', AccountId = osaka.Id, Status = 'Working'),\n    new Case(Subject = 'L2 返品したい', AccountId = nagoya.Id, Status = 'Closed')\n};\nSystem.debug('L2 の練習データを作りました');\n```\n\n## 使う名前\nクラス名とメソッド名は次のとおりにする。**引数（何を受け取るか）と戻り値の型（何を返すか）は自分で決める**。引数名・変数名・`private` のメソッドも自由。\n\n| 何を作るか | 名前 | 種類 |\n|---|---|---|\n| クラス | `SalesQuery` | `with sharing` |\n| 機能1：今月の大型商談 | `findLargeOpenDealsThisMonth` | static メソッド |\n| 機能2：未完了ケースが多い取引先 | `findAccountsWithManyOpenCases` | static メソッド |\n| 機能3：取引先ごとの商談金額の合計 | `sumAmountByAccount` | static メソッド |\n| 機能4：キーワードで横断検索 | `searchByKeyword` | static メソッド |\n| 機能5：条件を組み立てて商談を検索 | `searchOpportunities` | static メソッド |\n\n## 要件\nどの機能も、**練習データ（名前・件名が `L2 ` で始まるもの）だけ**を対象にする。\n\n- **機能1：今月の大型商談**\n  - 完了予定日が今月で、未完了、金額が指定した額以上の商談を、**取引先名付きで**、金額の大きい順に返す\n  - 金額はメソッドの引数で受け取り、**バインド変数**で SOQL に入れる\n- **機能2：未完了ケースが多い取引先**\n  - 未完了のケースが **3件以上**ある取引先の Id を返す（集計クエリで数える）\n- **機能3：取引先ごとの商談金額の合計**\n  - 取引先 Id から、その取引先の商談金額の合計（完了・未完了すべて）を引ける形で返す\n  - 商談のない取引先は含めなくてよい\n- **機能4：キーワードで横断検索（SOSL）**\n  - キーワードを受け取り、名前にそのキーワードを含む**取引先と商談**を1回の検索で探す\n  - キーワードが `null`・空白・1文字なら、検索せずに空の結果を返す（SOSL は2文字以上が必要）\n- **機能5：条件を組み立てて商談を検索（動的 SOQL）**\n  - 業種と最低金額を受け取り、商談を金額の大きい順に返す。結果には取引先名も入れる\n  - 業種が `null`・空白なら業種の条件は付けない。最低金額が `null` なら金額の条件は付けない\n  - `Database.queryWithBinds` を使い、値は**バインド変数**で渡す。**ユーザーモード**で実行する\n  - `Database.queryWithBinds` の使い方は、自分で Apex Reference Guide を調べる\n\n開発者コンソールの「File → New → Apex Class」でクラスを作ること。\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、「使う名前」のクラス・メソッドを呼んで自分で書く。\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | 1000000 | 2件：`L2 東京 大型`（L2 東京商事）、`L2 大阪 更新`（L2 大阪物産）の順 |\n| 1 | 5000000 | 0件 |\n| 2 | | L2 東京商事 の Id だけ（1件） |\n| 3 | | 東京商事 `3200000`、大阪物産 `3500000`、札幌フーズ `800000`（3件）。名古屋工業は入らない |\n| 4 | `'大阪'` | 取引先1件（L2 大阪物産）、商談2件（L2 大阪 更新・L2 大阪 前月） |\n| 4 | `'大'` | 取引先0件・商談0件（検索しない） |\n| 5 | 業種 `'Retail'`・金額 `null` | `L2 大阪 前月`、`L2 大阪 更新` の順 |\n| 5 | 業種 `null`・金額 1000000 | `L2 東京 大型`、`L2 大阪 前月`、`L2 大阪 更新` の順 |\n| 5 | 業種 `'Technology'`・金額 1000000 | `L2 東京 大型` だけ |\n| 5 | 業種 `null`・金額 `null` | 5件すべて |\n\n- SOSL は、データを作ってから検索できるようになるまで少し時間がかかる。機能4だけ0件になるときは、1〜2分待ってから確かめ直す\n- 金額の合計は Decimal で返ってくる。`Assert.areEqual(3200000, 結果.intValue())` のように整数にしてから比べる\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n確認コードの例は、解答の最初にある（開くと「解答を見た」と記録される）。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1（機能1〜3）\u003c/summary>\n\nL2-01 の②⑦⑧がそのまま使える。集計の結果は `for (AggregateResult row : [SELECT …])` で1行ずつ取り出し、`(Id) row.get('AccountId')`・`(Decimal) row.get('別名')` で値を取る。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2（機能4・5）\u003c/summary>\n\nSOSL：`[FIND :keyword IN NAME FIELDS RETURNING Account(Name WHERE …), Opportunity(Name WHERE …)]`。結果は `List\u003cList\u003cSObject>>` で、`RETURNING` に書いた順に入っている。\n動的 SOQL：SOQL を文字列で組み立て、`:industry` のように書いた名前と同じキーで値を `Map\u003cString, Object>` に入れて渡す。\n\u003c/details>","answer":"## 確認コード\nクラス名・メソッド名は指定どおりなので、引数と戻り値を解答例と同じ形にしていればそのまま使える。違う形にしたときは、呼び出す部分だけ自分の形に合わせる。\n\n```apex\nId tokyoId = [SELECT Id FROM Account WHERE Name = 'L2 東京商事'].Id;\nId osakaId = [SELECT Id FROM Account WHERE Name = 'L2 大阪物産'].Id;\nId sapporoId = [SELECT Id FROM Account WHERE Name = 'L2 札幌フーズ'].Id;\nId nagoyaId = [SELECT Id FROM Account WHERE Name = 'L2 名古屋工業'].Id;\n\n// 機能1\nList\u003cOpportunity> large = SalesQuery.findLargeOpenDealsThisMonth(1000000);\nAssert.areEqual(2, large.size());\nAssert.areEqual('L2 東京 大型', large[0].Name, '金額の大きい順');\nAssert.areEqual('L2 東京商事', large[0].Account.Name, '取引先名付き');\nAssert.areEqual('L2 大阪 更新', large[1].Name);\nAssert.areEqual(0, SalesQuery.findLargeOpenDealsThisMonth(5000000).size());\n\n// 機能2\nAssert.areEqual(new Set\u003cId>{ tokyoId }, SalesQuery.findAccountsWithManyOpenCases());\n\n// 機能3\nMap\u003cId, Decimal> totals = SalesQuery.sumAmountByAccount();\nAssert.areEqual(3, totals.size());\nAssert.areEqual(3200000, totals.get(tokyoId).intValue());\nAssert.areEqual(3500000, totals.get(osakaId).intValue());\nAssert.areEqual(800000, totals.get(sapporoId).intValue());\nAssert.isFalse(totals.containsKey(nagoyaId), '商談のない取引先は入らない');\n\n// 機能4（0件のときは1〜2分待ってから）\nList\u003cList\u003cSObject>> found = SalesQuery.searchByKeyword('大阪');\nAssert.areEqual(1, found[0].size(), '取引先1件');\nAssert.areEqual(2, found[1].size(), '商談2件');\nList\u003cList\u003cSObject>> tooShort = SalesQuery.searchByKeyword('大');\nAssert.areEqual(0, tooShort[0].size());\nAssert.areEqual(0, tooShort[1].size());\n\n// 機能5\nList\u003cOpportunity> retail = SalesQuery.searchOpportunities('Retail', null);\nAssert.areEqual(2, retail.size());\nAssert.areEqual('L2 大阪 前月', retail[0].Name);\nAssert.areEqual('L2 大阪 更新', retail[1].Name);\n\nList\u003cOpportunity> overMillion = SalesQuery.searchOpportunities(null, 1000000);\nAssert.areEqual(3, overMillion.size());\nAssert.areEqual('L2 東京 大型', overMillion[0].Name);\n\nList\u003cOpportunity> techOverMillion = SalesQuery.searchOpportunities('Technology', 1000000);\nAssert.areEqual(1, techOverMillion.size());\nAssert.areEqual('L2 東京 大型', techOverMillion[0].Name);\n\nAssert.areEqual(5, SalesQuery.searchOpportunities(' ', null).size(), '条件なしなら全部');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n引数と戻り値の型、メソッドの中身は一例。指定したクラス名・メソッド名で作り、要件と確認方法の表を満たしていれば正解とする。\n\n```apex\npublic with sharing class SalesQuery {\n    private static final String PRACTICE_PREFIX = 'L2 %';\n\n    public static List\u003cOpportunity> findLargeOpenDealsThisMonth(Decimal minAmount) {\n        return [\n            SELECT Name, Amount, CloseDate, Account.Name\n            FROM Opportunity\n            WHERE Name LIKE :PRACTICE_PREFIX\n                AND CloseDate = THIS_MONTH\n                AND IsClosed = false\n                AND Amount >= :minAmount\n            ORDER BY Amount DESC\n        ];\n    }\n\n    public static Set\u003cId> findAccountsWithManyOpenCases() {\n        Set\u003cId> accountIds = new Set\u003cId>();\n        for (AggregateResult row : [\n            SELECT AccountId, COUNT(Id) caseCount\n            FROM Case\n            WHERE Subject LIKE :PRACTICE_PREFIX AND IsClosed = false AND AccountId != null\n            GROUP BY AccountId\n            HAVING COUNT(Id) >= 3\n        ]) {\n            accountIds.add((Id) row.get('AccountId'));\n        }\n        return accountIds;\n    }\n\n    public static Map\u003cId, Decimal> sumAmountByAccount() {\n        Map\u003cId, Decimal> totals = new Map\u003cId, Decimal>();\n        for (AggregateResult row : [\n            SELECT AccountId, SUM(Amount) total\n            FROM Opportunity\n            WHERE Name LIKE :PRACTICE_PREFIX AND AccountId != null\n            GROUP BY AccountId\n        ]) {\n            totals.put((Id) row.get('AccountId'), (Decimal) row.get('total'));\n        }\n        return totals;\n    }\n\n    public static List\u003cList\u003cSObject>> searchByKeyword(String keyword) {\n        if (String.isBlank(keyword) || keyword.trim().length() \u003c 2) {\n            return new List\u003cList\u003cSObject>>{ new List\u003cAccount>(), new List\u003cOpportunity>() };\n        }\n        String searchText = keyword.trim();\n        return [\n            FIND :searchText IN NAME FIELDS\n            RETURNING\n                Account(Name WHERE Name LIKE :PRACTICE_PREFIX),\n                Opportunity(Name WHERE Name LIKE :PRACTICE_PREFIX)\n        ];\n    }\n\n    public static List\u003cOpportunity> searchOpportunities(String industry, Decimal minAmount) {\n        String query = 'SELECT Name, Amount, Account.Name FROM Opportunity WHERE Name LIKE :prefix';\n        Map\u003cString, Object> binds = new Map\u003cString, Object>{ 'prefix' => PRACTICE_PREFIX };\n\n        if (String.isNotBlank(industry)) {\n            query += ' AND Account.Industry = :industry';\n            binds.put('industry', industry.trim());\n        }\n        if (minAmount != null) {\n            query += ' AND Amount >= :minAmount';\n            binds.put('minAmount', minAmount);\n        }\n        query += ' ORDER BY Amount DESC';\n\n        return Database.queryWithBinds(query, binds, AccessLevel.USER_MODE);\n    }\n}\n```\n\n## 解説\n### ポイント\n- **要件の日本語を、SOQL の部品に1つずつ置き換える**。「今月」→ `CloseDate = THIS_MONTH`、「未完了」→ `IsClosed = false`、「取引先名付き」→ `Account.Name`、「大きい順」→ `ORDER BY Amount DESC`。現場の依頼もこの読み替えの繰り返し\n- \u003cmark>**「〜ごとの件数・合計」は `GROUP BY` + `AggregateResult`**\u003c/mark>。結果は `row.get('別名')` で取り出してキャストする。集計した値で絞るときは `HAVING`。L1-05 で Map に数えた処理を、SOQL が組織の中でやってくれる\n- **集計の結果を `Map\u003cId, Decimal>` に入れ直す**と、ほかの処理から `totals.get(accountId)` で引ける。L1 の「Id をキーにした Map」と同じ形\n- **SOSL は「どのオブジェクトにあるかわからないものを、まとめて探す」**とき。SOQL は1つのオブジェクトを条件で絞るとき。SOSL の結果は `RETURNING` に書いた順の `List\u003cList\u003cSObject>>` で返る。検索できるようになるまで時間がかかる点にも注意\n- \u003cmark>**`Database.queryWithBinds` は、文字列で組み立てた SOQL に、値を `Map` で渡す**\u003c/mark>。条件の有無が実行時に決まるときに使う。値を文字列で直接つなげない（`'… = \\'' + industry + '\\''` は SOQL インジェクションの原因になる。Lv8 で扱う）\n- **`AccessLevel.USER_MODE`** は、実行するユーザーの権限（項目・オブジェクト・共有）で検索する。画面から呼ばれる検索は、ユーザーが見てはいけないデータを返さないように基本これにする\n- **クラスに `with sharing` を付ける**。ユーザーが見られるレコードだけを対象にする（Lv8 で詳しく扱う）。迷ったら付けておく\n\n### よくある間違い\n- 機能1で `IsClosed = false` を忘れて、完了した 東京 小型 も対象にしてしまう（金額で外れるので結果は同じになり、気づきにくい）\n- 機能2で `WHERE COUNT(Id) >= 3` と書いて保存できない\n- 機能3で `row.get('expr0')` のまま使う。別名を付けないと `expr0`・`expr1` という名前になり、読みにくい\n- 機能5で、条件を足すたびに `WHERE` を書いて `WHERE … WHERE …` になる。最初に必ず付く条件（`Name LIKE :prefix`）を `WHERE` に書いておくと、あとは ` AND …` を足すだけで済む\n- 合計を `Assert.areEqual(3200000, 合計)` と比べて失敗する。`SUM` の結果は Decimal（`3200000.00` のように小数部を持つことがある）なので、`intValue()` で整数にしてから比べる\n- 機能5で、`binds` のキーと SOQL の `:名前` が一致せず `Variable does not exist` になる\n\n### 調べ先\n- Apex Reference Guide「Database Class」の `queryWithBinds`、「AccessLevel Class」\n- SOQL and SOSL Reference「Aggregate Functions」「FIND」「RETURNING」\n- Apex Developer Guide「Working with SOQL Aggregate Functions」「Dynamic SOQL」"},{"id":"L2-03","title":"顧客データを取り込む（まとめて登録・部分成功・upsert・ロールバック）","level":2,"type":"write","skills":["APEX-DML-01","APEX-DML-02","APEX-DML-03","PF-SETUP-01"],"difficulty":2,"minutes":50,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\n別システムから届く顧客データを Salesforce に取り込むクラスを作りなさい。\n**まとめて登録する・失敗した行だけを集める・外部 Id で upsert する・失敗したら全部元に戻す**の4つを、この1問で練習する。\n\n## 準備：外部 Id の項目を作る\n取引先に、別システムの取引先コードを入れる項目を作る。\n\n1. 設定（歯車）→ **オブジェクトマネージャ** → **取引先** → **項目とリレーション** → **新規**\n2. データ型：**テキスト**\n3. 項目の表示ラベル：`L2 取引先コード`、長さ：`20`、項目名：`L2_Code`（API 参照名は `L2_Code__c` になる）\n4. **「ユニーク」** と **「外部 ID」** にチェックを入れる\n5. 項目レベルセキュリティは、自分のプロファイル（システム管理者）で**参照可能**にしたまま保存する\n\n## 使う名前\nクラス名とメソッド名は次のとおりにする。**引数（何を受け取るか）と戻り値の型（何を返すか）は自分で決める**。引数名・変数名・`private` のメソッドも自由。\n\n| 何を作るか | 名前 | 種類 |\n|---|---|---|\n| クラス | `CustomerImporter` | `with sharing` |\n| 機能1：取引先と取引先責任者をまとめて作る | `createWithContacts` | static メソッド |\n| 機能2：失敗した行だけを集める | `insertAllowingErrors` | static メソッド |\n| 機能3：upsert し、失敗したら全部元に戻す | `upsertWithContacts` | static メソッド |\n\n## 要件\n- **機能1：取引先と取引先責任者をまとめて作る**\n  - 「取引先名 → その取引先の取引先責任者の姓のリスト」を受け取り、取引先と取引先責任者を作る\n  - 作った取引先のリストを返す\n  - 取引先が何件あっても、**DML は2回だけ**（取引先で1回、取引先責任者で1回）\n- **機能2：失敗した行だけを集める（部分成功）**\n  - 取引先責任者のリストを受け取り、**成功する行は登録し、失敗する行だけ**をエラーとして集める\n  - エラーは `'2行目: （エラーメッセージ）'` の形の文字列のリストで返す（行は1から数える）\n- **機能3：取引先コードで upsert し、失敗したら全部元に戻す**\n  - 取引先のリスト（取引先名と `L2_Code__c` が入っている）と、同じ順番の「窓口になる取引先責任者の姓」のリストを受け取る\n  - 取引先を `L2_Code__c` で **upsert** する（同じコードがあれば更新、なければ作成）\n  - 続けて、各取引先に窓口の取引先責任者を1人ずつ作る\n  - どこかで1件でも失敗したら、**取引先の upsert も含めてすべて元に戻し** `false` を返す。すべて成功したら `true`\n\n開発者コンソールの「File → New → Apex Class」でクラスを作ること。\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、「使う名前」のクラス・メソッドを呼んで自分で書く。\n確認コードの最初で、前回作った確認用のデータを消しておく：\n\n```apex\ndelete [SELECT Id FROM Account WHERE Name LIKE 'L2 取込%'];\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `'L2 取込 東'` → `'L2 青木'`, `'L2 石井'`／`'L2 取込 西'` → `'L2 上田'` | 取引先2件・取引先責任者3件ができる。DML は2回（`Limits.getDmlStatements()` の増えた数で確かめる） |\n| 2 | `'L2 江藤'`（正常）、姓なし、`'L2 小野'`（メール `'not-an-email'`） | 1件だけ登録される。エラーは2件で、`'2行目: '` と `'3行目: '` で始まる |\n| 3 | `A001`（L2 取込A）・`A002`（L2 取込B）、窓口 `'L2 窓口A'`・`'L2 窓口B'` | `true`。コード付きの取引先が2件 |\n| 3 | 続けて `A001`（L2 取込A 改）・`A003`（L2 取込C）、窓口 `'L2 窓口A2'`・`null` | `false`。A001 の名前は `L2 取込A` のまま、A003 はできていない |\n| 3 | 続けて `A001`（L2 取込A 改）、窓口 `'L2 窓口A3'` | `true`。A001 の名前が `L2 取込A 改` になる。コード付きの取引先は2件のまま |\n\n- 機能3は、呼ぶたびに**新しい** `Account` を作って渡す（前の呼び出しで使った `Account` を使い回さない）\n- 取引先を消すと、その取引先の取引先責任者も一緒に消える\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n確認コードの例は、解答の最初にある（開くと「解答を見た」と記録される）。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1（機能1・2）\u003c/summary>\n\n機能1：先に取引先だけを `insert` すると、リストの各要素に `Id` が入る。その `Id` を取引先責任者の `AccountId` に入れて、もう一度まとめて `insert` する。\n機能2：`Database.insert(リスト, false)` は失敗しても例外を投げず、行ごとの結果（`Database.SaveResult`）を、渡したリストと同じ順番で返す。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2（機能3）\u003c/summary>\n\n`upsert リスト Account.Fields.L2_Code__c;` で、どの項目で突き合わせるかを指定する。\n`Savepoint sp = Database.setSavepoint();` で「ここまで戻れる地点」を作り、失敗したら `Database.rollback(sp);`。失敗は `try { … } catch (DmlException e) { … }` で受け取る。\n\u003c/details>","answer":"## 確認コード\nクラス名・メソッド名は指定どおりなので、引数と戻り値を解答例と同じ形にしていればそのまま使える。違う形にしたときは、呼び出す部分だけ自分の形に合わせる。\n\n```apex\ndelete [SELECT Id FROM Account WHERE Name LIKE 'L2 取込%'];\n\n// 機能1\nMap\u003cString, List\u003cString>> contactNamesByAccount = new Map\u003cString, List\u003cString>>{\n    'L2 取込 東' => new List\u003cString>{ 'L2 青木', 'L2 石井' },\n    'L2 取込 西' => new List\u003cString>{ 'L2 上田' }\n};\nInteger dmlBefore = Limits.getDmlStatements();\nList\u003cAccount> created = CustomerImporter.createWithContacts(contactNamesByAccount);\nAssert.areEqual(2, Limits.getDmlStatements() - dmlBefore, 'DML は2回だけ');\nAssert.areEqual(2, created.size());\nAssert.areEqual(3, [SELECT COUNT() FROM Contact WHERE Account.Name LIKE 'L2 取込 %']);\n\n// 機能2\nId eastId = [SELECT Id FROM Account WHERE Name = 'L2 取込 東'].Id;\nList\u003cContact> rows = new List\u003cContact>{\n    new Contact(LastName = 'L2 江藤', AccountId = eastId),\n    new Contact(AccountId = eastId),\n    new Contact(LastName = 'L2 小野', AccountId = eastId, Email = 'not-an-email')\n};\nList\u003cString> errors = CustomerImporter.insertAllowingErrors(rows);\nAssert.areEqual(2, errors.size(), '失敗は2行');\nAssert.isTrue(errors[0].startsWith('2行目: '), errors[0]);\nAssert.isTrue(errors[1].startsWith('3行目: '), errors[1]);\nAssert.areEqual(1, [SELECT COUNT() FROM Contact WHERE LastName = 'L2 江藤'], '成功した行は登録される');\n\n// 機能3：1回目（すべて成功）\nBoolean first = CustomerImporter.upsertWithContacts(\n    new List\u003cAccount>{\n        new Account(Name = 'L2 取込A', L2_Code__c = 'A001'),\n        new Account(Name = 'L2 取込B', L2_Code__c = 'A002') },\n    new List\u003cString>{ 'L2 窓口A', 'L2 窓口B' });\nAssert.isTrue(first);\nAssert.areEqual(2, [SELECT COUNT() FROM Account WHERE L2_Code__c != null AND Name LIKE 'L2 取込%']);\n\n// 機能3：2回目（窓口の姓がないので失敗 → すべて元に戻る）\nBoolean second = CustomerImporter.upsertWithContacts(\n    new List\u003cAccount>{\n        new Account(Name = 'L2 取込A 改', L2_Code__c = 'A001'),\n        new Account(Name = 'L2 取込C', L2_Code__c = 'A003') },\n    new List\u003cString>{ 'L2 窓口A2', null });\nAssert.isFalse(second);\nAssert.areEqual('L2 取込A', [SELECT Name FROM Account WHERE L2_Code__c = 'A001'].Name, '更新も元に戻る');\nAssert.areEqual(0, [SELECT COUNT() FROM Account WHERE L2_Code__c = 'A003'], '作成も元に戻る');\n\n// 機能3：3回目（既存の A001 を更新）\nBoolean third = CustomerImporter.upsertWithContacts(\n    new List\u003cAccount>{ new Account(Name = 'L2 取込A 改', L2_Code__c = 'A001') },\n    new List\u003cString>{ 'L2 窓口A3' });\nAssert.isTrue(third);\nAssert.areEqual('L2 取込A 改', [SELECT Name FROM Account WHERE L2_Code__c = 'A001'].Name);\nAssert.areEqual(2, [SELECT COUNT() FROM Account WHERE L2_Code__c != null AND Name LIKE 'L2 取込%'], '更新なので増えない');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n引数と戻り値の型、メソッドの中身は一例。指定したクラス名・メソッド名で作り、要件と確認方法の表を満たしていれば正解とする。\n\n```apex\npublic with sharing class CustomerImporter {\n    public static List\u003cAccount> createWithContacts(Map\u003cString, List\u003cString>> contactNamesByAccount) {\n        List\u003cAccount> accounts = new List\u003cAccount>();\n        for (String accountName : contactNamesByAccount.keySet()) {\n            accounts.add(new Account(Name = accountName));\n        }\n        insert accounts;\n\n        List\u003cContact> contacts = new List\u003cContact>();\n        for (Account acc : accounts) {\n            for (String lastName : contactNamesByAccount.get(acc.Name)) {\n                contacts.add(new Contact(LastName = lastName, AccountId = acc.Id));\n            }\n        }\n        insert contacts;\n        return accounts;\n    }\n\n    public static List\u003cString> insertAllowingErrors(List\u003cContact> contacts) {\n        List\u003cString> errors = new List\u003cString>();\n        List\u003cDatabase.SaveResult> results = Database.insert(contacts, false);\n        for (Integer i = 0; i \u003c results.size(); i++) {\n            if (!results[i].isSuccess()) {\n                errors.add((i + 1) + '行目: ' + results[i].getErrors()[0].getMessage());\n            }\n        }\n        return errors;\n    }\n\n    public static Boolean upsertWithContacts(List\u003cAccount> accounts, List\u003cString> contactLastNames) {\n        Savepoint sp = Database.setSavepoint();\n        try {\n            upsert accounts Account.Fields.L2_Code__c;\n\n            List\u003cContact> contacts = new List\u003cContact>();\n            for (Integer i = 0; i \u003c accounts.size(); i++) {\n                contacts.add(new Contact(LastName = contactLastNames[i], AccountId = accounts[i].Id));\n            }\n            insert contacts;\n            return true;\n        } catch (DmlException e) {\n            Database.rollback(sp);\n            return false;\n        }\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>**DML はリストに対して1回で行う**\u003c/mark>。`for` の中で `insert` すると、1回の処理で使える DML の回数（150回）をすぐに使い切る。「親を先にまとめて登録 → 親の Id を子に入れて、子をまとめて登録」が基本の形\n- **`insert` のあと、リストの各要素に `Id` が入る**。だから `acc.Id` をそのまま子の `AccountId` に使える\n- \u003cmark>**`insert リスト` と `Database.insert(リスト, false)` の違い**\u003c/mark>\n\n  | 書き方 | 1件でも失敗したら |\n  |---|---|\n  | `insert contacts;` | **全部登録されず**、`DmlException` が投げられる |\n  | `Database.insert(contacts, false)` | **成功した行だけ登録**され、例外は投げられない。行ごとの結果が返る |\n\n  取り込みのように「できるものは入れて、だめな行を報告したい」ときは後者。結果は渡したリストと**同じ順番**で返るので、番号 `i` で元の行と対応づけられる\n- \u003cmark>**upsert は「外部 Id で探して、あれば更新・なければ作成」**\u003c/mark>。別システムのコードを外部 Id 項目に入れておけば、Salesforce の Id を知らなくても何度でも取り込み直せる。外部 Id 項目は「ユニーク」にしておくと、同じコードが2件できない\n- \u003cmark>**Savepoint と rollback で「全部成功か、全部なし」にする**\u003c/mark>。取引先の upsert は成功していても、あとの取引先責任者で失敗したら、upsert ごと元に戻す。途中まで登録されたデータが残ると、取り込み直したときに数が合わなくなる\n- **rollback しても、Apex の変数に入った `Id` は消えない**。2回目の呼び出しで作られかけた A003 の `Account` には `Id` が入ったまま残る。その `Account` をもう一度 `insert` すると「Id が入っているので insert できない」エラーになる。確認方法で「毎回新しい `Account` を作って渡す」としているのはこのため\n\n### よくある間違い\n- 機能1で、取引先ごとに `insert` を2回呼んで DML が4回以上になる\n- 機能2で、`i` をそのまま行番号にして `'1行目: '` から始まる（行は1から数える）\n- 機能3で `try` の中に `Database.setSavepoint()` を書き、`catch` から `sp` が見えなくて保存できない（`try` の外で作る）\n- 機能3で `catch (Exception e)` にして、DML 以外のバグ（`NullPointerException` など）まで「取り込み失敗」として隠してしまう。受け取る例外は、起きると分かっているものだけにする\n\n### 調べ先\n- Apex Developer Guide「Inserting and Updating Records」「Upserting Records」「Transaction Control」\n- Apex Reference Guide「Database Class」の `insert(recordsToInsert, allOrNone)`、「Database.SaveResult Class」"},{"id":"L2-04","title":"正規表現とカスタム例外で入力チェックを書く","level":2,"type":"write","skills":["APEX-BASIC-07","APEX-DEBUG-01"],"difficulty":2,"minutes":45,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\n取引先責任者を登録する前に、郵便番号・電話番号・メールアドレスをチェックして形をそろえる。\n**正規表現**と**カスタム例外（try / catch）**を、**予想する → 書く**の2段階で練習する。\n\n## パート1：結果を予想する（紙とペン）\n次のコードを匿名実行したとき、①〜⑨の `System.debug` に何が出るか答えなさい。\n\n```apex\nSystem.debug(Pattern.matches('\\\\d{3}-\\\\d{4}', '123-4567'));      // ①\nSystem.debug(Pattern.matches('\\\\d{3}-\\\\d{4}', '123-45678'));     // ②\nSystem.debug('090-1234-5678'.replaceAll('-', ''));               // ③\nSystem.debug('03 (1234) 5678'.replaceAll('[^0-9]', ''));         // ④\nSystem.debug('a,b,,c'.split(',').size());                        // ⑤\nSystem.debug('1.5.3'.split('.').size());                         // ⑥\n\nMatcher m = Pattern.compile('(\\\\d{3})-(\\\\d{4})').matcher('〒100-0001 東京都');\nSystem.debug(m.find());       // ⑦\nSystem.debug(m.group(1));     // ⑧\nSystem.debug(m.matches());    // ⑨\n```\n\n## パート2：入力チェックのクラスを書く\n### 使う名前\nクラス名とメソッド名は次のとおりにする。**引数（何を受け取るか）と戻り値の型（何を返すか）は自分で決める**。引数名・変数名・`private` のメソッドも自由。\n\n| 何を作るか | 名前 | 種類 |\n|---|---|---|\n| 例外クラス | `InputValidationException` | `Exception` を継承 |\n| チェックのクラス | `ContactInputValidator` | `with sharing` |\n| 機能1：郵便番号 | `normalizePostalCode` | static メソッド |\n| 機能2：電話番号 | `normalizePhone` | static メソッド |\n| 機能3：メールアドレス | `normalizeEmail` | static メソッド |\n| 機能4：まとめてチェック | `prepare` | static メソッド |\n| 機能5：チェックして保存 | `save` | static メソッド |\n\n**チェックで問題があったことを知らせる専用の例外クラス**も自分で作る（名前は `Exception` で終わる必要がある）。\n\n- **機能1：郵便番号**\n  - 前後の空白を取り除き、`'1234567'` か `'123-4567'` なら `'123-4567'` の形にして返す\n  - それ以外の形なら、自分で作った例外を投げる。メッセージは `'郵便番号の形式が正しくありません: （入力値）'`\n  - `null`・空白だけなら `null` を返す（未入力は OK）\n- **機能2：電話番号**\n  - 数字以外（ハイフン・空白・かっこ）を取り除き、**0 で始まる 10桁か11桁**なら数字だけにして返す\n  - それ以外なら例外。メッセージは `'電話番号の形式が正しくありません: （入力値）'`\n  - `null`・空白だけなら `null`\n- **機能3：メールアドレス**\n  - 前後の空白を取り除いて小文字にし、`名前@ドメイン.2文字以上` の形なら返す（名前に使えるのは英数字と `. _ % + -`）\n  - それ以外なら例外。メッセージは `'メールアドレスの形式が正しくありません: （入力値）'`\n  - `null`・空白だけなら `null`\n- **機能4：取引先責任者をまとめてチェック**\n  - `Contact` を受け取り、`MailingPostalCode`・`Phone`・`Email` に機能1〜3をかけて、そろえた値に書き換える\n  - 問題が複数あるときは、**最初の1つで止めずに全部集め**、メッセージを `' / '` でつないだ例外を1つだけ投げる\n- **機能5：チェックして保存する**\n  - `Contact` を機能4でチェックしてから `insert` し、結果を文字列で返す\n    - 成功：`'保存しました'`\n    - 入力チェックの例外：`'入力エラー: （例外のメッセージ）'`\n    - 保存（DML）の例外：`'保存エラー: （1件目のエラーメッセージ）'`\n\n## 確認方法\n作ったら、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、「使う名前」のクラス・メソッドを呼んで自分で書く。\n例外が投げられることは、次の形で確かめる。\n\n```apex\ntry {\n    // 例外が投げられるはずの呼び出し\n    Assert.fail('例外が投げられなかった');\n} catch (自分で作った例外 e) {\n    Assert.areEqual('期待するメッセージ', e.getMessage());\n}\n```\n\n| 機能 | 入力 | 結果 |\n|---|---|---|\n| 1 | `' 1000001 '` / `'100-0001'` | `'100-0001'` / `'100-0001'` |\n| 1 | `'100-00011'` | 例外：`'郵便番号の形式が正しくありません: 100-00011'` |\n| 1 | `null` | `null` |\n| 2 | `'03 (1234) 5678'` / `'090-1234-5678'` | `'0312345678'` / `'09012345678'` |\n| 2 | `'1234-5678'` | 例外（0 で始まらない、8桁） |\n| 3 | `' Taro.Yamada@Example.COM '` | `'taro.yamada@example.com'` |\n| 3 | `'taro@example'` / `'taro.example.com'` | どちらも例外 |\n| 4 | 郵便番号 `'1000001'`・電話 `'03-1234-5678'`・メール `'A@B.JP'` | `'100-0001'`・`'0312345678'`・`'a@b.jp'` に書き換わる |\n| 4 | 郵便番号 `'abc'`・電話 `'0312345678'`・メール `'bad'` | 例外1つ：`'郵便番号の形式が正しくありません: abc / メールアドレスの形式が正しくありません: bad'` |\n| 5 | 姓 `'L2 正規'`・メール `'seiki@example.com'` | `'保存しました'` |\n| 5 | 姓 `'L2 正規'`・郵便番号 `'abc'` | `'入力エラー: 郵便番号の形式が正しくありません: abc'` |\n| 5 | 姓なし・メール `'nolast@example.com'` | `'保存エラー: '` で始まる |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n確認が終わったら `delete [SELECT Id FROM Contact WHERE LastName = 'L2 正規'];` で消しておく。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1（パート1）\u003c/summary>\n\n`Pattern.matches` と `Matcher.matches` は**文字列全体**が形に合うかを見る。`find` は**一部分**に合うところがあるかを探す。\n`split` と `replaceAll` の引数も正規表現。正規表現で `.` は「どんな1文字でも」という意味。\nApex の文字列の中では `\\` を `\\\\` と2つ書く。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2（パート2）\u003c/summary>\n\n例外クラスは `public class 名前Exception extends Exception {}` の1行で作れる。投げるときは `throw new 名前Exception('メッセージ');`。\n機能4は、機能1〜3を1つずつ `try` で囲み、`catch` したメッセージを `List\u003cString>` に集める。最後に、リストが空でなければ `String.join(リスト, ' / ')` で例外を投げる。\n\u003c/details>","answer":"## パート1の解答\n| 番号 | 答え | 理由 |\n|---|---|---|\n| ① | `true` | 数字3桁・ハイフン・数字4桁にぴったり合う |\n| ② | `false` | 最後が5桁。`matches` は**全体**が合わないと `false` |\n| ③ | `09012345678` | `-` をすべて空文字に置き換える |\n| ④ | `0312345678` | `[^0-9]` は「数字以外の1文字」。空白・かっこが消える |\n| ⑤ | `4` | `a`・`b`・空文字・`c`。間の空文字は残る |\n| ⑥ | `0` | `.` は「どんな1文字でも」なので、全部の文字が区切りになる。区切りの間は空文字ばかりで、末尾の空文字は取り除かれるので0件。ピリオドで分けたいときは `split('\\\\.')` |\n| ⑦ | `true` | 文字列の**一部分**に `100-0001` がある |\n| ⑧ | `100` | 1つ目の `( )` に合った部分 |\n| ⑨ | `false` | 全体（`〒` や `東京都` を含む）は形に合わない |\n\n## パート2の確認コード\nクラス名・メソッド名は指定どおりなので、引数と戻り値を解答例と同じ形にしていればそのまま使える。違う形にしたときは、呼び出す部分だけ自分の形に合わせる。\n\n```apex\n// 機能1\nAssert.areEqual('100-0001', ContactInputValidator.normalizePostalCode(' 1000001 '));\nAssert.areEqual('100-0001', ContactInputValidator.normalizePostalCode('100-0001'));\nAssert.isNull(ContactInputValidator.normalizePostalCode(null));\ntry {\n    ContactInputValidator.normalizePostalCode('100-00011');\n    Assert.fail('例外が投げられなかった');\n} catch (InputValidationException e) {\n    Assert.areEqual('郵便番号の形式が正しくありません: 100-00011', e.getMessage());\n}\n\n// 機能2\nAssert.areEqual('0312345678', ContactInputValidator.normalizePhone('03 (1234) 5678'));\nAssert.areEqual('09012345678', ContactInputValidator.normalizePhone('090-1234-5678'));\ntry {\n    ContactInputValidator.normalizePhone('1234-5678');\n    Assert.fail('例外が投げられなかった');\n} catch (InputValidationException e) {\n    Assert.areEqual('電話番号の形式が正しくありません: 1234-5678', e.getMessage());\n}\n\n// 機能3\nAssert.areEqual('taro.yamada@example.com', ContactInputValidator.normalizeEmail(' Taro.Yamada@Example.COM '));\nfor (String bad : new List\u003cString>{ 'taro@example', 'taro.example.com' }) {\n    try {\n        ContactInputValidator.normalizeEmail(bad);\n        Assert.fail('例外が投げられなかった: ' + bad);\n    } catch (InputValidationException e) {\n        Assert.areEqual('メールアドレスの形式が正しくありません: ' + bad, e.getMessage());\n    }\n}\n\n// 機能4\nContact good = new Contact(LastName = 'L2 正規', MailingPostalCode = '1000001', Phone = '03-1234-5678', Email = 'A@B.JP');\nContactInputValidator.prepare(good);\nAssert.areEqual('100-0001', good.MailingPostalCode);\nAssert.areEqual('0312345678', good.Phone);\nAssert.areEqual('a@b.jp', good.Email);\ntry {\n    ContactInputValidator.prepare(new Contact(LastName = 'L2 正規', MailingPostalCode = 'abc', Phone = '0312345678', Email = 'bad'));\n    Assert.fail('例外が投げられなかった');\n} catch (InputValidationException e) {\n    Assert.areEqual('郵便番号の形式が正しくありません: abc / メールアドレスの形式が正しくありません: bad', e.getMessage());\n}\n\n// 機能5\nAssert.areEqual('保存しました', ContactInputValidator.save(new Contact(LastName = 'L2 正規', Email = 'seiki@example.com')));\nAssert.areEqual('入力エラー: 郵便番号の形式が正しくありません: abc',\n    ContactInputValidator.save(new Contact(LastName = 'L2 正規', MailingPostalCode = 'abc')));\nString dmlResult = ContactInputValidator.save(new Contact(Email = 'nolast@example.com'));\nAssert.isTrue(dmlResult.startsWith('保存エラー: '), dmlResult);\n\nSystem.debug('すべて正解です');\n```\n\n## パート2の解答例\n引数と戻り値の型、メソッドの中身は一例。指定したクラス名・メソッド名で作り、要件と確認方法の表を満たしていれば正解とする。\n\n**例外クラス**（クラスを1つ作り、この1行だけを書く）\n\n```apex\npublic class InputValidationException extends Exception {}\n```\n\n**チェックのクラス**\n\n```apex\npublic with sharing class ContactInputValidator {\n    private static final Pattern POSTAL_CODE = Pattern.compile('(\\\\d{3})-?(\\\\d{4})');\n    private static final Pattern PHONE = Pattern.compile('0\\\\d{9,10}');\n    private static final Pattern EMAIL = Pattern.compile('[a-z0-9._%+-]+@[a-z0-9.-]+\\\\.[a-z]{2,}');\n\n    public static String normalizePostalCode(String value) {\n        if (String.isBlank(value)) {\n            return null;\n        }\n        Matcher m = POSTAL_CODE.matcher(value.trim());\n        if (!m.matches()) {\n            throw new InputValidationException('郵便番号の形式が正しくありません: ' + value.trim());\n        }\n        return m.group(1) + '-' + m.group(2);\n    }\n\n    public static String normalizePhone(String value) {\n        if (String.isBlank(value)) {\n            return null;\n        }\n        String digits = value.replaceAll('[^0-9]', '');\n        if (!PHONE.matcher(digits).matches()) {\n            throw new InputValidationException('電話番号の形式が正しくありません: ' + value.trim());\n        }\n        return digits;\n    }\n\n    public static String normalizeEmail(String value) {\n        if (String.isBlank(value)) {\n            return null;\n        }\n        String email = value.trim().toLowerCase();\n        if (!EMAIL.matcher(email).matches()) {\n            throw new InputValidationException('メールアドレスの形式が正しくありません: ' + value.trim());\n        }\n        return email;\n    }\n\n    public static Contact prepare(Contact contact) {\n        List\u003cString> problems = new List\u003cString>();\n        try {\n            contact.MailingPostalCode = normalizePostalCode(contact.MailingPostalCode);\n        } catch (InputValidationException e) {\n            problems.add(e.getMessage());\n        }\n        try {\n            contact.Phone = normalizePhone(contact.Phone);\n        } catch (InputValidationException e) {\n            problems.add(e.getMessage());\n        }\n        try {\n            contact.Email = normalizeEmail(contact.Email);\n        } catch (InputValidationException e) {\n            problems.add(e.getMessage());\n        }\n        if (!problems.isEmpty()) {\n            throw new InputValidationException(String.join(problems, ' / '));\n        }\n        return contact;\n    }\n\n    public static String save(Contact contact) {\n        try {\n            Contact prepared = prepare(contact);\n            insert prepared;\n            return '保存しました';\n        } catch (InputValidationException e) {\n            return '入力エラー: ' + e.getMessage();\n        } catch (DmlException e) {\n            return '保存エラー: ' + e.getDmlMessage(0);\n        }\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>**`matches` は全体、`find` は一部分**\u003c/mark>。入力チェックは「全体がこの形か」なので `matches`。文章の中から郵便番号を探し出すような処理は `find`\n- **`( )` で囲んだ部分は `group(番号)` で取り出せる**。`-?` は「ハイフンがあってもなくてもよい」。`1000001` も `100-0001` も、3桁と4桁を取り出して `-` でつなぎ直せば同じ形にそろう\n- \u003cmark>**`split` / `replaceAll` の引数も正規表現**\u003c/mark>。`.`・`|`・`(` などの記号で分けたいときは `\\\\.` のように前に `\\\\` を付ける\n- **`Pattern.compile` した結果は定数にしておく**。メソッドが呼ばれるたびに作り直さなくて済み、どんな形をチェックしているかがクラスの先頭でわかる\n- \u003cmark>**カスタム例外は `extends Exception` の1行で作れる**\u003c/mark>。「入力が間違っている」のように、**呼び出し元に対処してほしいこと**を、専用の例外で知らせる。`catch` する側は、例外の種類で「入力エラー」と「保存エラー」を分けて扱える\n- **`catch` は上から順に見られる**。`InputValidationException` と `DmlException` を別々に受け取ることで、メッセージを出し分けている。`catch (Exception e)` 1つにまとめると、予想していないバグまで同じメッセージで隠してしまう\n- **`DmlException` の `getDmlMessage(0)`** は1件目のエラーの文章だけを返す。`getMessage()` だと `Insert failed. First exception on row 0; first error: …` のような長い文章になる\n\n### よくある間違い\n- 正規表現を `'\\d{3}'` と書いて保存できない（Apex の文字列では `\\\\d`）\n- `Pattern.matches('\\\\d{3}-\\\\d{4}', value)` で前後の空白を取らずにチェックして、`' 100-0001'` を不正と判定する\n- 機能4で、1つ目の問題で例外を投げてしまい、ほかの項目の問題がわからない\n- 例外クラスの名前を `InputValidationError` のようにして保存できない（`Exception` で終わる必要がある）\n\n### 調べ先\n- Apex Reference Guide「Pattern Class」「Matcher Class」\n- Apex Developer Guide「Create Custom Exceptions」「Exception Statements」\n- Apex Reference Guide「DmlException Class」の `getDmlMessage`"},{"id":"L2-05","title":"ときどき落ちるクラスを、デバッグログで調べて直す","level":2,"type":"fix","skills":["APEX-LIMIT-01","APEX-LIMIT-02","APEX-DEBUG-03","WORK-LOOKUP-02"],"difficulty":2,"minutes":50,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\n先輩が書いた次のクラスが、本番で**ときどき落ちる**と報告された。\nデバッグログで原因を確かめ、**件数が増えても落ちないように直し**、あわせてよく見る DML のエラーメッセージを読み解きなさい。\n**デバッグログ・ガバナ制限・ループ内 SOQL / DML・QueryException・エラーメッセージの読み方**を、この1問でまとめて練習する。\n\n```apex\npublic class MissingEmailCounter {\n    // 取引先ごとに、メールアドレスのない取引先責任者の数を数え、取引先の説明に書き込む\n    public static void updateCounts(List\u003cId> accountIds) {\n        for (Id accountId : accountIds) {\n            Account acc = [SELECT Id, Name FROM Account WHERE Id = :accountId];\n            List\u003cContact> contacts = [SELECT Id, Email FROM Contact WHERE AccountId = :accountId];\n            Integer missing = 0;\n            for (Contact c : contacts) {\n                if (c.Email == null) {\n                    missing++;\n                }\n            }\n            acc.Description = 'メールなし: ' + missing + '人';\n            update acc;\n        }\n    }\n}\n```\n\n## パート1：デバッグログで確かめる\n1. 上のクラスを、開発者コンソールでそのまま作る\n2. **デバッグログを設定する**：設定 → クイック検索「デバッグログ」→ **ユーザーリクエストのログ**（Trace Flags）の **新規** → 追跡対象エンティティ種別「ユーザー」・自分のユーザー・開始日時と有効期限（今から数時間）・デバッグレベルは新規作成（**Apex コード：DEBUG**、**Apex プロファイル：INFO**、**データベース：INFO**、**システム：DEBUG**。ほかは NONE でよい）で保存する\n3. 匿名実行で、次を **`n = 5`** で動かし、ログを開く\n\n   ```apex\n   Integer n = 5;\n   delete [SELECT Id FROM Account WHERE Name LIKE 'L2 件数%'];\n   List\u003cAccount> accounts = new List\u003cAccount>();\n   for (Integer i = 1; i \u003c= n; i++) {\n       accounts.add(new Account(Name = 'L2 件数 ' + i));\n   }\n   insert accounts;\n   insert new Contact(LastName = 'L2 件数 窓口', AccountId = accounts[0].Id);\n\n   List\u003cId> ids = new List\u003cId>();\n   for (Account acc : accounts) {\n       ids.add(acc.Id);\n   }\n   MissingEmailCounter.updateCounts(ids);\n   ```\n4. ログの **`LIMIT_USAGE_FOR_NS`**（ログの最後のほう。開発者コンソールのログ画面なら上の Filter に入力すると絞り込める）を探し、`Number of SOQL queries` と `Number of DML statements` の数を書き出す\n5. 次に **`n = 60`** にして動かし、出たエラーメッセージを書き出す\n\n**答えること**\n- ① `n = 5` のときの SOQL の回数と DML の回数（匿名実行の `delete`・`insert` も含めた数）\n- ② `n = 60` で出たエラーメッセージと、その意味\n- ③ `n = 60` のとき、ログの `SOQL_EXECUTE_BEGIN` は何回出ていたか。そこから何がわかるか\n- ④ 取引先がほかの処理で**削除されたあと**、その Id を渡して `updateCounts` を呼ぶとどうなるか（エラーの種類と、どの行で起きるか）\n\n## パート2：直す\n次を満たすように `updateCounts` を直しなさい。メソッドの名前・引数・戻り値は変えない。\n\n- 取引先が何件でも、**SOQL は1回、DML は1回**\n- 200件の取引先を渡しても落ちない\n- 存在しない Id が混ざっていても落ちない（その Id は無視する）\n- `accountIds` が `null` か空なら、SOQL も DML も実行せずに終わる\n\n## パート3：エラーメッセージを読む\n次の5つのエラーについて、**どの行（レコード）で・どの項目が・なぜ**失敗したか、**どう直すか**を答えなさい。\n\n```\n(a) System.DmlException: Insert failed. First exception on row 0; first error: REQUIRED_FIELD_MISSING, Required fields are missing: [LastName]: [LastName]\n\n(b) System.DmlException: Update failed. First exception on row 2 with id 001xx000003DGb2AAG; first error: FIELD_CUSTOM_VALIDATION_EXCEPTION, 電話番号を入力してください: [Phone]\n\n(c) System.DmlException: Insert failed. First exception on row 4; first error: STRING_TOO_LONG, Account Name: data value too large: 株式会社…(省略) (max length=255): [Name]\n\n(d) System.DmlException: Upsert failed. First exception on row 1; first error: DUPLICATE_VALUE, duplicate value found: L2_Code__c duplicates value on record with id: 001xx000003DGb5AAG: []\n\n(e) System.DmlException: Update failed. First exception on row 0 with id 003xx000004TmiQAAS; first error: INVALID_CROSS_REFERENCE_KEY, invalid cross reference id: []\n```\n\n## 確認方法（パート2）\n次の確認コードを、そのまま匿名実行する。\n\n```apex\ndelete [SELECT Id FROM Account WHERE Name LIKE 'L2 件数%'];\nList\u003cAccount> accounts = new List\u003cAccount>();\nfor (Integer i = 1; i \u003c= 200; i++) {\n    accounts.add(new Account(Name = 'L2 件数 ' + i));\n}\ninsert accounts;\ninsert new List\u003cContact>{\n    new Contact(LastName = 'L2 件数 窓口1', AccountId = accounts[0].Id),\n    new Contact(LastName = 'L2 件数 窓口2', AccountId = accounts[0].Id, Email = 'a@example.com'),\n    new Contact(LastName = 'L2 件数 窓口3', AccountId = accounts[0].Id)\n};\n\nAccount removed = new Account(Name = 'L2 件数 削除');\ninsert removed;\nId removedId = removed.Id;\ndelete removed;\n\nList\u003cId> ids = new List\u003cId>{ removedId };\nfor (Account acc : accounts) {\n    ids.add(acc.Id);\n}\n\nInteger soqlBefore = Limits.getQueries();\nInteger dmlBefore = Limits.getDmlStatements();\nMissingEmailCounter.updateCounts(ids);\nAssert.areEqual(1, Limits.getQueries() - soqlBefore, 'SOQL は1回');\nAssert.areEqual(1, Limits.getDmlStatements() - dmlBefore, 'DML は1回');\n\nAssert.areEqual('メールなし: 2人', [SELECT Description FROM Account WHERE Id = :accounts[0].Id].Description);\nAssert.areEqual('メールなし: 0人', [SELECT Description FROM Account WHERE Id = :accounts[1].Id].Description);\n\nsoqlBefore = Limits.getQueries();\nMissingEmailCounter.updateCounts(new List\u003cId>());\nMissingEmailCounter.updateCounts(null);\nAssert.areEqual(0, Limits.getQueries() - soqlBefore, '空なら SOQL を使わない');\n\nSystem.debug('すべて正解です');\n```\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1（パート1・3）\u003c/summary>\n\n1回の処理（トランザクション）で使える SOQL は **100回**、DML は **150回**まで。超えると、例外ではなく**その処理全体が止まる**エラーになる（`catch` できない）。\nDML のエラーメッセージは「**何の操作で** → **何行目で** → **エラーの種類（大文字の英語）** → **説明** → **[項目名]**」の順に並んでいる。行は 0 から数える。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2（パート2）\u003c/summary>\n\n取引先と、その取引先責任者は、親→子のサブクエリで1回にまとめて取れる（L2-01 の③）。`WHERE Id IN :accountIds` なら、存在しない Id はただ結果に出てこないだけ。\n更新する取引先はリストに集めて、ループの外で1回だけ `update` する。\n\u003c/details>","answer":"## パート1の解答\n- **①** SOQL **11回**、DML **8回**\n  - SOQL：匿名実行の `delete [SELECT …]` で1回 ＋ 取引先1件につき2回 × 5件 ＝ 11\n  - DML：`delete`・`insert`（取引先）・`insert`（取引先責任者）で3回 ＋ 取引先1件につき1回 × 5件 ＝ 8\n  - ログでは `Number of SOQL queries: 11 out of 100`、`Number of DML statements: 8 out of 150` のように出る\n- **②** `System.LimitException: Too many SOQL queries: 101`\n  - 1回の処理で使える SOQL（100回）を超えた。60件 × 2回 ＋ 1回 ＝ 121回になるはずが、101回目で止まった\n  - `LimitException` は `catch` できない。処理全体が止まり、それまでの DML もすべて取り消される\n- **③** `SOQL_EXECUTE_BEGIN` は **101回**出ている（1回目は匿名実行の `delete [SELECT …]`、残りはループの中）。**同じ形の SOQL が、取引先の数だけくり返し発行されている**ことがわかる。ループの中に SOQL があるサイン\n- **④** `System.QueryException: List has no rows for assignment to SObject`。`Account acc = [SELECT … WHERE Id = :accountId];` の行で起きる。削除された取引先は SOQL で見つからず、0件を1件の SObject に代入しようとするため\n\n## パート2の解答例\nメソッドの中身の書き方は一例。要件と確認方法を満たしていれば正解とする。\n\n```apex\npublic with sharing class MissingEmailCounter {\n    // 取引先ごとに、メールアドレスのない取引先責任者の数を数え、取引先の説明に書き込む\n    public static void updateCounts(List\u003cId> accountIds) {\n        if (accountIds == null || accountIds.isEmpty()) {\n            return;\n        }\n        List\u003cAccount> accounts = [\n            SELECT Id, (SELECT Email FROM Contacts)\n            FROM Account\n            WHERE Id IN :accountIds\n        ];\n        for (Account acc : accounts) {\n            Integer missing = 0;\n            for (Contact c : acc.Contacts) {\n                if (c.Email == null) {\n                    missing++;\n                }\n            }\n            acc.Description = 'メールなし: ' + missing + '人';\n        }\n        update accounts;\n    }\n}\n```\n\n## パート3の解答\n| | どこで・何が | なぜ | どう直すか |\n|---|---|---|---|\n| (a) | 0行目（1件目）の `LastName` | 必須項目の姓が空のまま `insert` した | 姓を入れる。外から来たデータなら、DML の前に空でないか確かめる |\n| (b) | 2行目（3件目、Id `001…b2`）の `Phone` | 組織の**入力規則**（エラーメッセージ「電話番号を入力してください」）に引っかかった。`FIELD_CUSTOM_VALIDATION_EXCEPTION` は入力規則のエラー | 電話番号を入れてから更新する。入力規則の条件は 設定 → オブジェクトマネージャ → 取引先 → 入力規則 で確かめる |\n| (c) | 4行目（5件目）の `Name` | 取引先名が最大の 255文字を超えている | 255文字に切る（`left(255)`）か、取り込む前にはじく |\n| (d) | 1行目（2件目）の `L2_Code__c` | 「ユニーク」の項目に、すでにある値（Id `001…b5` のレコードと同じコード）を入れようとした。upsert で同じコードが**リストの中に2回**入っているときにも起きる | 取り込むデータの重複を Set で取り除いてから upsert する |\n| (e) | 0行目（Id `003…`、取引先責任者）の参照項目 | 参照先の Id（`AccountId` など）が存在しない・削除済み・見る権限がない | 参照先の Id が正しいか、SOQL で存在を確かめる |\n\n## 解説\n### ポイント\n- \u003cmark>**ループの中に SOQL・DML を書かない**\u003c/mark>。件数が少ないうちは動くので、テストや開発中には気づきにくく、本番で件数が増えたときに初めて落ちる。「1件ずつ取る」を「`IN :Idのリスト` でまとめて取る」に、「1件ずつ更新」を「リストに集めて1回で更新」に変えるのがバルク化の基本\n- \u003cmark>**ガバナ制限を超えると `LimitException` で処理全体が止まる**\u003c/mark>。`try / catch` では受け取れない。よく出るのは SOQL 100回・DML 150回・取得レコード 50,000件。今の使用量は `Limits.getQueries()` などで調べられる\n- **デバッグログは「何回・何をしたか」を見る道具**。`SOQL_EXECUTE_BEGIN`（SOQL）、`DML_BEGIN`（DML）、`USER_DEBUG`（`System.debug`）、`EXCEPTION_THROWN`（例外）、`LIMIT_USAGE_FOR_NS`（制限の使用量）をまず探す。開発者コンソールのログ画面では、上の **Filter** にこの文字を入れると絞り込める\n- **`WHERE Id IN :リスト` は、見つからない Id を無視する**。1件ずつ `Account acc = [ … ]` で取ると、削除済みの Id が1つでも混ざると `QueryException` で落ちる\n- **空のリストで SOQL や DML を実行しない**。むだに制限を使うので、最初に `null` と空を確かめて抜ける\n- \u003cmark>**DML のエラーメッセージは決まった順に並んでいる**\u003c/mark>：`操作 failed. First exception on row 行番号（with id 〜）; first error: エラーの種類, 説明: [項目名]`。**行番号は 0 から**。エラーの種類（`REQUIRED_FIELD_MISSING`・`FIELD_CUSTOM_VALIDATION_EXCEPTION` など）で検索すると、原因と対処が見つかりやすい\n\n### よくある間違い\n- 取引先責任者だけ `WHERE AccountId IN :accountIds` でまとめて取り、取引先ごとに数えるところで Map を使わずに、また取引先ごとに SOQL を書いてしまう（サブクエリを使うか、`Map\u003cId, Integer>` で数える）\n- `update` をループの中に残したまま、SOQL だけを直す（DML は 150回で止まる）\n- パート3の行番号を1から数えて、「(b) は2件目」と答える\n\n### 調べ先\n- Apex Developer Guide「Execution Governors and Limits」\n- Salesforce ヘルプ「デバッグログ」「デバッグログレベル」\n- Apex Developer Guide「Bulk DML Exception Handling」、SOAP API Developer Guide「StatusCode」（エラーの種類の一覧）"},{"id":"L2-06","title":"【総合】休眠顧客を見つけてフォローの ToDo を作る","level":2,"type":"project","skills":["APEX-SOQL-01","APEX-SOQL-02","APEX-DML-02","APEX-LIMIT-01"],"difficulty":3,"minutes":70,"environment":"org","language":"ja","source":"original","memo_ids":[],"learned_ids":[],"question":"## 問題\nしばらく取引のない「休眠顧客」を見つけて、担当者にフォローの ToDo を作るクラスを作りなさい。\nLv2 で学んだこと（SOQL・リレーション・バインド変数・日付・部分成功の DML・バルク化）をすべて使う。**解答とヒントを見ずに解けたら Lv2 合格**。\n\n## 準備：練習データを作る\n匿名実行で次のスクリプトを動かす（何度動かしても同じデータに作り直される）。\n\n```apex\ndelete [SELECT Id FROM Task WHERE Subject LIKE 'フォロー: L2F %'];\ndelete [SELECT Id FROM Opportunity WHERE Name LIKE 'L2F %'];\ndelete [SELECT Id FROM Account WHERE Name LIKE 'L2F %'];\n\nDate today = Date.today();\nList\u003cAccount> accounts = new List\u003cAccount>{\n    new Account(Name = 'L2F A 長く取引なし（大口）'),\n    new Account(Name = 'L2F B 長く取引なし'),\n    new Account(Name = 'L2F C 商談なし・フォロー中'),\n    new Account(Name = 'L2F D 最近受注'),\n    new Account(Name = 'L2F E 商談進行中')\n};\ninsert accounts;\n\ninsert new List\u003cOpportunity>{\n    new Opportunity(Name = 'L2F A 受注', AccountId = accounts[0].Id, Amount = 1200000, StageName = 'Closed Won', CloseDate = today.addDays(-400)),\n    new Opportunity(Name = 'L2F A 受注2', AccountId = accounts[0].Id, Amount = 800000, StageName = 'Closed Won', CloseDate = today.addDays(-300)),\n    new Opportunity(Name = 'L2F B 失注', AccountId = accounts[1].Id, Amount = 500000, StageName = 'Closed Lost', CloseDate = today.addDays(-250)),\n    new Opportunity(Name = 'L2F B 受注', AccountId = accounts[1].Id, Amount = 300000, StageName = 'Closed Won', CloseDate = today.addDays(-200)),\n    new Opportunity(Name = 'L2F D 受注', AccountId = accounts[3].Id, Amount = 900000, StageName = 'Closed Won', CloseDate = today.addDays(-30)),\n    new Opportunity(Name = 'L2F E 進行中', AccountId = accounts[4].Id, Amount = 600000, StageName = 'Prospecting', CloseDate = today.addDays(-500))\n};\ninsert new Task(Subject = 'フォロー: L2F C 商談なし・フォロー中', WhatId = accounts[2].Id,\n                Status = 'Not Started', ActivityDate = today);\nSystem.debug('L2F の練習データを作りました');\n```\n\n## 使う名前\nクラス名とメソッド名は次のとおりにする。**引数（何を受け取るか）と戻り値の型（何を返すか）は自分で決める**。引数名・変数名・`private` のメソッドも自由。\n\n| 何を作るか | 名前 | 種類 |\n|---|---|---|\n| クラス | `DormantAccountFollowUp` | `with sharing` |\n| 休眠顧客を探して ToDo を作る | `run` | static メソッド |\n\n## 要件\n- **受け取るもの**：候補の取引先 Id のリストと、休眠とみなす日数（例：180）\n- **休眠の判定**\n  - 次の**どちらにも当てはまらない**取引先を「休眠」とする\n    - 未完了の商談がある（完了予定日が過ぎていても、未完了なら取引中とみなす）\n    - 完了予定日が「今日から休眠日数を引いた日」**以降**の商談がある（完了・未完了は問わない）\n  - 商談が1件もない取引先も休眠\n- **ToDo を作る**\n  - 休眠の取引先ごとに ToDo（`Task`）を1件作る\n    - 件名：`'フォロー: '` + 取引先名\n    - 関連先（`WhatId`）：その取引先、任命先（`OwnerId`）：取引先の所有者\n    - 期日（`ActivityDate`）：今日から7日後、状況（`Status`）：`'Not Started'`\n    - 優先度（`Priority`）：その取引先の**受注済み商談の金額の合計**が 1,000,000 以上なら `'High'`、それ以外は `'Normal'`\n  - **件名が `'フォロー: '` で始まる未完了の ToDo がすでにある**取引先は、作らずにスキップする（二重に作らない）\n  - ToDo は**部分成功**で登録する（1件失敗しても、ほかは登録する）\n- **結果を返す**\n  - 次の形の1行の文字列\n    ```\n    候補: 5件 / 休眠: 3件 / 作成: 2件 / スキップ: 1件 / 失敗: 0件\n    ```\n  - 候補の Id リストが `null` か空なら、SOQL も DML も使わずに `候補: 0件 / 休眠: 0件 / 作成: 0件 / スキップ: 0件 / 失敗: 0件` を返す\n- **制限**\n  - 候補が何件でも、**SOQL は3回以内、DML は1回以内**\n\n## 確認方法\n準備スクリプトのあと、下の表のとおりに動くかを匿名実行で確かめる。確認コードは、「使う名前」のクラス・メソッドを呼んで自分で書く。\n候補の Id は `[SELECT Id FROM Account WHERE Name LIKE 'L2F %']` で集める。\n\n| 確認 | 結果 |\n|---|---|\n| 休眠日数 180 で1回目 | `'候補: 5件 / 休眠: 3件 / 作成: 2件 / スキップ: 1件 / 失敗: 0件'`（A・B・C が休眠。C はフォロー中なのでスキップ） |\n| SOQL・DML の回数（1回目） | SOQL 3回以内、DML 1回以内（`Limits` の増えた数で確かめる） |\n| A の ToDo | 件名 `'フォロー: L2F A 長く取引なし（大口）'`、優先度 `'High'`（受注 200万）、期日は今日から7日後 |\n| B の ToDo | 優先度 `'Normal'`（受注は 30万だけ。失注の 50万は数えない） |\n| D・E の ToDo | 作られていない |\n| 同じ条件で2回目 | `'候補: 5件 / 休眠: 3件 / 作成: 0件 / スキップ: 3件 / 失敗: 0件'` |\n| 休眠日数 100 で3回目 | 休眠は A・B・C の3件。どれもフォロー中なので作成 0件・スキップ 3件 |\n| 休眠日数 20 で4回目 | D も休眠になる：`'候補: 5件 / 休眠: 4件 / 作成: 1件 / スキップ: 3件 / 失敗: 0件'` |\n| 候補が空のリスト | `'候補: 0件 / 休眠: 0件 / 作成: 0件 / スキップ: 0件 / 失敗: 0件'` |\n\nエラーが出ず、デバッグログに `すべて正解です` が出れば正解。\n確認コードの例は、解答の最初にある（開くと「解答を見た」と記録される）。\n\n## ヒント\n\u003cdetails>\n\u003csummary>ヒント1（設計）\u003c/summary>\n\n①候補の取引先を、商談のサブクエリ付きで1回で取る → ②Apex のループで休眠かどうかと受注合計を判定する → ③休眠の取引先の Id で、未完了のフォロー ToDo を1回で取る → ④作る ToDo をリストに集めて、1回で `Database.insert(リスト, false)`。\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>ヒント2（使うもの）\u003c/summary>\n\n商談の `IsClosed`・`IsWon`・`CloseDate`・`Amount`、ToDo の `IsClosed`・`WhatId`。\n「今日から休眠日数を引いた日」は `Date.today().addDays(-日数)`。\n件名の「〜で始まる」は `Subject LIKE 'フォロー: %'`。\n\u003c/details>","answer":"## 確認コード\nクラス名・メソッド名は指定どおりなので、引数と戻り値を解答例と同じ形にしていればそのまま使える。違う形にしたときは、呼び出す部分だけ自分の形に合わせる。準備スクリプトを動かしてから実行する。\n\n```apex\nMap\u003cId, Account> candidates = new Map\u003cId, Account>([SELECT Id, Name FROM Account WHERE Name LIKE 'L2F %']);\nList\u003cId> ids = new List\u003cId>(candidates.keySet());\nId idA = [SELECT Id FROM Account WHERE Name LIKE 'L2F A %'].Id;\nId idB = [SELECT Id FROM Account WHERE Name LIKE 'L2F B %'].Id;\nId idD = [SELECT Id FROM Account WHERE Name LIKE 'L2F D %'].Id;\nId idE = [SELECT Id FROM Account WHERE Name LIKE 'L2F E %'].Id;\n\n// 1回目\nInteger soqlBefore = Limits.getQueries();\nInteger dmlBefore = Limits.getDmlStatements();\nString first = DormantAccountFollowUp.run(ids, 180);\nAssert.areEqual('候補: 5件 / 休眠: 3件 / 作成: 2件 / スキップ: 1件 / 失敗: 0件', first);\nAssert.isTrue(Limits.getQueries() - soqlBefore \u003c= 3, 'SOQL は3回以内');\nAssert.isTrue(Limits.getDmlStatements() - dmlBefore \u003c= 1, 'DML は1回以内');\n\nTask taskA = [SELECT Subject, Priority, ActivityDate, Status FROM Task WHERE WhatId = :idA];\nAssert.areEqual('フォロー: L2F A 長く取引なし（大口）', taskA.Subject);\nAssert.areEqual('High', taskA.Priority, '受注 200万');\nAssert.areEqual(Date.today().addDays(7), taskA.ActivityDate);\nAssert.areEqual('Not Started', taskA.Status);\nAssert.areEqual('Normal', [SELECT Priority FROM Task WHERE WhatId = :idB].Priority, '失注は数えない');\nSet\u003cId> activeIds = new Set\u003cId>{ idD, idE };\nAssert.areEqual(0, [SELECT COUNT() FROM Task WHERE WhatId IN :activeIds], 'D と E は作らない');\n\n// 2回目（二重に作らない）\nAssert.areEqual('候補: 5件 / 休眠: 3件 / 作成: 0件 / スキップ: 3件 / 失敗: 0件', DormantAccountFollowUp.run(ids, 180));\n\n// 3回目・4回目（休眠日数を変える）\nAssert.areEqual('候補: 5件 / 休眠: 3件 / 作成: 0件 / スキップ: 3件 / 失敗: 0件', DormantAccountFollowUp.run(ids, 100));\nAssert.areEqual('候補: 5件 / 休眠: 4件 / 作成: 1件 / スキップ: 3件 / 失敗: 0件', DormantAccountFollowUp.run(ids, 20));\n\n// 候補なし\nsoqlBefore = Limits.getQueries();\nAssert.areEqual('候補: 0件 / 休眠: 0件 / 作成: 0件 / スキップ: 0件 / 失敗: 0件', DormantAccountFollowUp.run(new List\u003cId>(), 180));\nAssert.areEqual(0, Limits.getQueries() - soqlBefore, '候補がなければ SOQL を使わない');\n\nSystem.debug('すべて正解です');\n```\n\n## 解答例\n引数と戻り値の型、メソッドの中身は一例。指定したクラス名・メソッド名で作り、要件と確認方法の表を満たしていれば正解とする。\n\n```apex\npublic with sharing class DormantAccountFollowUp {\n    private static final String SUBJECT_PREFIX = 'フォロー: ';\n    private static final Decimal HIGH_PRIORITY_AMOUNT = 1000000;\n    private static final Integer DAYS_UNTIL_DUE = 7;\n\n    public static String run(List\u003cId> accountIds, Integer dormantDays) {\n        if (accountIds == null || accountIds.isEmpty()) {\n            return buildSummary(0, 0, 0, 0, 0);\n        }\n        Date activeSince = Date.today().addDays(-dormantDays);\n\n        // ① 候補の取引先と、その商談を1回で取る\n        List\u003cAccount> candidates = [\n            SELECT Id, Name, OwnerId,\n                (SELECT IsClosed, IsWon, Amount, CloseDate FROM Opportunities)\n            FROM Account\n            WHERE Id IN :accountIds\n        ];\n\n        // ② 休眠かどうかと、受注の合計を判定する\n        List\u003cAccount> dormantAccounts = new List\u003cAccount>();\n        Map\u003cId, Decimal> wonAmountByAccount = new Map\u003cId, Decimal>();\n        for (Account acc : candidates) {\n            Boolean active = false;\n            Decimal wonAmount = 0;\n            for (Opportunity opp : acc.Opportunities) {\n                if (!opp.IsClosed || opp.CloseDate >= activeSince) {\n                    active = true;\n                }\n                if (opp.IsWon && opp.Amount != null) {\n                    wonAmount += opp.Amount;\n                }\n            }\n            if (!active) {\n                dormantAccounts.add(acc);\n                wonAmountByAccount.put(acc.Id, wonAmount);\n            }\n        }\n\n        // ③ すでにフォロー中の取引先を1回で調べる\n        Set\u003cId> dormantIds = wonAmountByAccount.keySet();\n        Set\u003cId> alreadyFollowed = new Set\u003cId>();\n        for (Task existing : [\n            SELECT WhatId FROM Task\n            WHERE WhatId IN :dormantIds AND IsClosed = false AND Subject LIKE 'フォロー: %'\n        ]) {\n            alreadyFollowed.add(existing.WhatId);\n        }\n\n        // ④ 作る ToDo を集めて、1回で登録する\n        List\u003cTask> tasks = new List\u003cTask>();\n        Integer skipped = 0;\n        for (Account acc : dormantAccounts) {\n            if (alreadyFollowed.contains(acc.Id)) {\n                skipped++;\n                continue;\n            }\n            tasks.add(new Task(\n                Subject = SUBJECT_PREFIX + acc.Name,\n                WhatId = acc.Id,\n                OwnerId = acc.OwnerId,\n                ActivityDate = Date.today().addDays(DAYS_UNTIL_DUE),\n                Status = 'Not Started',\n                Priority = wonAmountByAccount.get(acc.Id) >= HIGH_PRIORITY_AMOUNT ? 'High' : 'Normal'\n            ));\n        }\n\n        Integer created = 0;\n        Integer failed = 0;\n        if (!tasks.isEmpty()) {\n            for (Database.SaveResult result : Database.insert(tasks, false)) {\n                if (result.isSuccess()) {\n                    created++;\n                } else {\n                    failed++;\n                    System.debug(LoggingLevel.WARN, 'ToDo を作れませんでした: ' + result.getErrors()[0].getMessage());\n                }\n            }\n        }\n        return buildSummary(candidates.size(), dormantAccounts.size(), created, skipped, failed);\n    }\n\n    private static String buildSummary(Integer candidateCount, Integer dormantCount, Integer created, Integer skipped, Integer failed) {\n        return '候補: ' + candidateCount + '件'\n            + ' / 休眠: ' + dormantCount + '件'\n            + ' / 作成: ' + created + '件'\n            + ' / スキップ: ' + skipped + '件'\n            + ' / 失敗: ' + failed + '件';\n    }\n}\n```\n\n## 解説\n### ポイント\n- \u003cmark>**「まとめて取る → Apex で判定 → まとめて書く」がバルク処理の基本の形**\u003c/mark>。SOQL・DML をループの外に置き、ループの中では Map や Set を使って判定だけをする。候補が5件でも200件でも、SOQL 2回・DML 1回のまま\n- **親→子のサブクエリで「取引先と、その商談」を1回で取る**。取引先ごとに商談を SOQL で取ると、L2-05 と同じくループ内 SOQL になる\n- **判定に必要なものは、判定と同時に集めておく**。休眠かどうかを見るループの中で、受注の合計も `Map\u003cId, Decimal>` に入れている。もう一度ループや SOQL をしなくて済む\n- **「すでにあるか」は Set で調べる**。既存の ToDo の `WhatId` を Set に入れておけば、`contains` で1件ずつ確かめられる（L1 の Set の考え方がそのまま使える）\n- **部分成功で、失敗した理由もログに残す**。`Database.insert(リスト, false)` なら1件の失敗で全体が止まらない。数えるだけでなく、`System.debug` で理由を出しておくと、あとで原因を追える（Lv7 ではエラーをレコードに記録する）\n- **日数の境目は `>=` で書く**。「休眠日数を引いた日**以降**の商談があれば取引中」。境目の日ちょうどの商談をどちらに入れるかは、要件を読んで決める\n- **組み立てた文字列は private メソッドに切り出す**。候補なしのときと通常のときで、同じ形の文字列を返せる\n\n### よくある間違い\n- 未完了の商談の判定を `CloseDate` だけで行い、完了予定日が過ぎた未完了の商談（E）を休眠と判定する\n- 受注合計に `IsClosed` の商談をすべて足して、失注の金額も入れてしまう（`IsWon` で見る）\n- 既存の ToDo を `WHERE WhatId IN :accountIds`（候補全部）で取る。動くが、休眠でない取引先の分まで取るのでむだ\n- ToDo の `insert` を `insert tasks;` にして、1件の失敗で全部が登録されない\n- 候補が空のときに、空のリストで SOQL を発行してしまう\n\n### さらに良くするには（発展）\n- 候補が何万件にもなる場合は、1回の処理では取りきれない（取得 50,000件の制限）。Lv7 で、これをバッチ（`Database.Batchable`）にして夜間に動かす\n- 「フォロー: 」の件名で既存 ToDo を判定しているので、だれかが件名を変えると二重に作られる。現場では、ToDo の種別を表す項目を作って判定することが多い\n\n### 調べ先\n- Apex Developer Guide「Execution Governors and Limits」「SOQL For Loops」\n- Object Reference「Opportunity」の `IsClosed` / `IsWon`、「Task」の `WhatId` / `IsClosed`"}],"skills":[{"id":"APEX-BASIC-01","group":"Apex","area":"基本文法","name":"データ型・変数・演算子・制御構文（if / for / while / switch）","requirement":"必須","file":"01_apex/01"},{"id":"APEX-BASIC-02","group":"Apex","area":"基本文法","name":"List / Set / Map の使い分けと操作","requirement":"必須","file":"01_apex/01"},{"id":"APEX-BASIC-03","group":"Apex","area":"基本文法","name":"`?.` `??`、String / Date / Datetime メソッド","requirement":"必須","file":"01_apex/01"},{"id":"APEX-BASIC-04","group":"Apex","area":"基本文法","name":"クラス・メソッド・コンストラクタ・static とインスタンス・アクセス修飾子","requirement":"必須","file":"01_apex/01"},{"id":"APEX-BASIC-05","group":"Apex","area":"基本文法","name":"SObject 型と項目アクセス","requirement":"必須","file":"01_apex/01"},{"id":"APEX-BASIC-06","group":"Apex","area":"基本文法","name":"インターフェース・継承・Enum・Schema","requirement":"推奨","file":"01_apex/01"},{"id":"APEX-BASIC-07","group":"Apex","area":"基本文法","name":"正規表現（`matches` / `replaceAll` / `split`、Pattern / Matcher）","requirement":"推奨","file":"01_apex/01"},{"id":"APEX-SOQL-01","group":"Apex","area":"SOQL","name":"基本構文・バインド変数・日付リテラル","requirement":"必須","file":"01_apex/02"},{"id":"APEX-SOQL-02","group":"Apex","area":"SOQL","name":"親子リレーションクエリ（子→親、親→子サブクエリ）","requirement":"必須","file":"01_apex/02"},{"id":"APEX-SOQL-03","group":"Apex","area":"SOQL","name":"SOSL（FIND / RETURNING）","requirement":"必須 ※TH","file":"01_apex/02"},{"id":"APEX-SOQL-04","group":"Apex","area":"SOQL","name":"集計クエリ（AggregateResult）","requirement":"推奨","file":"01_apex/02"},{"id":"APEX-SOQL-05","group":"Apex","area":"SOQL","name":"動的 SOQL（Database.query / queryWithBinds）","requirement":"推奨","file":"01_apex/02"},{"id
