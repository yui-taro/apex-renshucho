// ---------- メモ用紙（ドラッグで動かせる付箋。問題ごとに中身を分けて保存） ----------
const Scratch = (() => {
  const el = document.getElementById('scratch');
  const fab = document.getElementById('scratch-fab');
  const bar = document.getElementById('scratch-bar');
  const text = document.getElementById('scratch-text');
  const title = document.getElementById('scratch-title');
  const state = document.getElementById('scratch-state');
  const MARGIN = 8;
  let key = 'general';
  let timer = null;
  let dirty = false;
  let loadToken = 0;

  const readJson = (k, fallback) => { try { return JSON.parse(storage('get', k)) || fallback; } catch (e) { return fallback; } };
  const box = () => readJson('scratch:box', null);
  const saveBox = () => storage('set', 'scratch:box', JSON.stringify({
    x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.classList.contains('collapsed') ? (box() || {}).h : el.offsetHeight,
  }));

  function viewport() {
    const vv = window.visualViewport;
    return vv ? { left: vv.offsetLeft, top: vv.offsetTop, width: vv.width, height: vv.height } : { left: 0, top: 0, width: innerWidth, height: innerHeight };
  }

  // 画面からはみ出さないように位置と大きさを直す（キーボードが出たときも）
  function place(x, y, w, h) {
    const v = viewport();
    w = Math.max(180, Math.min(w, v.width - MARGIN * 2));
    h = Math.max(120, Math.min(h, v.height - MARGIN * 2));
    el.style.width = `${w}px`;
    if (!el.classList.contains('collapsed')) el.style.height = `${h}px`;
    const realH = el.classList.contains('collapsed') ? 44 : h;
    x = Math.min(Math.max(x, v.left + MARGIN), v.left + v.width - w - MARGIN);
    y = Math.min(Math.max(y, v.top + MARGIN), v.top + v.height - realH - MARGIN);
    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
  }

  function defaultBox() {
    const v = viewport();
    const w = Math.min(360, v.width - 32);
    const h = Math.min(260, Math.round(v.height * 0.4));
    const bottomGap = innerWidth >= 900 ? 28 : 64 + 16;
    return { x: v.width - w - 16, y: v.height - h - bottomGap, w, h };
  }

  function keyFor(r) { return r.name === 'problem' ? r.id : 'general'; }

  function setState(message) { state.textContent = message; }

  function flush() {
    clearTimeout(timer);
    if (!dirty) return;
    dirty = false;
    const k = key;
    const value = text.value;
    storage('set', `scratch:${k}`, JSON.stringify({ text: value, updatedAt: new Date().toISOString() }));
    if (!Store.canWrite()) { setState('この端末に保存'); return; }
    Store.saveScratch(k, value).then(() => { if (k === key && !dirty) setState('保存済み'); }).catch(() => setState('この端末にだけ保存'));
  }

  async function load() {
    const token = ++loadToken;
    const k = key;
    const local = readJson(`scratch:${k}`, null);
    text.value = local ? local.text : '';
    setState('');
    if (!Store.canWrite()) return;
    try {
      const remote = await Store.loadScratch(k);
      if (token !== loadToken || dirty || !remote) return;
      if (!local || (remote.updatedAt || '') > (local.updatedAt || '')) {
        text.value = remote.text || '';
        storage('set', `scratch:${k}`, JSON.stringify(remote));
      }
    } catch (e) { /* 読めなければこの端末の分を使う */ }
  }

  function onRoute(r) {
    const next = keyFor(r);
    if (next === key && title.dataset.ready) return;
    flush();
    key = next;
    title.dataset.ready = '1';
    title.textContent = key === 'general' ? 'メモ用紙' : `${key} のメモ`;
    if (!el.hidden) load();
  }

  function open() {
    el.hidden = false;
    fab.setAttribute('aria-expanded', 'true');
    const b = box() || defaultBox();
    place(b.x, b.y, b.w, b.h);
    load();
    storage('set', 'scratch:open', '1');
  }

  function close() {
    flush();
    el.hidden = true;
    fab.setAttribute('aria-expanded', 'false');
    storage('remove', 'scratch:open');
    fab.focus();
  }

  // ドラッグ（つまみ部分）と大きさ変更（右下の角）。マウスでも指でも動く
  function track(event, onMove) {
    if (event.button > 0) return;
    event.preventDefault();
    const start = { px: event.clientX, py: event.clientY, x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
    el.classList.add('dragging');
    const move = (e) => onMove(e.clientX - start.px, e.clientY - start.py, start);
    const up = () => {
      el.classList.remove('dragging');
      removeEventListener('pointermove', move);
      removeEventListener('pointerup', up);
      removeEventListener('pointercancel', up);
      saveBox();
    };
    addEventListener('pointermove', move);
    addEventListener('pointerup', up);
    addEventListener('pointercancel', up);
  }

  bar.addEventListener('pointerdown', (event) => {
    if (event.target.closest('button')) return;
    track(event, (dx, dy, s) => place(s.x + dx, s.y + dy, s.w, s.h));
  });
  // 角と辺のつまみ。左側をつかんだときは右端を動かさずに幅を変える
  el.querySelectorAll('[data-edge]').forEach((handle) => {
    const edge = handle.dataset.edge;
    handle.addEventListener('pointerdown', (event) => {
      track(event, (dx, dy, s) => {
        let { x, w, h } = s;
        if (edge.includes('e')) w = s.w + dx;
        if (edge.includes('w')) { w = Math.max(180, s.w - dx); x = s.x + s.w - w; }
        if (edge.includes('s')) h = s.h + dy;
        place(x, s.y, w, h);
      });
    });
  });
  document.getElementById('scratch-min').addEventListener('click', () => {
    const collapsed = el.classList.toggle('collapsed');
    const b = box() || defaultBox();
    if (!collapsed) el.style.height = `${b.h}px`;
    place(el.offsetLeft, el.offsetTop, el.offsetWidth, b.h);
    storage(collapsed ? 'set' : 'remove', 'scratch:collapsed', '1');
  });
  document.getElementById('scratch-close').addEventListener('click', close);
  fab.addEventListener('click', open);

  text.addEventListener('input', () => {
    dirty = true;
    setState('入力中…');
    clearTimeout(timer);
    timer = setTimeout(flush, 800);
  });
  text.addEventListener('keydown', (event) => {
    if (event.key !== 'Tab' || event.shiftKey) return;
    event.preventDefault();
    const { selectionStart: s, selectionEnd: e, value } = text;
    text.value = value.slice(0, s) + '    ' + value.slice(e);
    text.selectionStart = text.selectionEnd = s + 4;
    text.dispatchEvent(new Event('input'));
  });
  text.addEventListener('blur', flush);
  addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

  const refit = () => { if (!el.hidden) place(el.offsetLeft, el.offsetTop, el.offsetWidth, el.offsetHeight); };
  addEventListener('resize', refit);
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', refit);
    visualViewport.addEventListener('scroll', refit);
  }

  if (storage('get', 'scratch:collapsed')) el.classList.add('collapsed');

  return {
    onRoute,
    restore() { if (storage('get', 'scratch:open')) open(); },
  };
})();

// ---------- 画面の切り替え ----------
function routeFromHash() {
  const token = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (problemById.has(token)) return { name: 'problem', id: token };
  if (LEARNED.some((q) => q.id === token)) return { name: 'learned', focus: token };
  if (NAMING.some((r) => r.id === token)) return { name: 'naming', focus: token };
  const lv = token.match(/^lv(\d+)$/i);
  if (lv && levelOf(Number(lv[1]))) return { name: 'level', level: Number(lv[1]) };
  if (views[token] && token !== 'problem' && token !== 'level') return { name: token };
  return { name: 'home' };
}

function render() {
  view = views[route.name];
  Scratch.onRoute(route);
  main.innerHTML = view.html();
  enhance(main);
  if (view.mount) view.mount();
  document.querySelectorAll('[data-nav].tab').forEach((tab) => {
    if (tab.dataset.nav === view.tab) tab.setAttribute('aria-current', 'page');
    else tab.removeAttribute('aria-current');
  });
}

function go(next) {
  route = next;
  render();
  window.scrollTo(0, 0);
}

function refreshChrome() {
  const notice = document.getElementById('store-notice');
  const s = Store.state;
  let message = '';
  if (s.status === 'unavailable') message = '保存機能を使えない表示です。問題は読めますが、解答・結果・メモは保存されません。claude.ai にログインして開くと保存できます。';
  else if (s.error) message = 'データの読み込みが止まりました。ページを開き直してください。';
  else if (s.stale) message = 'データの読み込みに時間がかかっています。表示が古い可能性があります。';
  notice.textContent = message;
  notice.hidden = !message;
  const badge = document.getElementById('memo-badge');
  const count = openMemos().length;
  badge.textContent = count;
  badge.hidden = count === 0;
}

function onStoreChange() {
  refreshChrome();
  if (view && view.refresh) view.refresh();
  else render();
}

// ---------- 操作 ----------
const actions = {
  'open-problem': (el) => go({ name: 'problem', id: el.dataset.id }),
  'open-learned': (el) => go({ name: 'learned', focus: el.dataset.id }),
  'open-naming': (el) => go({ name: 'naming', focus: el.dataset.id }),
  'naming-check': () => {
    const v = views.problem;
    v.checkNaming(v.answerDoc ? v.answerDoc.code : '');
  },
  'naming-check-stop': () => {
    const n = views.problem.naming;
    if (n.ctl) n.ctl.abort();
  },
  'naming-filter': (el) => {
    views.naming.filter = el.dataset.value;
    views.naming.draw();
  },
  'open-level': (el) => go({ name: 'level', level: Number(el.dataset.level) }),

  'copy-code': (el) => {
    const code = el.parentElement.querySelector('code');
    const done = (label) => { el.textContent = label; setTimeout(() => { el.textContent = 'コピー'; }, 1600); };
    const selectFallback = () => {
      const range = document.createRange();
      range.selectNodeContents(code);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      done('選択しました');
    };
    try {
      navigator.clipboard.writeText(code.textContent).then(() => done('コピーしました'), selectFallback);
    } catch (e) {
      selectFallback();
    }
  },

  'th-status': async (el) => {
    try {
      await Store.setTrailheadStatus(el.dataset.id, el.dataset.value);
    } catch (e) {
      toast(failMessage(e));
    }
  },

  'memo-for-th': (el) => go({ name: 'memos', trailheadId: el.dataset.id }),

  'save-answer': async (el) => {
    const v = views.problem;
    const code = document.getElementById('answer-code').value;
    el.disabled = true;
    try {
      v.answerDoc = await Store.saveAnswer(route.id, code, v.answerDoc);
      v.dirty = false;
      v.draftRestored = false;
      storage('remove', `draft:${route.id}`);
      v.updateSaveState();
      v.renderHistory();
      toast('保存しました');
      const review = Store.namingReview(route.id);
      if (code.trim() && canCheckNaming(v.problem) && (!review || review.code !== code)) v.checkNaming(code);
      else v.renderNamingCheck();
    } catch (e) {
      toast(failMessage(e));
    } finally {
      el.disabled = !Store.canWrite();
    }
  },

  'restore-history': (el) => {
    const v = views.problem;
    const entry = v.answerDoc.history[Number(el.dataset.index)];
    const textarea = document.getElementById('answer-code');
    textarea.value = entry.code;
    textarea.dispatchEvent(new Event('input'));
    textarea.focus();
  },

  'mark-correct': async () => {
    try { await Store.markResult(route.id, true); toast('正解として記録しました'); } catch (e) { toast(failMessage(e)); }
  },
  'mark-failed': async () => {
    try { await Store.markResult(route.id, false); toast('記録しました。解答・解説で確認しましょう'); } catch (e) { toast(failMessage(e)); }
  },

  reveal: () => {
    const v = views.problem;
    const a = Store.attempt(route.id);
    if (a.status === 'correct' || a.answerViewed || !Store.canWrite()) v.revealed = true;
    else v.confirming = true;
    v.renderReveal();
  },
  'reveal-confirm': async () => {
    const v = views.problem;
    v.revealed = true;
    v.confirming = false;
    v.renderReveal();
    try { await Store.markAnswerViewed(route.id); } catch (e) { toast(failMessage(e)); }
  },
  'reveal-cancel': () => {
    views.problem.confirming = false;
    views.problem.renderReveal();
  },

  'add-memo': async (el) => {
    const p = problemById.get(route.id);
    const textarea = document.getElementById('memo-text');
    const text = textarea.value.trim();
    if (!text) { toast('メモの内容を書いてください'); textarea.focus(); return; }
    const selected = document.getElementById('memo-skill').value;
    const skills = selected === '__all__' ? p.skills : selected ? [selected] : [];
    el.disabled = true;
    try {
      await Store.addMemo({ kind: 'problem', problemId: p.id, skills, text });
      textarea.value = '';
      toast('メモを残しました');
    } catch (e) {
      toast(failMessage(e));
    } finally {
      el.disabled = !Store.canWrite();
    }
  },

  'add-free-memo': async (el) => {
    const textarea = document.getElementById('free-memo-text');
    const text = textarea.value.trim();
    if (!text) { toast('メモの内容を書いてください'); textarea.focus(); return; }
    const skill = document.getElementById('free-memo-skill').value;
    const trailheadId = document.getElementById('free-memo-th').value || null;
    el.disabled = true;
    try {
      await Store.addMemo({ kind: trailheadId ? 'trailhead' : 'free', trailheadId, skills: skill ? [skill] : [], text });
      textarea.value = '';
      views.memos.filter = 'open';
      views.memos.refresh();
      toast('メモを残しました');
    } catch (e) {
      toast(failMessage(e));
    } finally {
      el.disabled = !Store.canWrite();
    }
  },

  'memo-filter': (el) => {
    views.memos.filter = el.dataset.value;
    views.memos.refresh();
  },
  'memo-resolve': async (el) => {
    try { await Store.updateMemo(el.dataset.id, { status: 'resolved', resolvedAt: new Date().toISOString() }); } catch (e) { toast(failMessage(e)); }
  },
  'memo-reopen': async (el) => {
    const memo = Store.state.memos[el.dataset.id];
    const status = memo && memo.generatedProblemIds && memo.generatedProblemIds.length ? 'generated' : 'open';
    try { await Store.updateMemo(el.dataset.id, { status, resolvedAt: null }); } catch (e) { toast(failMessage(e)); }
  },
  'memo-delete': async (el) => {
    if (el.dataset.confirm !== '1') {
      el.dataset.confirm = '1';
      el.textContent = 'もう一度押すと削除';
      setTimeout(() => { el.dataset.confirm = ''; el.textContent = '削除'; }, 4000);
      return;
    }
    try { await Store.deleteMemo(el.dataset.id); toast('削除しました'); } catch (e) { toast(failMessage(e)); }
  },
  'resolve-source-memos': async () => {
    const p = problemById.get(route.id);
    try {
      for (const id of p.memo_ids) {
        const memo = Store.state.memos[id];
        if (memo && memo.status !== 'resolved') await Store.updateMemo(id, { status: 'resolved', resolvedAt: new Date().toISOString() });
      }
      toast('メモを解決済みにしました');
    } catch (e) {
      toast(failMessage(e));
    }
  },

  export: async (el) => {
    el.disabled = true;
    try {
      const data = await Store.exportAll();
      const downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (!downloads) { toast('この画面では書き出せません'); return; }
      const date = new Date().toISOString().slice(0, 10);
      await downloads.save({ filename: `apex-renshu-backup-${date}.json`, data: JSON.stringify(data, null, 2) });
      toast('書き出しました');
    } catch (e) {
      if (!e || e.code !== 'declined') toast('書き出せませんでした');
    } finally {
      el.disabled = false;
    }
  },
};

document.addEventListener('click', (event) => {
  const nav = event.target.closest('[data-nav]');
  if (nav) { go({ name: nav.dataset.nav }); return; }
  const target = event.target.closest('[data-action]');
  if (target && actions[target.dataset.action]) actions[target.dataset.action](target);
});

route = routeFromHash();
render();
refreshChrome();
Store.subscribe(onStoreChange);
Store.init().then(() => Scratch.restore());
</script>

</body>
</html>
